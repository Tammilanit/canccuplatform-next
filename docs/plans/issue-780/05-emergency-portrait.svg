<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1784 2064" width="1784" height="2064" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>5 · Emergency full screen (Portrait, 1080 × 1920)</title>
<defs>
<linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ddcff"/><stop offset="1" stop-color="#b98cff"/></linearGradient>
<radialGradient id="glowp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3ddcff" stop-opacity="0.32"/><stop offset="1" stop-color="#3ddcff" stop-opacity="0"/></radialGradient>
<radialGradient id="glowa" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#b98cff" stop-opacity="0.30"/><stop offset="1" stop-color="#b98cff" stop-opacity="0"/></radialGradient>
<radialGradient id="dot" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#b98cff" stop-opacity="0.9"/><stop offset="1" stop-color="#b98cff" stop-opacity="0"/></radialGradient>
<linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0d1a" stop-opacity="0"/><stop offset="0.35" stop-color="#0b0d1a" stop-opacity="0.15"/><stop offset="0.62" stop-color="#0b0d1a" stop-opacity="0.78"/><stop offset="1" stop-color="#0b0d1a" stop-opacity="0.95"/></linearGradient>
<linearGradient id="scrimL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b0d1a" stop-opacity="0.92"/><stop offset="0.5" stop-color="#0b0d1a" stop-opacity="0.55"/><stop offset="0.8" stop-color="#0b0d1a" stop-opacity="0"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b98cff" stop-opacity="0"/><stop offset="0.5" stop-color="#b98cff" stop-opacity="0.55"/><stop offset="1" stop-color="#b98cff" stop-opacity="0"/></linearGradient>
<linearGradient id="sweepSoft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b98cff" stop-opacity="0"/><stop offset="0.5" stop-color="#b98cff" stop-opacity="0.22"/><stop offset="1" stop-color="#b98cff" stop-opacity="0"/></linearGradient>
<linearGradient id="gameArt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3a6e"/><stop offset="0.55" stop-color="#4b2a7a"/><stop offset="1" stop-color="#12142a"/></linearGradient>
<linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a1f2c"/><stop offset="0.55" stop-color="#6e3424"/><stop offset="1" stop-color="#1c1222"/></linearGradient>
<linearGradient id="heroin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2140"/><stop offset="1" stop-color="#141831"/></linearGradient>
<filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="blurS" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect x="0" y="0" width="1784" height="2064" fill="#f3f4f6"/>
<text x="32" y="50" font-size="30" font-weight="700" fill="#111827" text-anchor="start">5 · Emergency full screen (Portrait, 1080 × 1920)</text>
<text x="32" y="84" font-size="19" font-weight="400" fill="#6b7280" text-anchor="start">A hard cut to red on every screen, a pulsing border, a huge title and a short instruction; the ticker's place carries the instruction.</text>
<clipPath id="scr12"><rect x="0" y="0" width="1080" height="1920"/></clipPath><g transform="translate(32,112)"><g clip-path="url(#scr12)"><rect x="0" y="0" width="1080" height="1920" fill="#c81e1e"/><path d="M166,250 L236,376 L96,376 Z" fill="#ffffff"/><text x="166" y="360" font-size="92" font-weight="900" fill="#c81e1e" text-anchor="middle">!</text><text x="272" y="344" font-size="60" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="8">EMERGENCY</text><text x="96" y="640" font-size="176" font-weight="900" fill="#ffffff" text-anchor="start">Please</text><text x="96" y="830" font-size="176" font-weight="900" fill="#ffffff" text-anchor="start">leave the</text><text x="96" y="1020" font-size="176" font-weight="900" fill="#ffffff" text-anchor="start">hall now</text><text x="96" y="1190" font-size="76" font-weight="600" fill="#ffffff" text-anchor="start">Follow the exit signs</text><text x="96" y="1286" font-size="76" font-weight="600" fill="#ffffff" text-anchor="start">to the nearest exit.</text><text x="96" y="1400" font-size="76" font-weight="600" fill="#ffffff" text-anchor="start">Do not use the lift.</text><rect x="0" y="1720" width="1080" height="200" fill="#7f1010"/><rect x="0" y="1720" width="300" height="200" fill="#ffffff"/><text x="160" y="1838" font-size="60" font-weight="900" fill="#7f1010" text-anchor="middle" letter-spacing="6">EXIT</text><text x="336" y="1838" font-size="56" font-weight="700" fill="#ffffff" text-anchor="start">Follow the exit signs ·</text><rect x="12" y="12" width="1056" height="1896" fill="none" stroke="#ffffff" stroke-width="24" opacity="0.9"/><rect x="48" y="48" width="984" height="1824" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.35"/></g></g><rect x="31" y="111" width="1082" height="1922" fill="none" stroke="#9ca3af" stroke-width="2"/><g><circle cx="70" cy="150" r="22" fill="#111827" stroke="#ffffff" stroke-width="3"/><text x="70" y="159" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text></g><g><circle cx="140" cy="560" r="22" fill="#111827" stroke="#ffffff" stroke-width="3"/><text x="140" y="569" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text></g><g><circle cx="70" cy="1820" r="22" fill="#111827" stroke="#ffffff" stroke-width="3"/><text x="70" y="1829" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></g><text x="1176" y="186" font-size="22" font-weight="700" fill="#111827" text-anchor="start">The urgent level in amber (landscape)</text><clipPath id="scr13"><rect x="0" y="0" width="1920" height="1080"/></clipPath><g transform="translate(1176,200) scale(0.3)"><g clip-path="url(#scr13)"><rect x="0" y="0" width="1920" height="1080" fill="#f59e0b"/><rect x="18" y="18" width="1884" height="1044" fill="none" stroke="#1a1205" stroke-width="20" opacity="0.85"/><text x="120" y="250" font-size="64" font-weight="800" fill="#1a1205" text-anchor="start" letter-spacing="8">URGENT</text><text x="120" y="470" font-size="190" font-weight="900" fill="#1a1205" text-anchor="start">Stop all matches</text><text x="120" y="590" font-size="70" font-weight="600" fill="#1a1205" text-anchor="start">Hands off the keyboard. Wait for the crew's go.</text><rect x="0" y="940" width="1920" height="140" fill="#1a1205"/><text x="120" y="1030" font-size="56" font-weight="700" fill="#f59e0b" text-anchor="start">Wait for the crew's go · Matches are paused</text></g></g><rect x="1175" y="199" width="578" height="326" fill="none" stroke="#9ca3af" stroke-width="2"/><text x="1176" y="580" font-size="22" font-weight="400" fill="#6b7280" text-anchor="start">An urgent announcement takes the same</text><text x="1176" y="610" font-size="22" font-weight="400" fill="#6b7280" text-anchor="start">shape in amber; the Emergency button</text><text x="1176" y="640" font-size="22" font-weight="400" fill="#6b7280" text-anchor="start">keeps the fixed red.</text>
</svg>
