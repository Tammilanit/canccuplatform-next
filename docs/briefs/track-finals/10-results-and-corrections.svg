<text x="32.0" y="48.0" font-size="28" fill="#111827" font-weight="700" text-anchor="start" data-box="32.0 1888.0">10 · Results, disputes and corrections (crew, organiser)</text>
<text x="32.0" y="80.0" font-size="17" fill="#4b5563" font-weight="400" text-anchor="start" data-box="32.0 1888.0">Use case: the crew settles group E's dispute, then corrects a result in group D that was entered wrong, with a reason, before the semi-final is played</text>
