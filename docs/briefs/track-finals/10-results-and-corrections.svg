<text x="48.0" y="163.0" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="start" data-box="48.0 220.0">1  Team Alpha</text>
<rect x="240.0" y="128.0" width="200.0" height="56.0" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
<text x="260.0" y="163.0" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="start" data-box="260.0 432.0">2  Team Zeta</text>
<rect x="452.0" y="128.0" width="200.0" height="56.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="472.0" y="163.0" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="start" data-box="472.0 644.0">3  Team Theta</text>
<rect x="664.0" y="128.0" width="200.0" height="56.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="684.0" y="163.0" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="start" data-box="684.0 856.0">4  Team Eta</text>
<text x="28.0" y="226.0" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="start">Reason (shown to the teams)</text>
<rect x="28.0" y="238.0" width="844.0" height="44.0" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
<text x="44.0" y="266.0" font-size="15" fill="#f8fafc" font-weight="500" text-anchor="start">Team Zeta's last kill was missed in the report</text>
<rect x="28.0" y="306.0" width="844.0" height="190.0" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
<text x="48.0" y="340.0" font-size="17" fill="#eab308" font-weight="700" text-anchor="start">What this changes</text>
<text x="48.0" y="374.0" font-size="15" fill="#f8fafc" font-weight="500" text-anchor="start" data-box="48.0 860.0">• Team Zeta goes through instead of Team Theta.</text>
<text x="48.0" y="404.0" font-size="15" fill="#f8fafc" font-weight="500" text-anchor="start" data-box="48.0 860.0">• The semi-final is drawn but not played: it is drawn again with Team Zeta.</text>
<text x="48.0" y="434.0" font-size="15" fill="#f8fafc" font-weight="500" text-anchor="start" data-box="48.0 860.0">• Four teams are told: Alpha, Zeta, Theta and the semi-final's teams.</text>
<text x="48.0" y="464.0" font-size="15" fill="#f8fafc" font-weight="500" text-anchor="start" data-box="48.0 860.0">• Rankings are worked out when the season ends, so nothing to undo.</text>
<rect x="28.0" y="520.0" width="220.0" height="44.0" rx="10" fill="#3b82f6"/>
<text x="138.0" y="547.4" font-size="15" fill="#0f172a" font-weight="600" text-anchor="middle" data-box="34.0 242.0">Change the result</text>
<rect x="262.0" y="520.0" width="120.0" height="44.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
<text x="322.0" y="547.4" font-size="15" fill="#f8fafc" font-weight="600" text-anchor="middle" data-box="268.0 376.0">Cancel</text>
<text x="28.0" y="596.0" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start" data-box="28.0 872.0">If the semi-final already had a result, this page would say so and offer to reopen it first.</text>
</g></g>
<text x="988.0" y="784.0" font-size="19" fill="#111827" font-weight="600" text-anchor="start">2 · A correction with its impact</text>
<text x="988.0" y="810.0" font-size="16" fill="#4b5563" font-weight="400" text-anchor="start" data-box="988.0 1868.0">The legacy could not correct a result. Here a change shows what it moves before it is made, and it needs a</text>
<text x="988.0" y="831.6" font-size="16" fill="#4b5563" font-weight="400" text-anchor="start" data-box="988.0 1868.0">reason (E4).</text>
