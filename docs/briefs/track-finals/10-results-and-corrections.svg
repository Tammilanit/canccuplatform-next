<text x="32.0" y="784.0" font-size="19" fill="#111827" font-weight="600" text-anchor="start">1 · A dispute</text>
<text x="32.0" y="810.0" font-size="16" fill="#4b5563" font-weight="400" text-anchor="start" data-box="32.0 912.0">Both reports side by side, the differences marked. The crew takes one, or drags its own order; nothing is</text>
<text x="32.0" y="831.6" font-size="16" fill="#4b5563" font-weight="400" text-anchor="start" data-box="32.0 912.0">pre-picked.</text>
<g transform="translate(988.0,110.0) scale(1.0)"><g>
<rect x="0.0" y="0.0" width="900.0" height="640.0" rx="12" fill="#0f172a"/>
