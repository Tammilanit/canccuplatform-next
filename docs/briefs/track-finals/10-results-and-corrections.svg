<text x="28.0" y="74.0" font-size="14" fill="#94a3b8" font-weight="500" text-anchor="start">Decided 20:52 by two matching reports</text>
<text x="28.0" y="116.0" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="start">New order</text>
