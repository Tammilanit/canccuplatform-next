<text x="48.0" y="1104.0" font-size="16" fill="#713f12" font-weight="700" text-anchor="start" data-box="48.0 1872.0">Notes</text>
<text x="48.0" y="1128.0" font-size="15" fill="#713f12" font-weight="400" text-anchor="start" data-box="48.0 1872.0">As the live command: one /finals, no subcommands; a status line, Register or Withdraw (with Yes / No) while an individual season is open, and a link button. A taken or unusable nickname opens a name dialog. Posts carry no link</text>
