<text x="48.0" y="1104.0" font-size="16" fill="#713f12" font-weight="700" text-anchor="start" data-box="48.0 1872.0">Notes</text>
<text x="48.0" y="1128.0" font-size="15" fill="#713f12" font-weight="400" text-anchor="start" data-box="48.0 1872.0">The commands are the provider contract's: status, register, cancel, link. On the platform, the link is the hub's plain Finals page (no token); rights come from the person's own sign-in, never from Discord roles. Questions: D6 (a Discord sign-up by</text>
<text x="48.0" y="1148.2" font-size="15" fill="#713f12" font-weight="400" text-anchor="start" data-box="48.0 1872.0">someone who never signed in), D7 (how the bot proves it is the bot), O9 (the provider switch), U9 (which posts and pushes).</text>
