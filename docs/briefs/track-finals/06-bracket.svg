<text x="45.0" y="959.0" font-size="15" fill="#111827" font-weight="700" text-anchor="middle">1</text>
<text x="68.0" y="958.0" font-size="16" fill="#4b5563" font-weight="400" text-anchor="start" data-box="68.0 1888.0">One renderer draws every format from the core's round table: columns of groups, the top places marked, connectors between rounds (L2).</text>
<circle cx="45.0" cy="996.6" r="13.0" fill="#f59e0b"/>
<text x="45.0" y="1002.6" font-size="15" fill="#111827" font-weight="700" text-anchor="middle">2</text>
<text x="68.0" y="1001.6" font-size="16" fill="#4b5563" font-weight="400" text-anchor="start" data-box="68.0 1888.0">Done groups show places; the live round is framed; later rounds read 'To be decided' until drawn. The final shows its series score.</text>
<circle cx="45.0" cy="1040.2" r="13.0" fill="#f59e0b"/>
<text x="45.0" y="1046.2" font-size="15" fill="#111827" font-weight="700" text-anchor="middle">3</text>
<text x="68.0" y="1045.2" font-size="16" fill="#4b5563" font-weight="400" text-anchor="start" data-box="68.0 1888.0">The legacy's hover tracing becomes a tap that works on phones too (L4). Ranking changes show once the season finishes (L8).</text>
<circle cx="45.0" cy="1083.8" r="13.0" fill="#f59e0b"/>
<text x="45.0" y="1089.8" font-size="15" fill="#111827" font-weight="700" text-anchor="middle">4</text>
<text x="68.0" y="1088.8" font-size="16" fill="#4b5563" font-weight="400" text-anchor="start" data-box="68.0 1888.0">Round names are plain words by default; a game may bring its own mode names as data (L5).</text>
</svg>
