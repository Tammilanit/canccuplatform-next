<text x="1320" y="500" font-size="22" fill="#111827" font-weight="700" text-anchor="start" >Moderation (Screen studio → Cues)</text><text x="1320" y="528" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >A fixed set, so nothing to moderate word by word;</text><text x="1320" y="553" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >a crew switch, rates and zones. No free text, no</text><text x="1320" y="578" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >names, no counter (0022 drops the cheer meter).</text>
