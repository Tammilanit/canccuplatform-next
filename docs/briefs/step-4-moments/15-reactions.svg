<text x="380" y="610" font-size="22" fill="#111827" font-weight="700" text-anchor="start" >On screen</text><text x="380" y="638" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >Each reaction floats up the large panel's right edge for 7 s and fades. At most one a second</text><text x="380" y="663" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >per screen (the rest are counted, not shown); off at the none level and in a quiet scene.</text>
