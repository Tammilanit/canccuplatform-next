<text x="664" y="620" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >Each round is one Override with steps (repeat unrolled)</text>
<text x="664" y="646" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >Moments' tick runs the rounds, the end and the finale</text>
<text x="664" y="672" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >Placeholders filled again each round: "in 5 minutes"</text>
<text x="664" y="698" font-size="14" fill="#111827" font-weight="700" text-anchor="start" >Two levels, no more</text>
