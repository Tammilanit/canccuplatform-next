<rect x="0" y="0" width="1880" height="940" rx="0" fill="#f3f4f6" />
<text x="24" y="50" font-size="28" fill="#111827" font-weight="700" text-anchor="start" >17 · Three story models, one storyboard: "Starting soon" for the Demo Game Cup final at 21:00</text>
