<text x="664" y="210" font-size="16" fill="#111827" font-weight="600" text-anchor="start" >A round with an inner repeat</text>
<rect x="664" y="222" width="296" height="14" rx="4" fill="#eff6ff" />
<text x="812" y="233" font-size="12" fill="#2563eb" font-weight="700" text-anchor="middle" >×2</text>
<rect x="664" y="242" width="120" height="70" rx="8" fill="#fff" stroke="#b98cff" stroke-width="3" />
