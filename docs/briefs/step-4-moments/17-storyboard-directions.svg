<text x="1284" y="712" font-size="14" fill="#111827" font-weight="700" text-anchor="start" >Nesting and branches need an operator</text>
<text x="1284" y="760" font-size="14" fill="#6b7280" font-weight="700" text-anchor="start" >Organisers</text>
