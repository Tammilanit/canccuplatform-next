<rect x="556" y="500" width="28" height="40" rx="4" fill="#ffc94d" />
<text x="44" y="620" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >No offsets (T−15, T−5, T−1): only "every n min"</text>
<text x="44" y="646" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >No finale when the item starts</text>
<text x="44" y="672" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >No inner loop: copies drift apart when edited</text>
<text x="44" y="760" font-size="14" fill="#6b7280" font-weight="700" text-anchor="start" >Organisers</text>
<text x="160" y="760" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >Simplest builder; copies by hand</text>
<text x="44" y="790" font-size="14" fill="#6b7280" font-weight="700" text-anchor="start" >Crew</text>
