<text x="324" y="278" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" >3 s</text>
<rect x="449" y="230" width="125" height="70" rx="8" fill="#fff" stroke="#ffc94d" stroke-width="3" />
<text x="459" y="256" font-size="14" fill="#111827" font-weight="700" text-anchor="start" >Card</text>
<text x="459" y="278" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" >20 s</text>
<text x="44" y="340" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" >Card and sting copied by hand to show them twice</text>
