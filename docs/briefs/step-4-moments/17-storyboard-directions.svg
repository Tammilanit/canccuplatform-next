<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 940" width="1880" height="940" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 17: three story models, one storyboard drawn in each</title>
