<text x="44" y="820" font-size="14" fill="#6b7280" font-weight="700" text-anchor="start" >Offline</text>
<text x="160" y="820" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >Each round plays from its state</text>
<text x="44" y="850" font-size="14" fill="#6b7280" font-weight="700" text-anchor="start" >Cost</text>
<text x="160" y="850" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >S–M</text>
