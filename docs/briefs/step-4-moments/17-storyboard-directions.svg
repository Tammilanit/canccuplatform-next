<text x="680" y="368" font-size="15" fill="#111827" font-weight="600" text-anchor="start" >Rounds: at −15, −5, −1 min of the item's start</text>
<text x="680" y="394" font-size="15" fill="#111827" font-weight="600" text-anchor="start" >Until: the item starts · Finale: "It's on!" 8 s</text>
<text x="664" y="460" font-size="15" fill="#111827" font-weight="700" text-anchor="start" >On the hero</text>
