<text x="24" y="44" font-size="26" fill="#111827" font-weight="700" text-anchor="start" >22 · Premiere: countdown in the hero, the video full screen, the after-card (preset 23, PV1)</text>
<text x="24" y="74" font-size="17" fill="#6b7280" font-weight="400" text-anchor="start" >Demo event · a run-of-show item of kind premiere at 19:00 on the main hall · the video step is on the dot, so it starts at 19:00:00</text>
