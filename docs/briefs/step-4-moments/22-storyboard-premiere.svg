<text x="56" y="524" font-size="15" fill="#374151" font-weight="400" text-anchor="start" >Countdown widget, ticks by itself; silent</text>
<text x="56" y="546" font-size="15" fill="#374151" font-weight="400" text-anchor="start" >The video is in the zone's prefetch while</text>
<text x="56" y="568" font-size="15" fill="#374151" font-weight="400" text-anchor="start" >the story is on: on every player before 19:00</text>
<text x="672" y="524" font-size="15" fill="#374151" font-weight="400" text-anchor="start" >Plays to its end; the zone's sound screen plays</text>
<text x="672" y="546" font-size="15" fill="#374151" font-weight="400" text-anchor="start" >its audio, every other non-urgent sound is held;</text>
<text x="672" y="568" font-size="15" fill="#374151" font-weight="400" text-anchor="start" >every screen starts on the server clock (≤ 200 ms)</text>
<text x="1288" y="524" font-size="15" fill="#374151" font-weight="400" text-anchor="start" >Title card, text the organiser's (a free variable</text>
<text x="1288" y="546" font-size="15" fill="#374151" font-weight="400" text-anchor="start" >at the take, or written in the preset);</text>
<text x="1288" y="568" font-size="15" fill="#374151" font-weight="400" text-anchor="start" >then the rotation comes back</text>
