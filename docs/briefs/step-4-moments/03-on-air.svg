<text x="30" y="1180" font-size="22" fill="#111827" font-weight="700" text-anchor="start" >What it shows</text><text x="30" y="1208" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >One column per zone: each live moment with its region, rank, source (rule or person) and time left; below it what is hidden or queued and why.</text><text x="30" y="1233" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >The timeline lists what the rules will do in the next two hours, so nothing surprises the crew; any item can be edited or skipped once.</text><text x="30" y="1258" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >Crew actions sit on the right; the emergency button needs a press-and-hold. History and Priorities are the page's other two views (mockups 08, 09).</text>
