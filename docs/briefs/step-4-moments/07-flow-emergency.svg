<text x="980" y="860" font-size="22" fill="#111827" font-weight="700" text-anchor="start" >After "All clear"</text><text x="980" y="888" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >The standings come back in the hero where they were; an optional All clear card</text><text x="980" y="913" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >takes the rail for 60 s; the announcement that ran out meanwhile does not return.</text>
<text x="40" y="950" font-size="22" fill="#111827" font-weight="700" text-anchor="start" >Rules</text><text x="40" y="978" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >The right moments.emergency belongs to the event admin; the superadmin may start one venue-wide, across the events at the venue (step 3, E9).</text><text x="40" y="1003" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >Nothing outranks it: the priority editor shows emergency at the top, locked. No rule, scene or storyboard can start or end one; only people do.</text>
</svg>
