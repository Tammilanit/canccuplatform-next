<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 07: the emergency flow</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddcff"/><stop offset="1" stop-color="#b98cff"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1920" height="1060" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start" >07 · Emergency: one hold to start, one tap to end, nothing can outrank it, and every screen comes back as it was</text>
<rect x="40" y="80" width="440" height="200" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5" /><text x="60" y="116" font-size="24" fill="#111827" font-weight="700" text-anchor="start" >1 · Hold</text>
<text x="60" y="150" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >The event admin holds Emergency for 2 s on</text>
<text x="60" y="175" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >the phone or in Studio, picks a text (or</text>
<text x="60" y="200" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >keeps the default) and the zones (all by</text>
<text x="60" y="225" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >default).</text>
<line x1="485" y1="180" x2="505" y2="180" stroke="#6b7280" stroke-width="3" marker-end="url(#ah)"/>
<rect x="510" y="80" width="440" height="200" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5" /><text x="530" y="116" font-size="24" fill="#111827" font-weight="700" text-anchor="start" >2 · Everywhere</text>
<text x="530" y="150" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >Within a second every screen of the chosen</text>
<text x="530" y="175" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >zones goes full screen, rank 100, the alarm</text>
<text x="530" y="200" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >loops on each zone's sound screen; an urgent</text>
<text x="530" y="225" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >push goes out.</text>
<line x1="955" y1="180" x2="975" y2="180" stroke="#6b7280" stroke-width="3" marker-end="url(#ah)"/>
<rect x="980" y="80" width="440" height="200" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5" /><text x="1000" y="116" font-size="24" fill="#111827" font-weight="700" text-anchor="start" >3 · Steady</text>
<text x="1000" y="150" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >The takeover has no end time. A reload, a</text>
<text x="1000" y="175" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >restart of Moments or a lost uplink keeps it</text>
<text x="1000" y="200" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >on. Every other moment is hidden and waits.</text>
<line x1="1425" y1="180" x2="1445" y2="180" stroke="#6b7280" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1450" y="80" width="440" height="200" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5" /><text x="1470" y="116" font-size="24" fill="#111827" font-weight="700" text-anchor="start" >4 · All clear</text>
<text x="1470" y="150" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >One tap ends it everywhere. Optionally an</text>
<text x="1470" y="175" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >"All clear" card shows for 60 s; hidden</text>
<text x="1470" y="200" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >moments come back if their time has not run</text>
<text x="1470" y="225" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >out.</text>
<g transform="translate(40,320) scale(0.46875)"><svg width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#0b0d1a" /><rect x="48" y="22" width="46" height="46" rx="10" fill="url(#g)" /><text x="110" y="58" font-size="34" fill="#f3f5ff" font-weight="700" text-anchor="start" >DEMO EVENT</text><text x="1500" y="58" font-size="30" fill="#a9b1d6" font-weight="600" text-anchor="end" >Main hall</text><text x="1872" y="58" font-size="40" fill="#f3f5ff" font-weight="700" text-anchor="end" >18:44</text><rect x="0" y="90" width="1920" height="990" rx="0" fill="#7f1d1d" /><text x="960" y="330" font-size="48" fill="#fecaca" font-weight="800" text-anchor="middle" letter-spacing="6">EMERGENCY</text><text x="960" y="520" font-size="120" fill="#fff" font-weight="900" text-anchor="middle" >Please leave the hall</text><text x="960" y="640" font-size="56" fill="#fecaca" font-weight="500" text-anchor="middle" >Follow the exit signs to the car park.</text><text x="960" y="960" font-size="36" fill="#fecaca" font-weight="400" text-anchor="middle" >The crew is on its way · 18:44</text></svg></g><rect x="40" y="320" width="900" height="506.25" rx="0" fill="none" stroke="#111827" stroke-width="3" />
<text x="40" y="860" font-size="22" fill="#111827" font-weight="700" text-anchor="start" >Every zone, full screen</text><text x="40" y="888" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >Fixed colours outside the theme (safety rule), so no theme can make it unreadable.</text><text x="40" y="913" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >The header keeps the clock and the event name; nothing else shows.</text>
