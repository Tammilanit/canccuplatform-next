-weight="800" text-anchor="start" >3</text><text x="220" y="586" font-size="54" fill="#f3f5ff" font-weight="700" text-anchor="start" >Team Beta</text><text x="1060" y="586" font-size="58" fill="#f3f5ff" font-weight="800" text-anchor="end" >29</text><text x="1180" y="586" font-size="40" fill="#a9b1d6" font-weight="700" text-anchor="end" >–</text><rect x="96" y="634" width="1116" height="100" rx="12" fill="#161a2e" /><text x="130" y="704" font-size="54" fill="#a9b1d6" font-weight="800" text-anchor="start" >4</text><text x="220" y="704" font-size="54" fill="#f3f5ff" font-weight="700" text-anchor="start" >Team Delta</text><text x="1060" y="704" font-size="58" fill="#f3f5ff" font-weight="800" text-anchor="end" >24</text><text x="1180" y="704" font-size="40" fill="#a9b1d6" font-weight="700" text-anchor="end" >–</text><rect x="96" y="752" width="1116" height="100" rx="12" fill="#161a2e" /><text x="130" y="822" font-size="54" fill="#a9b1d6" font-weight="800" text-anchor="start" >5</text><text x="220" y="822" font-size="54" fill="#f3f5ff" font-weight="700" text-anchor="start" >Team Epsilon</text><text x="1060" y="822" font-size="58" fill="#f3f5ff" font-weight="800" text-anchor="end" >17</text><text x="1180" y="822" font-size="40" fill="#4ade80" font-weight="700" text-anchor="end" >▲2</text><rect x="1290" y="102" width="582" height="510" rx="14" fill="#0f2a1a" stroke="#4ade80" stroke-width="8" /><text x="1322" y="170" font-size="28" fill="#4ade80" font-weight="800" text-anchor="start" letter-spacing="3">ALL CLEAR</text><text x="1322" y="250" font-size="50" fill="#f3f5ff" font-weight="800" text-anchor="start" >You may go back in</text><text x="1322" y="310" font-size="32" fill="#a9b1d6" font-weight="400" text-anchor="start" >Thank you for your patience</text><rect x="1290" y="642" width="582" height="336" rx="14" fill="#161a2e" stroke="#343c66" stroke-width="2" /><rect x="1322" y="680" width="200" height="200" rx="8" fill="#fff" /><rect x="1332.0" y="690.0" width="20.0" height