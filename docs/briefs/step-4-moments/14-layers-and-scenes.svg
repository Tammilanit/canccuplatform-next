<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" width="1920" height="1000" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 14: the five layers, and the scene on the crew remote</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddcff"/><stop offset="1" stop-color="#b98cff"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1920" height="1000" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start" >14 · Five layers, one owner each: the scene sets the mood, the Director rotates, moments take regions, cues touch boxes, safety wins</text>
<rect x="40" y="80" width="1100" height="88" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2" /><text x="70" y="116" font-size="24" fill="#dc2626" font-weight="800" text-anchor="start" >Safety</text><text x="300" y="116" font-size="17" fill="#111827" font-weight="400" text-anchor="start" >Emergency takeover, the offline marker</text><text x="300" y="146" font-size="15" fill="#6b7280" font-weight="600" text-anchor="start" >Moments (emergency) · Screen (marker)</text>
<rect x="64" y="180" width="1052" height="88" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2" /><text x="94" y="216" font-size="24" fill="#6d28d9" font-weight="800" text-anchor="start" >Moments</text><text x="300" y="216" font-size="17" fill="#111827" font-weight="400" text-anchor="start" >Claims on regions: announcements, spotlight, storyboards, tournament, hot game, reactions</text><text x="300" y="246" font-size="15" fill="#6b7280" font-weight="600" text-anchor="start" >Moments ranks and times · Screen places</text>
<rect x="88" y="280" width="1004" height="88" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" /><text x="118" y="316" font-size="24" fill="#2563eb" font-weight="800" text-anchor="start" >Cues</text><text x="300" y="316" font-size="17" fill="#111827" font-weight="400" text-anchor="start" >A box effect plus an optional sound: pop, tilt, flip, ripple, slide, glow; a held frame for 1–2 min</text><text x="300" y="346" font-size="15" fill="#6b7280" font-weight="600" text-anchor="start" >Moments picks · Screen draws</text>
<rect x="112" y="380" width="956" height="88" rx="12" fill="#e5e7eb" stroke="#111827" stroke-width="2" /><text x="142" y="416" font-size="24" fill="#111827" font-weight="800" text-anchor="start" >The Director</text><text x="300" y="416" font-size="17" fill="#111827" font-weight="400" text-anchor="start" >The hero's rotation by priority and freshness; the choreographer's pacing</text><text x="300" y="446" font-size="15" fill="#6b7280" font-weight="600" text-anchor="start" >Screen (step 3, built)</text>
<rect x="136" y="480" width="908" height="88" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2" /><text x="166" y="516" font-size="24" fill="#b45309" font-weight="800" text-anchor="start" >Scene</text><text x="300" y="516" font-size="17" fill="#111827" font-weight="400" text-anchor="start" >Motion level, layout per zone, stage mood, palette, sound on or off, quiet mode, hero features</text><text x="300" y="546" font-size="15" fill="#6b7280" font-weight="600" text-anchor="start" >Moments decides · Screen renders</text>
<text x="40" y="610" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >A higher layer covers a lower one only where it claims; everything else keeps running underneath.</text>
<g transform="translate(1240,70) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a" /><rect x="10" y="10" width="370" height="824" rx="36" fill="#f6f7fb" /><text x="40" y="50" font-size="16" fill="#111827" font-weight="600" text-anchor="start" >18:42</text><text x="350" y="50" font-size="14" fill="#111827" font-weight="400" text-anchor="end" >●●● ▮</text><text x="30" y="92" font-size="22" fill="#111827" font-weight="700" text-anchor="start" >Demo Event</text><rect x="250" y="72" width="92" height="26" rx="13" fill="#16a34a" /><text x="296.0" y="89.68" font-size="13" fill="#fff" font-weight="600" text-anchor="middle" >Live 18:42</text><text x="30" y="122" font-size="15" fill="#6b7280" font-weight="600" text-anchor="start" >Screens · Scenes</text><rect x="26" y="140" width="338" height="330" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" /><text x="46" y="172" font-size="18" fill="#111827" font-weight="700" text-anchor="start" >Scene now: Daytime</text><text x="46" y="198" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start" >since 10:00 · calm · Pulse</text><text x="46" y="236" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >Why: every day 10:00–18:00</text><text x="46" y="260" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >Next: Peak at 22:00, or with 150</text><text x="46" y="282" font-size="14" fill="#111827" font-weight="400" text-anchor="start" >online (212 now), or a surge</text><text x="46" y="322" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" >Held: at least 20 min · blend 30 s</text><rect x="46" y="350" width="300" height="46" rx="10" fill="#fef3c7" /><text x="196.0" y="379.0" font-size="15" fill="#b45309" font-weight="700" text-anchor="middle" >Peak now, for 30 min</text><text x="46" y="430" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" >Per zone: Main hall · Stage · Café</text><rect x="26" y="490" width="338" height="150" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" /><text x="46" y="520" font-size="15" fill="#111827" font-weight="700" text-anchor="start" >Today</text><rect x="46" y="540" width="42" height="22" rx="4" fill="#e5e7eb" /><rect x="90" y="540" width="42" height="22" rx="4" fill="#e5e7eb" /><rect x="134" y="540" width="42" height="22" rx="4" fill="#fde68a" /><rect x="178" y="540" width="42" height="22" rx="4" fill="#fde68a" /><rect x="222" y="540" width="42" height="22" rx="4" fill="#fde68a" /><rect x="266" y="540" width="42" height="22" rx="4" fill="#fde68a" /><rect x="310" y="540" width="42" height="22" rx="4" fill="#fca5a5" /><text x="46" y="590" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" >Not open · Daytime · Peak</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#ffffff" /><line x1="10" y1="770" x2="380" y2="770" stroke="#e5e7eb" stroke-width="1" /><text x="47" y="808" font-size="11" fill="#6b7280" font-weight="500" text-anchor="middle" >Run of show</text><text x="121" y="808" font-size="11" fill="#6b7280" font-weight="500" text-anchor="middle" >Notify</text><text x="195" y="808" font-size="11" fill="#6b7280" font-weight="500" text-anchor="middle" >Quick add</text><text x="269" y="808" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle" >Screens</text><text x="343" y="808" font-size="11" fill="#6b7280" font-weight="500" text-anchor="middle" >More</text></g>
<text x="1240" y="690" font-size="22" fill="#111827" font-weight="700" text-anchor="start" >The scene on the crew remote</text><text x="1240" y="718" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >The scene now, why it holds, the next change and its</text><text x="1240" y="743" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >conditions, and the crew button. The editor is</text><text x="1240" y="768" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >design sheet 12 (Screen studio → Scenes).</text>
<text x="40" y="680" font-size="22" fill="#111827" font-weight="700" text-anchor="start" >How a scene reaches the screen</text><text x="40" y="708" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >Moments evaluates the scenes per zone (the first in the list whose conditions hold wins, held for its minimum time) and</text><text x="40" y="733" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >emits moments.scene.changed with the scene's settings. Screen composes them into the zone's display (motion_level, layout,</text><text x="40" y="758" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >stage mood, features) where step 3 used the day's phase. With no scene configured, the built-in presets reproduce</text><text x="40" y="783" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >step 3's "follow the day" exactly, so an event that never opens Scenes looks the same as today.</text><text x="40" y="808" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >If Moments is down, Screen keeps the last scene it was told; a scene never starts or ends a moment by itself, it</text><text x="40" y="833" font-size="18" fill="#374151" font-weight="400" text-anchor="start" >only switches what may play ("no slides at the peak", "sound off").</text>
</svg>
