<text x="56.0" y="502.0" font-size="14.5" fill="#374151" font-weight="400" text-anchor="start" data-box="56.0 1840.0">Every write is one transaction under SELECT … FOR UPDATE on the session row; events leave through the kit&#x27;s outbox.</text>
