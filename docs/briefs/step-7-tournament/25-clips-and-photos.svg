<text x="458" y="846" font-size="12.5" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="458 1150">The crew takes it off the screen and the recap, and deletes it if you asked.</text>
<text x="444" y="900" font-size="13" fill="#f3f5ff" font-weight="500" text-anchor="start" data-box="434 1180">Files sit in the tenant’s files volume, with a size and a type limit.</text>
<text x="444" y="922" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="434 1180">Retention follows D16 and O6: kept as personal data, deleted with the player’s data.</text>
<text x="444" y="944" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="434 1180">Crew uploads skip the queue; a participant’s upload never does.</text>
