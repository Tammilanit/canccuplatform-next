<text x="420" y="128" font-size="17" fill="#111827" font-weight="700" text-anchor="start" data-box="420 1190">2 · From a PC browser (drag and drop)</text>
<text x="1210" y="128" font-size="17" fill="#111827" font-weight="700" text-anchor="start" data-box="1210 1888">3 · The crew queue on the desk</text>
