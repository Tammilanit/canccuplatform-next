<title>Step 7 mockup 25: Clips and photos from anyone taking part, approved by the crew</title>
<rect x="0" y="0" width="1920" height="1080" fill="#f3f4f6"/>
<text x="32" y="48" font-size="28" fill="#111827" font-weight="700" text-anchor="start" data-box="32 1888">25 · Clips and photos from anyone taking part, approved by the crew</text>
<text x="32" y="80" font-size="17" fill="#6b7280" font-weight="400" text-anchor="start" data-box="32 1888">Use case: players share a clip from the gaming PC or a photo from the phone; the crew approves; only approved items reach the screen and the recap. Demo names only.</text>
