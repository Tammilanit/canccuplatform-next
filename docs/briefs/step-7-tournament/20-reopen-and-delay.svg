<text x="749.0" y="208.5" font-size="11" fill="#7cecba" font-weight="600" text-anchor="middle" data-box="687.0 811.0">Open until 19:20</text>
<text x="828.0" y="209.0" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="828.0 1244.0">closes by itself · 7 of 8 teams</text>
<rect x="684.0" y="232.0" width="110.0" height="34.0" rx="8" fill="#1f2440" stroke="#616788" stroke-width="1"/>
<text x="739.0" y="253.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle" data-box="688.0 790.0">Close now</text>
<rect x="806.0" y="232.0" width="170.0" height="34.0" rx="8" fill="#1f2440" stroke="#616788" stroke-width="1"/>
<text x="891.0" y="253.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle" data-box="810.0 972.0">Delay this session</text>
<text x="684.0" y="300.0" font-size="14" fill="#f3f5ff" font-weight="700" text-anchor="start" data-box="684.0 1244.0">On the venue screen and in the hub</text>
<rect x="684.0" y="316.0" width="560.0" height="84.0" rx="12" fill="#1d2442" stroke="#ffc94d" stroke-width="1.5"/>
<text x="702.0" y="346.0" font-size="15" fill="#ffc94d" font-weight="700" text-anchor="start" data-box="702.0 1226.0">Registration open again · Demo Arena 5v5</text>
<text x="702.0" y="372.0" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="702.0 1226.0">Until 19:20 · 1 place left. Register in the hub.</text>
<text x="684.0" y="436.0" font-size="14" fill="#f3f5ff" font-weight="700" text-anchor="start" data-box="684.0 1244.0">History</text>
<text x="684.0" y="462.0" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">19:05</text>
<text x="744.0" y="462.0" font-size="14" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="744.0 1244.0">Reopened until 19:20 · Crew Member</text>
<line x1="684.0" y1="476.0" x2="1244.0" y2="476.0" stroke="#262c4a" stroke-width="1"/>
