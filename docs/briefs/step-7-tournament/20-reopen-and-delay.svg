<rect x="140" y="768" width="38" height="36" rx="8" fill="#1c2a44" stroke="#3ddcff" stroke-width="1"/>
<text x="159.0" y="791" font-size="13" fill="#f3f5ff" font-weight="600" text-anchor="middle" data-box="140 178">+15</text>
<rect x="184" y="768" width="38" height="36" rx="8" fill="#0f1430" stroke="#616788" stroke-width="1"/>
<text x="203.0" y="791" font-size="13" fill="#f3f5ff" font-weight="600" text-anchor="middle" data-box="184 222">+30</text>
<rect x="228" y="768" width="52" height="36" rx="8" fill="#0f1430" stroke="#616788" stroke-width="1"/>
<text x="254.0" y="791" font-size="13" fill="#f3f5ff" font-weight="600" text-anchor="middle" data-box="228 280">Other</text>
<rect x="272.0" y="768.0" width="260.0" height="38.0" rx="10" fill="#1c2a44" stroke="#3ddcff" stroke-width="1"/>
<text x="286.0" y="792.0" font-size="14" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="282.0 526.0">◉  This session only</text>
<rect x="548.0" y="768.0" width="330.0" height="38.0" rx="10" fill="#0f1430" stroke="#616788" stroke-width="1"/>
<text x="562.0" y="792.0" font-size="14" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="558.0 872.0">○  It and every later session today</text>
<text x="52.0" y="850.0" font-size="14" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="52.0 432.0">Start 19:30 → 19:45</text>
<text x="292.0" y="850.0" font-size="14" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="292.0 1244.0">Registration closes 19:00 → 19:15 (the gap before the start stays the same)</text>
<text x="52.0" y="878.0" font-size="13.5" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="52.0 1244.0">The agenda item moves with it (one run of show). Places and check-ins are kept; registrants get a push.</text>
<text x="52.0" y="906.0" font-size="13.5" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="52.0 1244.0">The same happens when someone delays this session in the run of show.</text>
<rect x="52.0" y="936.0" width="160.0" height="34.0" rx="8" fill="#3ddcff"/>
<text x="132.0" y="957.5" font-size="12.5" fill="#0b0d1a" font-weight="600" text-anchor="middle" data-box="56.0 208.0">Delay 15 minutes</text>
<rect x="224.0" y="936.0" width="90.0" height="34.0" rx="8" fill="#1f2440" stroke="#616788" stroke-width="1"/>
<text x="269.0" y="957.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle" data-box="228.0 310.0">Cancel</text>
<circle cx="1309" cy="795" r="13" fill="#f59e0b"/>
<text x="1309.0" y="800.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">1</text>
<text x="1330.0" y="800.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="1330.0 1888.0">Reopen: until a time or for a few minutes; it closes by itself (U19).</text>
<circle cx="1309" cy="835" r="13" fill="#f59e0b"/>
<text x="1309.0" y="840.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">2</text>
<text x="1330.0" y="840.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="1330.0 1888.0">Close now is always there; a reopen is in the History.</text>
<circle cx="1309" cy="875" r="13" fill="#f59e0b"/>
<text x="1309.0" y="880.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">3</text>
<text x="1330.0" y="880.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="1330.0 1888.0">Delaying by hand keeps the gap before the start; places stay (E2).</text>
<circle cx="1309" cy="915" r="13" fill="#f59e0b"/>
<text x="1309.0" y="920.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">4</text>
<text x="1330.0" y="920.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="1330.0 1888.0">Both need the crew’s desk right, not the lead’s.</text>
</svg>
