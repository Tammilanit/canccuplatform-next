<text x="352.0" y="396.0" font-size="14" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="348.0 556.0">○  For a few minutes</text>
<text x="72.0" y="440.0" font-size="12.5" fill="#a9b1d6" font-weight="600" text-anchor="start" data-box="72.0 322.0">Until</text>
<rect x="72.0" y="448.0" width="250.0" height="36.0" rx="8" fill="#0f1430" stroke="#616788" stroke-width="1"/>
<text x="84.0" y="471.0" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="start" data-box="80.0 314.0">19:20</text>
<text x="338.0" y="440.0" font-size="12.5" fill="#a9b1d6" font-weight="600" text-anchor="start" data-box="338.0 562.0">Or for a few minutes</text>
<rect x="338" y="448" width="38" height="36" rx="8" fill="#0f1430" stroke="#616788" stroke-width="1"/>
<text x="357.0" y="471" font-size="13" fill="#f3f5ff" font-weight="600" text-anchor="middle" data-box="338 376">+5</text>
<rect x="382" y="448" width="38" height="36" rx="8" fill="#0f1430" stroke="#616788" stroke-width="1"/>
<text x="401.0" y="471" font-size="13" fill="#f3f5ff" font-weight="600" text-anchor="middle" data-box="382 420">+10</text>
<rect x="426" y="448" width="38" height="36" rx="8" fill="#0f1430" stroke="#616788" stroke-width="1"/>
<text x="445.0" y="471" font-size="13" fill="#f3f5ff" font-weight="600" text-anchor="middle" data-box="426 464">+15</text>
<rect x="470" y="448" width="38" height="36" rx="8" fill="#0f1430" stroke="#616788" stroke-width="1"/>
<text x="489.0" y="471" font-size="13" fill="#f3f5ff" font-weight="600" text-anchor="middle" data-box="470 508">+30</text>
<rect x="514" y="448" width="52" height="36" rx="8" fill="#0f1430" stroke="#616788" stroke-width="1"/>
<text x="540.0" y="471" font-size="13" fill="#f3f5ff" font-weight="600" text-anchor="middle" data-box="514 566">Other</text>
<text x="72.0" y="512.0" font-size="13" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="72.0 592.0">Registrants and followers of the tournament get a push:</text>
<text x="72.0" y="534.0" font-size="13" fill="#ffc94d" font-weight="400" text-anchor="start" data-box="72.0 592.0">“Registration for Demo Arena 5v5 is open again until 19:20.”</text>
<text x="72.0" y="558.0" font-size="13" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="72.0 592.0">The screen and the hub show it. History records who and until when.</text>
<rect x="72.0" y="576.0" width="170.0" height="34.0" rx="8" fill="#3ddcff"/>
<text x="157.0" y="597.5" font-size="12.5" fill="#0b0d1a" font-weight="600" text-anchor="middle" data-box="76.0 238.0">Reopen until 19:20</text>
<rect x="254.0" y="576.0" width="90.0" height="34.0" rx="8" fill="#1f2440" stroke="#616788" stroke-width="1"/>
<text x="299.0" y="597.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle" data-box="258.0 340.0">Cancel</text>
<text x="664.0" y="128.0" font-size="17" fill="#111827" font-weight="700" text-anchor="start" data-box="664.0 1264.0">2 · Reopened: Close now, or let it close</text>
<rect x="664.0" y="140.0" width="600.0" height="520.0" rx="12" fill="#0b0d1a" stroke="#343c66" stroke-width="1"/>
