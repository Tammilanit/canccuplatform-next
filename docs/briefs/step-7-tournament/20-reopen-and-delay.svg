<text x="744.0" y="502.0" font-size="14" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="744.0 1244.0">Registration closed (scheduler)</text>
<line x1="684.0" y1="516.0" x2="1244.0" y2="516.0" stroke="#262c4a" stroke-width="1"/>
