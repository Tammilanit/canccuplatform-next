<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Step 7 mockup Reopen registration and delay a session (crew)</title>
<rect x="0.0" y="0.0" width="1920.0" height="1060.0" rx="0" fill="#f3f4f6"/>
<text x="32.0" y="48.0" font-size="28" fill="#111827" font-weight="700" text-anchor="start" data-box="32.0 1888.0">20 · Reopen registration and delay a session (crew)</text>
<text x="32.0" y="80.0" font-size="17" fill="#6b7280" font-weight="400" text-anchor="start" data-box="32.0 1888.0">Use case: a session closed for registration fills late, or the evening runs behind: the crew reopens it for a while or delays it, and everyone affected is told</text>
<text x="32.0" y="128.0" font-size="17" fill="#111827" font-weight="700" text-anchor="start" data-box="32.0 632.0">1 · Desk: a closed session → Reopen registration</text>
<rect x="32.0" y="140.0" width="600.0" height="520.0" rx="12" fill="#0b0d1a" stroke="#343c66" stroke-width="1"/>
<text x="52.0" y="178.0" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start" data-box="52.0 612.0">Demo Arena 5v5 · registration closed 19:00</text>
<rect x="52.0" y="194.0" width="60.4" height="21.0" rx="10.5" fill="#3a2030"/>
<text x="82.2" y="208.5" font-size="11" fill="#ff6b81" font-weight="600" text-anchor="middle" data-box="55.0 109.4">Closed</text>
<text x="128.0" y="209.0" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="128.0 612.0">8 of 8 teams · Full</text>
<rect x="52.0" y="232.0" width="190.0" height="34.0" rx="8" fill="#3ddcff"/>
<text x="147.0" y="253.5" font-size="12.5" fill="#0b0d1a" font-weight="600" text-anchor="middle" data-box="56.0 238.0">Reopen registration</text>
<rect x="254.0" y="232.0" width="170.0" height="34.0" rx="8" fill="#1f2440" stroke="#616788" stroke-width="1"/>
<text x="339.0" y="253.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle" data-box="258.0 420.0">Delay this session</text>
<rect x="52.0" y="290.0" width="560.0" height="340.0" rx="12" fill="#161a2e" stroke="#3ddcff" stroke-width="1.5"/>
<text x="72.0" y="324.0" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start" data-box="72.0 592.0">Reopen registration</text>
<text x="72.0" y="352.0" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="72.0 592.0">It closes by itself through the scheduler at the time you pick.</text>
<rect x="72.0" y="372.0" width="250.0" height="38.0" rx="10" fill="#1c2a44" stroke="#3ddcff" stroke-width="1"/>
<text x="86.0" y="396.0" font-size="14" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="82.0 316.0">◉  Until a time</text>
