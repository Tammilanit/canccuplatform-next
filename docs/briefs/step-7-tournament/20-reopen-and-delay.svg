<text x="744.0" y="542.0" font-size="14" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="744.0 1244.0">Registration opened (scheduler)</text>
<line x1="684.0" y1="556.0" x2="1244.0" y2="556.0" stroke="#262c4a" stroke-width="1"/>
<text x="1296.0" y="128.0" font-size="17" fill="#111827" font-weight="700" text-anchor="start" data-box="1296.0 1888.0">3 · The push on a phone</text>
<g transform="translate(1406,140) scale(0.72)">
<rect x="0.0" y="0.0" width="390.0" height="844.0" rx="44" fill="#0f172a"/><rect x="10.0" y="10.0" width="370.0" height="824.0" rx="36" fill="#0b0d1a"/>
<text x="40.0" y="50.0" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">19:05</text>
<text x="350.0" y="50.0" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text>
<rect x="20.0" y="120.0" width="350.0" height="96.0" rx="18" fill="#e5e7eb"/>
<text x="36.0" y="144.0" font-size="12" fill="#374151" font-weight="600" text-anchor="start" data-box="36.0 310.0">DEMO EVENT · TOURNAMENT</text>
<text x="356.0" y="144.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="end">now</text>
<text x="36.0" y="168.0" font-size="14.5" fill="#111827" font-weight="700" text-anchor="start" data-box="36.0 358.0">Demo Arena 5v5 is open again</text>
<text x="36.0" y="190.0" font-size="13" fill="#374151" font-weight="400" text-anchor="start" data-box="36.0 358.0">Registration is open until 19:20.</text>
<text x="36.0" y="208.0" font-size="13" fill="#374151" font-weight="400" text-anchor="start" data-box="36.0 358.0">Tap to register.</text>
<text x="26.0" y="262.0" font-size="13" fill="#a9b1d6" font-weight="600" text-anchor="start">Delayed sessions</text>
<rect x="26.0" y="278.0" width="338.0" height="120.0" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/>
<text x="44.0" y="310.0" font-size="15" fill="#ffc94d" font-weight="700" text-anchor="start" data-box="44.0 346.0">Demo Arena 5v5 · moved to 19:45</text>
<text x="44.0" y="336.0" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="44.0 346.0">Delayed 15 minutes. Registration closes</text>
<text x="44.0" y="358.0" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="44.0 346.0">19:15. Your place and check-in are kept.</text>
</g>
<text x="32.0" y="688.0" font-size="17" fill="#111827" font-weight="700" text-anchor="start" data-box="32.0 1264.0">4 · Delay a session: this one, or it and every later session that day</text>
<rect x="32.0" y="700.0" width="1232.0" height="300.0" rx="12" fill="#0b0d1a" stroke="#343c66" stroke-width="1"/>
