<text x="1312.0" y="178.0" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start" data-box="1312.0 1864.0">The legacy season as the spine, made live</text>
<rect x="1312.0" y="196.0" width="552.0" height="380.0" rx="12" fill="#0b0d1a"/>
<text x="1336.0" y="232.0" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start" data-box="1336.0 1840.0">Demo Arena 5v5 · Semi-finals</text>
