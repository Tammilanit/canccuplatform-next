<rect x="0.0" y="0.0" width="1920.0" height="1130.0" rx="0" fill="#f3f4f6"/>
<text x="32.0" y="48.0" font-size="28" fill="#111827" font-weight="700" text-anchor="start" data-box="32.0 1888.0">01 · Three directions, one moment: Saturday 19:30, the Demo Arena semi-finals</text>
<text x="32.0" y="80.0" font-size="17" fill="#6b7280" font-weight="400" text-anchor="start" data-box="32.0 1888.0">Use case: the session compares how each direction feels for a player, the crew and the hall</text>
<rect x="32.0" y="110.0" width="600.0" height="990.0" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="56.0" y="150.0" font-size="22" fill="#111827" font-weight="700" text-anchor="start" data-box="56.0 542.0">A · The LAN cup, ported</text>
<rect x="550.0" y="130.0" width="60.0" height="28.0" rx="14" fill="#eef2ff"/>
<text x="580.0" y="150.0" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle" data-box="552.0 608.0">S–M</text>
<text x="56.0" y="178.0" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start" data-box="56.0 608.0">The legacy season, rebuilt on the platform</text>
<rect x="56.0" y="196.0" width="552.0" height="380.0" rx="12" fill="#0b0d1a"/>
<text x="80.0" y="232.0" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start" data-box="80.0 584.0">Standings · Demo Game Cup</text>
