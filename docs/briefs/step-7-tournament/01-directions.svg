<text x="1068.0" y="423.0" font-size="12" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="1066.0 1198.0">Team ?</text>
<text x="708.0" y="558.0" font-size="14" fill="#ffc94d" font-weight="600" text-anchor="start" data-box="708.0 1212.0">+ lower bracket · 3 disputes waiting</text>
<text x="684.0" y="610.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="684.0 1236.0">Every session a bracket: groups, single or double</text>
<text x="684.0" y="638.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="684.0 1236.0">elimination, best-of-n, seeded from a rating.</text>
<text x="684.0" y="666.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="684.0 1236.0">Teams report their own scores and confirm each</text>
<text x="684.0" y="694.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="684.0 1236.0">other&#x27;s; a dispute goes to a referee queue.</text>
<text x="684.0" y="722.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="684.0 1236.0">Ready-up check-in per match, auto-forfeit on a timer.</text>
<text x="684.0" y="750.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="684.0 1236.0">Player: lives in the app all evening.</text>
<text x="684.0" y="778.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="684.0 1236.0">Crew: referees and admins disputes.</text>
<text x="684.0" y="806.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="684.0 1236.0">Hall: a big bracket, always moving.</text>
<text x="684.0" y="834.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="684.0 1236.0">Overlaps the Finals track&#x27;s engine (0025).</text>
<text x="684.0" y="880.0" font-size="14" fill="#2563eb" font-weight="700" text-anchor="start">Trade-off</text>
<text x="684.0" y="906.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="684.0 1236.0">Exciting for one serious game, wrong for a</text>
<text x="684.0" y="932.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="684.0 1236.0">party game; most cost goes to rules few use.</text>
