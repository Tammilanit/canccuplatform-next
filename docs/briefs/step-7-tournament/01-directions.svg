<text x="572.0" y="470.0" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="end">7</text>
<text x="80.0" y="540.0" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="80.0 584.0">Scores appear after the crew saves them.</text>
<text x="56.0" y="610.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="56.0 608.0">Sessions in many games over the weekend; each gives</text>
<text x="56.0" y="638.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="56.0 608.0">1st, 2nd, played or no-show: 3, 2, 1 or 0 points.</text>
<text x="56.0" y="666.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="56.0 608.0">Sign-in replaces token links; registration, the</text>
<text x="56.0" y="694.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="56.0 608.0">deadline and the timeline move into the module.</text>
<text x="56.0" y="722.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="56.0 608.0">Check-in, corrections and seeding are added as the</text>
<text x="56.0" y="750.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="56.0 608.0">issues ask, nothing more. One match per session.</text>
<text x="56.0" y="778.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="56.0 608.0">Player: registers, waits for a DM, plays, reads the</text>
<text x="56.0" y="806.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="56.0 608.0">table later. Crew: one results form per session.</text>
<text x="56.0" y="834.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="56.0 608.0">Hall: the leaderboard, as before.</text>
<text x="56.0" y="880.0" font-size="14" fill="#2563eb" font-weight="700" text-anchor="start">Trade-off</text>
<text x="56.0" y="906.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="56.0 608.0">Cheap, proven, but quiet: nobody is called to a</text>
<text x="56.0" y="932.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="56.0 608.0">match, the screen has no story until scores exist.</text>
<rect x="660.0" y="110.0" width="600.0" height="990.0" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="684.0" y="150.0" font-size="22" fill="#111827" font-weight="700" text-anchor="start" data-box="684.0 1170.0">B · Brackets everywhere</text>
