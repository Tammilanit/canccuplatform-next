<text x="684.0" y="178.0" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start" data-box="684.0 1236.0">An esports platform inside the event</text>
<rect x="684.0" y="196.0" width="552.0" height="380.0" rx="12" fill="#0b0d1a"/>
<text x="708.0" y="232.0" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start" data-box="708.0 1212.0">Upper bracket · Demo Arena</text>
