<text x="1350.0" y="402.0" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="1350.0 1628.0">Team Delta</text>
<rect x="1652.0" y="370.0" width="113.2" height="22.0" rx="11.0" fill="#1e4244"/>
<text x="1708.6" y="384.0" font-size="12" fill="#7cecba" font-weight="600" text-anchor="middle" data-box="1656.0 1761.2">Live · Game 2</text>
<text x="1336.0" y="470.0" font-size="14" fill="#a9b1d6" font-weight="600" text-anchor="start" data-box="1336.0 1840.0">Season standings after tonight</text>
<text x="1336.0" y="500.0" font-size="15" fill="#f3f5ff" font-weight="500" text-anchor="start" data-box="1336.0 1688.0">1  Player Five</text>
<text x="1758.0" y="500.0" font-size="13" fill="#3ee39a" font-weight="700" text-anchor="start">▲1</text>
<text x="1828.0" y="500.0" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="end">11</text>
<text x="1336.0" y="530.0" font-size="15" fill="#f3f5ff" font-weight="500" text-anchor="start" data-box="1336.0 1688.0">2  Demo Player</text>
<text x="1758.0" y="530.0" font-size="13" fill="#ff6b81" font-weight="700" text-anchor="start">▼1</text>
<text x="1828.0" y="530.0" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="end">10</text>
<text x="1312.0" y="610.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="1312.0 1864.0">Season points across sessions stay the spine, so</text>
<text x="1312.0" y="638.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="1312.0 1864.0">any game fits. Inside a session, matches are an</text>
<text x="1312.0" y="666.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="1312.0 1864.0">option: heats or rounds; &#x27;winners advance&#x27; fills</text>
<text x="1312.0" y="694.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="1312.0 1864.0">the next round, no engine. The crew enters results</text>
<text x="1312.0" y="722.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="1312.0 1864.0">from the voice roster in one tap; corrections keep</text>
<text x="1312.0" y="750.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="1312.0 1864.0">a trail. Phones are called to a match; the screen</text>
<text x="1312.0" y="778.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="1312.0 1864.0">tells the story: check-in, called, live, champion.</text>
<text x="1312.0" y="806.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="1312.0 1864.0">Crew: a match desk on a phone. Hall: the bracket</text>
<text x="1312.0" y="834.0" font-size="15.5" fill="#1f2937" font-weight="400" text-anchor="start" data-box="1312.0 1864.0">and the standings, live by push.</text>
<text x="1312.0" y="880.0" font-size="14" fill="#2563eb" font-weight="700" text-anchor="start">Trade-off</text>
<text x="1312.0" y="906.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="1312.0 1864.0">More states than A, far less than B; most of the</text>
<text x="1312.0" y="932.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="1312.0 1864.0">screen side is built and waits for these events.</text>
