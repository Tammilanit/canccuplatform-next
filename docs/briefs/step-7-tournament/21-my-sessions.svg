<text x="62" y="920" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="62 930">One screen for the whole weekend: PC shows a section per day side by side, a phone a single list with</text>
<text x="62" y="941" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="62 930">sticky day headings and a jump bar at the top.</text>
