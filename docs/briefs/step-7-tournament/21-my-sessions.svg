<text x="970" y="920" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="990" y="920" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="990 1858">Time order inside each day (the day-schedule rule); no card grid and no Save button: one tap saves that</text>
<text x="990" y="941" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="990 1858">session.</text>
<circle cx="42" cy="967" r="10" fill="#111827"/>
<text x="42" y="972" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="62" y="972" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="62 930">A team session ticked here is a solo sign-up to be placed; the row&#x27;s link is for a group.</text>
<circle cx="970" cy="967" r="10" fill="#111827"/>
<text x="970" y="972" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">4</text>
<text x="990" y="972" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="990 1858">The sessions, their close times and Full or Closed come from the module; the page only reads them.</text>
