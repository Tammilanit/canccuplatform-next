<text x="32" y="48" font-size="28" fill="#111827" font-weight="700" text-anchor="start" data-box="32 1888">21 · My sessions: every session of the weekend on one screen, by day (player)</text>
<text x="32" y="80" font-size="17" fill="#6b7280" font-weight="400" text-anchor="start" data-box="32 1888">Use case: signing up is choosing across the weekend. A PC page shows each day side by side; a phone scrolls one list with sticky day headings and a jump bar. Demo names only.</text>
<text x="32" y="128" font-size="17" fill="#111827" font-weight="700" text-anchor="start" data-box="32 1212">1 · PC (1280 px): the whole weekend on one page, a section per day, time order inside each day</text>
