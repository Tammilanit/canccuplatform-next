<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1090" width="1920" height="1090" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Step 7 mockup 03: Teams: one team panel, one invite line (player, team leader)</title>
<defs></defs>
<rect x="0" y="0" width="1920" height="1000" rx="0" fill="#f3f4f6"/>
<text x="32" y="48" font-size="28" fill="#111827" font-weight="700" text-anchor="start" data-box="32 1888">03 · Teams: one team panel, members as a list, one invite line (player, team leader)</text>
<text x="32" y="80" font-size="17" fill="#6b7280" font-weight="400" text-anchor="start" data-box="32 1888">Use case: a team leader registers a team of five for Demo Arena 5v5 and gathers players with one invite; a solo player is placed by the crew. A team lives for one session.</text>
<text x="32" y="128" font-size="17" fill="#111827" font-weight="700" text-anchor="start" data-box="32 402">1 · Name the team</text>
<text x="512" y="128" font-size="17" fill="#111827" font-weight="700" text-anchor="start" data-box="512 882">2 · The team panel and its invite</text>
<text x="992" y="128" font-size="17" fill="#111827" font-weight="700" text-anchor="start" data-box="992 1362">3 · Join from the invite</text>
<text x="1472" y="128" font-size="17" fill="#111827" font-weight="700" text-anchor="start" data-box="1472 1842">4 · Solo, placed by the crew</text>
