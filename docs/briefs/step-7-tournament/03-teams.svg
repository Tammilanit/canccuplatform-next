<text x="42" y="985" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="62" y="985" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="62 620.667">A team is one panel: a name, a leader, members as a list and one</text>
<text x="62" y="1006" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="62 620.667">invite line. A team lives for one session (U3).</text>
<circle cx="660.667" cy="980" r="10" fill="#111827"/>
<text x="660.667" y="985" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text>
<text x="680.667" y="985" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="680.667 1239.33">The invite is a link with a QR for the same link; it is valid</text>
<text x="680.667" y="1006" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="680.667 1239.33">until the close and never names a person.</text>
<circle cx="1279.33" cy="980" r="10" fill="#111827"/>
<text x="1279.33" y="985" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text>
<text x="1299.33" y="985" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="1299.33 1858">One team per player per session, enforced under a row lock (E1).</text>
<text x="1299.33" y="1006" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="1299.33 1858">Short teams are the crew&#x27;s call at the close (U6).</text>
