<circle cx="45.0" cy="785.0" r="13" fill="#f59e0b"/>
<text x="45.0" y="790.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">1</text>
<text x="66.0" y="790.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="66.0 932.0">The module follows agenda.item.delayed (agenda contract, built); the close moves with the start (E2).</text>
<circle cx="985.0" cy="785.0" r="13" fill="#f59e0b"/>
<text x="985.0" y="790.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">2</text>
<text x="1006.0" y="790.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="1006.0 1872.0">Overlaps warn, never block: a LAN player often plays two things in an evening (E10).</text>
<circle cx="45.0" cy="819.0" r="13" fill="#f59e0b"/>
<text x="45.0" y="824.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">3</text>
<text x="66.0" y="824.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="66.0 932.0">The bot is a helper, not a dependency: every step has a manual path (E3, O8).</text>
<circle cx="985.0" cy="819.0" r="13" fill="#f59e0b"/>
<text x="985.0" y="824.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">4</text>
<text x="1006.0" y="824.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="1006.0 1872.0">Presence opt-outs are never in the roster; the crew ticks them by hand (D5).</text>
<circle cx="45.0" cy="853.0" r="13" fill="#f59e0b"/>
<text x="45.0" y="858.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">5</text>
<text x="66.0" y="858.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="66.0 932.0">A cancelled session keeps no points; registrants get a push with the crew&#x27;s reason (E9).</text>
<circle cx="985.0" cy="853.0" r="13" fill="#f59e0b"/>
<text x="985.0" y="858.0" font-size="14" fill="#111827" font-weight="700" text-anchor="middle">6</text>
<text x="1006.0" y="858.0" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="1006.0 1872.0">Guests and visitors see the schedule and standings; registering needs membership (U12).</text>
</svg>
