<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1210" width="1920" height="1210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 02: the Pulse main-hall screen, 16:9, recommended direction</title>
  <style>
    .bg { fill: #0b0d1a; }
    .panel { fill: #161a2e; stroke: #343c66; stroke-width: 2; }
    .t { fill: #f3f5ff; }
    .m { fill: #a9b1d6; }
    .p { fill: #3ddcff; }
    .a { fill: #b98cff; }
    .ok { fill: #3ee39a; }
    .warn { fill: #ffc94d; }
    .down { fill: #ff6b7d; }
    .note { fill: #f97316; }
    .label { fill: #1f2937; font-size: 26px; font-weight: 600; }
    .legend { fill: #374151; font-size: 21px; }
    .pin { fill: #f97316; }
    .pintext { fill: #fff; font-size: 20px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <symbol id="qr" viewBox="0 0 21 21">
      <rect width="21" height="21" fill="#fff"/>
      <g fill="#0b0d1a">
        <rect x="1" y="1" width="6" height="6"/><rect x="2" y="2" width="4" height="4" fill="#fff"/><rect x="3" y="3" width="2" height="2"/>
        <rect x="14" y="1" width="6" height="6"/><rect x="15" y="2" width="4" height="4" fill="#fff"/><rect x="16" y="3" width="2" height="2"/>
        <rect x="1" y="14" width="6" height="6"/><rect x="2" y="15" width="4" height="4" fill="#fff"/><rect x="3" y="16" width="2" height="2"/>
        <rect x="9" y="1" width="1" height="2"/><rect x="11" y="2" width="2" height="1"/><rect x="9" y="5" width="3" height="1"/>
        <rect x="8" y="8" width="2" height="2"/><rect x="11" y="9" width="3" height="1"/><rect x="15" y="9" width="2" height="2"/>
        <rect x="18" y="8" width="2" height="1"/><rect x="1" y="9" width="3" height="1"/><rect x="5" y="10" width="2" height="2"/>
        <rect x="9" y="12" width="1" height="3"/><rect x="12" y="12" width="3" height="2"/><rect x="17" y="13" width="3" height="1"/>
        <rect x="9" y="17" width="2" height="2"/><rect x="13" y="16" width="2" height="3"/><rect x="17" y="17" width="3" height="3"/>
      </g>
    </symbol>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddcff"/><stop offset="1" stop-color="#b98cff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2246"/><stop offset="1" stop-color="#2a1745"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1210" fill="#f3f4f6"/>
  <text x="24" y="40" class="label">02 · Pulse, main hall (16:9, built-in layout "pulse", 12×12 grid) · Demo Event</text>

  <g transform="translate(0,60)">
    <rect width="1920" height="1080" class="bg"/>

    <!-- header (1,1,12,1) -->
    <rect x="48" y="22" width="46" height="46" rx="10" fill="url(#grad)"/>
    <text x="110" y="58" class="t" font-size="34" font-weight="700" letter-spacing="2">DEMO EVENT</text>
    <text x="420" y="58" class="m" font-size="26">Main hall</text>
    <text x="1872" y="58" class="t" font-size="40" font-weight="700" text-anchor="end">18:42</text>
    <text x="1740" y="58" class="m" font-size="24" text-anchor="end">Sat 14 Mar</text>

    <!-- hero (1,2,8,10): playlist widget showing a rendered PPTX slide -->
    <rect x="48" y="102" width="1212" height="876" rx="14" fill="url(#hero)" stroke="#343c66" stroke-width="2"/>
    <text x="96" y="190" class="p" font-size="28" font-weight="700" letter-spacing="3">TONIGHT ON STAGE</text>
    <text x="96" y="300" class="t" font-size="92" font-weight="800">Demo Game Cup</text>
    <text x="96" y="400" class="t" font-size="92" font-weight="800">Grand final</text>
    <text x="96" y="480" class="m" font-size="40">21:00 · Stage · 8 teams left</text>
    <rect x="96" y="560" width="520" height="290" rx="12" fill="#0b0d1a" opacity="0.55"/>
    <text x="126" y="620" class="m" font-size="26">Slide 3 / 12 · from "welcome.pptx"</text>
    <text x="126" y="680" class="t" font-size="34">Bring your own headset.</text>
    <text x="126" y="730" class="t" font-size="34">Seats open 20:30.</text>
    <text x="126" y="810" class="a" font-size="26">rendered by the PPTX render job</text>
    <!-- rotation dots: playlist, photo, bracket (skipped while empty) -->
    <circle cx="1120" cy="930" r="9" class="p"/>
    <circle cx="1150" cy="930" r="9" fill="#343c66"/>
    <circle cx="1180" cy="930" r="9" fill="none" stroke="#343c66" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="96" y="924" width="980" height="10" rx="5" fill="#343c66"/>
    <rect x="96" y="924" width="610" height="10" rx="5" fill="url(#grad)"/>

    <!-- rail (9,2,4,6): agenda_now + countdown -->
    <rect x="1290" y="102" width="582" height="510" rx="14" class="panel"/>
    <text x="1322" y="152" class="m" font-size="24" font-weight="700" letter-spacing="3">NOW</text>
    <text x="1322" y="200" class="t" font-size="38" font-weight="700">Dinner</text>
    <text x="1322" y="240" class="m" font-size="26">Café · until 19:15</text>
    <rect x="1640" y="176" width="200" height="40" rx="20" fill="#3a2d10"/>
    <text x="1740" y="204" class="warn" font-size="24" font-weight="700" text-anchor="middle">+15 min</text>
    <line x1="1322" y1="272" x2="1840" y2="272" stroke="#343c66" stroke-width="2"/>
    <text x="1322" y="318" class="m" font-size="24" font-weight="700" letter-spacing="3">NEXT</text>
    <text x="1322" y="364" class="t" font-size="34" font-weight="600">Demo Game Cup, semis</text>
    <text x="1322" y="402" class="m" font-size="26">Stage · 19:30</text>
    <text x="1322" y="452" class="t" font-size="30">Board games corner</text>
    <text x="1322" y="488" class="m" font-size="26">Café · 20:00</text>
    <text x="1322" y="548" class="m" font-size="24">Semis start in</text>
    <text x="1840" y="552" class="p" font-size="40" font-weight="700" text-anchor="end">00:47:18</text>
    <rect x="1322" y="568" width="518" height="10" rx="5" fill="#343c66"/>
    <rect x="1322" y="568" width="190" height="10" rx="5" fill="url(#grad)"/>

    <!-- venue_rail (9,8,4,4): venue_info + checkin_qr -->
    <rect x="1290" y="642" width="582" height="336" rx="14" class="panel"/>
    <text x="1322" y="690" class="m" font-size="24" font-weight="700" letter-spacing="3">WI-FI</text>
    <text x="1322" y="732" class="t" font-size="32" font-weight="700">demo-guest</text>
    <text x="1322" y="770" class="m" font-size="24">password on the hub</text>
    <text x="1322" y="842" class="t" font-size="30" font-weight="700">Check in</text>
    <text x="1322" y="880" class="m" font-size="24">Scan with the hub.</text>
    <text x="1322" y="912" class="m" font-size="24">Code changes every 30 s.</text>
    <use href="#qr" x="1636" y="700" width="210" height="210"/>
    <rect x="1636" y="922" width="210" height="8" rx="4" fill="#343c66"/>
    <rect x="1636" y="922" width="120" height="8" rx="4" class="p"/>

    <!-- ticker (1,12,12,1) -->
    <rect x="0" y="1002" width="1920" height="78" fill="#161a2e"/>
    <rect x="0" y="1002" width="190" height="78" fill="url(#grad)"/>
    <text x="95" y="1052" fill="#0b0d1a" font-size="28" font-weight="800" text-anchor="middle">INFO</text>
    <text x="220" y="1052" class="t" font-size="32">Pizza orders close at 20:00  ·  Lost and found at the info desk  ·  Demo Game Cup final 21:00 on stage</text>

    <!-- annotation pins -->
    <circle cx="30" cy="45" r="16" class="pin"/><text x="30" y="52" class="pintext">1</text>
    <circle cx="66" cy="120" r="16" class="pin"/><text x="66" y="127" class="pintext">2</text>
    <circle cx="1306" cy="120" r="16" class="pin"/><text x="1306" y="127" class="pintext">3</text>
    <circle cx="1306" cy="660" r="16" class="pin"/><text x="1306" y="667" class="pintext">4</text>
    <circle cx="20" cy="1020" r="16" class="pin"/><text x="20" y="1027" class="pintext">5</text>
  </g>

  <text x="24" y="1168" class="legend">1 header: logo, zone, clock · 2 hero rotates playlist (PPTX, image, video), photo, bracket; empty widgets are skipped</text>
  <text x="24" y="1198" class="legend">3 now/next from the run-of-show, delays shown · 4 venue facts and the rotating check-in QR · 5 the manual ticker</text>
</svg>
