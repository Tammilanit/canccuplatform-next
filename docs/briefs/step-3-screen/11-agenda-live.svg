<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1100" width="1920" height="1100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 11: the run-of-show, edited live: a delay with "everything after it", and what it will change before it changes it</title>
  <style>
    .label { fill: #1f2937; font-size: 26px; font-weight: 600; }
    .ui { fill: #ffffff; }
    .h1 { fill: #111827; font-size: 28px; font-weight: 700; }
    .h2 { fill: #111827; font-size: 19px; font-weight: 700; }
    .tx { fill: #111827; font-size: 16px; } .mu { fill: #6b7280; font-size: 14px; }
    .time { fill: #111827; font-size: 18px; font-weight: 700; }
    .row { fill: #fff; stroke: #e5e7eb; stroke-width: 1.5; }
    .chip { font-size: 12px; font-weight: 700; }
    .btn { fill: #2563eb; } .btnt { fill: #fff; font-size: 16px; font-weight: 700; }
    .gbtn { fill: #fff; stroke: #d1d5db; stroke-width: 1.5; } .gbtnt { fill: #111827; font-size: 15px; }
    .note { fill: #c2410c; font-size: 17px; }
  </style>
  <rect width="1920" height="1100" fill="#f3f4f6"/>
  <text x="24" y="40" class="label">11 · Run-of-show (agenda module), edited live: delay dinner by 15 minutes and everything after it</text>

  <g transform="translate(24,64)">
    <rect width="1872" height="1010" rx="12" class="ui" stroke="#d1d5db" stroke-width="2"/>
    <rect width="1872" height="64" rx="12" fill="#111827"/>
    <text x="28" y="41" fill="#fff" font-size="20" font-weight="700">Demo Event</text>
    <g transform="translate(40,64)">
      <text x="0" y="52" class="h1">Run-of-show</text>
      <rect x="220" y="28" width="150" height="36" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="295" y="52" class="gbtnt" text-anchor="middle">Sat 14 Mar</text>
      <rect x="380" y="28" width="110" height="36" rx="6" class="gbtn"/><text x="435" y="52" class="gbtnt" text-anchor="middle">Sun 15</text>
      <text x="520" y="52" class="mu">Kinds: Doors · Ceremony · Tournament · Meal · Quiet hours · Activity · Other (yours to rename)</text>
      <rect x="1600" y="28" width="190" height="40" rx="8" class="btn"/><text x="1695" y="54" class="btnt" text-anchor="middle">+ Item</text>

      <g transform="translate(0,96)">
        <!-- rows -->
        <rect width="900" height="64" rx="8" class="row"/>
        <text x="20" y="40" class="time">17:00</text><text x="110" y="30" class="tx" font-weight="700">Doors open (day 2)</text><text x="110" y="52" class="mu">Doors · Entrance · public</text>
        <text x="880" y="40" class="mu" text-anchor="end">done</text>
        <rect y="74" width="900" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
        <text x="20" y="118" class="time">18:00</text><text x="110" y="104" class="tx" font-weight="700">Dinner</text><text x="110" y="128" class="mu">Meal · Café · zone café · public · until 19:00</text>
        <rect x="700" y="96" width="70" height="26" rx="13" fill="#dcfce7"/><text x="735" y="114" class="chip" fill="#166534" text-anchor="middle">NOW</text>
        <rect x="780" y="94" width="100" height="32" rx="6" class="gbtn"/><text x="830" y="116" class="gbtnt" text-anchor="middle">Delay…</text>
        <line x1="0" y1="160" x2="900" y2="160" stroke="#dc2626" stroke-width="2"/><text x="904" y="165" fill="#dc2626" font-size="13" font-weight="700">18:42</text>
        <rect y="170" width="900" height="64" rx="8" class="row"/>
        <text x="20" y="210" class="time">19:30</text><text x="110" y="200" class="tx" font-weight="700">Demo Game Cup, semis</text><text x="110" y="222" class="mu">Tournament · Stage · from the tournament module (title and times are its own)</text>
        <rect y="244" width="900" height="64" rx="8" class="row"/>
        <text x="20" y="284" class="time">20:00</text><text x="110" y="274" class="tx" font-weight="700">Board games corner</text><text x="110" y="296" class="mu">Activity · Café · attendees only</text>
        <rect y="318" width="900" height="64" rx="8" class="row"/>
        <text x="20" y="358" class="time">20:15</text><text x="110" y="348" class="tx" font-weight="700">Crew briefing</text><text x="110" y="370" class="mu">Other · Back office · crew only (never on a screen)</text>
        <rect y="392" width="900" height="64" rx="8" class="row"/>
        <text x="20" y="432" class="time">21:00</text><text x="110" y="422" class="tx" font-weight="700">Demo Game Cup, grand final</text><text x="110" y="444" class="mu">Tournament · Stage · reminders 30 and 10 min · push, Discord, screen</text>
        <rect y="466" width="900" height="64" rx="8" class="row"/>
        <text x="20" y="506" class="time">01:00</text><text x="110" y="496" class="tx" font-weight="700">Quiet hours</text><text x="110" y="518" class="mu">Quiet hours · until 08:00 · holds non-urgent pushes · never shifted by a delay</text>
      </g>

      <!-- delay dialog -->
      <g transform="translate(960,96)">
        <rect width="830" height="640" rx="14" fill="#fff" stroke="#2563eb" stroke-width="3"/>
        <text x="30" y="50" class="h2">Delay "Dinner"</text>
        <text x="30" y="76" class="mu">It is running: its end moves; its start stays.</text>
        <rect x="30" y="96" width="70" height="44" rx="8" class="gbtn"/><text x="65" y="124" class="gbtnt" text-anchor="middle">+5</text>
        <rect x="110" y="96" width="70" height="44" rx="8" class="gbtn"/><text x="145" y="124" class="gbtnt" text-anchor="middle">+10</text>
        <rect x="190" y="96" width="70" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="225" y="124" class="gbtnt" text-anchor="middle">+15</text>
        <rect x="270" y="96" width="70" height="44" rx="8" class="gbtn"/><text x="305" y="124" class="gbtnt" text-anchor="middle">+30</text>
        <rect x="350" y="96" width="110" height="44" rx="8" class="gbtn"/><text x="405" y="124" class="gbtnt" text-anchor="middle">other…</text>
        <rect x="30" y="160" width="22" height="22" rx="4" fill="#2563eb"/><text x="36" y="177" fill="#fff" font-size="16">✓</text>
        <text x="64" y="178" class="tx">and everything after it today (following)</text>
        <text x="30" y="226" class="h2">This will change</text>
        <text x="30" y="258" class="tx">Dinner ends 19:15 instead of 19:00</text>
        <text x="30" y="286" class="tx">Semis 19:30 → 19:45 · Board games 20:00 → 20:15</text>
        <text x="30" y="314" class="tx">Crew briefing 20:15 → 20:30 · Grand final 21:00 → 21:15</text>
        <text x="30" y="342" class="mu">Quiet hours stay at 01:00. The tournament module follows for the semis and the final.</text>
        <text x="30" y="390" class="h2">Who hears about it</text>
        <text x="30" y="422" class="tx">Screens: every zone, within a second (+15 min on each item)</text>
        <text x="30" y="450" class="tx">Phones: one "schedule" notice per audience (public, attendees)</text>
        <text x="30" y="478" class="tx">Discord: one post in the event channel</text>
        <text x="30" y="506" class="mu">Crew items notify crew only. Items starting more than 2 h out stay quiet.</text>
        <rect x="30" y="560" width="160" height="48" rx="8" class="gbtn"/><text x="110" y="590" class="gbtnt" text-anchor="middle">Cancel</text>
        <rect x="560" y="560" width="240" height="48" rx="8" class="btn"/><text x="680" y="590" class="btnt" text-anchor="middle">Delay 5 items +15</text>
      </g>
      <text x="0" y="790" class="note">The agenda is the one source for now and next: screens, the bot and the hub read GET /api/agenda/now, so they never disagree. A delay keeps the planned times so people see "+15 min";</text>
      <text x="0" y="816" class="note">a move is a new plan. The "who hears about it" box is computed in the browser from the item's notify channels and visibility (no new contract path). Undo of a delay is a delay of −15</text>
      <text x="0" y="842" class="note">(question U9). Works the same on a phone (mockup 13), where most live edits happen.</text>
    </g>
  </g>
</svg>
