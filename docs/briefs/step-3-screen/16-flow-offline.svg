<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 820" width="1920" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 16: flow, the venue uplink drops for twelve minutes</title>
  <style>
    .label { fill: #1f2937; font-size: 26px; font-weight: 600; }
    .lane { fill: #111827; font-size: 20px; font-weight: 700; }
    .d { fill: #374151; font-size: 16px; }
    .tm { fill: #6b7280; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .ev { fill: #fff; stroke: #d1d5db; stroke-width: 1.5; }
    .evt { fill: #111827; font-size: 15px; }
    .note { fill: #c2410c; font-size: 17px; }
  </style>
  <rect width="1920" height="820" fill="#f3f4f6"/>
  <text x="24" y="40" class="label">16 · Flow: the venue uplink drops at 18:40 and comes back at 18:52 (the VM is remote, so the venue is cut off, not the platform)</text>

  <!-- time axis -->
  <g transform="translate(260,80)">
    <line x1="0" y1="20" x2="1600" y2="20" stroke="#9ca3af" stroke-width="2"/>
    <rect x="160" y="0" width="960" height="490" fill="#fee2e2" opacity="0.5"/>
    <text x="160" y="14" class="tm">18:40</text><text x="225" y="14" class="tm">+10 s</text><text x="300" y="14" class="tm">+45 s</text>
    <text x="640" y="14" class="tm">18:46</text><text x="1120" y="14" class="tm">18:52</text><text x="1240" y="14" class="tm">+2 s</text><text x="1500" y="14" class="tm">later</text>
    <text x="640" y="478" fill="#b91c1c" font-size="18" font-weight="700" text-anchor="middle">uplink down · 12 min</text>
  </g>

  <!-- lanes -->
  <text x="24" y="170" class="lane">Screens</text>
  <text x="24" y="196" class="d">at the venue</text>
  <g transform="translate(260,130)">
    <rect x="0" y="0" width="150" height="90" rx="8" class="ev"/><text x="12" y="28" class="evt">Pulse plays,</text><text x="12" y="50" class="evt">live by push</text>
    <rect x="200" y="0" width="300" height="90" rx="8" class="ev"/><text x="212" y="28" class="evt">"offline since 18:40" mark;</text><text x="212" y="50" class="evt">rotation, clock, countdowns,</text><text x="212" y="72" class="evt">cached playlist run on</text>
    <rect x="520" y="0" width="300" height="90" rx="8" class="ev"/><text x="532" y="28" class="evt">stale widgets dim; the</text><text x="532" y="50" class="evt">check-in QR hides; a claim</text><text x="532" y="72" class="evt">ends at its expires_at</text>
    <rect x="1130" y="0" width="300" height="90" rx="8" class="ev" stroke="#10b981"/><text x="1142" y="28" class="evt">stream reconnects (backoff,</text><text x="1142" y="50" class="evt">jitter): over 5 min, so one</text><text x="1142" y="72" class="evt">full state, no reload</text>
  </g>

  <text x="24" y="320" class="lane">Studio</text>
  <text x="24" y="346" class="d">anywhere (VM)</text>
  <g transform="translate(260,280)">
    <rect x="290" y="0" width="330" height="90" rx="8" class="ev" stroke="#f59e0b"/><text x="302" y="28" class="evt">all venue screens offline (45 s):</text><text x="302" y="50" class="evt">"the venue uplink may be down",</text><text x="302" y="72" class="evt">not three separate alarms</text>
    <rect x="660" y="0" width="300" height="90" rx="8" class="ev"/><text x="672" y="28" class="evt">edits still work: the agenda,</text><text x="672" y="50" class="evt">ticker and content save and</text><text x="672" y="72" class="evt">wait for the screens</text>
    <rect x="1130" y="0" width="300" height="90" rx="8" class="ev" stroke="#10b981"/><text x="1142" y="28" class="evt">devices online again;</text><text x="1142" y="50" class="evt">"back after 12 min"</text><text x="1142" y="72" class="evt">in Recent</text>
  </g>

  <text x="24" y="470" class="lane">Phones</text>
  <text x="24" y="496" class="d">mobile data</text>
  <g transform="translate(260,430)">
    <rect x="660" y="0" width="420" height="90" rx="8" class="ev"/><text x="672" y="28" class="evt">attendees on mobile data still get pushes and</text><text x="672" y="50" class="evt">the hub (the VM is up); on the venue Wi-Fi</text><text x="672" y="72" class="evt">they are cut off like the screens</text>
  </g>

  <text x="24" y="680" class="note">Not an offline-first player (0022): nothing new starts offline, and a cold kiosk boot without the uplink shows its cached last state only if the browser kept it. The contract keeps 5 minutes</text>
  <text x="24" y="706" class="note">of changes per zone for a resume; a longer outage gets one full state. Studio telling "uplink down" from "one screen down" is an invented rule over device health (question E2).</text>
  <text x="24" y="732" class="note">Exit criterion of the step: the projector keeps showing the Pulse with the uplink cut, and catches up when it returns.</text>
</svg>
