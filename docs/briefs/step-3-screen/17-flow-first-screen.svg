<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 17: flow, a useful screen in five minutes with no content uploaded</title>
  <style>
    .label { fill: #1f2937; font-size: 26px; font-weight: 600; }
    .step { fill: #111827; font-size: 22px; font-weight: 700; }
    .d { fill: #374151; font-size: 18px; }
    .min { fill: #2563eb; font-size: 18px; font-weight: 700; }
    .t { fill: #f3f5ff; } .m { fill: #a9b1d6; } .p { fill: #3ddcff; } .w { fill: #ffc94d; }
    .note { fill: #c2410c; font-size: 17px; }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff7a45"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
  </defs>
  <rect width="1920" height="900" fill="#f3f4f6"/>
  <text x="24" y="40" class="label">17 · Flow: a new event's first screen in five minutes, with nothing uploaded but a logo</text>

  <g transform="translate(40,90)">
    <circle cx="20" cy="20" r="20" fill="#2563eb"/><text x="20" y="27" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">1</text>
    <text x="54" y="20" class="step">Brand kit</text><text x="54" y="46" class="min">2 min</text>
    <text x="0" y="86" class="d">Logo and two colours (mockup 12),</text>
    <text x="0" y="110" class="d">or start from a demo theme.</text>
    <circle cx="20" cy="170" r="20" fill="#2563eb"/><text x="20" y="177" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">2</text>
    <text x="54" y="170" class="step">Run-of-show</text><text x="54" y="196" class="min">2 min</text>
    <text x="0" y="236" class="d">Five items with the starter kinds,</text>
    <text x="0" y="260" class="d">or clone the last event's agenda.</text>
    <circle cx="20" cy="320" r="20" fill="#2563eb"/><text x="20" y="327" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">3</text>
    <text x="54" y="320" class="step">Pair a screen</text><text x="54" y="346" class="min">1 min</text>
    <text x="0" y="386" class="d">Code on the kiosk, zone "main"</text>
    <text x="0" y="410" class="d">(every event starts with it).</text>
    <text x="0" y="470" class="step">Already there, from the platform:</text>
    <text x="0" y="502" class="d">• the venue's Wi-Fi (venue profile copy)</text>
    <text x="0" y="530" class="d">• the clock in the event's time zone</text>
    <text x="0" y="558" class="d">• the check-in QR (Notify)</text>
    <text x="0" y="586" class="d">• the default Pulse layout</text>
  </g>

  <!-- the resulting screen -->
  <g transform="translate(520,90) scale(0.6875)">
    <rect width="1920" height="1080" fill="#120c0a"/>
    <circle cx="74" cy="46" r="24" fill="#ff7a45"/><circle cx="74" cy="46" r="10" fill="#120c0a"/>
    <text x="114" y="58" fill="#fff4ee" font-size="34" font-weight="700">DEMO EVENT</text>
    <text x="1872" y="58" fill="#fff4ee" font-size="40" font-weight="700" text-anchor="end">16:05</text>
    <!-- hero with no playlist: the agenda hero (proposal) -->
    <rect x="48" y="102" width="1212" height="876" rx="14" fill="#241712"/>
    <text x="96" y="200" fill="#ff7a45" font-size="30" font-weight="700" letter-spacing="3">NEXT UP</text>
    <text x="96" y="320" fill="#fff4ee" font-size="110" font-weight="800">Doors open</text>
    <text x="96" y="420" fill="#d9bfb2" font-size="48">17:00 · Entrance</text>
    <text x="96" y="560" fill="#fff4ee" font-size="140" font-weight="800">00:54:12</text>
    <rect x="96" y="610" width="1100" height="14" rx="7" fill="#4a3027"/><rect x="96" y="610" width="220" height="14" rx="7" fill="url(#g)"/>
    <text x="96" y="760" fill="#d9bfb2" font-size="36">Then: Opening ceremony 17:30 · Dinner 18:00 · Quiz 22:00</text>
    <!-- rail -->
    <rect x="1290" y="102" width="582" height="510" rx="14" fill="#241712" stroke="#4a3027" stroke-width="2"/>
    <text x="1322" y="152" fill="#d9bfb2" font-size="24" font-weight="700" letter-spacing="3">TODAY</text>
    <text x="1322" y="210" fill="#fff4ee" font-size="32">17:00  Doors open</text>
    <text x="1322" y="262" fill="#fff4ee" font-size="32">17:30  Opening ceremony</text>
    <text x="1322" y="314" fill="#fff4ee" font-size="32">18:00  Dinner</text>
    <text x="1322" y="366" fill="#fff4ee" font-size="32">20:00  Tournament</text>
    <text x="1322" y="418" fill="#fff4ee" font-size="32">22:00  Quiz</text>
    <!-- venue rail -->
    <rect x="1290" y="642" width="582" height="336" rx="14" fill="#241712" stroke="#4a3027" stroke-width="2"/>
    <text x="1322" y="690" fill="#d9bfb2" font-size="24" font-weight="700" letter-spacing="3">WI-FI</text>
    <text x="1322" y="734" fill="#fff4ee" font-size="32" font-weight="700">demo-guest</text>
    <rect x="1636" y="700" width="210" height="210" fill="#fff"/>
    <text x="1322" y="860" fill="#fff4ee" font-size="28" font-weight="700">Check in</text>
    <rect x="0" y="1002" width="1920" height="78" fill="#241712"/>
    <text x="40" y="1052" fill="#d9bfb2" font-size="30">No ticker set: the line stays hidden until someone sets one</text>
  </g>
  <text x="520" y="866" class="note">With no playlist yet, the hero shows the next run-of-show item with a big countdown (proposal; the contract's idle rule would show the logo): question L2.</text>
</svg>
