<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" width="1920" height="1000" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 15: the superadmin's device registry: moving a venue's screens to the next event</title>
  <style>
    .label { fill: #1f2937; font-size: 26px; font-weight: 600; }
    .ui { fill: #ffffff; }
    .h1 { fill: #111827; font-size: 28px; font-weight: 700; }
    .h2 { fill: #111827; font-size: 19px; font-weight: 700; }
    .tx { fill: #111827; font-size: 16px; } .mu { fill: #6b7280; font-size: 14px; }
    .th { fill: #6b7280; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    .btn { fill: #2563eb; } .btnt { fill: #fff; font-size: 16px; font-weight: 700; }
    .gbtn { fill: #fff; stroke: #d1d5db; stroke-width: 1.5; } .gbtnt { fill: #111827; font-size: 15px; }
    .note { fill: #c2410c; font-size: 17px; }
    .t { fill: #f3f5ff; } .m { fill: #a9b1d6; } .p { fill: #3ddcff; }
  </style>
  <rect width="1920" height="1000" fill="#f3f4f6"/>
  <text x="24" y="40" class="label">15 · Superadmin → Venues → Demo Venue → Devices: hand the venue's screens to the next event in one action</text>

  <g transform="translate(24,64)">
    <rect width="1872" height="900" rx="12" class="ui" stroke="#d1d5db" stroke-width="2"/>
    <rect width="1872" height="64" rx="12" fill="#3f0f5c"/>
    <text x="28" y="41" fill="#fff" font-size="20" font-weight="700">Platform · superadmin (over Tailscale only)</text>
    <g transform="translate(40,64)">
      <text x="0" y="52" class="h1">Demo Venue · devices</text>
      <text x="0" y="84" class="mu">Events here: Demo Event (live, ends Sun 15) · Demo Event 2 (draft, starts Fri 20)</text>
      <!-- table -->
      <g transform="translate(0,110)">
        <rect width="1100" height="44" fill="#f9fafb"/>
        <rect x="14" y="13" width="18" height="18" rx="3" fill="#2563eb"/>
        <text x="50" y="28" class="th">DEVICE</text><text x="260" y="28" class="th">CURRENT EVENT</text><text x="520" y="28" class="th">LAST SEEN</text><text x="700" y="28" class="th">START URL</text>
        <g transform="translate(0,44)">
          <rect width="1100" height="56" fill="#eff6ff"/><rect x="14" y="19" width="18" height="18" rx="3" fill="#2563eb"/>
          <text x="50" y="34" class="tx">Hall left</text><text x="260" y="34" class="tx">Demo Event</text><text x="520" y="34" class="mu">now</text><text x="700" y="34" class="mu">demo.example.org/screen/</text>
        </g>
        <g transform="translate(0,100)">
          <rect width="1100" height="56" fill="#eff6ff"/><rect x="14" y="19" width="18" height="18" rx="3" fill="#2563eb"/>
          <text x="50" y="34" class="tx">Hall right</text><text x="260" y="34" class="tx">Demo Event</text><text x="520" y="34" class="mu">now</text><text x="700" y="34" class="mu">demo.example.org/screen/</text>
        </g>
        <g transform="translate(0,156)">
          <rect width="1100" height="56" fill="#eff6ff"/><rect x="14" y="19" width="18" height="18" rx="3" fill="#2563eb"/>
          <text x="50" y="34" class="tx">Café TV</text><text x="260" y="34" class="tx">Demo Event</text><text x="520" y="34" class="mu">2 min ago</text><text x="700" y="34" class="mu">demo.example.org/screen/</text>
        </g>
        <g transform="translate(0,212)">
          <rect width="1100" height="56" fill="#fff"/><rect x="14" y="19" width="18" height="18" rx="3" fill="#fff" stroke="#9ca3af"/>
          <text x="50" y="34" class="tx">Stage left</text><text x="260" y="34" class="mu">parked</text><text x="520" y="34" class="mu">yesterday</text><text x="700" y="34" class="mu">—</text>
        </g>
      </g>
      <!-- dialog -->
      <g transform="translate(1140,110)">
        <rect width="650" height="520" rx="14" fill="#fff" stroke="#2563eb" stroke-width="3"/>
        <text x="30" y="50" class="h2">Move 3 devices</text>
        <text x="30" y="90" class="mu">To</text>
        <rect x="30" y="102" width="590" height="44" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
        <text x="46" y="130" class="tx">Demo Event 2 · draft · same venue ▾</text>
        <rect x="30" y="160" width="22" height="22" rx="4" class="btn"/><text x="36" y="177" fill="#fff" font-size="16">✓</text>
        <text x="64" y="178" class="tx">After Demo Event ends (Sun 15, 23:59)</text>
        <text x="64" y="202" class="mu">or at once, if unticked</text>
        <text x="30" y="250" class="h2">What happens</text>
        <text x="30" y="282" class="tx">Their zones in Demo Event end; that event is told</text>
        <text x="30" y="306" class="tx">"released" without naming the new one.</text>
        <text x="30" y="338" class="tx">Each kiosk is sent on to Demo Event 2 with a</text>
        <text x="30" y="362" class="tx">one-time transfer code and shows "not assigned"</text>
        <text x="30" y="386" class="tx">until its organisers pick zones.</text>
        <text x="30" y="418" class="mu">Same venue, so the start URLs keep working.</text>
        <rect x="30" y="448" width="160" height="48" rx="8" class="gbtn"/><text x="110" y="478" class="gbtnt" text-anchor="middle">Cancel</text>
        <rect x="380" y="448" width="240" height="48" rx="8" class="btn"/><text x="500" y="478" class="btnt" text-anchor="middle">Schedule the move</text>
      </g>
      <text x="0" y="700" class="note">Only the superadmin moves a device (0013 item 34), audited. Two events at the venue at once use different devices. Moving "after the event ends" is not in the contract (a PATCH moves</text>
      <text x="0" y="726" class="note">at once): a scheduled move is question O6. Bulk selection is a client feature over the per-device PATCH. A kiosk on the old hostname follows the redirect until its new cookie has worked once.</text>
      <text x="0" y="752" class="note">Moving to another venue needs a new start URL on the kiosk, which this dialog then shows with the device.</text>
    </g>
  </g>
</svg>
