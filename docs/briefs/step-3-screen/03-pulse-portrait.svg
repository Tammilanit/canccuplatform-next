<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 03: portrait screens, the café zone and the entrance zone with the check-in QR in the hero</title>
  <style>
    .label { fill: #1f2937; font-size: 26px; font-weight: 600; }
    .cap { fill: #111827; font-size: 24px; font-weight: 700; }
    .d { fill: #374151; font-size: 20px; }
    .bg { fill: #0b0d1a; } .panel { fill: #161a2e; stroke: #343c66; stroke-width: 3; }
    .t { fill: #f3f5ff; } .m { fill: #a9b1d6; } .p { fill: #3ddcff; } .a { fill: #b98cff; } .w { fill: #ffc94d; } .ok { fill: #3ee39a; }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddcff"/><stop offset="1" stop-color="#b98cff"/></linearGradient>
    <symbol id="qr" viewBox="0 0 21 21">
      <rect width="21" height="21" fill="#fff"/>
      <g fill="#0b0d1a">
        <rect x="1" y="1" width="6" height="6"/><rect x="2" y="2" width="4" height="4" fill="#fff"/><rect x="3" y="3" width="2" height="2"/>
        <rect x="14" y="1" width="6" height="6"/><rect x="15" y="2" width="4" height="4" fill="#fff"/><rect x="16" y="3" width="2" height="2"/>
        <rect x="1" y="14" width="6" height="6"/><rect x="2" y="15" width="4" height="4" fill="#fff"/><rect x="3" y="16" width="2" height="2"/>
        <rect x="9" y="1" width="1" height="2"/><rect x="11" y="2" width="2" height="1"/><rect x="9" y="5" width="3" height="1"/>
        <rect x="8" y="8" width="2" height="2"/><rect x="11" y="9" width="3" height="1"/><rect x="15" y="9" width="2" height="2"/>
        <rect x="18" y="8" width="2" height="1"/><rect x="1" y="9" width="3" height="1"/><rect x="5" y="10" width="2" height="2"/>
        <rect x="9" y="12" width="1" height="3"/><rect x="12" y="12" width="3" height="2"/><rect x="17" y="13" width="3" height="1"/>
        <rect x="9" y="17" width="2" height="2"/><rect x="13" y="16" width="2" height="3"/><rect x="17" y="17" width="3" height="3"/>
      </g>
    </symbol>
  </defs>
  <rect width="1920" height="1060" fill="#f3f4f6"/>
  <text x="24" y="40" class="label">03 · Portrait screens (built-in layout "pulse_portrait", 6×16 grid): café zone and entrance zone</text>

  <!-- Café portrait, scaled 0.45 -->
  <g transform="translate(60,70) scale(0.45)">
    <rect width="1080" height="1920" class="bg"/>
    <rect x="48" y="60" width="90" height="90" rx="18" fill="url(#g)"/>
    <text x="164" y="122" class="t" font-size="56" font-weight="700">DEMO EVENT</text>
    <text x="1032" y="122" class="t" font-size="72" font-weight="700" text-anchor="end">18:42</text>
    <text x="164" y="190" class="m" font-size="40">Café</text>
    <!-- hero: photo widget, featured -->
    <rect x="48" y="252" width="984" height="816" rx="20" fill="#232a4d"/>
    <rect x="48" y="252" width="984" height="816" rx="20" fill="none" stroke="url(#g)" stroke-width="8"/>
    <circle cx="540" cy="580" r="150" fill="#2f3866"/>
    <rect x="300" y="700" width="480" height="160" rx="60" fill="#2f3866"/>
    <text x="96" y="980" class="t" font-size="44" font-weight="700">New photo · "Setup day"</text>
    <text x="96" y="1036" class="m" font-size="36">by Player One · 18:31</text>
    <!-- rail: agenda_now -->
    <rect x="48" y="1092" width="984" height="696" rx="20" class="panel"/>
    <text x="96" y="1170" class="m" font-size="36" font-weight="700" letter-spacing="4">NOW IN THE CAFÉ</text>
    <text x="96" y="1250" class="t" font-size="64" font-weight="700">Dinner</text>
    <text x="96" y="1316" class="m" font-size="40">until 19:15</text>
    <rect x="720" y="1206" width="270" height="64" rx="32" fill="#3a2d10"/>
    <text x="855" y="1252" class="w" font-size="40" font-weight="700" text-anchor="middle">+15 min</text>
    <text x="96" y="1420" class="m" font-size="36" font-weight="700" letter-spacing="4">NEXT</text>
    <text x="96" y="1490" class="t" font-size="52">Board games corner · 20:00</text>
    <text x="96" y="1570" class="t" font-size="52">Quiz · 22:00</text>
    <text x="96" y="1700" class="m" font-size="36">Café items first, then the rest of the event</text>
    <!-- ticker -->
    <rect x="0" y="1812" width="1080" height="108" fill="#161a2e"/>
    <rect x="0" y="1812" width="200" height="108" fill="url(#g)"/>
    <text x="100" y="1880" fill="#0b0d1a" font-size="40" font-weight="800" text-anchor="middle">INFO</text>
    <text x="230" y="1880" class="t" font-size="44">Pizza orders close at 20:00</text>
  </g>
  <text x="60" y="980" class="cap">Café zone</text>
  <text x="60" y="1010" class="d">hero rotates photos (new first), playlist;</text>
  <text x="60" y="1036" class="d">rail shows the café's agenda items first</text>

  <!-- Entrance portrait -->
  <g transform="translate(620,70) scale(0.45)">
    <rect width="1080" height="1920" class="bg"/>
    <rect x="48" y="60" width="90" height="90" rx="18" fill="url(#g)"/>
    <text x="164" y="122" class="t" font-size="56" font-weight="700">DEMO EVENT</text>
    <text x="1032" y="122" class="t" font-size="72" font-weight="700" text-anchor="end">18:42</text>
    <text x="164" y="190" class="m" font-size="40">Entrance</text>
    <!-- hero: checkin_qr large -->
    <rect x="48" y="252" width="984" height="816" rx="20" fill="#161a2e" stroke="#343c66" stroke-width="3"/>
    <text x="540" y="350" class="t" font-size="64" font-weight="800" text-anchor="middle">Welcome! Check in here</text>
    <use href="#qr" x="300" y="400" width="480" height="480"/>
    <rect x="300" y="910" width="480" height="16" rx="8" fill="#343c66"/>
    <rect x="300" y="910" width="300" height="16" rx="8" class="p"/>
    <text x="540" y="1000" class="m" font-size="38" text-anchor="middle">Open the camera, scan, done. New code in 12 s.</text>
    <!-- rail: venue_info + agenda -->
    <rect x="48" y="1092" width="984" height="696" rx="20" class="panel"/>
    <text x="96" y="1170" class="m" font-size="36" font-weight="700" letter-spacing="4">WI-FI</text>
    <text x="96" y="1240" class="t" font-size="60" font-weight="700">demo-guest</text>
    <text x="96" y="1300" class="m" font-size="38">The password is on the hub after check-in</text>
    <line x1="96" y1="1350" x2="984" y2="1350" stroke="#343c66" stroke-width="3"/>
    <text x="96" y="1420" class="m" font-size="36" font-weight="700" letter-spacing="4">TONIGHT</text>
    <text x="96" y="1490" class="t" font-size="50">19:30  Semis · Stage</text>
    <text x="96" y="1560" class="t" font-size="50">21:00  Grand final · Stage</text>
    <text x="96" y="1630" class="t" font-size="50">01:00  Quiet hours</text>
    <rect x="0" y="1812" width="1080" height="108" fill="#161a2e"/>
    <rect x="0" y="1812" width="200" height="108" fill="url(#g)"/>
    <text x="100" y="1880" fill="#0b0d1a" font-size="40" font-weight="800" text-anchor="middle">INFO</text>
    <text x="230" y="1880" class="t" font-size="44">Cloakroom open until 23:00</text>
  </g>
  <text x="620" y="980" class="cap">Entrance zone</text>
  <text x="620" y="1010" class="d">the zone's hero widgets replaced by checkin_qr</text>
  <text x="620" y="1036" class="d">(Zone.regions.hero.widgets); same layout, no theme work</text>

  <!-- Notes -->
  <g transform="translate(1180,90)">
    <text x="0" y="0" class="cap">What the session should react to</text>
    <text x="0" y="44" class="d">• One built-in portrait layout serves very different jobs; a zone</text>
    <text x="0" y="72" class="d">   changes what each region shows without touching the theme.</text>
    <text x="0" y="112" class="d">• The check-in QR rotates every 30 s (Notify), so a photo of it is</text>
    <text x="0" y="140" class="d">   useless a minute later; the bar under it shows the next rotation.</text>
    <text x="0" y="180" class="d">• Wi-Fi passwords marked "attendees" never reach a screen or a guest:</text>
    <text x="0" y="208" class="d">   the screen shows the network name and says where the password is.</text>
    <text x="0" y="248" class="d">• Agenda items with a zone show first on that zone's screens</text>
    <text x="0" y="276" class="d">   (agenda Item.zone), then the rest of the event.</text>
    <text x="0" y="316" class="d">• Text sizes are for reading across a hall: nothing under 36 px</text>
    <text x="0" y="344" class="d">   at 1080 px wide (a rule CI can check, see question L7).</text>
    <text x="0" y="384" class="d">• The scan opens /notify/check-in on the phone: the page itself</text>
    <text x="0" y="412" class="d">   is the App track's, or a minimal one in step 3 (question D6).</text>
    <text x="0" y="460" class="cap">Open</text>
    <text x="0" y="500" class="d">• A dedicated "door" layout in the demo theme, or this zone override?</text>
    <text x="0" y="528" class="d">• Show the agenda on an entrance screen at all, or only the QR?</text>
  </g>
</svg>
