<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1100" width="1920" height="1100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 07: Screen studio, the devices page</title>
  <style>
    .label { fill: #1f2937; font-size: 26px; font-weight: 600; }
    .ui { fill: #ffffff; } .line { stroke: #e5e7eb; stroke-width: 2; }
    .h1 { fill: #111827; font-size: 30px; font-weight: 700; }
    .h2 { fill: #111827; font-size: 20px; font-weight: 700; }
    .tx { fill: #111827; font-size: 17px; } .mu { fill: #6b7280; font-size: 15px; }
    .nav { fill: #374151; font-size: 18px; } .navon { fill: #1d4ed8; font-size: 18px; font-weight: 700; }
    .chip { font-size: 14px; font-weight: 700; }
    .btn { fill: #2563eb; } .btnt { fill: #fff; font-size: 16px; font-weight: 700; }
    .gbtn { fill: #fff; stroke: #d1d5db; stroke-width: 1.5; } .gbtnt { fill: #111827; font-size: 15px; }
    .t { fill: #f3f5ff; } .m { fill: #a9b1d6; }
    .note { fill: #c2410c; font-size: 17px; }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddcff"/><stop offset="1" stop-color="#b98cff"/></linearGradient>
    <symbol id="thumb" viewBox="0 0 320 180">
      <rect width="320" height="180" fill="#0b0d1a"/>
      <rect x="6" y="14" width="200" height="146" rx="4" fill="#1b2246"/>
      <rect x="16" y="60" width="140" height="12" rx="3" fill="#f3f5ff"/>
      <rect x="16" y="80" width="100" height="12" rx="3" fill="#f3f5ff"/>
      <rect x="212" y="14" width="102" height="84" rx="4" fill="#161a2e"/>
      <rect x="212" y="104" width="102" height="56" rx="4" fill="#161a2e"/>
      <rect x="0" y="166" width="320" height="14" fill="#161a2e"/>
    </symbol>
  </defs>
  <rect width="1920" height="1100" fill="#f3f4f6"/>
  <text x="24" y="40" class="label">07 · Screen studio → Devices: the fleet at a glance, with what each screen shows right now</text>

  <g transform="translate(24,64)">
    <rect width="1872" height="1010" rx="12" class="ui" stroke="#d1d5db" stroke-width="2"/>
    <!-- top bar -->
    <rect width="1872" height="64" rx="12" fill="#111827"/>
    <text x="28" y="41" fill="#fff" font-size="20" font-weight="700">Demo Event</text>
    <rect x="180" y="20" width="60" height="26" rx="13" fill="#065f46"/><text x="210" y="38" fill="#a7f3d0" font-size="14" font-weight="700" text-anchor="middle">live</text>
    <text x="1844" y="41" fill="#d1d5db" font-size="16" text-anchor="end">Organiser · ⌘K search</text>
    <!-- nav -->
    <g transform="translate(0,64)">
      <rect width="250" height="946" fill="#f9fafb"/>
      <text x="28" y="44" class="mu">SCREEN STUDIO</text>
      <text x="28" y="86" class="nav">Live</text>
      <rect x="12" y="104" width="226" height="40" rx="8" fill="#dbeafe"/>
      <text x="28" y="130" class="navon">Devices</text>
      <text x="28" y="174" class="nav">Zones and layouts</text>
      <text x="28" y="218" class="nav">Schedule</text>
      <text x="28" y="262" class="nav">Content</text>
      <text x="28" y="306" class="nav">Ticker</text>
      <text x="28" y="370" class="mu">EVENT</text>
      <text x="28" y="412" class="nav">Run-of-show</text>
      <text x="28" y="456" class="nav">Brand kit</text>
      <text x="28" y="500" class="nav">Notifications</text>
    </g>
    <!-- main -->
    <g transform="translate(290,64)">
      <text x="0" y="56" class="h1">Devices</text>
      <text x="0" y="88" class="mu">4 screens at Demo Venue · 3 online · 1 offline · all on bundle 0.4.0</text>
      <rect x="1350" y="28" width="200" height="44" rx="8" class="btn"/><text x="1450" y="56" class="btnt" text-anchor="middle">+ Pair a screen</text>
      <!-- alert -->
      <rect x="0" y="110" width="1550" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="20" y="145" fill="#92400e" font-size="17" font-weight="700">Café TV is offline since 18:40 (2 min).</text>
      <text x="430" y="145" fill="#92400e" font-size="17">It keeps showing its last state. Check its power and network; the venue uplink is fine (3 other screens online).</text>

      <!-- cards -->
      <g transform="translate(0,190)">
        <rect width="370" height="420" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
        <use href="#thumb" x="16" y="16" width="338" height="190"/>
        <circle cx="28" cy="236" r="7" fill="#10b981"/><text x="44" y="242" class="h2">Hall left</text>
        <text x="16" y="272" class="mu">Main hall · sound device · 1920×1080</text>
        <text x="16" y="300" class="tx">Now: hero · playlist "Welcome"</text>
        <text x="16" y="326" class="mu">seen 3 s ago · state up to date</text>
        <rect x="16" y="350" width="100" height="36" rx="6" class="gbtn"/><text x="66" y="374" class="gbtnt" text-anchor="middle">Identify</text>
        <rect x="126" y="350" width="100" height="36" rx="6" class="gbtn"/><text x="176" y="374" class="gbtnt" text-anchor="middle">Reload</text>
        <rect x="236" y="350" width="118" height="36" rx="6" class="gbtn"/><text x="295" y="374" class="gbtnt" text-anchor="middle">Assign ▾</text>
      </g>
      <g transform="translate(395,190)">
        <rect width="370" height="420" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
        <use href="#thumb" x="16" y="16" width="338" height="190"/>
        <circle cx="28" cy="236" r="7" fill="#10b981"/><text x="44" y="242" class="h2">Hall right</text>
        <text x="16" y="272" class="mu">mirrors Hall left · silent</text>
        <text x="16" y="300" class="tx">Now: same as Hall left</text>
        <text x="16" y="326" class="mu">seen 5 s ago · state up to date</text>
        <rect x="16" y="350" width="100" height="36" rx="6" class="gbtn"/><text x="66" y="374" class="gbtnt" text-anchor="middle">Identify</text>
        <rect x="126" y="350" width="100" height="36" rx="6" class="gbtn"/><text x="176" y="374" class="gbtnt" text-anchor="middle">Reload</text>
        <rect x="236" y="350" width="118" height="36" rx="6" class="gbtn"/><text x="295" y="374" class="gbtnt" text-anchor="middle">Assign ▾</text>
      </g>
      <g transform="translate(790,190)">
        <rect width="370" height="420" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
        <use href="#thumb" x="16" y="16" width="338" height="190" opacity="0.45"/>
        <rect x="120" y="96" width="130" height="30" rx="15" fill="#92400e"/><text x="185" y="117" fill="#fef3c7" font-size="14" font-weight="700" text-anchor="middle">last seen 18:40</text>
        <circle cx="28" cy="236" r="7" fill="#f59e0b"/><text x="44" y="242" class="h2">Café TV</text>
        <text x="16" y="272" class="mu">Café · portrait 1080×1920</text>
        <text x="16" y="300" class="tx">Last: hero · photo</text>
        <text x="16" y="326" class="mu">offline 2 min · 3 changes behind</text>
        <rect x="16" y="350" width="100" height="36" rx="6" class="gbtn" opacity="0.5"/><text x="66" y="374" class="gbtnt" text-anchor="middle" opacity="0.5">Identify</text>
        <rect x="126" y="350" width="228" height="36" rx="6" class="gbtn"/><text x="240" y="374" class="gbtnt" text-anchor="middle">What to check ▸</text>
      </g>
      <g transform="translate(1185,190)">
        <rect width="370" height="420" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
        <rect x="16" y="16" width="338" height="190" fill="#0b0d1a"/>
        <text x="185" y="104" class="t" font-size="22" font-weight="700" text-anchor="middle">Stage left</text>
        <text x="185" y="132" class="m" font-size="15" text-anchor="middle">not assigned</text>
        <circle cx="28" cy="236" r="7" fill="#10b981"/><text x="44" y="242" class="h2">Stage left</text>
        <text x="16" y="272" class="mu">no zone · paired 10 min ago</text>
        <text x="16" y="300" class="tx">Now: its name, "not assigned"</text>
        <text x="16" y="326" class="mu">seen 4 s ago</text>
        <rect x="16" y="350" width="338" height="36" rx="6" class="btn"/><text x="185" y="374" class="btnt" text-anchor="middle">Assign to a zone</text>
      </g>

      <!-- table strip -->
      <g transform="translate(0,640)">
        <text x="0" y="24" class="h2">Recent</text>
        <line x1="0" y1="40" x2="1550" y2="40" class="line"/>
        <text x="0" y="72" class="tx">18:40  Café TV went offline</text><text x="1550" y="72" class="mu" text-anchor="end">screen.device.offline</text>
        <text x="0" y="106" class="tx">18:31  Stage left paired by Organiser</text><text x="1550" y="106" class="mu" text-anchor="end">audited</text>
        <text x="0" y="140" class="tx">18:02  Hall right set to mirror Hall left</text><text x="1550" y="140" class="mu" text-anchor="end">audited</text>
      </g>
      <text x="0" y="860" class="note">Thumbnails are the virtual screen rendering the device's zone at its state_version (no screenshot from the device itself: question O4). Rights: screen.devices.read to see,</text>
      <text x="0" y="886" class="note">screen.devices.write to act. The same page works on a phone as one column (mockup 13). "What to check" is a short checklist, not a chat or a ticket.</text>
    </g>
  </g>
</svg>
