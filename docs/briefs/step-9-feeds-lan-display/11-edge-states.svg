<rect x="0" y="0" width="1920" height="1420" rx="0" fill="#f3f4f6"/>
<text x="32" y="48" font-size="30" fill="#111827" font-weight="700" text-anchor="start">11 · Edge and failure states: the screen never lies and never looks broken</text>
<text x="32" y="80" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start">Each box as the hall sees it when a feed is slow, gone, private, small or corrected. The crew learns why on Live data (mockup 09); the hall only sees calm, honest boxes.</text>
<text x="32" y="108" font-size="18" fill="#374151" font-weight="600" text-anchor="start">Use case: attendees in the hall; the crew reads why.</text>
<text x="32" y="150" font-size="18" fill="#111827" font-weight="700" text-anchor="start">1 · The bot is slow (2 min)</text>
