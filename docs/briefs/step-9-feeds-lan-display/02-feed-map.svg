<line x1="40" y1="950" x2="110" y2="950" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>
<text x="124" y="956" font-size="16" fill="#374151" font-weight="400" text-anchor="start">event on the bus</text>
<line x1="320" y1="950" x2="390" y2="950" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ah)"/>
<text x="404" y="956" font-size="16" fill="#374151" font-weight="400" text-anchor="start">module read</text>
<rect x="600" y="940" width="16" height="16" rx="4" fill="#3ee39a"/>
<text x="626" y="954" font-size="16" fill="#374151" font-weight="400" text-anchor="start">built or planned elsewhere</text>
<rect x="900" y="940" width="16" height="16" rx="4" fill="#ffc94d"/>
<text x="926" y="954" font-size="16" fill="#374151" font-weight="400" text-anchor="start">step 9 builds the consumer</text>
<rect x="1200" y="940" width="16" height="16" rx="4" fill="#3ddcff"/>
<text x="1226" y="954" font-size="16" fill="#374151" font-weight="400" text-anchor="start">new in step 9</text>
<rect x="1500" y="940" width="16" height="16" rx="4" fill="#9ca3af"/>
<text x="1526" y="954" font-size="16" fill="#374151" font-weight="400" text-anchor="start">waits for another track</text>
</svg>
