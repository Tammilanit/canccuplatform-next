<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">16 · Edge states: nothing is a dead end (attendee, holder)</text>
<g transform="translate(30,80) scale(0.66)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 2</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="120" width="338" height="128" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="154" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 2 closed at 18:31</text><text x="44" y="176" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Your pizza was not added.</text><text x="44" y="198" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Order 3 (Demo Trattoria) is open</text><text x="44" y="220" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">until 18:45.</text><rect x="26" y="268" width="338" height="50" rx="12" fill="#3ddcff"/><text x="195.0" y="299.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Add it to order 3</text></g>
<text x="30" y="668" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Closed while you chose</text>
<g transform="translate(342,80) scale(0.66)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 2</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="10" y="104" width="370" height="40" rx="0" fill="#ffc94d"/><text x="195" y="130" font-size="14" fill="#0b0d1a" font-weight="700" text-anchor="middle">Reconnecting…</text><rect x="26" y="170" width="338" height="106" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="204" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">#12 Kebab · no onion</text><text x="44" y="226" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Saved. We&#x27;ll show changes</text><text x="44" y="248" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">when the network is back.</text></g>
<text x="342" y="668" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Offline for a moment</text>
<g transform="translate(654,80) scale(0.66)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 2</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="120" width="338" height="128" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="154" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 2 was cancelled</text><text x="44" y="176" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">by the crew: &#x27;the pizzeria</text><text x="44" y="198" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">is closed today&#x27;.</text><text x="44" y="220" font-size="15" fill="#ff6b7d" font-weight="600" text-anchor="start">Your pizza was not ordered.</text><rect x="26" y="268" width="338" height="50" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="195.0" y="299.0" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="middle">See open orders</text></g>
<text x="654" y="668" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Cancelled</text>
<g transform="translate(966,80) scale(0.66)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Now</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Food</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="120" width="338" height="106" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="154" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 4 from Friday is still</text><text x="44" y="176" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">open. It blocks nothing, but</text><text x="44" y="198" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">it should not be.</text><rect x="26" y="246" width="338" height="50" rx="12" fill="#0b0d1a" stroke="#ff6b7d" stroke-width="1.5"/><text x="195.0" y="277.0" font-size="16" fill="#ff6b7d" font-weight="700" text-anchor="middle">Cancel the old order</text></g>
<text x="966" y="668" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Left from an earlier day</text>
<g transform="translate(1278,80) scale(0.66)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Now</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Food</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="120" width="338" height="106" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="154" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Join Demo Event to order</text><text x="44" y="176" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">You join at the venue or with</text><text x="44" y="198" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">the event&#x27;s own link.</text><rect x="26" y="246" width="338" height="50" rx="12" fill="#3ddcff"/><text x="195.0" y="277.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Join the event</text></g>
<text x="1278" y="668" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Signed in, not a member</text>
<g transform="translate(1590,80) scale(0.66)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 2</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="120" width="338" height="106" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="154" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Nobody holds order 2</text><text x="44" y="176" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Released after 2 h without a</text><text x="44" y="198" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">call. The pizzas are still here.</text><rect x="26" y="246" width="338" height="50" rx="12" fill="#3ddcff"/><text x="195.0" y="277.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Take over the order</text></g>
<text x="1590" y="668" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Released by the timer</text>
<text x="30" y="694" font-size="15" fill="#374151" font-weight="400" text-anchor="start">409 closed, with the open</text><text x="30" y="715" font-size="15" fill="#374151" font-weight="400" text-anchor="start">orders: never a dead end.</text>
<text x="342" y="694" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The page keeps the last state</text><text x="342" y="715" font-size="15" fill="#374151" font-weight="400" text-anchor="start">and says so; actions wait (no</text><text x="342" y="736" font-size="15" fill="#374151" font-weight="400" text-anchor="start">silent loss).</text>
<text x="654" y="694" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Who cancelled and why; never the</text><text x="654" y="715" font-size="15" fill="#374151" font-weight="400" text-anchor="start">holder&#x27;s name when the crew did</text><text x="654" y="736" font-size="15" fill="#374151" font-weight="400" text-anchor="start">it (legacy problem 16).</text>
<text x="966" y="694" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The legacy rule: anyone may</text><text x="966" y="715" font-size="15" fill="#374151" font-weight="400" text-anchor="start">cancel an order from an earlier</text><text x="966" y="736" font-size="15" fill="#374151" font-weight="400" text-anchor="start">day (D1 makes it block nothing).</text>
<text x="1278" y="694" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Membership is the tenants</text><text x="1278" y="715" font-size="15" fill="#374151" font-weight="400" text-anchor="start">module&#x27;s (0027); the page links</text><text x="1278" y="736" font-size="15" fill="#374151" font-weight="400" text-anchor="start">to its join flow.</text>
<text x="1590" y="694" font-size="15" fill="#374151" font-weight="400" text-anchor="start">pizza.order.released, reason</text><text x="1590" y="715" font-size="15" fill="#374151" font-weight="400" text-anchor="start">timeout; the record flags it</text><text x="1590" y="736" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(&#x27;check the payer&#x27;).</text>
<text x="30" y="860" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Also covered in the question bank</text><text x="30" y="886" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Two people claim at once (E1), double taps (E2), the holder leaves the event or deletes their account (E5), a pizzeria that never answers (E6), a menu edited mid-order (E7), the venue&#x27;s clocks across</text><text x="30" y="907" font-size="15" fill="#374151" font-weight="400" text-anchor="start">midnight and DST (E8), an order with no pizzas at close (E9).</text>
</svg>
