<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1100" width="1920" height="1100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 17: Food settings</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1100" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">17 · Food settings, per event (organiser)</text>
<rect x="24" y="70" width="1320" height="1000" rx="12" fill="#f6f7fb" stroke="#e5e7eb" stroke-width="1.5"/><rect x="24" y="70" width="1320" height="52" rx="12" fill="#111827"/><rect x="24" y="110" width="1320" height="12" rx="0" fill="#111827"/><rect x="42" y="82" width="28" height="28" rx="7" fill="#3ddcff"/><text x="56" y="101" font-size="12" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="80" y="102" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">Demo Event</text><text x="234" y="102" font-size="15" fill="#d1d5db" font-weight="500" text-anchor="start">Event ▾</text><text x="1324" y="102" font-size="14" fill="#d1d5db" font-weight="500" text-anchor="end">Health ok · Crew Member ▾</text><text x="52" y="162" font-size="24" fill="#111827" font-weight="700" text-anchor="start">Food</text><text x="92.0" y="202" font-size="15" fill="#6b7280" font-weight="500" text-anchor="middle">Orders</text><text x="240.5" y="202" font-size="15" fill="#6b7280" font-weight="500" text-anchor="middle">Pizzerias and menus</text><text x="416.0" y="202" font-size="15" fill="#6b7280" font-weight="500" text-anchor="middle">Daily record</text><text x="542.0" y="202" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">Settings</text><rect x="493" y="210" width="98" height="3" rx="0" fill="#2563eb"/><rect x="52" y="213" width="1264" height="1" rx="0" fill="#e5e7eb"/><text x="52" y="256" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Ordering is open</text><text x="52" y="276" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Off: the Food page says so, with your note</text><rect x="620" y="244" width="44" height="24" rx="12" fill="#2563eb"/><circle cx="652" cy="256" r="9" fill="#ffffff"/><rect x="690" y="238" width="420" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="702" y="261" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Breakfast orders open at 09:00</text><rect x="48" y="290" width="1270" height="1" rx="0" fill="#e5e7eb"/><text x="52" y="318" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Who may start an order</text><text x="52" y="338" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">U2</text><rect x="620" y="302" width="174.5" height="34" rx="8" fill="#2563eb"/><text x="707.25" y="324" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">Anyone who joined</text><rect x="800.5" y="302" width="106.5" height="34" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="853.75" y="324" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">Crew only</text><rect x="48" y="352" width="1270" height="1" rx="0" fill="#e5e7eb"/><text x="52" y="380" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Open orders at once, at most</text><text x="52" y="400" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">O5</text><rect x="620" y="362" width="260" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="632" y="385" font-size="14" fill="#374151" font-weight="400" text-anchor="start">3</text><rect x="48" y="414" width="1270" height="1" rx="0" fill="#e5e7eb"/><text x="52" y="442" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Close time, by default</text><text x="52" y="462" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">the opener may change it</text><rect x="620" y="424" width="260" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="632" y="447" font-size="14" fill="#374151" font-weight="400" text-anchor="start">30 min after opening</text><rect x="48" y="476" width="1270" height="1" rx="0" fill="#e5e7eb"/><text x="52" y="504" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Last call</text><text x="52" y="524" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">pizza.order.closing; Moments&#x27; preset 20</text><rect x="620" y="486" width="260" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="632" y="509" font-size="14" fill="#374151" font-weight="400" text-anchor="start">10 min before</text><rect x="48" y="538" width="1270" height="1" rx="0" fill="#e5e7eb"/><text x="52" y="566" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Close by itself at the close time</text><text x="52" y="586" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">U3</text><rect x="620" y="554" width="44" height="24" rx="12" fill="#2563eb"/><circle cx="652" cy="566" r="9" fill="#ffffff"/><rect x="48" y="600" width="1270" height="1" rx="0" fill="#e5e7eb"/><text x="52" y="628" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Reminders to the holder</text><text x="52" y="648" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">legacy +30 and +60</text><rect x="620" y="610" width="260" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="632" y="633" font-size="14" fill="#374151" font-weight="400" text-anchor="start">30 min · 60 min</text><rect x="48" y="662" width="1270" height="1" rx="0" fill="#e5e7eb"/><text x="52" y="690" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Tell the crew from</text><text x="52" y="710" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">U10</text><rect x="620" y="672" width="260" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="632" y="695" font-size="14" fill="#374151" font-weight="400" text-anchor="start">60 min</text><rect x="48" y="724" width="1270" height="1" rx="0" fill="#e5e7eb"/><text x="52" y="752" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Release when closed and not called in</text><text x="52" y="772" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">legacy 2 h</text><rect x="620" y="734" width="260" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="632" y="757" font-size="14" fill="#374151" font-weight="400" text-anchor="start">2 h</text><rect x="48" y="786" width="1270" height="1" rx="0" fill="#e5e7eb"/><text x="52" y="814" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Done after arrival</text><text x="52" y="834" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">if not everyone is ticked off</text><rect x="620" y="796" width="260" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="632" y="819" font-size="14" fill="#374151" font-weight="400" text-anchor="start">2 h</text><rect x="48" y="848" width="1270" height="1" rx="0" fill="#e5e7eb"/><text x="52" y="876" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Pickup, by default</text><text x="52" y="896" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">shown in &#x27;pizza is here&#x27;</text><rect x="620" y="858" width="260" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="632" y="881" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Entrance table</text><rect x="48" y="910" width="1270" height="1" rx="0" fill="#e5e7eb"/><text x="52" y="938" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Show the holder&#x27;s name on screens</text><text x="52" y="958" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">L8</text><rect x="620" y="926" width="44" height="24" rx="12" fill="#2563eb"/><circle cx="652" cy="938" r="9" fill="#ffffff"/><rect x="48" y="972" width="1270" height="1" rx="0" fill="#e5e7eb"/><rect x="1180" y="990" width="120" height="36" rx="8" fill="#2563eb"/><text x="1240.0" y="1013.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">Save</text>
<text x="1380" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Rights (D5)</text><text x="1380" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">pizza.order.open: start an order when &#x27;crew only&#x27;</text><text x="1380" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">is set. pizza.order.manage: step in on any order</text><text x="1380" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(release, cancel, undo, edit after close, mark</text><text x="1380" y="199" font-size="15" fill="#374151" font-weight="400" text-anchor="start">arrived for the holder). pizza.menu.write:</text><text x="1380" y="220" font-size="15" fill="#374151" font-weight="400" text-anchor="start">pizzerias and menus. pizza.record.read: the daily</text><text x="1380" y="241" font-size="15" fill="#374151" font-weight="400" text-anchor="start">record and its CSV. This page saves through</text><text x="1380" y="262" font-size="15" fill="#374151" font-weight="400" text-anchor="start">admin&#x27;s settings API (admin.settings.write). The</text><text x="1380" y="283" font-size="15" fill="#374151" font-weight="400" text-anchor="start">event-admin role holds them all.</text>
<text x="1380" y="430" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Settings, not code</text><text x="1380" y="456" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Every time is a per-event setting with the legacy</text><text x="1380" y="477" font-size="15" fill="#374151" font-weight="400" text-anchor="start">value as its default (#118). Admin&#x27;s settings API</text><text x="1380" y="498" font-size="15" fill="#374151" font-weight="400" text-anchor="start">holds them; the profile can set them</text><text x="1380" y="519" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(contracts/profile.md).</text>
<text x="1380" y="620" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Language and time</text><text x="1380" y="646" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The event&#x27;s time zone and language from the</text><text x="1380" y="667" font-size="15" fill="#374151" font-weight="400" text-anchor="start">tenants module and the profile; nothing fixed in</text><text x="1380" y="688" font-size="15" fill="#374151" font-weight="400" text-anchor="start">code (legacy problem: the zone hardcoded in three</text><text x="1380" y="709" font-size="15" fill="#374151" font-weight="400" text-anchor="start">places).</text>
</svg>
