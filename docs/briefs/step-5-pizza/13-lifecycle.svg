<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 13: the order&#x27;s lifecycle</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">13 · The order&#x27;s lifecycle: states, the holder, who may, and what each step emits</text>
<rect x="60" y="300" width="220" height="84" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="170" y="336" font-size="22" fill="#111827" font-weight="700" text-anchor="middle">open</text><text x="170" y="362" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">pizzas can be added</text>
<rect x="420" y="300" width="220" height="84" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="530" y="336" font-size="22" fill="#111827" font-weight="700" text-anchor="middle">closed</text><text x="530" y="362" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">the holder calls</text>
<rect x="780" y="300" width="220" height="84" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="890" y="336" font-size="22" fill="#111827" font-weight="700" text-anchor="middle">placed</text><text x="890" y="362" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">called in · estimate</text>
<rect x="1140" y="300" width="220" height="84" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><text x="1250" y="336" font-size="22" fill="#111827" font-weight="700" text-anchor="middle">arrived</text><text x="1250" y="362" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">hand-out runs</text>
<rect x="1500" y="300" width="220" height="84" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/><text x="1610" y="336" font-size="22" fill="#111827" font-weight="700" text-anchor="middle">done</text><text x="1610" y="362" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">new: D3</text>
<line x1="284" y1="330" x2="414" y2="330" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="350.0" y="316" font-size="13" fill="#374151" font-weight="600" text-anchor="middle">close</text>
<text x="350.0" y="352" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">pizza.order.closed</text>
<line x1="644" y1="330" x2="774" y2="330" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="710.0" y="316" font-size="13" fill="#374151" font-weight="600" text-anchor="middle">call in</text>
<text x="710.0" y="352" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">pizza.order.placed</text>
<line x1="1004" y1="330" x2="1134" y2="330" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="1070.0" y="316" font-size="13" fill="#374151" font-weight="600" text-anchor="middle">it&#x27;s here</text>
<text x="1070.0" y="352" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">pizza.order.arrived</text>
<line x1="1364" y1="330" x2="1494" y2="330" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="1430.0" y="316" font-size="13" fill="#374151" font-weight="600" text-anchor="middle">handed out</text>
<text x="1430.0" y="352" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">pizza.order.done</text>
<line x1="450" y1="384" x2="250" y2="384" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="350.0" y="404" font-size="13" fill="#6b7280" font-weight="600" text-anchor="middle">reopen</text>
<text x="350.0" y="422" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">pizza.order.reopened</text>
<line x1="810" y1="384" x2="610" y2="384" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="710.0" y="404" font-size="13" fill="#6b7280" font-weight="600" text-anchor="middle">undo</text>
<text x="710.0" y="422" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">pizza.order.reverted</text>
<line x1="1170" y1="384" x2="970" y2="384" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="1070.0" y="404" font-size="13" fill="#6b7280" font-weight="600" text-anchor="middle">undo</text>
<text x="1070.0" y="422" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">pizza.order.reverted</text>
<rect x="240" y="600" width="220" height="84" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/><text x="350" y="636" font-size="22" fill="#111827" font-weight="700" text-anchor="middle">cancelled</text><text x="350" y="662" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle">reason: cancelled, stale</text>
<line x1="150" y1="384" x2="300" y2="594" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
<line x1="520" y1="384" x2="400" y2="594" stroke="#dc2626" stroke-width="2" marker-end="url(#ah)"/>
<text x="190" y="520" font-size="13" fill="#dc2626" font-weight="600" text-anchor="end">cancel</text>
<text x="470" y="520" font-size="13" fill="#dc2626" font-weight="600" text-anchor="start">cancel</text>
<text x="350" y="712" font-size="12" fill="#2563eb" font-weight="400" text-anchor="middle">pizza.order.cancelled</text>
<rect x="60" y="120" width="900" height="120" rx="14" fill="#ffffff" stroke="#b98cff" stroke-width="2"/>
<text x="80" y="152" font-size="17" fill="#111827" font-weight="700" text-anchor="start">The holder, beside the state (open and closed only)</text>
<text x="80" y="182" font-size="18" fill="#7c3aed" font-weight="700" text-anchor="start">held  ⇄  nobody holds it</text>
<text x="340" y="182" font-size="14" fill="#374151" font-weight="400" text-anchor="start">claim, take-over: pizza.order.claimed (previous_holder) · one winner</text>
<text x="340" y="208" font-size="14" fill="#374151" font-weight="400" text-anchor="start">release, forced, timeout (2 h closed): pizza.order.released (reason)</text>
<text x="80" y="230" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">A placed order keeps its holder; a crew member may correct it (audited).</text>
<rect x="1000" y="120" width="860" height="120" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="1020" y="152" font-size="17" fill="#111827" font-weight="700" text-anchor="start">While open</text>
<text x="1020" y="182" font-size="14" fill="#374151" font-weight="400" text-anchor="start">pizza.item.added / .removed (personal) · counts with the order&#x27;s revision</text>
<text x="1020" y="208" font-size="14" fill="#374151" font-weight="400" text-anchor="start">10 min before the close time: pizza.order.closing (once; Moments&#x27; last call)</text>
<text x="1020" y="230" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Overdue: pizza.reminder.triggered (open_past_target, closed_not_placed)</text>
<text x="72" y="778" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">ACTION</text><text x="452" y="778" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">WHO MAY</text><text x="972" y="778" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">RULE</text><rect x="60" y="788" width="1760" height="1" rx="0" fill="#e5e7eb"/><rect x="60" y="790" width="1760" height="46" rx="0" fill="#ffffff"/><text x="72" y="818.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Open an order</text><text x="452" y="818.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">a member (U2: or pizza.order.open only)</text><text x="972" y="818.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">one open order per pizzeria (D1); the opener holds it</text><rect x="60" y="836" width="1760" height="1" rx="0" fill="#e5e7eb"/><rect x="60" y="836" width="1760" height="46" rx="0" fill="#fafafa"/><text x="72" y="864.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Add, edit, delete my pizza</text><text x="452" y="864.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">the pizza&#x27;s owner while open</text><text x="972" y="864.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">after close: the holder or pizza.order.manage, audited</text><rect x="60" y="882" width="1760" height="1" rx="0" fill="#e5e7eb"/><rect x="60" y="882" width="1760" height="46" rx="0" fill="#ffffff"/><text x="72" y="910.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Close, reopen, call in, arrived, hand out</text><text x="452" y="910.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">the holder, or pizza.order.manage</text><text x="972" y="910.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">each one conditional update in a transaction</text><rect x="60" y="928" width="1760" height="1" rx="0" fill="#e5e7eb"/><rect x="60" y="928" width="1760" height="46" rx="0" fill="#fafafa"/><text x="72" y="956.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Force release, cancel, undo, correct payer</text><text x="452" y="956.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">pizza.order.manage</text><text x="972" y="956.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">a reason; an audit entry with before and after</text><rect x="60" y="974" width="1760" height="1" rx="0" fill="#e5e7eb"/><rect x="60" y="974" width="1760" height="46" rx="0" fill="#ffffff"/><text x="72" y="1002.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Cancel a stale order (an earlier day)</text><text x="452" y="1002.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">any member (legacy rule) or pizza.order.manage</text><text x="972" y="1002.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">reason stale</text><rect x="60" y="1020" width="1760" height="1" rx="0" fill="#e5e7eb"/>
</svg>
