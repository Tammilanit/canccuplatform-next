<text x="445.12820512820514" y="382" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">last call</text>
<circle cx="541.0256410256411" cy="400" r="9" fill="#2563eb"/>
<text x="541.0256410256411" y="432" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">closed</text>
<circle cx="802.5641025641025" cy="400" r="9" fill="#b45309"/>
<text x="802.5641025641025" y="382" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">+30: holder</text>
<circle cx="1064.102564102564" cy="400" r="9" fill="#dc2626"/>
<text x="1064.102564102564" y="432" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">+60: holder and crew</text>
<circle cx="1587.179487179487" cy="400" r="9" fill="#6b7280"/>
<text x="1587.179487179487" y="382" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">2 h: auto-release</text>
<text x="30" y="540" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Auto-close off (U3: B)</text>
<line x1="140" y1="570" x2="1840" y2="570" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="270.7692307692308" cy="570" r="9" fill="#2563eb"/>
<text x="270.7692307692308" y="602" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">opened, target 18:30</text>
<circle cx="793.8461538461538" cy="570" r="9" fill="#b45309"/>
<text x="793.8461538461538" y="552" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">+30 past target</text>
<circle cx="1055.3846153846152" cy="570" r="9" fill="#dc2626"/>
<text x="1055.3846153846152" y="602" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">+60 past target</text>
<text x="30" y="710" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Called in, no sign of it</text>
<line x1="140" y1="740" x2="1840" y2="740" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="671.7948717948718" cy="740" r="9" fill="#2563eb"/>
<text x="671.7948717948718" y="772" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">called in, about 19:31</text>
<circle cx="1325.6410256410256" cy="740" r="9" fill="#b45309"/>
<text x="1325.6410256410256" y="722" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">+30 past the estimate: &#x27;arrived?&#x27; to the holder (U11)</text>
<rect x="30" y="830" width="1860" height="200" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="54" y="866" font-size="17" fill="#111827" font-weight="700" text-anchor="start">The legacy rules, kept (reminders.ts and its tests)</text>
<text x="54" y="896" font-size="15" fill="#374151" font-weight="400" text-anchor="start">• +30 and +60 min, each step at most once per order; only the latest due step; skipped when more than 30 min late (an outage never sends stale ones).</text>
<text x="54" y="922" font-size="15" fill="#374151" font-weight="400" text-anchor="start">• A step is marked sent only after its delivery succeeded; auto-release clears the holder and nothing else; it never cancels or calls in.</text>
<text x="54" y="960" font-size="15" fill="#374151" font-weight="400" text-anchor="start">New: a scheduler inside the pizza container, due times in Postgres (a restart loses nothing; two replicas never send twice: one row lock per due step).</text>
<text x="54" y="986" font-size="15" fill="#374151" font-weight="400" text-anchor="start">New: who hears it. The holder by push (a personal pizza topic, D12) and, from step 6, the bot&#x27;s mention; the crew from +60 (U10). Every time is a per-event setting.</text>
<text x="54" y="1012" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">pizza.reminder.triggered (kind, minutes) is the event; Moments never shows reminders on the screen.</text>
</svg>
