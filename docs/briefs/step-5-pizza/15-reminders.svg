<circle cx="671.7948717948718" cy="230" r="9" fill="#2563eb"/>
<circle cx="1037.9487179487178" cy="230" r="9" fill="#7c3aed"/>
<text x="1037.9487179487178" y="262" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">arrived</text>
<circle cx="1299.4871794871794" cy="230" r="9" fill="#16a34a"/>
<text x="1299.4871794871794" y="212" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">done</text>
<text x="30" y="370" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Order 2, the holder stalls</text>
<line x1="140" y1="400" x2="1840" y2="400" stroke="#e5e7eb" stroke-width="2"/>
<circle cx="288.2051282051282" cy="400" r="9" fill="#2563eb"/>
<text x="288.2051282051282" y="432" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">opened</text>
