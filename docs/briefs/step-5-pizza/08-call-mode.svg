<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 08: call mode</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">08 · Call mode: the list read aloud, then &#x27;called in&#x27; (holder)</text>
<g transform="translate(30,60) scale(0.78)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:46</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="100" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Order 3</text><text x="364" y="100" font-size="14" fill="#3ddcff" font-weight="600" text-anchor="end">Copy as text</text><text x="26" y="150" font-size="26" fill="#f3f5ff" font-weight="800" text-anchor="start">Demo Trattoria</text><text x="26" y="182" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">8 pizzas for 6 people · deliver to the venue</text><rect x="26" y="202" width="338" height="50" rx="12" fill="#3ee39a"/><text x="195" y="234" font-size="18" fill="#0b0d1a" font-weight="800" text-anchor="middle">📞  Call 000 000 0000</text><rect x="26" y="280" width="338" height="74" rx="14" fill="#103a2a" stroke="#3ee39a" stroke-width="1.5"/><text x="44" y="314" font-size="20" fill="#a9b1d6" font-weight="800" text-anchor="start">3 ×</text><text x="96" y="314" font-size="19" fill="#a9b1d6" font-weight="800" text-anchor="start">#12 Kebab</text><text x="96" y="338" font-size="15" fill="#a9b1d6" font-weight="600" text-anchor="start">1 × no onion</text><rect x="330" y="306" width="22" height="22" rx="6" fill="#3ee39a"/><text x="341" y="323" font-size="15" fill="#0b0d1a" font-weight="800" text-anchor="middle">✓</text><rect x="26" y="364" width="338" height="74" rx="14" fill="#103a2a" stroke="#3ee39a" stroke-width="1.5"/><text x="44" y="398" font-size="20" fill="#a9b1d6" font-weight="800" text-anchor="start">2 ×</text><text x="96" y="398" font-size="19" fill="#a9b1d6" font-weight="800" text-anchor="start">#1 Margherita</text><rect x="330" y="390" width="22" height="22" rx="6" fill="#3ee39a"/><text x="341" y="407" font-size="15" fill="#0b0d1a" font-weight="800" text-anchor="middle">✓</text><rect x="26" y="448" width="338" height="74" rx="14" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="482" font-size="20" fill="#3ddcff" font-weight="800" text-anchor="start">1 ×</text><text x="96" y="482" font-size="19" fill="#f3f5ff" font-weight="800" text-anchor="start">#4 Quattro formaggi</text><text x="96" y="506" font-size="15" fill="#ffc94d" font-weight="600" text-anchor="start">well done</text><rect x="330" y="474" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><rect x="26" y="532" width="338" height="74" rx="14" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="566" font-size="20" fill="#3ddcff" font-weight="800" text-anchor="start">1 ×</text><text x="96" y="566" font-size="19" fill="#f3f5ff" font-weight="800" text-anchor="start">Own pizza</text><text x="96" y="590" font-size="15" fill="#ffc94d" font-weight="600" text-anchor="start">ham, pineapple, jalapeño</text><rect x="330" y="558" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><rect x="26" y="616" width="338" height="74" rx="14" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="650" font-size="20" fill="#3ddcff" font-weight="800" text-anchor="start">1 ×</text><text x="96" y="650" font-size="19" fill="#f3f5ff" font-weight="800" text-anchor="start">Other</text><text x="96" y="674" font-size="15" fill="#ffc94d" font-weight="600" text-anchor="start">gluten-free margherita</text><rect x="330" y="642" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><rect x="26" y="712" width="338" height="54" rx="12" fill="#3ddcff"/><text x="195.0" y="745.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Called in: add the estimate</text></g>
<line x1="340" y1="400" x2="380" y2="400" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<g transform="translate(390,60) scale(0.78)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Call mode</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Called in</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><text x="195" y="150" font-size="18" fill="#f3f5ff" font-weight="700" text-anchor="middle">When did they say it comes?</text><rect x="26" y="180" width="166" height="48" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="109" y="210" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="middle">30 min</text><rect x="198" y="180" width="166" height="48" rx="12" fill="#3ddcff"/><text x="281" y="210" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">45 min</text><rect x="26" y="238" width="166" height="48" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="109" y="268" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="middle">60 min</text><rect x="198" y="238" width="166" height="48" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="281" y="268" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="middle">Don&#x27;t know</text><text x="195" y="330" font-size="30" fill="#3ddcff" font-weight="800" text-anchor="middle">About 19:31</text><text x="26" y="390" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">WHO PAID THE PIZZERIA?</text><rect x="26" y="402" width="338" height="56" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="436" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">Me (Player Three)</text><rect x="330" y="418" width="22" height="22" rx="6" fill="#3ee39a"/><text x="341" y="435" font-size="15" fill="#0b0d1a" font-weight="800" text-anchor="middle">✓</text><text x="26" y="492" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">The payer is who the others pay back. A</text><text x="26" y="511" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">crew member can correct it later.</text><rect x="26" y="560" width="338" height="50" rx="12" fill="#3ddcff"/><text x="195.0" y="591.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Mark called in</text><text x="195" y="650" font-size="15" fill="#3ddcff" font-weight="600" text-anchor="middle">Back to the list</text></g>
<text x="730" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Read it like a script</text><text x="730" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The legacy summary (summary.ts, ported as is): identical</text><text x="730" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">pizzas grouped with a count, notes under them, numbers first</text><text x="730" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">because the holder reads numbers to the pizzeria. In large</text><text x="730" y="199" font-size="15" fill="#374151" font-weight="400" text-anchor="start">type, in the menu&#x27;s order, one line per kind.</text>
<text x="730" y="290" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Tick as you read</text><text x="730" y="316" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Tap a line when the pizzeria has it; ticks live only on this</text><text x="730" y="337" font-size="15" fill="#374151" font-weight="400" text-anchor="start">phone (no state to sync), so a dropped call starts where it</text><text x="730" y="358" font-size="15" fill="#374151" font-weight="400" text-anchor="start">stopped.</text>
<text x="730" y="430" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Copy as text</text><text x="730" y="456" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The same list as plain text for a web order form or a chat</text><text x="730" y="477" font-size="15" fill="#374151" font-weight="400" text-anchor="start">with the pizzeria (the legacy&#x27;s copy). Comments never appear</text><text x="730" y="498" font-size="15" fill="#374151" font-weight="400" text-anchor="start">in it.</text>
<text x="730" y="560" font-size="17" fill="#111827" font-weight="700" text-anchor="start">The estimate</text><text x="730" y="586" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Optional: 30, 45, 60 minutes or don&#x27;t know (U8). It becomes</text><text x="730" y="607" font-size="15" fill="#374151" font-weight="400" text-anchor="start">&#x27;about 19:31&#x27; on everyone&#x27;s page and the screen; it is not a</text><text x="730" y="628" font-size="15" fill="#374151" font-weight="400" text-anchor="start">promise, and &#x27;It&#x27;s here&#x27; replaces it.</text>
<text x="730" y="720" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Who paid</text><text x="730" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The legacy set the payer when the order was placed; that</text><text x="730" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">stays (the person the others repay). The bill total is a</text><text x="730" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">question (D8): keep it for the after-event bill system, or</text><text x="730" y="809" font-size="15" fill="#374151" font-weight="400" text-anchor="start">drop it.</text>
<text x="1380" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">The number</text><text x="1380" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Tap to call (tel: with the spaces stripped, as</text><text x="1380" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">the legacy). Shown only in call mode and to</text><text x="1380" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">the crew.</text>
<text x="1380" y="260" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Several pizzerias</text><text x="1380" y="286" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Each order has its own call mode; a person</text><text x="1380" y="307" font-size="15" fill="#374151" font-weight="400" text-anchor="start">with pizzas in two orders appears in both</text><text x="1380" y="328" font-size="15" fill="#374151" font-weight="400" text-anchor="start">lists.</text>
</svg>
