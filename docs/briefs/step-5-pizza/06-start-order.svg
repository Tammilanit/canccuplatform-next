<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 06: starting an order</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">06 · Starting an order (attendee becomes the holder)</text>
<g transform="translate(30,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Start an order</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><text x="26" y="130" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">PIZZERIA</text><rect x="26" y="144" width="338" height="68" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="172" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Pizzeria</text><text x="44" y="194" font-size="13" fill="#ffc94d" font-weight="400" text-anchor="start">Order 2 is open · join it instead?</text><circle cx="338" cy="178" r="10" fill="#0b0d1a" stroke="#343c66" stroke-width="2"/><rect x="26" y="222" width="338" height="68" rx="16" fill="#1d2442" stroke="#3ddcff" stroke-width="1.5"/><text x="44" y="250" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Trattoria</text><text x="44" y="272" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Delivers · own pizza available</text><circle cx="338" cy="256" r="10" fill="#3ddcff"/><rect x="26" y="300" width="338" height="68" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="328" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Corner Grill</text><text x="44" y="350" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Takeaway only: someone fetches it</text><circle cx="338" cy="334" r="10" fill="#0b0d1a" stroke="#343c66" stroke-width="2"/><text x="26" y="398" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">ORDERS CLOSE AT</text><rect x="26" y="410" width="78" height="40" rx="20" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="65" y="436" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="middle">18:30</text><rect x="112" y="410" width="78" height="40" rx="20" fill="#3ddcff"/><text x="151" y="436" font-size="15" fill="#0b0d1a" font-weight="700" text-anchor="middle">18:45</text><rect x="198" y="410" width="78" height="40" rx="20" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="237" y="436" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="middle">19:00</text><rect x="284" y="410" width="78" height="40" rx="20" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="323" y="436" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="middle">Other</text><text x="26" y="476" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">A last call goes out 10 minutes before.</text><text x="26" y="495" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">You can close earlier or later.</text><text x="26" y="530" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">PICKUP (SHOWN WHEN IT ARRIVES)</text><rect x="26" y="542" width="338" height="42" rx="10" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="569" font-size="15" fill="#f3f5ff" font-weight="400" text-anchor="start">Entrance table</text><text x="26" y="610" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">NOTE TO EVERYONE (OPTIONAL)</text><rect x="26" y="622" width="338" height="42" rx="10" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="649" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">Delivery takes about 40 min</text><rect x="26" y="690" width="338" height="50" rx="12" fill="#3ddcff"/><text x="195.0" y="721.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Open the order</text></g>
<line x1="322" y1="380" x2="352" y2="380" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<g transform="translate(360,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 3</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="112" width="338" height="120" rx="16" fill="#103a2a" stroke="#3ee39a" stroke-width="1.5"/><text x="44" y="146" font-size="18" fill="#3ee39a" font-weight="700" text-anchor="start">✓ Order 3 is open</text><text x="44" y="174" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Everyone with food alerts on was told;</text><text x="44" y="193" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">the screens show it now.</text><rect x="26" y="250" width="338" height="50" rx="12" fill="#3ddcff"/><text x="195.0" y="281.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Add my own pizza</text><rect x="26" y="316" width="338" height="50" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="195.0" y="347.0" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="middle">Open my holder view</text><text x="26" y="400" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">You hold this order. Someone else will</text><text x="26" y="419" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">call? Release it and anyone can take it</text><text x="26" y="438" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">over.</text></g>
<text x="680" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Who opens an order</text><text x="680" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">U2: anyone who joined the event (the legacy rule, the</text><text x="680" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">default), or only people with the right pizza.order.open</text><text x="680" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(a crew setting for events that run fixed food rounds).</text><text x="680" y="199" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The opener holds the order.</text>
<text x="680" y="280" font-size="17" fill="#111827" font-weight="700" text-anchor="start">One per pizzeria, several at once</text><text x="680" y="306" font-size="15" fill="#374151" font-weight="400" text-anchor="start">D1: a pizzeria with an open order offers &#x27;join it</text><text x="680" y="327" font-size="15" fill="#374151" font-weight="400" text-anchor="start">instead&#x27;; a second pizzeria opens its own order. The</text><text x="680" y="348" font-size="15" fill="#374151" font-weight="400" text-anchor="start">legacy partial unique index becomes one open order per</text><text x="680" y="369" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(event, pizzeria).</text>
<text x="680" y="450" font-size="17" fill="#111827" font-weight="700" text-anchor="start">A close time, not a &#x27;calling around&#x27;</text><text x="680" y="476" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The legacy target_at was a hint; the new close time is a</text><text x="680" y="497" font-size="15" fill="#374151" font-weight="400" text-anchor="start">promise: last call 10 min before (pizza.order.closing,</text><text x="680" y="518" font-size="15" fill="#374151" font-weight="400" text-anchor="start">which Moments&#x27; preset 20 waits for), and at the time the</text><text x="680" y="539" font-size="15" fill="#374151" font-weight="400" text-anchor="start">order closes by itself if the holder has not (U3:</text><text x="680" y="560" font-size="15" fill="#374151" font-weight="400" text-anchor="start">auto-close is a setting, on by default).</text>
<text x="680" y="650" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Pickup note</text><text x="680" y="676" font-size="15" fill="#374151" font-weight="400" text-anchor="start">One line the arrival push and the page show (&#x27;Entrance</text><text x="680" y="697" font-size="15" fill="#374151" font-weight="400" text-anchor="start">table&#x27;); the event&#x27;s default comes from Food settings</text><text x="680" y="718" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(mockup 17).</text>
<text x="1340" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Takeaway pizzerias</text><text x="1340" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">A pizzeria marked takeaway reads &#x27;someone</text><text x="1340" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">fetches it&#x27; and the holder&#x27;s checklist says</text><text x="1340" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">&#x27;fetch&#x27; instead of &#x27;wait for delivery&#x27; (D6). The</text><text x="1340" y="199" font-size="15" fill="#374151" font-weight="400" text-anchor="start">flow is otherwise the same.</text>
<text x="1340" y="290" font-size="17" fill="#111827" font-weight="700" text-anchor="start">What it emits</text><text x="1340" y="316" font-size="15" fill="#374151" font-weight="400" text-anchor="start">pizza.order.opened (Order with closes_at,</text><text x="1340" y="337" font-size="15" fill="#374151" font-weight="400" text-anchor="start">pickup) → notify food (event part), screen</text><text x="1340" y="358" font-size="15" fill="#374151" font-weight="400" text-anchor="start">food_status, Moments preset 10, the bot&#x27;s</text><text x="1340" y="379" font-size="15" fill="#374151" font-weight="400" text-anchor="start">channel post in step 6.</text>
</svg>
