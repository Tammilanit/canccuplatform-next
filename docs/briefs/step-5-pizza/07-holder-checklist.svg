<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 07: the holder&#x27;s checklist and take-over</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">07 · Holding an order: the checklist, release and take-over (holder)</text>
<g transform="translate(30,70) scale(0.74)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Your order 3</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="100" width="338" height="66" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="128" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Trattoria · closes 18:45</text><text x="44" y="150" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">8 pizzas · 6 people · you hold it</text><rect x="26" y="184" width="338" height="64" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><rect x="40" y="204" width="22" height="22" rx="6" fill="#3ee39a"/><text x="51" y="221" font-size="15" fill="#0b0d1a" font-weight="800" text-anchor="middle">✓</text><text x="76" y="212" font-size="16" fill="#f3f5ff" font-weight="500" text-anchor="start">1  Prepare</text><text x="76" y="234" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Demo Trattoria, closes 18:45 · Edit</text><rect x="26" y="258" width="338" height="64" rx="16" fill="#1d2442" stroke="#3ddcff" stroke-width="1.5"/><rect x="40" y="278" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><text x="76" y="286" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">2  Close the order</text><text x="76" y="308" font-size="13" fill="#ffc94d" font-weight="400" text-anchor="start">Last call sent 18:35 · closes by itself 18:45</text><rect x="26" y="332" width="338" height="64" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><rect x="40" y="352" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><text x="76" y="360" font-size="16" fill="#f3f5ff" font-weight="500" text-anchor="start">3  Call the pizzeria</text><text x="76" y="382" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Call mode: the list, read aloud</text><rect x="26" y="406" width="338" height="64" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><rect x="40" y="426" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><text x="76" y="434" font-size="16" fill="#f3f5ff" font-weight="500" text-anchor="start">4  Mark it called in</text><text x="76" y="456" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Add the pizzeria&#x27;s estimate</text><rect x="26" y="480" width="338" height="64" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><rect x="40" y="500" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><text x="76" y="508" font-size="16" fill="#f3f5ff" font-weight="500" text-anchor="start">5  It&#x27;s here</text><text x="76" y="530" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Tell everyone where to collect</text><rect x="26" y="554" width="338" height="64" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><rect x="40" y="574" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><text x="76" y="582" font-size="16" fill="#f3f5ff" font-weight="500" text-anchor="start">6  Hand out</text><text x="76" y="604" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Tick people off; who paid you</text><rect x="26" y="636" width="338" height="46" rx="12" fill="#3ddcff"/><text x="195.0" y="665.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Close the order now</text><text x="26" y="712" font-size="14" fill="#3ddcff" font-weight="600" text-anchor="start">Release</text><text x="364" y="712" font-size="14" fill="#ff6b7d" font-weight="600" text-anchor="end">Cancel order</text></g>
<g transform="translate(350,70) scale(0.74)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 2</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="112" width="338" height="104" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="142" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 2 · Demo Pizzeria</text><rect x="44" y="154" width="124" height="24" rx="12" fill="#ffc94d"/><text x="106.0" y="171" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Nobody holds it</text><text x="44" y="202" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Closed 18:31 · 9 pizzas · 7 people</text><rect x="26" y="232" width="338" height="178" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="266" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Demo Player released this order at</text><text x="44" y="285" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">18:40. It needs someone to call it in.</text><text x="44" y="304" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">You&#x27;ll see the list and the pizzeria&#x27;s</text><text x="44" y="323" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">number.</text><rect x="44" y="348" width="302" height="44" rx="12" fill="#3ddcff"/><text x="195.0" y="376.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Take over the order</text><text x="26" y="440" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">A take-over is a claim: one person wins</text><text x="26" y="459" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">if two tap at once; the other sees who.</text></g>
<g transform="translate(670,70) scale(0.74)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 2</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="112" width="338" height="80" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="142" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 2 · Demo Pizzeria</text><rect x="44" y="156" width="58" height="24" rx="12" fill="#3ddcff"/><text x="73.0" y="173" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Held</text><rect x="26" y="214" width="338" height="120" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="246" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Player Three holds this order</text><text x="44" y="272" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">since 18:41. Ask them, or a crew</text><text x="44" y="291" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">member, if something is wrong.</text><text x="26" y="370" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">The answer to a lost race: 409 claimed,</text><text x="26" y="389" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">with the holder and since when (the</text><text x="26" y="408" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">legacy&#x27;s).</text></g>
<text x="30" y="730" font-size="18" fill="#111827" font-weight="700" text-anchor="start">The holder&#x27;s view</text>
<text x="30" y="756" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The legacy&#x27;s numbered checklist,</text><text x="30" y="777" font-size="15" fill="#374151" font-weight="400" text-anchor="start">extended to the end: the first</text><text x="30" y="798" font-size="15" fill="#374151" font-weight="400" text-anchor="start">unfinished step is highlighted; one</text><text x="30" y="819" font-size="15" fill="#374151" font-weight="400" text-anchor="start">main action at a time.</text>
<text x="350" y="730" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Released: take over</text>
<text x="350" y="756" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Release keeps pizzas and history; a</text><text x="350" y="777" font-size="15" fill="#374151" font-weight="400" text-anchor="start">take-over makes the taker the holder</text><text x="350" y="798" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(pizza.order.claimed with</text><text x="350" y="819" font-size="15" fill="#374151" font-weight="400" text-anchor="start">previous_holder).</text>
<text x="670" y="730" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Someone else holds it</text>
<text x="670" y="756" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Members see the holder&#x27;s name;</text><text x="670" y="777" font-size="15" fill="#374151" font-weight="400" text-anchor="start">nothing to do but ask.</text>
<text x="1000" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">The volunteer is not alone</text><text x="1000" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The holder is an attendee doing everyone a favour. The app</text><text x="1000" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">does the counting (summary), the reading (call mode), the</text><text x="1000" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">reminding (reminders reach the holder first, then the crew,</text><text x="1000" y="199" font-size="15" fill="#374151" font-weight="400" text-anchor="start">U10) and the chasing (hand-out and paid ticks).</text>
<text x="1000" y="300" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Undo, never a dead end</text><text x="1000" y="326" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Each step has its undo while the next has not happened:</text><text x="1000" y="347" font-size="15" fill="#374151" font-weight="400" text-anchor="start">reopen a closed order, back from called in to closed, from</text><text x="1000" y="368" font-size="15" fill="#374151" font-weight="400" text-anchor="start">arrived to called in (pizza.order.reopened, .reverted). The</text><text x="1000" y="389" font-size="15" fill="#374151" font-weight="400" text-anchor="start">crew can undo anything, audited.</text>
<text x="1000" y="470" font-size="17" fill="#111827" font-weight="700" text-anchor="start">The holder&#x27;s phone sees the phone number</text><text x="1000" y="496" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The pizzeria&#x27;s number shows only to the holder and the crew</text><text x="1000" y="517" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(legacy rule). Comments are shown to the holder for the bill</text><text x="1000" y="538" font-size="15" fill="#374151" font-weight="400" text-anchor="start">split and never read out.</text>
<text x="1000" y="620" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Transactions</text><text x="1000" y="646" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Every step is one conditional update in a transaction (state</text><text x="1000" y="667" font-size="15" fill="#374151" font-weight="400" text-anchor="start">and holder checked in the WHERE); a double tap or two phones</text><text x="1000" y="688" font-size="15" fill="#374151" font-weight="400" text-anchor="start">cannot place twice (the legacy&#x27;s read-then-write bug,</text><text x="1000" y="709" font-size="15" fill="#374151" font-weight="400" text-anchor="start">problem 15).</text>
</svg>
