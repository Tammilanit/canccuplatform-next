<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 09: arrival and hand-out</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">09 · It&#x27;s here: hand-out and who paid the holder (holder)</text>
<g transform="translate(30,70) scale(0.78)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Order 3</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Hand out</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="100" width="338" height="70" rx="16" fill="#2a1f45" stroke="#b98cff" stroke-width="1.5"/><text x="44" y="130" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Arrived 19:28 · Entrance table</text><text x="44" y="152" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Everyone in the order was told</text><text x="26" y="206" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">4 of 6 collected · 3 paid you</text><rect x="26" y="218" width="338" height="8" rx="4" fill="#161a2e"/><rect x="26" y="218" width="225" height="8" rx="4" fill="#3ee39a"/><text x="250" y="252" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="middle">Got it</text><text x="326" y="252" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="middle">Paid</text><rect x="26" y="266" width="338" height="58" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="291" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Demo Player</text><text x="44" y="311" font-size="12" fill="#a9b1d6" font-weight="400" text-anchor="start">#12 Kebab ×2</text><rect x="239" y="284" width="22" height="22" rx="6" fill="#3ee39a"/><text x="250" y="301" font-size="15" fill="#0b0d1a" font-weight="800" text-anchor="middle">✓</text><rect x="315" y="284" width="22" height="22" rx="6" fill="#b98cff"/><text x="326" y="301" font-size="15" fill="#0b0d1a" font-weight="800" text-anchor="middle">✓</text><rect x="26" y="332" width="338" height="58" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="357" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Player Two</text><text x="44" y="377" font-size="12" fill="#a9b1d6" font-weight="400" text-anchor="start">#12 Kebab · split</text><rect x="239" y="350" width="22" height="22" rx="6" fill="#3ee39a"/><text x="250" y="367" font-size="15" fill="#0b0d1a" font-weight="800" text-anchor="middle">✓</text><rect x="315" y="350" width="22" height="22" rx="6" fill="#b98cff"/><text x="326" y="367" font-size="15" fill="#0b0d1a" font-weight="800" text-anchor="middle">✓</text><rect x="26" y="398" width="338" height="58" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="423" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Player Three (you)</text><text x="44" y="443" font-size="12" fill="#a9b1d6" font-weight="400" text-anchor="start">#1 Margherita</text><rect x="239" y="416" width="22" height="22" rx="6" fill="#3ee39a"/><text x="250" y="433" font-size="15" fill="#0b0d1a" font-weight="800" text-anchor="middle">✓</text><rect x="315" y="416" width="22" height="22" rx="6" fill="#b98cff"/><text x="326" y="433" font-size="15" fill="#0b0d1a" font-weight="800" text-anchor="middle">✓</text><rect x="26" y="464" width="338" height="58" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="489" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Player Four</text><text x="44" y="509" font-size="12" fill="#a9b1d6" font-weight="400" text-anchor="start">Own pizza</text><rect x="239" y="482" width="22" height="22" rx="6" fill="#3ee39a"/><text x="250" y="499" font-size="15" fill="#0b0d1a" font-weight="800" text-anchor="middle">✓</text><rect x="315" y="482" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><rect x="26" y="530" width="338" height="58" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="555" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Player Five</text><text x="44" y="575" font-size="12" fill="#a9b1d6" font-weight="400" text-anchor="start">#4 Quattro formaggi</text><rect x="239" y="548" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><rect x="315" y="548" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><rect x="26" y="596" width="338" height="58" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="621" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Player Six</text><text x="44" y="641" font-size="12" fill="#a9b1d6" font-weight="400" text-anchor="start">Other: gluten-free</text><rect x="239" y="614" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><rect x="315" y="614" width="22" height="22" rx="6" fill="#0b0d1a" stroke="#343c66" stroke-width="1.5"/><rect x="26" y="670" width="338" height="50" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="195.0" y="701.0" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="middle">Nudge the 2 who haven&#x27;t collected</text></g>
<g transform="translate(370,70) scale(0.78)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 3</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="112" width="338" height="120" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="146" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 3 is done</text><text x="44" y="174" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Everyone collected. Paid status stays</text><text x="44" y="193" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">with the holder and the crew; nobody</text><text x="44" y="212" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">else sees it.</text><text x="26" y="270" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">THE DAY&#x27;S RECORD KEEPS</text><text x="44" y="304" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">• the pizzeria, the times, the payer</text><text x="44" y="334" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">• who had what (for the bill split)</text><text x="44" y="364" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">• flags: released, corrected, cancelled</text></g>
<text x="720" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Arrival is a moment for everyone</text><text x="720" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">&#x27;It&#x27;s here&#x27; (pizza.order.arrived) pushes to each person in</text><text x="720" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">the order (Notify&#x27;s food topic, personal part, already</text><text x="720" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">built) and starts Moments&#x27; &#x27;Pizza orders ready&#x27; story on the</text><text x="720" y="199" font-size="15" fill="#374151" font-weight="400" text-anchor="start">screens (preset 21, already built).</text>
<text x="720" y="290" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Hand-out, the step the legacy never had</text><text x="720" y="316" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The roadmap&#x27;s goal says &#x27;the crew hands it out&#x27;; the legacy</text><text x="720" y="337" font-size="15" fill="#374151" font-weight="400" text-anchor="start">stopped at &#x27;placed&#x27;. Here the holder (or a crew member, U4)</text><text x="720" y="358" font-size="15" fill="#374151" font-weight="400" text-anchor="start">ticks each person off. &#x27;I&#x27;ve got mine&#x27; on the attendee&#x27;s</text><text x="720" y="379" font-size="15" fill="#374151" font-weight="400" text-anchor="start">page ticks the same box (U9).</text>
<text x="720" y="470" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Paid the holder: a checkbox, no money</text><text x="720" y="496" font-size="15" fill="#374151" font-weight="400" text-anchor="start">#118&#x27;s criterion. It is the holder&#x27;s private memo: no</text><text x="720" y="517" font-size="15" fill="#374151" font-weight="400" text-anchor="start">amounts, no reminders to pay, no screen. It replaces chasing</text><text x="720" y="538" font-size="15" fill="#374151" font-weight="400" text-anchor="start">by memory, and it never makes the platform handle money</text><text x="720" y="559" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(0022).</text>
<text x="720" y="650" font-size="17" fill="#111827" font-weight="700" text-anchor="start">When is an order done?</text><text x="720" y="676" font-size="15" fill="#374151" font-weight="400" text-anchor="start">When everyone is ticked, or the holder taps Done, or after a</text><text x="720" y="697" font-size="15" fill="#374151" font-weight="400" text-anchor="start">set time (O7: 2 h after arrival). pizza.order.done is a new</text><text x="720" y="718" font-size="15" fill="#374151" font-weight="400" text-anchor="start">additive event (D3); Moments&#x27; preset 21 may end on it.</text>
<text x="1380" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Nudge</text><text x="1380" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">One push to the people not yet ticked: &#x27;Your</text><text x="1380" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">pizza is waiting at the entrance table&#x27;. Once</text><text x="1380" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">per order, rate-limited (D12).</text>
<text x="1380" y="270" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Leftovers</text><text x="1380" y="296" font-size="15" fill="#374151" font-weight="400" text-anchor="start">An unclaimed pizza after done stays a line in</text><text x="1380" y="317" font-size="15" fill="#374151" font-weight="400" text-anchor="start">the record; what happens to the pizza is the</text><text x="1380" y="338" font-size="15" fill="#374151" font-weight="400" text-anchor="start">venue&#x27;s house rule, not the app&#x27;s.</text>
</svg>
