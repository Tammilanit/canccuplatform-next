<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 03: the Food page in its states</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">03 · Food: the open orders, in every state (attendee)</text>
<g transform="translate(30,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Now</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Food</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="110" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="132" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="133" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><text x="26" y="170" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">OPEN ORDERS</text><rect x="26" y="184" width="338" height="112" rx="16" fill="#1d2442" stroke="#3ddcff" stroke-width="1.5"/><text x="44" y="214" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 2 · Demo Pizzeria</text><rect x="292" y="196" width="58" height="24" rx="12" fill="#3ee39a"/><text x="321.0" y="213" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Open</text><text x="44" y="240" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Closes 18:30 · 9 pizzas · 7 people</text><text x="44" y="266" font-size="14" fill="#3ddcff" font-weight="600" text-anchor="start">You have 1 pizza here</text><rect x="26" y="310" width="338" height="112" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="340" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 3 · Demo Trattoria</text><rect x="292" y="322" width="58" height="24" rx="12" fill="#3ee39a"/><text x="321.0" y="339" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Open</text><text x="44" y="366" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Closes 18:45 · 4 pizzas · 3 people</text><text x="44" y="392" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Held by Player Three</text><text x="26" y="456" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">EARLIER TODAY</text><rect x="26" y="468" width="338" height="64" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="496" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Order 1 · Demo Pizzeria</text><text x="44" y="518" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Arrived 17:05 · collected</text><rect x="256" y="482" width="90" height="24" rx="12" fill="#b98cff"/><text x="301.0" y="499" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Arrived</text><rect x="26" y="690" width="338" height="50" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="195.0" y="721.0" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="middle">Start another order</text></g>
<g transform="translate(330,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Now</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Food</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="110" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="132" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="133" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="26" y="170" width="338" height="250" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="195" y="250" font-size="54" fill="#f3f5ff" font-weight="400" text-anchor="middle">🍕</text><text x="195" y="310" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="middle">No order is open</text><text x="60" y="340" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Start one: pick a pizzeria and a</text><text x="60" y="359" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">close time. You hold the order and</text><text x="60" y="378" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">call it in, or hand it to someone</text><text x="60" y="397" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">who will.</text><rect x="26" y="440" width="338" height="50" rx="12" fill="#3ddcff"/><text x="195.0" y="471.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Start an order</text><text x="26" y="530" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">EARLIER TODAY</text><rect x="26" y="542" width="338" height="64" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="570" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Order 1 · Demo Pizzeria</text><text x="44" y="592" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Arrived 17:05</text></g>
<g transform="translate(630,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Now</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Food</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="110" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="132" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="133" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><text x="26" y="170" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">OPEN ORDERS</text><rect x="26" y="184" width="338" height="92" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="214" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 2 · Demo Pizzeria</text><text x="44" y="240" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Closes 18:30 · 9 pizzas · 7 people</text><rect x="26" y="290" width="338" height="92" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="320" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 3 · Demo Trattoria</text><text x="44" y="346" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Closes 18:45 · 4 pizzas · 3 people</text><rect x="26" y="420" width="338" height="196" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="452" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Order with your Discord account</text><text x="44" y="480" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">You order as yourself, so the holder</text><text x="44" y="499" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">knows whose pizza is whose. Joining</text><text x="44" y="518" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">works at the venue or with the event&#x27;s</text><text x="44" y="537" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">link.</text><rect x="44" y="556" width="302" height="44" rx="12" fill="#3ddcff"/><text x="195.0" y="584.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Sign in with Discord</text></g>
<g transform="translate(930,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Now</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Food</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="110" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="132" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="133" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="26" y="170" width="338" height="220" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="195" y="230" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="middle">Ordering is closed</text><text x="54" y="262" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">The organisers have turned food orders</text><text x="54" y="281" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">off for now. Breakfast orders open at</text><text x="54" y="300" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">09:00.</text><text x="54" y="330" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">(the organiser&#x27;s note, from Food</text><text x="54" y="349" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">settings)</text></g>
<text x="30" y="720" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Member, two open</text>
<text x="30" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Each card: pizzeria, close time,</text><text x="30" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">counts, your stake. Holder names</text><text x="30" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">show to members only on the card;</text><text x="30" y="809" font-size="15" fill="#374151" font-weight="400" text-anchor="start">the screen may show them (L8).</text>
<text x="330" y="720" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Member, nothing open</text>
<text x="330" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">One clear action. Who may start an</text><text x="330" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">order is a setting: anyone who</text><text x="330" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">joined (default) or crew only</text><text x="330" y="809" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(U2).</text>
<text x="630" y="720" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Guest</text>
<text x="630" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">What the screen already shows</text><text x="630" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(public events), then sign in. A</text><text x="630" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">guest never sees who ordered what.</text>
<text x="930" y="720" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Ordering off</text>
<text x="930" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The event&#x27;s &#x27;ordering open&#x27;</text><text x="930" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">setting (the demo profile already</text><text x="930" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">sets pizza&#x27;s ordering_open) with a</text><text x="930" y="809" font-size="15" fill="#374151" font-weight="400" text-anchor="start">short note (O3).</text>
<text x="1250" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">What the Food page is</text><text x="1250" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The pizza module&#x27;s own page, drawn in the hub&#x27;s</text><text x="1250" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">frame from packages/ui (App track D2): the event</text><text x="1250" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">header, the tab bar, the theme&#x27;s tokens. The hub</text><text x="1250" y="199" font-size="15" fill="#374151" font-weight="400" text-anchor="start">links to it from For you and More; it is not a tab</text><text x="1250" y="220" font-size="15" fill="#374151" font-weight="400" text-anchor="start">of its own (App track L2).</text>
<text x="1250" y="300" font-size="17" fill="#111827" font-weight="700" text-anchor="start">One list, not a lobby</text><text x="1250" y="326" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Open orders first, newest close time last; your own</text><text x="1250" y="347" font-size="15" fill="#374151" font-weight="400" text-anchor="start">stake is marked so you find your order again.</text><text x="1250" y="368" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Earlier today&#x27;s orders stay for the day, so &#x27;did</text><text x="1250" y="389" font-size="15" fill="#374151" font-weight="400" text-anchor="start">ours arrive?&#x27; has an answer.</text>
<text x="1250" y="470" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Sort and limits</text><text x="1250" y="496" font-size="15" fill="#374151" font-weight="400" text-anchor="start">At most a few orders are open at once in practice. A</text><text x="1250" y="517" font-size="15" fill="#374151" font-weight="400" text-anchor="start">cap per event (O5) keeps a prank from opening</text><text x="1250" y="538" font-size="15" fill="#374151" font-weight="400" text-anchor="start">twenty.</text>
<text x="1250" y="590" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Language</text><text x="1250" y="616" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Finnish and English from the start (#119), from the</text><text x="1250" y="637" font-size="15" fill="#374151" font-weight="400" text-anchor="start">event&#x27;s language and the person&#x27;s choice in the hub.</text>
</svg>
