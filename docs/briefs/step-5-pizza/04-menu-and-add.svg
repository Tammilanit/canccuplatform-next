ff" font-weight="600" text-anchor="middle">chicken</text><text x="26" y="470" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">NOTE FOR THE PIZZERIA</text><rect x="26" y="482" width="338" height="42" rx="10" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="509" font-size="15" fill="#f3f5ff" font-weight="400" text-anchor="start">well done</text><rect x="26" y="690" width="338" height="50" rx="12" fill="#3ddcff"/><text x="195.0" y="721.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Add Own pizza</text></g>
<g transform="translate(330,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Order 2</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Other</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="112" width="338" height="34" rx="17" fill="#161a2e"/><rect x="250" y="112" width="110" height="34" rx="17" fill="#3ddcff"/><text x="81" y="134" font-size="14" fill="#a9b1d6" font-weight="600" text-anchor="middle">Menu</text><text x="195" y="134" font-size="14" fill="#a9b1d6" font-weight="600" text-anchor="middle">Own pizza</text><text x="306" y="134" font-size="14" fill="#0b0d1a" font-weight="700" text-anchor="middle">Other</text><text x="26" y="184" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">WHAT SHOULD THE HOLDER ORDER?</text><rect x="26" y="196" width="338" height="90" rx="10" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="226" font-size="15" fill="#f3f5ff" font-weight="400" text-anchor="start">Gluten-free margherita</text><text x="346" y="276" font-size="12" fill="#a9b1d6" font-weight="400" text-anchor="end">22 / 80</text><text x="26" y="312" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">The holder reads it out as written. Use</text><text x="26" y="331" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">it when the menu has no match.</text><rect x="26" y="690" width="338" height="50" rx="12" fill="#3ddcff"/><text x="195.0" y="721.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Add</text></g>
<g transform="translate(630,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 2</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="112" width="338" height="150" rx="16" fill="#1d2442" stroke="#b98cff" stroke-width="1.5"/><text x="44" y="142" font-size="12" fill="#b98cff" font-weight="700" text-anchor="start">LAST TIME</text><text x="44" y="172" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">#12 Kebab · no onion</text><text x="44" y="196" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Demo Pizzeria · yesterday</text><rect x="44" y="212" width="302" height="40" rx="12" fill="#3ddcff"/><text x="195.0" y="238.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Add the same again</text><rect x="26" y="284" width="338" height="44" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="312" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">🔍  name or ingredient</text><rect x="26" y="344" width="338" height="70" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="374" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">#1 Margherita</text><text x="44" y="396" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">tomato, cheese</text><rect x="306" y="360" width="40" height="40" rx="20" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="326" y="387" font-size="22" fill="#f3f5ff" font-weight="700" text-anchor="middle">+</text><rect x="26" y="424" width="338" height="70" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="454" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">#4 Quattro formaggi</text><text x="44" y="476" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">four cheeses</text><rect x="306" y="440" width="40" height="40" rx="20" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="326" y="467" font-size="22" fill="#f3f5ff" font-weight="700" text-anchor="middle">+</text><rect x="26" y="504" width="338" height="70" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="534" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">#12 Kebab</text><text x="44" y="556" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">kebab, onion, jalapeño, garlic sauce</text><rect x="306" y="520" width="40" height="40" rx="20" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="326" y="547" font-size="22" fill="#f3f5ff" font-weight="700" text-anchor="middle">+</text><rect x="26" y="584" width="338" height="70" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="614" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">#20 Vegetariana</text><text x="44" y="636" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">mushroom, pepper, olives, onion</text><rect x="306" y="600" width="40" height="40" rx="20" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="326" y="627" font-size="22" fill="#f3f5ff" font-weight="700" text-anchor="middle">+</text></g>
<text x="30" y="720" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Own pizza</text>
<text x="30" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The pizzeria&#x27;s base and 1–4 of its</text><text x="30" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">own toppings; the count stops at</text><text x="30" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">the limit. Hidden where the</text><text x="30" y="809" font-size="15" fill="#374151" font-weight="400" text-anchor="start">pizzeria has no base.</text>
<text x="330" y="720" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Other</text>
<text x="330" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Free text up to 80 characters, the</text><text x="330" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">last resort, as the legacy</text><text x="330" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">validator.</text>
<text x="630" y="720" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Menu, with last time</text>
<text x="630" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Invented: your last pizza from</text><text x="630" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">this pizzeria, one tap to add</text><text x="630" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">again (U6). The legacy filter</text><text x="630" y="809" font-size="15" fill="#374151" font-weight="400" text-anchor="start">matches name or ingredient.</text>
<text x="950" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Ported as is</text><text x="950" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">validate.ts (kinds, limits, 1–4 toppings, text lengths)</text><text x="950" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">and menu-filter.ts with their tests; the menu number</text><text x="950" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">shows as #12 in the picker, the list and the read-out,</text><text x="950" y="199" font-size="15" fill="#374151" font-weight="400" text-anchor="start">as the legacy plan chose.</text>
<text x="950" y="270" font-size="17" fill="#111827" font-weight="700" text-anchor="start">One size, no prices</text><text x="950" y="296" font-size="15" fill="#374151" font-weight="400" text-anchor="start">No sizes and no prices in the app (0022: no payments).</text><text x="950" y="317" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Anything else goes in Other or the note. Prices on the</text><text x="950" y="338" font-size="15" fill="#374151" font-weight="400" text-anchor="start">menu are a question (D7), shown only as a hint if at</text><text x="950" y="359" font-size="15" fill="#374151" font-weight="400" text-anchor="start">all.</text>
<text x="950" y="430" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Edit until close</text><text x="950" y="456" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Each pizza is the person&#x27;s own row: edit and delete</text><text x="950" y="477" font-size="15" fill="#374151" font-weight="400" text-anchor="start">while the order is open; after close only the holder or</text><text x="950" y="498" font-size="15" fill="#374151" font-weight="400" text-anchor="start">the crew change it (and it is audited).</text>
<text x="950" y="590" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Accessibility</text><text x="950" y="616" font-size="15" fill="#374151" font-weight="400" text-anchor="start">48 px targets, the filter keeps focus, toppings are real</text><text x="950" y="637" font-size="15" fill="#374151" font-weight="400" text-anchor="start">toggle buttons with their state read out; reduced motion</text><text x="950" y="658" font-size="15" fill="#374151" font-weight="400" text-anchor="start">honoured.</text>
</svg>
