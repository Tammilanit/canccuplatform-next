<g transform="translate(1204,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 2</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="112" width="338" height="86" rx="16" fill="#103a2a" stroke="#3ee39a" stroke-width="1.5"/><text x="44" y="146" font-size="18" fill="#3ee39a" font-weight="700" text-anchor="start">✓ Added to order 2</text><text x="44" y="174" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">You can edit it until the order closes.</text><text x="26" y="232" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">YOUR PIZZAS</text><rect x="26" y="244" width="338" height="70" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="274" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">#12 Kebab</text><text x="44" y="298" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">no onion · split with Player Two</text><text x="312" y="286" font-size="14" fill="#3ddcff" font-weight="600" text-anchor="end">Edit</text><text x="346" y="286" font-size="15" fill="#ff6b7d" font-weight="400" text-anchor="end">🗑</text><text x="26" y="354" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">WHAT HAPPENS NEXT</text><circle cx="48" cy="380" r="9" fill="#3ddcff"/><line x1="48" y1="390" x2="48" y2="416" stroke="#343c66" stroke-width="2"/><text x="70" y="385" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Open · closes 18:30</text><circle cx="48" cy="426" r="9" fill="#0b0d1a" stroke="#343c66" stroke-width="2"/><line x1="48" y1="436" x2="48" y2="462" stroke="#343c66" stroke-width="2"/><text x="70" y="431" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">Called in</text><circle cx="48" cy="472" r="9" fill="#0b0d1a" stroke="#343c66" stroke-width="2"/><line x1="48" y1="482" x2="48" y2="508" stroke="#343c66" stroke-width="2"/><text x="70" y="477" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">On the way</text><circle cx="48" cy="518" r="9" fill="#0b0d1a" stroke="#343c66" stroke-width="2"/><text x="70" y="523" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">Pizza is here</text><rect x="26" y="590" width="338" height="78" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="620" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">🔔 Tell me when it arrives</text><text x="44" y="646" font-size="13" fill="#3ee39a" font-weight="400" text-anchor="start">Food alerts are on for this phone</text></g>
<text x="1500" y="120" font-size="17" fill="#111827" font-weight="700" text-anchor="start">1 · Food</text><text x="1500" y="146" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Open orders, each with its close time,</text><text x="1500" y="167" font-size="15" fill="#374151" font-weight="400" text-anchor="start">counts and holder. Reached from the</text><text x="1500" y="188" font-size="15" fill="#374151" font-weight="400" text-anchor="start">screen&#x27;s QR, the hub&#x27;s For you card or</text><text x="1500" y="209" font-size="15" fill="#374151" font-weight="400" text-anchor="start">More.</text>
<text x="1500" y="280" font-size="17" fill="#111827" font-weight="700" text-anchor="start">2 · The menu</text><text x="1500" y="306" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Filter by name or ingredient (the legacy</text><text x="1500" y="327" font-size="15" fill="#374151" font-weight="400" text-anchor="start">menu filter); Own pizza is a base plus</text><text x="1500" y="348" font-size="15" fill="#374151" font-weight="400" text-anchor="start">1–4 toppings; Other is free text. The</text><text x="1500" y="369" font-size="15" fill="#374151" font-weight="400" text-anchor="start">note is read to the pizzeria, the</text><text x="1500" y="390" font-size="15" fill="#374151" font-weight="400" text-anchor="start">comment is not.</text>
<text x="1500" y="480" font-size="17" fill="#111827" font-weight="700" text-anchor="start">3 · Added</text><text x="1500" y="506" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Status in four plain steps. Live by push</text><text x="1500" y="527" font-size="15" fill="#374151" font-weight="400" text-anchor="start">from pizza.order.* (no polling); the</text><text x="1500" y="548" font-size="15" fill="#374151" font-weight="400" text-anchor="start">food topic&#x27;s personal part pushes &#x27;pizza</text><text x="1500" y="569" font-size="15" fill="#374151" font-weight="400" text-anchor="start">is here&#x27;.</text>
</svg>
