ht="600" text-anchor="start">Closes 18:30 · last call 18:20</text><text x="44" y="264" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">9 pizzas · 7 people · held by Demo Player</text><rect x="44" y="278" width="302" height="40" rx="12" fill="#3ddcff"/><text x="195.0" y="304.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Join this order</text><rect x="26" y="350" width="338" height="92" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="380" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 3 · Demo Trattoria</text><rect x="292" y="362" width="58" height="24" rx="12" fill="#3ee39a"/><text x="321.0" y="379" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Open</text><text x="44" y="406" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Closes 18:45 · 4 pizzas · 3 people</text><rect x="26" y="690" width="338" height="50" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="195.0" y="721.0" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="middle">Start another order</text></g>
<line x1="820" y1="400" x2="860" y2="400" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<g transform="translate(866,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 2</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="112" width="338" height="44" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="140" font-size="15" fill="#f3f5ff" font-weight="400" text-anchor="start">🔍  kebab</text><rect x="26" y="168" width="110" height="34" rx="17" fill="#3ddcff"/><text x="81" y="190" font-size="14" fill="#0b0d1a" font-weight="700" text-anchor="middle">Menu</text><text x="176" y="190" font-size="14" fill="#a9b1d6" font-weight="600" text-anchor="middle">Own pizza</text><text x="276" y="190" font-size="14" fill="#a9b1d6" font-weight="600" text-anchor="middle">Other</text><rect x="26" y="220" width="338" height="74" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="250" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">#12 Kebab</text><text x="44" y="274" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">kebab, onion, jalapeño, garlic sauce</text><rect x="306" y="238" width="40" height="40" rx="20" fill="#3ddcff"/><text x="326" y="265" font-size="22" fill="#0b0d1a" font-weight="700" text-anchor="middle">+</text><rect x="26" y="304" width="338" height="74" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="334" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">#14 Kebab special</text><text x="44" y="358" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">kebab, feta, olives, chili</text><rect x="306" y="322" width="40" height="40" rx="20" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="326" y="349" font-size="22" fill="#f3f5ff" font-weight="700" text-anchor="middle">+</text><rect x="26" y="388" width="338" height="74" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="418" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">#31 Kebab calzone</text><text x="44" y="442" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">kebab, tomato, cheese</text><rect x="306" y="406" width="40" height="40" rx="20" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="326" y="433" font-size="22" fill="#f3f5ff" font-weight="700" text-anchor="middle">+</text><text x="26" y="500" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">NOTE FOR THE PIZZERIA (READ OUT)</text><rect x="26" y="512" width="338" height="42" rx="10" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="539" font-size="15" fill="#f3f5ff" font-weight="400" text-anchor="start">no onion</text><text x="26" y="580" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">COMMENT FOR THE HOLDER (NEVER READ OUT)</text><rect x="26" y="592" width="338" height="42" rx="10" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="619" font-size="15" fill="#a9b1d6" font-weight="400" text-