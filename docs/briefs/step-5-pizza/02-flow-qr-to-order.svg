<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 02: from the screen&#x27;s QR to a pizza in the order</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">02 · From the screen to a pizza in the order (attendee)</text>
<text x="30" y="120" font-size="16" fill="#374151" font-weight="600" text-anchor="start">The screen: Moments&#x27; &#x27;Pizza order open&#x27;</text>
<text x="30" y="142" font-size="16" fill="#374151" font-weight="600" text-anchor="start">story (preset 10), built in step 4</text>
<g transform="translate(30,160) scale(0.2188)"><rect x="0" y="0" width="1920" height="1080" rx="24" fill="#0b0d1a"/><rect x="60" y="60" width="1180" height="960" rx="20" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="110" y="160" font-size="44" fill="#a9b1d6" font-weight="600" text-anchor="start">Now · Main hall</text><text x="110" y="300" font-size="90" fill="#f3f5ff" font-weight="800" text-anchor="start">Demo Game Cup</text><text x="110" y="400" font-size="56" fill="#a9b1d6" font-weight="500" text-anchor="start">Semi-final · 19:40</text><rect x="1280" y="60" width="580" height="960" rx="20" fill="#1d2442" stroke="#3ddcff" stroke-width="4"/><text x="1320" y="170" font-size="44" fill="#3ddcff" font-weight="800" text-anchor="start">PIZZA ORDER OPEN</text><text x="1320" y="260" font-size="60" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Pizzeria</text><text x="1320" y="340" font-size="52" fill="#ffc94d" font-weight="700" text-anchor="start">Closes 18:30</text><text x="1320" y="420" font-size="44" fill="#a9b1d6" font-weight="500" text-anchor="start">Order in the hub</text><rect x="1434" y="514" width="312" height="312" rx="6" fill="#f3f5ff"/><rect x="1440.0" y="520.0" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1482.9" y="520.0" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1525.7" y="520.0" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1611.4" y="520.0" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1654.3" y="520.0" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1697.1" y="520.0" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1440.0" y="562.9" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1568.6" y="562.9" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1697.1" y="562.9" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1440.0" y="605.7" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1525.7" y="605.7" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1568.6" y="605.7" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1611.4" y="605.7" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1697.1" y="605.7" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1525.7" y="648.6" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1611.4" y="648.6" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1440.0" y="691.4" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1525.7" y="691.4" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1568.6" y="691.4" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1654.3" y="691.4" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1697.1" y="691.4" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1440.0" y="734.3" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1611.4" y="734.3" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1697.1" y="734.3" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1440.0" y="777.1" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1482.9" y="777.1" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1525.7" y="777.1" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1611.4" y="777.1" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1654.3" y="777.1" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/><rect x="1697.1" y="777.1" width="42.9" height="42.9" rx="0" fill="#0b0d1a"/></g><rect x="30" y="160" width="420" height="236" rx="6" fill="none" stroke="#0f172a" stroke-width="6"/>
<line x1="458" y1="300" x2="520" y2="300" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="30" y="440" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Under a minute, end to end</text><text x="30" y="466" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Scan, join, add. Sign-in happens once per</text><text x="30" y="487" font-size="15" fill="#374151" font-weight="400" text-anchor="start">phone (#52) and membership comes from the</text><text x="30" y="508" font-size="15" fill="#374151" font-weight="400" text-anchor="start">venue or the event&#x27;s link (0027); a member</text><text x="30" y="529" font-size="15" fill="#374151" font-weight="400" text-anchor="start">is never asked again. No token in any URL.</text>
<text x="30" y="590" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Why a list first</text><text x="30" y="616" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Several orders can be open at once, one per</text><text x="30" y="637" font-size="15" fill="#374151" font-weight="400" text-anchor="start">pizzeria (D1). With one open order the QR</text><text x="30" y="658" font-size="15" fill="#374151" font-weight="400" text-anchor="start">may skip the list and land on the menu (L6).</text>
<text x="30" y="720" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Private by default</text><text x="30" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Your pizzas, notes and comments are seen by</text><text x="30" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">you, the order&#x27;s holder and the crew; other</text><text x="30" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">members see the count and the pizzeria only</text><text x="30" y="809" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(D9).</text>
