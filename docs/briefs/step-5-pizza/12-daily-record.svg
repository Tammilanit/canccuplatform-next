<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" width="1920" height="1000" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 12: the daily record</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1000" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">12 · The daily record and its CSV (organiser)</text>
<rect x="24" y="70" width="1440" height="860" rx="12" fill="#f6f7fb" stroke="#e5e7eb" stroke-width="1.5"/><rect x="24" y="70" width="1440" height="52" rx="12" fill="#111827"/><rect x="24" y="110" width="1440" height="12" rx="0" fill="#111827"/><rect x="42" y="82" width="28" height="28" rx="7" fill="#3ddcff"/><text x="56" y="101" font-size="12" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="80" y="102" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">Demo Event</text><text x="234" y="102" font-size="15" fill="#d1d5db" font-weight="500" text-anchor="start">Event ▾</text><text x="1444" y="102" font-size="14" fill="#d1d5db" font-weight="500" text-anchor="end">Health ok · Crew Member ▾</text><text x="52" y="162" font-size="24" fill="#111827" font-weight="700" text-anchor="start">Food</text><text x="92.0" y="202" font-size="15" fill="#6b7280" font-weight="500" text-anchor="middle">Orders</text><text x="240.5" y="202" font-size="15" fill="#6b7280" font-weight="500" text-anchor="middle">Pizzerias and menus</text><text x="416.0" y="202" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">Daily record</text><rect x="349" y="210" width="134" height="3" rx="0" fill="#2563eb"/><text x="542.0" y="202" font-size="15" fill="#6b7280" font-weight="500" text-anchor="middle">Settings</text><rect x="52" y="213" width="1384" height="1" rx="0" fill="#e5e7eb"/><g transform="translate(0,40)"><text x="52" y="200" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Saturday · 3 orders · 28 pizzas · 21 people</text><rect x="1150" y="178" width="150" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="1225.0" y="201.0" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">CSV for this day</text><rect x="1310" y="178" width="150" height="36" rx="8" fill="#2563eb"/><text x="1385.0" y="201.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">CSV for the event</text><text x="60" y="238" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">ORDER</text><text x="130" y="238" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">PIZZERIA</text><text x="300" y="238" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">HOLDER</text><text x="450" y="238" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">PAID THE PIZZERIA</text><text x="620" y="238" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">CALLED IN</text><text x="730" y="238" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">ARRIVED</text><text x="830" y="238" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">PIZZAS</text><text x="910" y="238" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">PEOPLE</text><text x="990" y="238" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">BILL (D8)</text><text x="1100" y="238" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">FLAGS</text><rect x="48" y="248" width="1400" height="1" rx="0" fill="#e5e7eb"/><rect x="48" y="250" width="1400" height="48" rx="0" fill="#ffffff"/><text x="60" y="279.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">1</text><text x="130" y="279.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Demo Pizzeria</text><text x="300" y="279.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Demo Player</text><text x="450" y="279.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Demo Player</text><text x="620" y="279.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">16:20</text><text x="730" y="279.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">17:05</text><text x="830" y="279.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">11</text><text x="910" y="279.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">8</text><text x="990" y="279.0" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">—</text><text x="1100" y="279.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">—</text><rect x="48" y="298" width="1400" height="1" rx="0" fill="#e5e7eb"/><rect x="48" y="298" width="1400" height="48" rx="0" fill="#fafafa"/><text x="60" y="327.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">2</text><text x="130" y="327.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Demo Pizzeria</text><text x="300" y="327.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Crew Member</text><text x="450" y="327.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Crew Member</text><text x="620" y="327.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">19:10</text><text x="730" y="327.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">19:52</text><text x="830" y="327.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">9</text><text x="910" y="327.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">7</text><text x="990" y="327.0" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">—</text><text x="1100" y="327.0" font-size="14" fill="#b45309" font-weight="600" text-anchor="start">Released; taken over by the crew</text><rect x="48" y="346" width="1400" height="1" rx="0" fill="#e5e7eb"/><rect x="48" y="346" width="1400" height="48" rx="0" fill="#ffffff"/><text x="60" y="375.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">3</text><text x="130" y="375.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Demo Trattoria</text><text x="300" y="375.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Player Three</text><text x="450" y="375.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Player Three</text><text x="620" y="375.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">18:46</text><text x="730" y="375.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">19:28</text><text x="830" y="375.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">8</text><text x="910" y="375.0" font-size="14" fill="#374151" font-weight="400" text-anchor="start">6</text><text x="990" y="375.0" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">—</text><text x="1100" y="375.0" font-size="14" fill="#b45309" font-weight="600" text-anchor="start">Pizza edited after close (by the holder)</text><rect x="48" y="394" width="1400" height="1" rx="0" fill="#e5e7eb"/><rect x="48" y="420" width="1400" height="330" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="70" y="454" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Order 2 · who had what</text><text x="70" y="490" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Demo Player</text><text x="260" y="490" font-size="15" fill="#374151" font-weight="400" text-anchor="start">#12 Kebab · no onion</text><text x="600" y="490" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">split with Player Two</text><text x="70" y="524" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Player Two</text><text x="260" y="524" font-size="15" fill="#374151" font-weight="400" text-anchor="start">#12 Kebab</text><text x="600" y="524" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start"></text><text x="70" y="558" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Player Four</text><text x="260" y="558" font-size="15" fill="#374151" font-weight="400" text-anchor="start">#1 Margherita ×2</text><text x="600" y="558" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">one is for a friend</text><text x="70" y="592" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Player Five</text><text x="260" y="592" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Own pizza: ham, pineapple</text><text x="600" y="592" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start"></text><text x="70" y="626" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Player Six</text><text x="260" y="626" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Other: gluten-free margherita</text><text x="600" y="626" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start"></text><text x="70" y="660" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Player Seven</text><text x="260" y="660" font-size="15" fill="#374151" font-weight="400" text-anchor="start">#20 Vegetariana</text><text x="600" y="660" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start"></text><text x="70" y="694" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Player Eight</text><text x="260" y="694" font-size="15" fill="#374151" font-weight="400" text-anchor="start">#4 Quattro formaggi</text><text x="600" y="694" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start"></text><text x="900" y="454" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">THE CSV, AS THE LEGACY</text><text x="900" y="484" font-size="13" fill="#374151" font-weight="400" text-anchor="start">order;date;pizzeria;payer;participant;pizza;comment</text><text x="900" y="512" font-size="13" fill="#374151" font-weight="400" text-anchor="start">2;2026-…;Demo Pizzeria;Crew Member;Demo Player;#12 Kebab;split with…</text><text x="900" y="540" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">UTF-8 with BOM, &#x27;;&#x27; separators, decimal comma,</text><text x="900" y="568" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">quoted text, placed orders only, the event&#x27;s time zone.</text><text x="900" y="620" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">Read with pizza.record.read (D5). The tenant&#x27;s export</text><text x="900" y="639" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">includes the record (TH3); after 12 months the names are</text><text x="900" y="658" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">anonymised and the totals stay (0027).</text></g>
<text x="1490" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Why it exists</text><text x="1490" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">After the event the organisers settle</text><text x="1490" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">food outside the platform: they need</text><text x="1490" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">each day&#x27;s orders, who paid the pizzeria</text><text x="1490" y="199" font-size="15" fill="#374151" font-weight="400" text-anchor="start">and who ate what. The legacy record and</text><text x="1490" y="220" font-size="15" fill="#374151" font-weight="400" text-anchor="start">CSV did that (P10), with tests.</text>
<text x="1490" y="330" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Ported as is</text><text x="1490" y="356" font-size="15" fill="#374151" font-weight="400" text-anchor="start">report.ts and its CSV bytes test; the</text><text x="1490" y="377" font-size="15" fill="#374151" font-weight="400" text-anchor="start">time zone is the event&#x27;s, not a</text><text x="1490" y="398" font-size="15" fill="#374151" font-weight="400" text-anchor="start">constant.</text>
<text x="1490" y="460" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Flags replace guesswork</text><text x="1490" y="486" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Released automatically, taken over,</text><text x="1490" y="507" font-size="15" fill="#374151" font-weight="400" text-anchor="start">edited after close, cancelled: each from</text><text x="1490" y="528" font-size="15" fill="#374151" font-weight="400" text-anchor="start">the audit log, so the record says why a</text><text x="1490" y="549" font-size="15" fill="#374151" font-weight="400" text-anchor="start">line looks odd.</text>
<text x="1490" y="640" font-size="17" fill="#111827" font-weight="700" text-anchor="start">No money</text><text x="1490" y="666" font-size="15" fill="#374151" font-weight="400" text-anchor="start">A bill column only if D8 keeps the bill</text><text x="1490" y="687" font-size="15" fill="#374151" font-weight="400" text-anchor="start">total; the app never splits or settles.</text>
</svg>
