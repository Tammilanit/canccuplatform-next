<circle cx="1380" cy="155" r="12" fill="#111827"/>
<text x="1380" y="160" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="1370" y="190" font-size="14" fill="#111827" font-weight="600" text-anchor="start">Write-only (the plan, The optional AI reader)</text>
<text x="1370" y="212" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">The key goes in once: sealed with the platform's</text>
<text x="1370" y="231" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">secrets key, bound to the event, never in an</text>
<text x="1370" y="250" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">answer, a log, an audit entry or an event.</text>
<circle cx="1380" cy="304" r="12" fill="#111827"/>
<text x="1380" y="309" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="1370" y="339" font-size="14" fill="#111827" font-weight="600" text-anchor="start">What the page shows</text>
<text x="1370" y="361" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">The provider and model, the key's last four</text>
<text x="1370" y="380" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">characters, who set it and when, its last use</text>
<text x="1370" y="399" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">and this month's reads.</text>
<circle cx="1380" cy="453" r="12" fill="#111827"/>
<text x="1380" y="458" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="1370" y="488" font-size="14" fill="#111827" font-weight="600" text-anchor="start">Replace and revoke act at once</text>
<text x="1370" y="510" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">Replace swaps the key; Revoke deletes it, reads</text>
<text x="1370" y="529" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">stop and the reader leaves every page. Each is</text>
<text x="1370" y="548" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">audited with the last four characters only.</text>
<circle cx="1380" cy="602" r="12" fill="#111827"/>
<text x="1380" y="607" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="1370" y="637" font-size="14" fill="#111827" font-weight="600" text-anchor="start">Without a key, no reader</text>
<text x="1370" y="659" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">Food settings shows no AI reader section, the</text>
<text x="1370" y="678" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">money step only keeps the photo, and the</text>
<text x="1370" y="697" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">pizzeria page offers no "Read a photo".</text>
<circle cx="1380" cy="751" r="12" fill="#111827"/>
<text x="1380" y="756" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="1370" y="786" font-size="14" fill="#111827" font-weight="600" text-anchor="start">A refused key stops the reader</text>
<text x="1370" y="808" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">The provider's refusal is shown here and in the</text>
<text x="1370" y="827" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">reader; it is never retried in a loop.</text>
<circle cx="1380" cy="881" r="12" fill="#111827"/>
<text x="1380" y="886" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<text x="1370" y="916" font-size="14" fill="#111827" font-weight="600" text-anchor="start">Who</text>
<text x="1370" y="938" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">admin.integrations.write, which the event-admin</text>
<text x="1370" y="957" font-size="12.5" fill="#374151" font-weight="400" text-anchor="start">role holds; one key per event (0013).</text>
</svg>
