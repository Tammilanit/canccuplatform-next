<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 05: following my order</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">05 · My order: from closed to &#x27;pizza is here&#x27; (attendee)</text>
<g transform="translate(30,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 2</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="112" width="338" height="80" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="142" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 2 · Demo Pizzeria</text><text x="44" y="168" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Held by Demo Player</text><rect x="282" y="150" width="66" height="24" rx="12" fill="#ffc94d"/><text x="315.0" y="167" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Closed</text><circle cx="48" cy="232" r="10" fill="#3ddcff"/><line x1="48" y1="243" x2="48" y2="283" stroke="#3ddcff" stroke-width="2"/><text x="72" y="237" font-size="15" fill="#f3f5ff" font-weight="400" text-anchor="start">Open</text><text x="72" y="258" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">18:02–18:30</text><circle cx="48" cy="294" r="10" fill="#3ddcff"/><line x1="48" y1="305" x2="48" y2="345" stroke="#343c66" stroke-width="2"/><text x="72" y="299" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Closed: Demo Player is calling</text><text x="72" y="320" font-size="13" fill="#ffc94d" font-weight="400" text-anchor="start">since 18:31</text><circle cx="48" cy="356" r="10" fill="#0b0d1a" stroke="#343c66" stroke-width="2"/><line x1="48" y1="367" x2="48" y2="407" stroke="#343c66" stroke-width="2"/><text x="72" y="361" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">Called in</text><circle cx="48" cy="418" r="10" fill="#0b0d1a" stroke="#343c66" stroke-width="2"/><line x1="48" y1="429" x2="48" y2="469" stroke="#343c66" stroke-width="2"/><text x="72" y="423" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">On the way</text><circle cx="48" cy="480" r="10" fill="#0b0d1a" stroke="#343c66" stroke-width="2"/><text x="72" y="485" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">Pizza is here</text><text x="26" y="560" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">YOUR PIZZAS</text><rect x="26" y="572" width="338" height="64" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="602" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">#12 Kebab</text><text x="44" y="624" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">no onion</text><text x="346" y="612" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="end">🔒</text><text x="26" y="670" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">The order is closed: ask Demo Player for</text><text x="26" y="689" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">a change.</text></g>
<g transform="translate(330,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 2</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="112" width="338" height="80" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="142" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 2 · Demo Pizzeria</text><text x="44" y="168" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Called in 18:36</text><rect x="254" y="150" width="96" height="24" rx="12" fill="#3ddcff"/><text x="302.0" y="167" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">On the way</text><circle cx="48" cy="232" r="10" fill="#3ddcff"/><line x1="48" y1="243" x2="48" y2="283" stroke="#3ddcff" stroke-width="2"/><text x="72" y="237" font-size="15" fill="#f3f5ff" font-weight="400" text-anchor="start">Open</text><circle cx="48" cy="294" r="10" fill="#3ddcff"/><line x1="48" y1="305" x2="48" y2="345" stroke="#3ddcff" stroke-width="2"/><text x="72" y="299" font-size="15" fill="#f3f5ff" font-weight="400" text-anchor="start">Closed</text><circle cx="48" cy="356" r="10" fill="#3ddcff"/><line x1="48" y1="367" x2="48" y2="407" stroke="#3ddcff" stroke-width="2"/><text x="72" y="361" font-size="15" fill="#f3f5ff" font-weight="400" text-anchor="start">Called in</text><text x="72" y="382" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">18:36</text><circle cx="48" cy="418" r="10" fill="#3ddcff"/><line x1="48" y1="429" x2="48" y2="469" stroke="#343c66" stroke-width="2"/><text x="72" y="423" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">On the way</text><text x="72" y="444" font-size="13" fill="#ffc94d" font-weight="400" text-anchor="start">about 19:15, the pizzeria said</text><circle cx="48" cy="480" r="10" fill="#0b0d1a" stroke="#343c66" stroke-width="2"/><text x="72" y="485" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">Pizza is here</text><rect x="26" y="560" width="338" height="80" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="592" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Collect from Demo Player</text><text x="44" y="616" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Pay them your share; the app takes no money</text></g>
<g transform="translate(630,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Food</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Order 2</text><rect x="10" y="760" width="370" height="74" rx="0" fill="#161a2e"/><text x="47" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><text x="121" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><text x="195" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><text x="269" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><text x="343" y="800" font-size="13" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text><rect x="26" y="112" width="338" height="150" rx="16" fill="#2a1f45" stroke="#b98cff" stroke-width="1.5"/><text x="195" y="166" font-size="24" fill="#f3f5ff" font-weight="800" text-anchor="middle">🍕 Pizza is here</text><text x="195" y="198" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="middle">Order 2 · arrived 19:12</text><text x="195" y="230" font-size="16" fill="#b98cff" font-weight="700" text-anchor="middle">Collect at the entrance table</text><text x="26" y="296" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">YOUR PIZZAS</text><rect x="26" y="308" width="338" height="64" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="338" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">#12 Kebab</text><text x="44" y="360" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">no onion</text><rect x="26" y="400" width="338" height="50" rx="12" fill="#3ee39a"/><text x="195.0" y="431.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">I&#x27;ve got mine</text><text x="26" y="482" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Ticks you off the holder&#x27;s hand-out</text><text x="26" y="501" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">list. The holder can tick it for you</text><text x="26" y="520" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">too.</text></g>
<g transform="translate(930,80) scale(0.72)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">19:12</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="195" y="170" font-size="64" fill="#f3f5ff" font-weight="300" text-anchor="middle">19:12</text><text x="195" y="204" font-size="16" fill="#a9b1d6" font-weight="400" text-anchor="middle">Saturday</text><rect x="22" y="260" width="346" height="96" rx="18" fill="#2a2f4a"/><rect x="38" y="276" width="30" height="30" rx="8" fill="#3ddcff"/><text x="53" y="297" font-size="11" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="80" y="290" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">DEMO EVENT · FOOD</text><text x="80" y="314" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Pizza is here: order 2</text><text x="80" y="336" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Collect at the entrance table</text><rect x="22" y="368" width="346" height="96" rx="18" fill="#2a2f4a"/><rect x="38" y="384" width="30" height="30" rx="8" fill="#3ddcff"/><text x="53" y="405" font-size="11" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="80" y="398" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">DEMO EVENT · FOOD</text><text x="80" y="422" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 2 is closing at 18:30</text><text x="80" y="444" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Last call: add your pizza now</text></g>
<text x="30" y="720" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Closed, being called</text>
<text x="30" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Your pizzas lock; the page says</text><text x="30" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">who to ask. Steps show times as</text><text x="30" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">they happen.</text>
<text x="330" y="720" font-size="18" fill="#111827" font-weight="700" text-anchor="start">On the way</text>
<text x="330" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The holder may enter the</text><text x="330" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">pizzeria&#x27;s estimate when marking</text><text x="330" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">it called in (U8): the one number</text><text x="330" y="809" font-size="15" fill="#374151" font-weight="400" text-anchor="start">everyone asks for.</text>
<text x="630" y="720" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Arrived</text>
<text x="630" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Where to collect is the holder&#x27;s</text><text x="630" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">one-line pickup note (or the</text><text x="630" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">event&#x27;s default). &#x27;I&#x27;ve got mine&#x27;</text><text x="630" y="809" font-size="15" fill="#374151" font-weight="400" text-anchor="start">is optional (U9).</text>
<text x="930" y="720" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Pushes</text>
<text x="930" y="746" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Notify&#x27;s food topic: &#x27;pizza is</text><text x="930" y="767" font-size="15" fill="#374151" font-weight="400" text-anchor="start">here&#x27; to each person in the order</text><text x="930" y="788" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(exists). The personal last call</text><text x="930" y="809" font-size="15" fill="#374151" font-weight="400" text-anchor="start">is new (D12).</text>
<text x="1250" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">The order&#x27;s states, as people say them</text><text x="1250" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">open → closed (being called) → called in (placed) →</text><text x="1250" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">on the way (placed with an estimate) → pizza is here</text><text x="1250" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(arrived) → done. Cancelled at any point before</text><text x="1250" y="199" font-size="15" fill="#374151" font-weight="400" text-anchor="start">placed; the page then says why and by whom (crew or</text><text x="1250" y="220" font-size="15" fill="#374151" font-weight="400" text-anchor="start">holder), never blames.</text>
<text x="1250" y="320" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Live, never polled</text><text x="1250" y="346" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The page subscribes to the order&#x27;s pizza.order.*</text><text x="1250" y="367" font-size="15" fill="#374151" font-weight="400" text-anchor="start">events through the kit&#x27;s push channel (#119</text><text x="1250" y="388" font-size="15" fill="#374151" font-weight="400" text-anchor="start">criterion). A late phone catches up from the order</text><text x="1250" y="409" font-size="15" fill="#374151" font-weight="400" text-anchor="start">read on reconnect.</text>
<text x="1250" y="470" font-size="17" fill="#111827" font-weight="700" text-anchor="start">For you in the hub</text><text x="1250" y="496" font-size="15" fill="#374151" font-weight="400" text-anchor="start">While you have a pizza in an order, the hub&#x27;s For</text><text x="1250" y="517" font-size="15" fill="#374151" font-weight="400" text-anchor="start">you shows its card (App track D18, the me/summary</text><text x="1250" y="538" font-size="15" fill="#374151" font-weight="400" text-anchor="start">convention): &#x27;Order 2 · on the way · about 19:15&#x27;.</text>
</svg>
