<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1100" width="1920" height="1100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 11: pizzerias and menus</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1100" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">11 · Pizzerias and menus (organiser)</text>
<rect x="24" y="70" width="1400" height="1000" rx="12" fill="#f6f7fb" stroke="#e5e7eb" stroke-width="1.5"/><rect x="24" y="70" width="1400" height="52" rx="12" fill="#111827"/><rect x="24" y="110" width="1400" height="12" rx="0" fill="#111827"/><rect x="42" y="82" width="28" height="28" rx="7" fill="#3ddcff"/><text x="56" y="101" font-size="12" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="80" y="102" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">Demo Event</text><text x="234" y="102" font-size="15" fill="#d1d5db" font-weight="500" text-anchor="start">Event ▾</text><text x="1404" y="102" font-size="14" fill="#d1d5db" font-weight="500" text-anchor="end">Health ok · Crew Member ▾</text><text x="52" y="162" font-size="24" fill="#111827" font-weight="700" text-anchor="start">Food</text><text x="92.0" y="202" font-size="15" fill="#6b7280" font-weight="500" text-anchor="middle">Orders</text><text x="240.5" y="202" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">Pizzerias and menus</text><rect x="142" y="210" width="197" height="3" rx="0" fill="#2563eb"/><text x="416.0" y="202" font-size="15" fill="#6b7280" font-weight="500" text-anchor="middle">Daily record</text><text x="542.0" y="202" font-size="15" fill="#6b7280" font-weight="500" text-anchor="middle">Settings</text><rect x="52" y="213" width="1344" height="1" rx="0" fill="#e5e7eb"/><g transform="translate(0,50)"><text x="52" y="186" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">PIZZERIAS</text><rect x="48" y="200" width="300" height="60" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="66" y="226" font-size="16" fill="#111827" font-weight="700" text-anchor="start">Demo Pizzeria</text><text x="66" y="247" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Delivers · 24 items · own pizza</text><rect x="48" y="270" width="300" height="60" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/><text x="66" y="296" font-size="16" fill="#111827" font-weight="700" text-anchor="start">Demo Trattoria</text><text x="66" y="317" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Delivers · 18 items · own pizza</text><rect x="48" y="340" width="300" height="60" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="66" y="366" font-size="16" fill="#111827" font-weight="700" text-anchor="start">Demo Corner Grill</text><text x="66" y="387" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Takeaway · 12 items</text><rect x="48" y="420" width="300" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="198.0" y="443.0" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">+ Add a pizzeria</text><text x="52" y="490" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Loaded from the event profile</text><text x="52" y="508" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">(TG12: per event, from the event</text><text x="52" y="526" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">repo) and copied by</text><text x="52" y="544" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">clone-the-last-event; edited here</text><text x="52" y="562" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">after that.</text><rect x="372" y="170" width="1030" height="820" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="396" y="206" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">NAME</text><rect x="396" y="214" width="300" height="38" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="408" y="239" font-size="15" fill="#111827" font-weight="400" text-anchor="start">Demo Trattoria</text><text x="726" y="206" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">PHONE (HOLDERS AND CREW ONLY)</text><rect x="726" y="214" width="260" height="38" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="738" y="239" font-size="15" fill="#111827" font-weight="400" text-anchor="start">000 000 0000</text><text x="1016" y="206" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">HOW FOOD COMES</text><rect x="1016" y="224" width="82.48" height="22" rx="11" fill="#2563eb"/><text x="1057.24" y="240" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Delivers</text><rect x="1112" y="224" width="82.48" height="22" rx="11" fill="#f3f4f6"/><text x="1153.24" y="240" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">Takeaway</text><text x="396" y="286" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">OWN PIZZA BASE (EMPTY: NO OWN PIZZA)</text><rect x="396" y="294" width="300" height="38" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="408" y="319" font-size="15" fill="#111827" font-weight="400" text-anchor="start">Own pizza (tomato, cheese)</text><text x="396" y="366" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">MENU · ONE ITEM PER LINE: NUMBER NAME: INGREDIENTS</text><rect x="396" y="374" width="560" height="300" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="410" y="402" font-size="14" fill="#111827" font-weight="400" text-anchor="start">1 Margherita: tomato, cheese</text><text x="410" y="434" font-size="14" fill="#111827" font-weight="400" text-anchor="start">4 Quattro formaggi: four cheeses</text><text x="410" y="466" font-size="14" fill="#111827" font-weight="400" text-anchor="start">7 Funghi: mushroom</text><text x="410" y="498" font-size="14" fill="#111827" font-weight="400" text-anchor="start">12 Kebab: kebab, onion, jalapeño, garlic sauce</text><text x="410" y="530" font-size="14" fill="#111827" font-weight="400" text-anchor="start">14 Kebab special: kebab, feta, olives, chili</text><text x="410" y="562" font-size="14" fill="#111827" font-weight="400" text-anchor="start">20 Vegetariana: mushroom, pepper, olives, onion</text><text x="410" y="594" font-size="14" fill="#111827" font-weight="400" text-anchor="start">31 Kebab calzone: kebab, tomato, cheese</text><text x="410" y="626" font-size="14" fill="#111827" font-weight="400" text-anchor="start">…</text><text x="986" y="366" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start">TOPPINGS FOR OWN PIZZA</text><rect x="986" y="378" width="42.18" height="22" rx="11" fill="#f3f4f6"/><text x="1007.09" y="394" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">ham</text><rect x="1042" y="378" width="90.54" height="22" rx="11" fill="#f3f4f6"/><text x="1087.27" y="394" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">pineapple</text><rect x="1146" y="378" width="82.48" height="22" rx="11" fill="#f3f4f6"/><text x="1187.24" y="394" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">jalapeño</text><rect x="1242" y="378" width="66.36" height="22" rx="11" fill="#f3f4f6"/><text x="1275.18" y="394" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">salami</text><rect x="986" y="410" width="82.48" height="22" rx="11" fill="#f3f4f6"/><text x="1027.24" y="426" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">mushroom</text><rect x="1082" y="410" width="58.300000000000004" height="22" rx="11" fill="#f3f4f6"/><text x="1111.15" y="426" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">onion</text><rect x="1154" y="410" width="66.36" height="22" rx="11" fill="#f3f4f6"/><text x="1187.18" y="426" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">olives</text><rect x="1234" y="410" width="50.24" height="22" rx="11" fill="#f3f4f6"/><text x="1259.12" y="426" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">feta</text><rect x="1298" y="410" width="50.24" height="22" rx="11" fill="#f3f4f6"/><text x="1323.12" y="426" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">tuna</text><rect x="986" y="442" width="74.42" height="22" rx="11" fill="#f3f4f6"/><text x="1023.21" y="458" font-size="13" fill="#374151" font-weight="700" text-anchor="middle">chicken</text><rect x="1074" y="442" width="58.300000000000004" height="22" rx="11" fill="#eef2ff"/><text x="1103.15" y="458" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">+ add</text><rect x="396" y="700" width="990" height="120" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="412" y="728" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Preview of the change</text><text x="412" y="754" font-size="14" fill="#374151" font-weight="400" text-anchor="start">18 items · 2 changed · 1 removed: #9 Seafood is hidden from new orders; past orders keep the name they had.</text><text x="412" y="778" font-size="14" fill="#374151" font-weight="400" text-anchor="start">Toppings: &#x27;tuna&#x27; added. Nothing is lost: an item in an open order keeps its line as ordered.</text><text x="412" y="802" font-size="14" fill="#2563eb" font-weight="600" text-anchor="start">Paste a JSON menu instead · Import from a photo (later, D10)</text><rect x="1256" y="846" width="130" height="36" rx="8" fill="#2563eb"/><text x="1321.0" y="869.0" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">Save menu</text><rect x="1136" y="846" width="110" height="36" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="1191.0" y="869.0" font-size="14" fill="#374151" font-weight="600" text-anchor="middle">Discard</text></g>
<text x="1450" y="110" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Ported with changes</text><text x="1450" y="136" font-size="15" fill="#374151" font-weight="400" text-anchor="start">The legacy admin (P9): name, phone, the</text><text x="1450" y="157" font-size="15" fill="#374151" font-weight="400" text-anchor="start">custom base name, the menu as text or JSON</text><text x="1450" y="178" font-size="15" fill="#374151" font-weight="400" text-anchor="start">with ingredients, the toppings per pizzeria.</text><text x="1450" y="199" font-size="15" fill="#374151" font-weight="400" text-anchor="start">New: delivers or takeaway, and a preview</text><text x="1450" y="220" font-size="15" fill="#374151" font-weight="400" text-anchor="start">before saving.</text>
<text x="1450" y="330" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Snapshots, not live labels</text><text x="1450" y="356" font-size="15" fill="#374151" font-weight="400" text-anchor="start">Legacy problem 16: the history followed live</text><text x="1450" y="377" font-size="15" fill="#374151" font-weight="400" text-anchor="start">menu data. A pizza row keeps its label,</text><text x="1450" y="398" font-size="15" fill="#374151" font-weight="400" text-anchor="start">number and ingredients as ordered, so a</text><text x="1450" y="419" font-size="15" fill="#374151" font-weight="400" text-anchor="start">later menu edit never rewrites a past order</text><text x="1450" y="440" font-size="15" fill="#374151" font-weight="400" text-anchor="start">or the record.</text>
<text x="1450" y="550" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Removing is hiding</text><text x="1450" y="576" font-size="15" fill="#374151" font-weight="400" text-anchor="start">An item that leaves the menu is deactivated</text><text x="1450" y="597" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(the legacy rule), never deleted.</text>
<text x="1450" y="680" font-size="17" fill="#111827" font-weight="700" text-anchor="start">Right</text><text x="1450" y="706" font-size="15" fill="#374151" font-weight="400" text-anchor="start">pizza.menu.write (D5). Prices: not shown</text><text x="1450" y="727" font-size="15" fill="#374151" font-weight="400" text-anchor="start">(D7).</text>
</svg>
