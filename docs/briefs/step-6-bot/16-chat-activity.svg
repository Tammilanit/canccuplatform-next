<text x="1606.0" y="870" font-size="16" fill="#374151" font-weight="600" text-anchor="middle" data-box="1360 1852">C · The first hours: collecting</text>
<text x="32" y="900" font-size="14" fill="#111827" font-weight="400" text-anchor="start" data-box="32 1312">Data: bot.messages.counted and the hourly messages series of GET /api/bot/stats: counts only. No text (the message-content intent stays off), no author, no channel.</text>
<text x="32" y="921" font-size="14" fill="#111827" font-weight="400" text-anchor="start" data-box="32 1312">Busy or quiet compares this hour with the event&#x27;s usual hour so far; the arrow follows the catalogue&#x27;s 10-minute rule. Busy: accent colour, a sweep of light when the count rolls,</text>
<text x="32" y="942" font-size="14" fill="#111827" font-weight="400" text-anchor="start" data-box="32 1312">the chat icon pulses; quiet: muted colours, no motion. Collecting: under three hours of data. Settings: window (12 h, 24 h, the whole event) and bars or area.</text>
<text x="1400" y="930" font-size="14" fill="#111827" font-weight="400" text-anchor="start" data-box="1380 1880">Not built in step 6: drawn for the product owner to see</text>
<text x="1400" y="951" font-size="14" fill="#111827" font-weight="400" text-anchor="start" data-box="1380 1880">first. The feed ships with the bot (#122).</text>
