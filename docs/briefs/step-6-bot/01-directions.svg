<text x="890" y="513" font-size="14" fill="#fff" font-weight="600" text-anchor="middle" data-box="844 936">Check in</text>
<text x="670" y="556" font-size="13" fill="#949ba4" font-weight="400" text-anchor="start" data-box="664 1230">Every page built twice: once on the web, once in Discord</text>
</g>
<text x="652" y="830" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="652 1242">Attendees: never leave Discord; no hub needed.</text>
<text x="652" y="851.75" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="652 1242">Organisers: every flow twice, in pages and in Discord.</text>
<text x="652" y="873.5" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="652 1242">Venue staff: run the night from chat.</text>
<text x="652" y="895.25" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="652 1242">Trade-off: doubles every UI; Discord&#x27;s limits shape</text>
<text x="652" y="917" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="652 1242">the product; against 0022 (screen and hub first).</text>
<text x="652" y="938.75" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="652 1242">Cost: XL.</text>
<text x="1272" y="128" font-size="20" fill="#111827" font-weight="700" text-anchor="start" data-box="1272 1862">C · The living server (recommended)</text>
<text x="1272" y="154" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start" data-box="1272 1862">One message per thing, edited in place</text>
