<text x="1272" y="830" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="1272 1862">Attendees: glance at a channel and know where things are;</text>
<text x="1272" y="851.75" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="1272 1862">one tap to the page that does it.</text>
<text x="1272" y="873.5" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="1272 1862">Organisers: set up in minutes; crew act fast with 3 commands.</text>
<text x="1272" y="895.25" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="1272 1862">Venue staff: the crew channel and DMs, nothing to learn.</text>
<text x="1272" y="917" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="1272 1862">Trade-off: Discord-only people must open a page to act.</text>
<text x="1272" y="938.75" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="1272 1862">Cost: M.</text>
