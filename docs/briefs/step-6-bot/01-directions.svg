<text x="1358" y="580" font-size="12" fill="#949ba4" font-weight="400" text-anchor="start" data-box="1356 1832">One message, edited as the order moves</text>
<text x="1290" y="624" font-size="13" fill="#949ba4" font-weight="400" text-anchor="start" data-box="1284 1850">Two messages tell the whole story; nothing scrolls away</text>
