<text x="102" y="518" font-size="15" fill="#f2f3f5" font-weight="600" text-anchor="start" data-box="44 610">Demo Bot</text>
<rect x="178.8" y="506" width="34" height="16" rx="3" fill="#5865f2"/>
<text x="195.8" y="518" font-size="10" fill="#fff" font-weight="700" text-anchor="middle" data-box="178.8 212.8">APP</text>
<text x="220.8" y="518" font-size="12" fill="#949ba4" font-weight="400" text-anchor="start" data-box="44 610">20:13</text>
<text x="102" y="542" font-size="14.5" fill="#dbdee1" font-weight="400" text-anchor="start" data-box="44 610">Order 3 from Demo Pizzeria is open.</text>
<text x="50" y="578" font-size="13" fill="#949ba4" font-weight="400" text-anchor="start" data-box="44 610">… five posts for two orders; the channel scrolls away</text>
</g>
<text x="32" y="830" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="32 622">Attendees: familiar, but noisy; the channel is a log.</text>
<text x="32" y="851.75" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="32 622">Organisers: the legacy commands, now on any server.</text>
<text x="32" y="873.5" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="32 622">Venue staff: nothing new.</text>
<text x="32" y="895.25" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="32 622">Trade-off: cheapest; keeps every legacy weak spot</text>
<text x="32" y="917" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="32 622">(new posts per change, admin by role name fixed).</text>
<text x="32" y="938.75" font-size="15" fill="#111827" font-weight="400" text-anchor="start" data-box="32 622">Cost: M (the pool and per-guild commands are M alone).</text>
<text x="652" y="128" font-size="20" fill="#111827" font-weight="700" text-anchor="start" data-box="652 1242">B · Discord first</text>
<text x="652" y="154" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start" data-box="652 1242">Order, register and run the event inside Discord</text>
