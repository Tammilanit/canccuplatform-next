<text x="102" y="278" font-size="14.5" fill="#dbdee1" font-weight="400" text-anchor="start" data-box="44 610">Order 2 from Demo Trattoria is open. Add yours!</text>
<circle cx="68" cy="324" r="18" fill="#5865f2"/>
