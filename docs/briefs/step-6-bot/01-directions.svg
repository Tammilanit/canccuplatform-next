<text x="195.8" y="320" font-size="10" fill="#fff" font-weight="700" text-anchor="middle" data-box="178.8 212.8">APP</text>
<text x="220.8" y="320" font-size="12" fill="#949ba4" font-weight="400" text-anchor="start" data-box="44 610">19:58</text>
<text x="102" y="344" font-size="14.5" fill="#dbdee1" font-weight="400" text-anchor="start" data-box="44 610">Last call for order 2: closes in 10 minutes.</text>
