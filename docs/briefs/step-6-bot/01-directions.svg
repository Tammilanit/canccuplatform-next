<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1060" width="1900" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>01 · Three directions: the same Saturday 20:00 in the event&#x27;s Discord server</title>
<defs><clipPath id="c1"><rect x="32" y="170" width="590" height="620" rx="10"/></clipPath><clipPath id="c2"><rect x="652" y="170" width="590" height="620" rx="10"/></clipPath><clipPath id="c3"><rect x="1272" y="170" width="590" height="620" rx="10"/></clipPath></defs>
<rect x="0" y="0" width="1900" height="1060" rx="0" fill="#f3f4f6"/>
<text x="32" y="48" font-size="30" fill="#111827" font-weight="700" text-anchor="start" data-box="0 1900">01 · Three directions: the same Saturday 20:00 in the event&#x27;s Discord server</text>
<text x="32" y="80" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start" data-box="0 1900">Use case: the session compares how each direction feels in #food and #announcements while order 2 closes and the crew announces the next match.</text>
<text x="32" y="128" font-size="20" fill="#111827" font-weight="700" text-anchor="start" data-box="32 622">A · The old bot, for many events</text>
<text x="32" y="154" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start" data-box="32 622">A stream of new posts, one per change</text>
<g clip-path="url(#c1)">
<rect x="32" y="170" width="590" height="620" rx="0" fill="#313338"/>
<line x1="32" y1="218" x2="622" y2="218" stroke="#1f2023" stroke-width="1"/>
