<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1030" width="1900" height="1030" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>10 · Living messages: one per thing, edited in place</title>
