<text x="32" y="80" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start" data-box="0 1900">Use case: anyone glancing at # now-and-next or # food knows the state of the event without scrolling; the bot edits its own pinned messages from events (#123).</text>
