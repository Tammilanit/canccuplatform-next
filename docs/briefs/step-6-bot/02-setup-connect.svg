<text x="296" y="114" font-size="26" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="296 1240">Discord</text>
<text x="296" y="136" font-size="13.5" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="296 1240">Connect your event&#x27;s Discord server. About five minutes.</text>
<rect x="296" y="160" width="161.6" height="34" rx="17" fill="#1e4158" stroke="#2a7b96" stroke-width="1"/>
<text x="376.8" y="182" font-size="13.5" fill="#7be7ff" font-weight="600" text-anchor="middle" data-box="300 453.6">1 Choose the bot</text>
<rect x="469.6" y="160" width="214.8" height="34" rx="17" fill="none" stroke="#616788" stroke-width="1"/>
<text x="577" y="182" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="middle" data-box="473.6 680.4">2 Add it to your server</text>
<rect x="696.4" y="160" width="192" height="34" rx="17" fill="none" stroke="#616788" stroke-width="1"/>
<text x="792.4" y="182" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="middle" data-box="700.4 884.4">3 Channels and roles</text>
<rect x="900.4" y="160" width="93.2" height="34" rx="17" fill="none" stroke="#616788" stroke-width="1"/>
<text x="947" y="182" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="middle" data-box="904.4 989.6">4 Check</text>
<text x="296" y="236" font-size="18" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="296 1240">Which bot speaks for Demo Event?</text>
<rect x="296" y="256" width="464" height="170" rx="12" fill="#161a2e" stroke="#3ddcff" stroke-width="2"/>
<circle cx="326" cy="286" r="9" fill="none" stroke="#3ddcff" stroke-width="2"/>
<circle cx="326" cy="286" r="4.5" fill="#3ddcff"/>
<text x="346" y="291" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="312 744">The platform&#x27;s bot (recommended)</text>
<text x="346" y="322" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="346 740">Ready now: nothing to create.</text>
<text x="346" y="346" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="346 740">Named Demo Event in your server.</text>
<text x="346" y="370" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="346 740">Shares Discord&#x27;s limits with other events.</text>
<rect x="776" y="256" width="464" height="170" rx="12" fill="#161a2e" stroke="#3c446c" stroke-width="1"/>
<circle cx="806" cy="286" r="9" fill="none" stroke="#616788" stroke-width="2"/>
<text x="826" y="291" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="792 1224">Your own Discord application</text>
<text x="826" y="322" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="826 1220">Your own name and picture.</text>
<text x="826" y="346" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="826 1220">Paste its bot token and client secret.</text>
<text x="826" y="370" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="826 1220">Its own limits; an outage stays yours.</text>
<text x="296" y="466" font-size="18" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="296 1240">Step 2 · Add it to your server</text>
<text x="296" y="494" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="296 1240">Discord opens and asks which server. You need Manage Server there; the bot gets only the permissions</text>
<text x="296" y="516" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="296 1240">your features need (step 4 lists them). You come back here when it is done.</text>
<rect x="296" y="546" width="170" height="36" rx="8" fill="#3ddcff"/>
<text x="381" y="568.9" font-size="14" fill="#0b0d1a" font-weight="600" text-anchor="middle" data-box="300 462">Add to Discord</text>
<rect x="478" y="546" width="190" height="36" rx="8" fill="none" stroke="#616788" stroke-width="1"/>
<text x="573" y="568.9" font-size="14" fill="#c5cae3" font-weight="600" text-anchor="middle" data-box="482 664">I have no server yet</text>
<rect x="296" y="610" width="944" height="120" rx="12" fill="#161a2e" stroke="#3c446c" stroke-width="1"/>
<text x="312" y="640" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="312 1224">What the bot will do in your server</text>
<text x="312" y="666" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="312 1224">Post announcements, the run of show and food updates in the channels you pick · edit its own posts</text>
<text x="312" y="690" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="312 1224">Send DMs people chose · create match voice channels (tournament, later) · count who is online (no names stored)</text>
