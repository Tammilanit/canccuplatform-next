<text x="32" y="80" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start" data-box="0 1900">Use case: an event admin connects the event&#x27;s Discord server for the first time, from the Discord page, in a few minutes (#124, bot.md Binding a guild).</text>
