<text x="1410" y="696" font-size="16" fill="#374151" font-weight="600" text-anchor="middle" data-box="960 1860">B · # photos: the message menu, then the private answer</text>
<text x="960" y="740" font-size="14.5" fill="#111827" font-weight="400" text-anchor="start" data-box="960 1860">· Only a person with the Photos right sees it work; others get a private “you need the Photos right”.</text>
<text x="960" y="761.025" font-size="14.5" fill="#111827" font-weight="400" text-anchor="start" data-box="960 1860">· The picture goes through Screen&#x27;s photo API: checked by content, scaled, EXIF dropped, counted in the quota.</text>
<text x="960" y="782.05" font-size="14.5" fill="#111827" font-weight="400" text-anchor="start" data-box="960 1860">· The author&#x27;s platform name shows on the wall, never a Discord name; the wall is off unless the event turns it on.</text>
<text x="960" y="803.075" font-size="14.5" fill="#111827" font-weight="400" text-anchor="start" data-box="960 1860">· A photo removed in Discord leaves the wall too (the message id is the photo&#x27;s source_ref).</text>
</svg>
