<text x="312" y="570" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="312 1224">The rules</text>
<text x="312" y="598" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="312 1224">· By role id: renaming a role in Discord changes nothing; someone making a new role called Crew gets nothing.</text>
<text x="312" y="622" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="312 1224">· The event-admin role and the role-only rights (admins, lifecycle, access) never come from Discord.</text>
<text x="312" y="646" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="312 1224">· Removing the role in Discord removes the rights within a minute; rights granted by hand in People stay apart.</text>
<text x="312" y="670" font-size="13.5" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="312 1224">· Every change of a mapping is audited; every grant or loss through a role is in the person&#x27;s history.</text>
