<text x="60" y="776" font-size="17" fill="#111827" font-weight="400" text-anchor="start" data-box="60 716">One place for every setting; nothing moves.</text>
<text x="60" y="820" font-size="12" fill="#6b7280" font-weight="700" text-anchor="start" data-box="60 736" letter-spacing="1.2">FOR CREW</text>
<text x="60" y="846" font-size="17" fill="#111827" font-weight="400" text-anchor="start" data-box="60 716">A links page; today is one link among many.</text>
