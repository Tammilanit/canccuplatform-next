<text x="32" y="48" font-size="30" fill="#111827" font-weight="700" text-anchor="start" data-box="32 2208">01 · Three directions for admin</text>
<text x="32" y="80" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start" data-box="32 2208">What admin is when you open it, where settings live, and how parts are switched on and off, three ways.</text>
<text x="32" y="108" font-size="17" fill="#374151" font-weight="600" text-anchor="start" data-box="32 2208">Use case: the session picks a direction; B is the base the product owner and the lead agreed on 2026-11-22</text>
