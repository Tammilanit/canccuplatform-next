<text x="612" y="200" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start" data-box="612 1104">Food</text>
<rect x="612" y="226" width="464" height="270" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1"/>
<text x="844" y="310" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="middle" data-box="612 1076">Food is off for this event</text>
<text x="844" y="340" font-size="13.5" fill="#a9b1d6" font-weight="400" text-anchor="middle" data-box="612 1076">Its orders, menus and settings are kept.</text>
<text x="844" y="360" font-size="13.5" fill="#a9b1d6" font-weight="400" text-anchor="middle" data-box="612 1076">Attendees see that food is not served here.</text>
