<text x="844" y="410.68" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle" data-box="754 934">Switch Food on</text>
<text x="844" y="462" font-size="13.5" fill="#7be7ff" font-weight="600" text-anchor="middle" data-box="612 1076">Modules →</text>
</g>
<text x="844" y="580" font-size="15" fill="#374151" font-weight="600" text-anchor="middle" data-box="584 1104">2 · A part switched off, opened by an organiser (U4)</text>
<g clip-path="url(#c3)">
