<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2240 1130" width="2240" height="1130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Mockup 11: States</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><clipPath id="c1"><rect x="32" y="150" width="520" height="400" rx="12"/></clipPath><clipPath id="c2"><rect x="584" y="150" width="520" height="400" rx="12"/></clipPath><clipPath id="c3"><rect x="1136" y="150" width="520" height="400" rx="12"/></clipPath><clipPath id="c4"><rect x="1688" y="150" width="520" height="400" rx="12"/></clipPath><clipPath id="c5"><rect x="32" y="630" width="520" height="400" rx="12"/></clipPath><clipPath id="c6"><rect x="584" y="630" width="520" height="400" rx="12"/></clipPath><clipPath id="c7"><rect x="1136" y="630" width="520" height="400" rx="12"/></clipPath><clipPath id="c8"><rect x="1688" y="630" width="520" height="400" rx="12"/></clipPath></defs>
<rect x="0" y="0" width="2240" height="1130" rx="0" fill="#f3f4f6"/>
<text x="32" y="48" font-size="30" fill="#111827" font-weight="700" text-anchor="start" data-box="32 2208">11 · States</text>
<text x="32" y="80" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start" data-box="32 2208">Eight edge states at card size: empty, off, down, nothing to do, a clash, a refusal, loading and no role.</text>
<text x="32" y="108" font-size="17" fill="#374151" font-weight="600" text-anchor="start" data-box="32 2208">Use case: whatever goes wrong or is not there yet, the page says what it means and what to do next</text>
<g clip-path="url(#c1)">
