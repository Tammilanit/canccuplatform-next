<text x="60" y="200" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start" data-box="60 552">Control center</text>
<rect x="60" y="226" width="464" height="270" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="264" y="260" width="56" height="56" rx="14" fill="#1f2440" stroke="#616788" stroke-width="1"/>
<text x="292" y="354" font-size="18" fill="#f3f5ff" font-weight="700" text-anchor="middle" data-box="60 524">Nothing on the run of show yet</text>
<text x="292" y="380" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="middle" data-box="60 524">Add the doors, meals and the tournament; the rest follows.</text>
<rect x="182" y="404" width="220" height="32" rx="8" fill="#3b82f6"/>
<text x="292" y="424.68" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle" data-box="182 402">Set up the run of show</text>
<text x="292" y="472" font-size="13.5" fill="#7be7ff" font-weight="600" text-anchor="middle" data-box="60 524">Or start from the demo event</text>
</g>
<text x="292" y="580" font-size="15" fill="#374151" font-weight="600" text-anchor="middle" data-box="32 552">1 · A new event: the empty state teaches (E6)</text>
<g clip-path="url(#c2)">
