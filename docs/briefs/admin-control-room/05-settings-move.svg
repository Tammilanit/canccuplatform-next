<text x="32" y="48" font-size="30" fill="#111827" font-weight="700" text-anchor="start" data-box="32 2208">05 · Where settings live</text>
<text x="32" y="80" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start" data-box="32 2208">Today every module’s settings sit on one admin page. They move to a Settings tab on each module’s own page; admin keeps only the event basics.</text>
<text x="32" y="108" font-size="17" fill="#374151" font-weight="600" text-anchor="start" data-box="32 2208">Use case: an organiser who wants to change how Food works opens Food, not admin; whoever changes the event’s dates opens Event basics</text>
<text x="40" y="160" font-size="13" fill="#6b7280" font-weight="700" text-anchor="start" data-box="40 640" letter-spacing="1.4">TODAY</text>
<text x="40" y="190" font-size="22" fill="#111827" font-weight="700" text-anchor="start" data-box="40 680">Admin → Settings: one page, every module</text>
