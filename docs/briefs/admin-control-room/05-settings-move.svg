<text x="64" y="934" font-size="18" fill="#111827" font-weight="700" text-anchor="start" data-box="64 640">What does not move</text>
<text x="64" y="974" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="64 834">• The values: still kept by admin, per event, with the same version check.</text>
<text x="854" y="974" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="854 1624">• Who may change them: organisers, as today. A crew lead’s own right is a later choice.</text>
<text x="64" y="1008" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="64 834">• Profiles: saving and loading an event carries every module’s settings as before.</text>
<text x="854" y="1008" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="854 1624">• Old bookmarks: the old settings address of a module opens its new tab.</text>
<text x="1680" y="160" font-size="13" fill="#6b7280" font-weight="700" text-anchor="start" data-box="1680 2200" letter-spacing="1.4">THE TAB IN PLACE</text>
