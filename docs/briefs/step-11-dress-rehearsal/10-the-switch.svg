<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1100" width="1920" height="1100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 10: The switch: what is renamed, archived, re-pointed and kept (superadmin, lead, everyone)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.0" y="0.0" width="1920.0" height="1100.0" rx="0" fill="#e5e7eb"/>
<text x="32.0" y="50.0" font-size="30" fill="#111827" font-weight="700" text-anchor="start" data-maxw="1856">10 · The switch: what is renamed, archived, re-pointed and kept (superadmin, lead, everyone)</text>
<text x="32.0" y="84.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">Use case: after the first event has run on the platform, the lead retires the legacy in one quiet window: the legacy repos get the -legacy suffix and are archived, this repo takes the name canccuplatform, and every place that</text>
<text x="32.0" y="110.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">names the old path follows.</text>
<text x="32.0" y="166.0" font-size="18" fill="#111827" font-weight="700" text-anchor="start" data-maxw="1100">Before → after</text>
<rect x="32.0" y="182.0" width="1180.0" height="720.0" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="64.0" y="214.0" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="284">WHAT</text>
<text x="364.0" y="214.0" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="364">BEFORE</text>
<text x="744.0" y="214.0" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="444">AFTER</text>
<line x1="52.0" y1="224.0" x2="1192.0" y2="224.0" stroke="#334155" stroke-width="1"/>
<text x="64.0" y="254.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="282">This repo</text>
<text x="364.0" y="254.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="362">canccuplatform-next</text>
<text x="744.0" y="254.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="442">canccuplatform (the old URL redirects)</text>
<line x1="52.0" y1="274.0" x2="1192.0" y2="274.0" stroke="#334155" stroke-width="1"/>
<text x="64.0" y="304.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="282">Legacy system repo</text>
<text x="364.0" y="304.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="362">canccuplatform</text>
<text x="744.0" y="304.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="442">canccuplatform-legacy, archived</text>
<line x1="52.0" y1="324.0" x2="1192.0" y2="324.0" stroke="#334155" stroke-width="1"/>
<text x="64.0" y="354.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="282">Legacy bot</text>
<text x="364.0" y="354.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="362">canccubot</text>
<text x="744.0" y="354.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="442">canccubot-legacy, archived</text>
<line x1="52.0" y1="374.0" x2="1192.0" y2="374.0" stroke="#334155" stroke-width="1"/>
<text x="64.0" y="404.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="282">Legacy screens</text>
<text x="364.0" y="404.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="362">canccusignage</text>
<text x="744.0" y="404.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="442">canccusignage-legacy, archived</text>
<line x1="52.0" y1="424.0" x2="1192.0" y2="424.0" stroke="#334155" stroke-width="1"/>
<text x="64.0" y="454.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="282">Legacy manager</text>
<text x="364.0" y="454.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="362">canccumanager</text>
<text x="744.0" y="454.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="442">canccumanager-legacy, archived</text>
<line x1="52.0" y1="474.0" x2="1192.0" y2="474.0" stroke="#334155" stroke-width="1"/>
<text x="64.0" y="504.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="282">Legacy plans</text>
<text x="364.0" y="504.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="362">canccudocs</text>
<text x="744.0" y="504.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="442">canccudocs-legacy, archived</text>
<line x1="52.0" y1="524.0" x2="1192.0" y2="524.0" stroke="#334155" stroke-width="1"/>
<text x="64.0" y="554.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="282">Legacy streaming</text>
<text x="364.0" y="554.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="362">canccustream</text>
<text x="744.0" y="554.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="442">canccustream-legacy, archived</text>
<line x1="52.0" y1="574.0" x2="1192.0" y2="574.0" stroke="#334155" stroke-width="1"/>
<text x="64.0" y="604.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="282">Module images</text>
<text x="364.0" y="604.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="362">.../canccuplatform-next/&lt;module&gt;</text>
<text x="744.0" y="604.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="442">.../canccuplatform/&lt;module&gt;; v1.0.0 pushed again</text>
<line x1="52.0" y1="624.0" x2="1192.0" y2="624.0" stroke="#334155" stroke-width="1"/>
<text x="64.0" y="654.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="282">VM and laptop checkouts</text>
<text x="364.0" y="654.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="362">remote: canccuplatform-next</text>
<text x="744.0" y="654.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="442">remote: canccuplatform; deploy finds the new images</text>
<line x1="52.0" y1="674.0" x2="1192.0" y2="674.0" stroke="#334155" stroke-width="1"/>
<text x="64.0" y="704.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="282">Docs and checks</text>
<text x="364.0" y="704.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="362">README, AGENTS.md, 0017, a self-test</text>
<text x="744.0" y="704.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="442">the new name; history and old briefs stay as written</text>
<line x1="52.0" y1="724.0" x2="1192.0" y2="724.0" stroke="#334155" stroke-width="1"/>
<text x="52.0" y="758.0" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="300">KEPT AS THEY ARE</text>
<circle cx="58.0" cy="777.0" r="3" fill="#22c55e"/>
<text x="72.0" y="782.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="1110">The signup site: registration stays outside (0005); only its pizza and tournament links change (D8).</text>
<circle cx="58.0" cy="803.0" r="3" fill="#22c55e"/>
<text x="72.0" y="808.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="1110">The mini tourney: the independent off-LAN app the finals module shares a library with (0025).</text>
<circle cx="58.0" cy="829.0" r="3" fill="#22c55e"/>
<text x="72.0" y="834.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="1110">The private event repo: it gains platform.version and the rehearsal report (D9).</text>
<text x="1244.0" y="166.0" font-size="18" fill="#111827" font-weight="700" text-anchor="start" data-maxw="644">The order, in one quiet window</text>
<rect x="1244.0" y="182.0" width="644.0" height="720.0" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<circle cx="1276.0" cy="218.0" r="14" fill="#3b82f6"/>
<text x="1276.0" y="223.0" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle" data-maxw="20">1</text>
<text x="1302.0" y="223.0" font-size="14.5" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="564">No package run open; the dispatcher paused (E8).</text>
<circle cx="1276.0" cy="263.0" r="14" fill="#3b82f6"/>
<text x="1276.0" y="268.0" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle" data-maxw="20">2</text>
<text x="1302.0" y="268.0" font-size="14.5" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="564">Rename the legacy canccuplatform to canccuplatform-legacy first: it frees the</text>
<text x="1302.0" y="288.0" font-size="14.5" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="564">name.</text>
<circle cx="1276.0" cy="328.0" r="14" fill="#3b82f6"/>
<text x="1276.0" y="333.0" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle" data-maxw="20">3</text>
<text x="1302.0" y="333.0" font-size="14.5" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="564">Rename this repo to canccuplatform; GitHub redirects the old URL.</text>
<circle cx="1276.0" cy="373.0" r="14" fill="#3b82f6"/>
<text x="1276.0" y="378.0" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle" data-maxw="20">4</text>
<text x="1302.0" y="378.0" font-size="14.5" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="564">Push the pinned release's images under the new path; install from it on the fallback</text>
<text x="1302.0" y="398.0" font-size="14.5" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="564">laptop (E9).</text>
<circle cx="1276.0" cy="438.0" r="14" fill="#3b82f6"/>
<text x="1276.0" y="443.0" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle" data-maxw="20">5</text>
<text x="1302.0" y="443.0" font-size="14.5" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="564">Re-point the VM's and the laptop's remotes; one deploy run proves the path.</text>
<circle cx="1276.0" cy="483.0" r="14" fill="#3b82f6"/>
<text x="1276.0" y="488.0" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle" data-maxw="20">6</text>
<text x="1302.0" y="488.0" font-size="14.5" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="564">Rename and archive the other legacy repos; their open issues are closed with a</text>
<text x="1302.0" y="508.0" font-size="14.5" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="564">pointer.</text>
<circle cx="1276.0" cy="548.0" r="14" fill="#3b82f6"/>
<text x="1276.0" y="553.0" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle" data-maxw="20">7</text>
<text x="1302.0" y="553.0" font-size="14.5" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="564">One PR sweeps the name in docs and checks (high: AGENTS.md, .github).</text>
<circle cx="1276.0" cy="593.0" r="14" fill="#3b82f6"/>
<text x="1276.0" y="598.0" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle" data-maxw="20">8</text>
<text x="1302.0" y="598.0" font-size="14.5" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="564">The checkpoint: the maintainer sees the step summary; the roadmap marks the</text>
<text x="1302.0" y="618.0" font-size="14.5" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="564">switch done.</text>
<text x="32.0" y="940.0" font-size="18" fill="#111827" font-weight="700" text-anchor="start" data-maxw="1856">Who meets what</text>
<rect x="32.0" y="956.0" width="358.4" height="120.0" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="50.0" y="986.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="start" data-maxw="322">Attendees</text>
<text x="50.0" y="1012.0" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="322">Nothing to do: the hub's address is the same; old</text>
<text x="50.0" y="1031.0" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="322">pizza and tournament links lead to the hub.</text>
<rect x="406.4" y="956.0" width="358.4" height="120.0" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="424.4" y="986.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="start" data-maxw="322">Organisers</text>
<text x="424.4" y="1012.0" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="322">Nothing changes in admin; the event repo's remote</text>
<text x="424.4" y="1031.0" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="322">changes once.</text>
<rect x="780.8" y="956.0" width="358.4" height="120.0" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="798.8" y="986.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="start" data-maxw="322">Venue crew</text>
<text x="798.8" y="1012.0" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="322">Nothing: screens were paired to the platform</text>
<text x="798.8" y="1031.0" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="322">before the event.</text>
<rect x="1155.2" y="956.0" width="358.4" height="120.0" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="1173.2" y="986.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="start" data-maxw="322">Superadmin</text>
<text x="1173.2" y="1012.0" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="322">Two remotes and one image path; a deploy run</text>
<text x="1173.2" y="1031.0" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="322">checks them.</text>
<rect x="1529.6" y="956.0" width="358.4" height="120.0" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="1547.6" y="986.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="start" data-maxw="322">Contributors</text>
<text x="1547.6" y="1012.0" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="322">New clone URL (old one redirects); open</text>
<text x="1547.6" y="1031.0" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="322">worktrees re-point their remote.</text>
</svg>
