<rect x="1544.0" y="214.0" width="60.4" height="24.0" rx="12.0" fill="#14532d"/>
<text x="1574.2" y="229.0" font-size="13" fill="#86efac" font-weight="700" text-anchor="middle" data-maxw="50">tested</text>
<text x="1424.0" y="270.0" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="444">Your event runs on v1.0.0, the release your dress rehearsal</text>
<text x="1424.0" y="290.0" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="444">passed. The platform will not update during your event; the next</text>
<text x="1424.0" y="310.0" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="444">update waits until it is archived.</text>
<line x1="1424.0" y1="336.0" x2="1868.0" y2="336.0" stroke="#334155" stroke-width="1"/>
<text x="1424.0" y="362.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="444">The event repo says: platform.version v1.0.0</text>
<text x="1424.0" y="392.0" font-size="14" fill="#3b82f6" font-weight="600" text-anchor="start" data-maxw="444">What changed since your last event ›</text>
<text x="1404.0" y="564.0" font-size="18" fill="#111827" font-weight="700" text-anchor="start" data-maxw="484">When the pins do not match</text>
<rect x="1404.0" y="580.0" width="484.0" height="200.0" rx="12" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
<text x="1424.0" y="618.0" font-size="18" fill="#f8fafc" font-weight="700" text-anchor="start" data-maxw="444">Go live is held</text>
<text x="1424.0" y="646.0" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="444">Demo Autumn Event pins v1.0.0 but the stack runs v1.0.1. Rehearse</text>
<text x="1424.0" y="666.0" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="444">the changed scenarios on v1.0.1 and pin it, or ask the superadmin</text>
<text x="1424.0" y="686.0" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="444">to return the stack to v1.0.0.</text>
<text x="1404.0" y="814.0" font-size="15" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="484">One stack runs one version (0013); an event "pins" by recording the</text>
<text x="1404.0" y="834.0" font-size="15" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="484">release it tested, and going live checks that the stack runs it (D1).</text>
<text x="1404.0" y="854.0" font-size="15" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="484">Channels come from step 10; the numbering is D3, the hotfix lane D4.</text>
