<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 05: The dress rehearsal at home: what stands in for the venue, and the evening's plan (product owner)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.0" y="0.0" width="1920.0" height="900.0" rx="0" fill="#e5e7eb"/>
<text x="32.0" y="50.0" font-size="30" fill="#111827" font-weight="700" text-anchor="start" data-maxw="1856">05 · The dress rehearsal at home: what stands in for the venue, and the evening's plan (product owner)</text>
<text x="32.0" y="84.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">Use case: the product owner rehearses the whole event at home on the production stack, with a rehearsal copy of the event, a home "venue", a TV as the projector, two phones, the test Discord server and the fallback</text>
<text x="32.0" y="110.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">laptop; the lead is on call.</text>
<text x="32.0" y="166.0" font-size="18" fill="#111827" font-weight="700" text-anchor="start" data-maxw="1000">The home setup</text>
<rect x="32.0" y="182.0" width="1060.0" height="560.0" rx="14" fill="#d1d5db"/>
<rect x="52.0" y="202.0" width="700.0" height="520.0" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="8 6"/>
<text x="72.0" y="232.0" font-size="13" fill="#4b5563" font-weight="700" text-anchor="start" data-maxw="660">HOME: the rehearsal's "venue" (its address is the venue address of the rehearsal copy)</text>
<rect x="80.0" y="260.0" width="200.0" height="110.0" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
<text x="180.0" y="290.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" data-maxw="180">TV as projector</text>
<text x="180.0" y="312.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">a laptop's browser on</text>
<text x="180.0" y="330.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">/screen/, paired as Main</text>
<text x="180.0" y="348.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">hall</text>
<rect x="300.0" y="260.0" width="200.0" height="110.0" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
<text x="400.0" y="290.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" data-maxw="180">Attendee phone</text>
<text x="400.0" y="312.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">the hub; joins at the home</text>
<text x="400.0" y="330.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">venue</text>
<rect x="520.0" y="260.0" width="200.0" height="110.0" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
<text x="620.0" y="290.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" data-maxw="180">Crew phone</text>
<text x="620.0" y="312.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">admin pages; Go live; the</text>
<text x="620.0" y="330.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">venue-day check</text>
<rect x="80.0" y="430.0" width="200.0" height="110.0" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
<text x="180.0" y="460.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" data-maxw="180">Admin laptop</text>
<text x="180.0" y="482.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">the product owner's</text>
<text x="180.0" y="500.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">organiser pages</text>
<rect x="300.0" y="430.0" width="200.0" height="110.0" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
<text x="400.0" y="460.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" data-maxw="180">Fallback laptop</text>
<text x="400.0" y="482.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">the restore drill from cold</text>
<rect x="520.0" y="430.0" width="200.0" height="110.0" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
<text x="620.0" y="460.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" data-maxw="180">Second screen</text>
<text x="620.0" y="482.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">an old PC or tablet as Lobby</text>
<rect x="300.0" y="590.0" width="200.0" height="100.0" rx="12" fill="#0f172a" stroke="#eab308" stroke-width="2"/>
<text x="400.0" y="620.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" data-maxw="180">Home router</text>
<text x="400.0" y="642.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">the uplink; unplugged in the</text>
<text x="400.0" y="660.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="180">drill</text>
<line x1="180.0" y1="540.0" x2="400.0" y2="590.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="400.0" y1="540.0" x2="400.0" y2="590.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="620.0" y1="540.0" x2="400.0" y2="590.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="400.0" y1="370.0" x2="400.0" y2="430.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="820.0" y="260.0" width="240.0" height="120.0" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
<text x="940.0" y="290.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" data-maxw="220">The VM (production)</text>
<text x="940.0" y="312.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="220">the pinned release v1.0.0, HTTPS,</text>
<text x="940.0" y="330.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="220">the real domain</text>
<rect x="820.0" y="420.0" width="240.0" height="110.0" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
<text x="940.0" y="450.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" data-maxw="220">Test Discord server</text>
<text x="940.0" y="472.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="220">the dev bot in the rehearsal copy</text>
<rect x="820.0" y="570.0" width="240.0" height="120.0" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
<text x="940.0" y="600.0" font-size="16" fill="#f8fafc" font-weight="700" text-anchor="middle" data-maxw="220">The lead, on call</text>
<text x="940.0" y="622.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="220">watches Health and logs; files</text>
<text x="940.0" y="640.0" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle" data-maxw="220">issues; never edits the VM</text>
<line x1="500.0" y1="640.0" x2="786.0" y2="640.0" stroke="#3b82f6" stroke-width="2"/>
<line x1="786.0" y1="640.0" x2="786.0" y2="320.0" stroke="#3b82f6" stroke-width="2"/>
<line x1="786.0" y1="320.0" x2="818.0" y2="320.0" stroke="#3b82f6" stroke-width="2" marker-end="url(#ah)"/>
<text x="520.0" y="632.0" font-size="13" fill="#3b82f6" font-weight="600" text-anchor="start" data-maxw="100">the uplink</text>
<line x1="940.0" y1="380.0" x2="940.0" y2="420.0" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ah)"/>
<text x="1124.0" y="166.0" font-size="18" fill="#111827" font-weight="700" text-anchor="start" data-maxw="760">The rehearsal copy</text>
<rect x="1124.0" y="182.0" width="764.0" height="260.0" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="1146.0" y="216.0" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="start" data-maxw="120">Tenant</text>
<text x="1270.0" y="216.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="600">Demo Event rehearsal (draft → live → deleted)</text>
<text x="1146.0" y="252.0" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="start" data-maxw="120">Made by</text>
<text x="1270.0" y="252.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="600">clone of Demo Event, the event's days moved to this evening</text>
<text x="1146.0" y="288.0" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="start" data-maxw="120">Venue</text>
<text x="1270.0" y="288.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="600">Home, with today's home address</text>
<text x="1146.0" y="324.0" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="start" data-maxw="120">Discord</text>
<text x="1270.0" y="324.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="600">the test server, the dev bot</text>
<text x="1146.0" y="360.0" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="start" data-maxw="120">Release</text>
<text x="1270.0" y="360.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="600">v1.0.0, the one the event pins</text>
<text x="1146.0" y="396.0" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="start" data-maxw="120">Report</text>
<text x="1270.0" y="396.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="600">an issue in the private event repo</text>
<text x="1124.0" y="480.0" font-size="18" fill="#111827" font-weight="700" text-anchor="start" data-maxw="760">The evening (about four hours, then a night)</text>
<rect x="1124.0" y="496.0" width="764.0" height="370.0" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="1146.0" y="534.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">17:30</text>
<text x="1216.0" y="534.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="640">Clone, set the home venue, pair the TV and the second screen</text>
<text x="1146.0" y="568.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">18:00</text>
<text x="1216.0" y="568.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="640">Go live; join from both phones; doors story on the TV</text>
<text x="1146.0" y="602.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">18:20</text>
<text x="1216.0" y="602.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="640">Run of show live edits, an announcement, quiet mode</text>
<text x="1146.0" y="636.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">18:45</text>
<text x="1216.0" y="636.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="640">A pizza order end to end; the food box on the TV</text>
<text x="1146.0" y="670.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">19:15</text>
<text x="1216.0" y="670.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="640">A tournament session: check-in, match called, results</text>
<text x="1146.0" y="704.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">20:00</text>
<text x="1216.0" y="704.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="640">Failure drills: uplink out, module killed, VM reboot</text>
<text x="1146.0" y="738.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">21:00</text>
<text x="1216.0" y="738.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="640">Restore drill on the fallback laptop, timed</text>
<text x="1146.0" y="772.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">22:00</text>
<text x="1216.0" y="772.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="640">Privacy: export and delete as an attendee</text>
<text x="1146.0" y="806.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">22:15</text>
<text x="1216.0" y="806.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="640">Overnight soak starts: screens and stack left running</text>
<text x="1146.0" y="840.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">09:00</text>
<text x="1216.0" y="840.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="640">Soak report; the go-live board's rehearsal gate</text>
<text x="32.0" y="770.0" font-size="15" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1060">Why at home on the production stack: it tests what the event will use (the real domain, HTTPS, sign-in, the uplink, the pinned release), while the venue</text>
<text x="32.0" y="790.0" font-size="15" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1060">stays free. What home cannot test (the venue's network, its projector PCs, the sound system) is the venue-day check (mockup 13). Who takes part is U1,</text>
<text x="32.0" y="810.0" font-size="15" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1060">the copy U2, the home venue U3, the length U9.</text>
</svg>
