<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 960" width="1920" height="960" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 04: Going live: one deliberate step, and what it changes (organiser, superadmin)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.0" y="0.0" width="1920.0" height="960.0" rx="0" fill="#e5e7eb"/>
<text x="32.0" y="50.0" font-size="30" fill="#111827" font-weight="700" text-anchor="start" data-maxw="1856">04 · Going live: one deliberate step, and what it changes (organiser, superadmin)</text>
<text x="32.0" y="84.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">Use case: on the evening the doors open, the organiser goes live from the board; joining opens, the stack holds its deploys, and a deploy that comes anyway is refused with a reason the superadmin can act on.</text>
<rect x="32.0" y="124.0" width="1100.0" height="760.0" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<rect x="32.0" y="124.0" width="1100.0" height="56.0" rx="12" fill="#1e293b"/>
<rect x="32.0" y="168.0" width="1100.0" height="12.0" rx="0" fill="#1e293b"/>
<line x1="32.0" y1="180.0" x2="1132.0" y2="180.0" stroke="#334155" stroke-width="1"/>
<rect x="48.0" y="138.0" width="28.0" height="28.0" rx="7" fill="#3b82f6"/>
<text x="62.0" y="157.0" font-size="12" fill="#0f172a" font-weight="800" text-anchor="middle" data-maxw="26">DE</text>
<text x="86.0" y="158.0" font-size="17" fill="#f8fafc" font-weight="700" text-anchor="start" data-maxw="260">Demo Event</text>
<text x="1114.0" y="158.0" font-size="14" fill="#94a3b8" font-weight="500" text-anchor="end" data-maxw="360">Health ok · Organiser</text>
<rect x="32.0" y="180.0" width="236.0" height="704.0" rx="0" fill="#111a2e"/>
<line x1="268.0" y1="180.0" x2="268.0" y2="884.0" stroke="#334155" stroke-width="1"/>
<text x="52.0" y="216.0" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="206">RUN THE EVENT</text>
<text x="54.0" y="249.0" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start" data-maxw="146">Run of show</text>
<text x="54.0" y="285.0" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start" data-maxw="146">Notifications</text>
<text x="54.0" y="321.0" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start" data-maxw="146">Announcements</text>
<text x="52.0" y="362.0" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="206">SCREENS AND LOOK</text>
<text x="54.0" y="395.0" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start" data-maxw="146">Screen studio</text>
<text x="54.0" y="431.0" font-size="14" fill="#cbd5e1" font-weight="400" text-anchor="start" data-maxw="146">Theme studio</text>
<text x="52.0" y="472.0" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="206">ADMIN</text>
