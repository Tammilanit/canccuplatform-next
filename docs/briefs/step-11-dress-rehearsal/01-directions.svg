<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 01: Three directions for the dress rehearsal and the switch</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.0" y="0.0" width="1920.0" height="900.0" rx="0" fill="#e5e7eb"/>
<text x="32.0" y="50.0" font-size="30" fill="#111827" font-weight="700" text-anchor="start" data-maxw="1856">01 · Three directions for the dress rehearsal and the switch</text>
<text x="32.0" y="84.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">Use case: the session compares three ways to reach the first event on the platform; the same moment in each: one week before the event, the release is chosen and the rehearsal is due.</text>
<rect x="32.0" y="124.0" width="600.0" height="736.0" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="56.0" y="168.0" font-size="24" fill="#f8fafc" font-weight="700" text-anchor="start" data-maxw="400">A · One long evening</text>
<text x="56.0" y="208.0" font-size="17" fill="#cbd5e1" font-weight="600" text-anchor="start" data-maxw="552">A runbook in the repo, one rehearsal by hand, the switch by</text>
<text x="56.0" y="232.0" font-size="17" fill="#cbd5e1" font-weight="600" text-anchor="start" data-maxw="552">hand.</text>
<text x="56.0" y="266.0" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="552">WHO MEETS WHAT</text>
<circle cx="62.0" cy="287.0" r="3" fill="#3b82f6"/>
<text x="76.0" y="292.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Attendees: nothing changes until the day; old links break at the switch.</text>
<circle cx="62.0" cy="316.0" r="3" fill="#3b82f6"/>
<text x="76.0" y="321.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Organisers: follow a long checklist; nothing in admin says whether the</text>
<text x="76.0" y="342.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">event is ready.</text>
<circle cx="62.0" cy="366.0" r="3" fill="#3b82f6"/>
<text x="76.0" y="371.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Venue staff: a printed list for screens and sound.</text>
<circle cx="62.0" cy="395.0" r="3" fill="#3b82f6"/>
<text x="76.0" y="400.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Superadmin: sets the version in deploy/.env by hand; no deploy hold except</text>
<text x="76.0" y="421.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">discipline.</text>
<text x="56.0" y="458.0" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="552">TRADE-OFFS</text>
<circle cx="62.0" cy="479.0" r="3" fill="#f59e0b"/>
<text x="76.0" y="484.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Cheapest; nothing new to build.</text>
<circle cx="62.0" cy="508.0" r="3" fill="#f59e0b"/>
<text x="76.0" y="513.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Done once, forgotten by the next event: readiness lives in one person's</text>
<text x="76.0" y="534.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">head.</text>
<circle cx="62.0" cy="558.0" r="3" fill="#f59e0b"/>
<text x="76.0" y="563.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Rollback triggers and evidence are words, not checks.</text>
<text x="56.0" y="600.0" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="552">THE WEEK BEFORE</text>
<rect x="56.0" y="614.0" width="552.0" height="40.0" rx="8" fill="#1e293b"/>
<text x="72.0" y="640.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">Mon</text>
<text x="132.0" y="640.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="460">copy last time's checklist</text>
<rect x="56.0" y="660.0" width="552.0" height="40.0" rx="8" fill="#1e293b"/>
<text x="72.0" y="686.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">Tue</text>
<text x="132.0" y="686.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="460">rehearse by hand, notes in a chat</text>
<rect x="56.0" y="706.0" width="552.0" height="40.0" rx="8" fill="#1e293b"/>
<text x="72.0" y="732.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">Fri</text>
<text x="132.0" y="732.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="460">edit deploy/.env and hope</text>
<rect x="56.0" y="800.0" width="74.3" height="26.0" rx="13.0" fill="#422006"/>
<text x="93.2" y="817.0" font-size="15" fill="#fde047" font-weight="700" text-anchor="middle" data-maxw="64">Cost: S</text>
<rect x="656.0" y="124.0" width="600.0" height="736.0" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="680.0" y="168.0" font-size="24" fill="#f8fafc" font-weight="700" text-anchor="start" data-maxw="400">B · Rehearsal studio</text>
<text x="680.0" y="208.0" font-size="17" fill="#cbd5e1" font-weight="600" text-anchor="start" data-maxw="552">A simulator: replay the event's run of show at speed, synthetic</text>
<text x="680.0" y="232.0" font-size="17" fill="#cbd5e1" font-weight="600" text-anchor="start" data-maxw="552">crowds, recorded evidence.</text>
<text x="680.0" y="266.0" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="552">WHO MEETS WHAT</text>
<circle cx="686.0" cy="287.0" r="3" fill="#3b82f6"/>
<text x="700.0" y="292.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Attendees: the hub is load-tested with hundreds of fake phones before</text>
<text x="700.0" y="313.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">anyone arrives.</text>
<circle cx="686.0" cy="337.0" r="3" fill="#3b82f6"/>
<text x="700.0" y="342.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Organisers: press play and watch a whole Saturday in an hour.</text>
<circle cx="686.0" cy="366.0" r="3" fill="#3b82f6"/>
<text x="700.0" y="371.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Venue staff: rehearse their part against the simulation.</text>
<circle cx="686.0" cy="395.0" r="3" fill="#3b82f6"/>
<text x="700.0" y="400.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Superadmin: a load report per release.</text>
<text x="680.0" y="437.0" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="552">TRADE-OFFS</text>
<circle cx="686.0" cy="458.0" r="3" fill="#f59e0b"/>
<text x="700.0" y="463.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Most thorough; finds load problems early.</text>
<circle cx="686.0" cy="487.0" r="3" fill="#f59e0b"/>
<text x="700.0" y="492.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Pulls two backlog items of 0022 (a dry run, a load harness): needs the</text>
<text x="700.0" y="513.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">product owner's yes.</text>
<circle cx="686.0" cy="537.0" r="3" fill="#f59e0b"/>
<text x="700.0" y="542.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Weeks of work before the first event; a simulator is software that must</text>
<text x="700.0" y="563.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">itself be right.</text>
<text x="680.0" y="600.0" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="552">THE WEEK BEFORE</text>
<rect x="680.0" y="614.0" width="552.0" height="40.0" rx="8" fill="#1e293b"/>
<text x="696.0" y="640.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">Mon</text>
<text x="756.0" y="640.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="460">load run: 1,000 simulated phones</text>
<rect x="680.0" y="660.0" width="552.0" height="40.0" rx="8" fill="#1e293b"/>
<text x="696.0" y="686.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">Tue</text>
<text x="756.0" y="686.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="460">replay Saturday at ten times speed</text>
<rect x="680.0" y="706.0" width="552.0" height="40.0" rx="8" fill="#1e293b"/>
<text x="696.0" y="732.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">Fri</text>
<text x="756.0" y="732.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="460">go, with a load report</text>
<rect x="680.0" y="800.0" width="103.5" height="26.0" rx="13.0" fill="#172554"/>
<text x="731.8" y="817.0" font-size="15" fill="#93c5fd" font-weight="700" text-anchor="middle" data-maxw="94">Cost: L–XL</text>
<rect x="1280.0" y="124.0" width="600.0" height="736.0" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="3"/>
<text x="1304.0" y="168.0" font-size="24" fill="#f8fafc" font-weight="700" text-anchor="start" data-maxw="400">C · The go-live kit</text>
<rect x="1737.9" y="146.0" width="122.1" height="25.0" rx="12.5" fill="#14532d"/>
<text x="1799.0" y="162.0" font-size="14" fill="#86efac" font-weight="700" text-anchor="middle" data-maxw="112">Recommended</text>
<text x="1304.0" y="208.0" font-size="17" fill="#cbd5e1" font-weight="600" text-anchor="start" data-maxw="552">Releases and pins in the platform, a go-live board, scripted</text>
<text x="1304.0" y="232.0" font-size="17" fill="#cbd5e1" font-weight="600" text-anchor="start" data-maxw="552">drills, a reversible switch.</text>
<text x="1304.0" y="266.0" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="552">WHO MEETS WHAT</text>
<circle cx="1310.0" cy="287.0" r="3" fill="#3b82f6"/>
<text x="1324.0" y="292.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Attendees: one announcement and links that lead to the hub; nothing to install</text>
<text x="1324.0" y="313.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">or learn.</text>
<circle cx="1310.0" cy="337.0" r="3" fill="#3b82f6"/>
<text x="1324.0" y="342.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Organisers: one page says what is ready, who accepted what, and what to</text>
<text x="1324.0" y="363.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">do if it fails.</text>
<circle cx="1310.0" cy="387.0" r="3" fill="#3b82f6"/>
<text x="1324.0" y="392.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Venue staff: a venue-day check on the crew phone (screens, sound, uplink).</text>
<circle cx="1310.0" cy="416.0" r="3" fill="#3b82f6"/>
<text x="1324.0" y="421.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Superadmin: the stack runs a pinned release, deploys hold while an event is</text>
<text x="1324.0" y="442.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">live, hotfixes have a lane.</text>
<text x="1304.0" y="479.0" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="552">TRADE-OFFS</text>
<circle cx="1310.0" cy="500.0" r="3" fill="#f59e0b"/>
<text x="1324.0" y="505.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Every later event reuses it: the second event costs an afternoon.</text>
<circle cx="1310.0" cy="529.0" r="3" fill="#f59e0b"/>
<text x="1324.0" y="534.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">Builds on what steps 8–10 make (clone, alerts, pre-flight, restore,</text>
<text x="1324.0" y="555.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">channels).</text>
<circle cx="1310.0" cy="579.0" r="3" fill="#f59e0b"/>
<text x="1324.0" y="584.0" font-size="15" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="530">No load harness: the large event still needs one later (backlog).</text>
<text x="1304.0" y="621.0" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="start" data-maxw="552">THE WEEK BEFORE</text>
<rect x="1304.0" y="635.0" width="552.0" height="40.0" rx="8" fill="#1e293b"/>
<text x="1320.0" y="661.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">Mon</text>
<text x="1380.0" y="661.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="460">pin v1.0.0; the board turns green</text>
<rect x="1304.0" y="681.0" width="552.0" height="40.0" rx="8" fill="#1e293b"/>
<text x="1320.0" y="707.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">Tue</text>
<text x="1380.0" y="707.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="460">rehearse at home; drills; restore</text>
<rect x="1304.0" y="727.0" width="552.0" height="40.0" rx="8" fill="#1e293b"/>
<text x="1320.0" y="753.0" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="start" data-maxw="60">Wed</text>
<text x="1380.0" y="753.0" font-size="14" fill="#f8fafc" font-weight="400" text-anchor="start" data-maxw="460">cut the bot over; Fri: go live</text>
<rect x="1304.0" y="800.0" width="77.9" height="26.0" rx="13.0" fill="#14532d"/>
<text x="1342.9" y="817.0" font-size="15" fill="#86efac" font-weight="700" text-anchor="middle" data-maxw="68">Cost: M</text>
</svg>
