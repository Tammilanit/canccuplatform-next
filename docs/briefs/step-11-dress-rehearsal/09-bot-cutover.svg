<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" width="1920" height="1000" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 09: Cutting the legacy bot over: stop it, import what it held, hand its token to the event (organiser, superadmin)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.0" y="0.0" width="1920.0" height="1000.0" rx="0" fill="#e5e7eb"/>
<text x="32.0" y="50.0" font-size="30" fill="#111827" font-weight="700" text-anchor="start" data-maxw="1856">09 · Cutting the legacy bot over: stop it, import what it held, hand its token to the event (organiser, superadmin)</text>
<text x="32.0" y="84.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">Use case: a quiet day before the event, an event admin cuts the event's Discord bot over from the legacy bot: the legacy process is stopped first, the import runs as a dry run and then for real, the token is entered once, and</text>
<text x="32.0" y="110.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">the bot is back online in the platform; rolling back is one button.</text>
