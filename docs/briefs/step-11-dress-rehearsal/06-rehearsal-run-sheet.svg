<text x="84.0" y="926.0" font-size="15" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1700">Each scenario is written so anyone could run it again: steps, the expected result, where the evidence goes.</text>
<circle cx="70.0" cy="948.0" r="3" fill="#3b82f6"/>
<text x="84.0" y="953.0" font-size="15" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1700">No silent success: a fail is fixed (and re-run on the patch release) or accepted in writing with a name and a reason (E11, U5).</text>
<circle cx="70.0" cy="975.0" r="3" fill="#3b82f6"/>
<text x="84.0" y="980.0" font-size="15" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1700">Evidence with real names stays in the private event repo; this repo keeps only the generic sheet and a scrubbed summary (D11).</text>
