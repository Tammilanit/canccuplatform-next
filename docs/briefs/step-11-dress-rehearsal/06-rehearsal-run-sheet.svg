<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 06: The rehearsal run sheet: every scenario, what should happen, and the evidence (product owner, lead)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0" fill="#e5e7eb"/>
<text x="32.0" y="50.0" font-size="30" fill="#111827" font-weight="700" text-anchor="start" data-maxw="1856">06 · The rehearsal run sheet: every scenario, what should happen, and the evidence (product owner, lead)</text>
<text x="32.0" y="84.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">Use case: the product owner works down the run sheet during the evening; each scenario has its steps, what should happen and a result with evidence; a fail becomes an issue, then a fix or a written acceptance. A</text>
<text x="32.0" y="110.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">document, generic in this repo and filled in the private event repo, not a page.</text>
