<text x="32.0" y="50.0" font-size="30" fill="#111827" font-weight="700" text-anchor="start" data-maxw="1856">11 · The live window: deploys hold, main keeps moving, a hotfix has its own lane (superadmin, lead)</text>
<text x="32.0" y="84.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">Use case: while an event is live the stack does not follow new releases; main goes on merging (no freeze, 0021), and a fix the event needs travels as a patch of the pinned release, tested on the staging stack and applied by</text>
<text x="32.0" y="110.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">the superadmin with a reason.</text>
