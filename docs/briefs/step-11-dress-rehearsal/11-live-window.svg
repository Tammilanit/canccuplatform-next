<text x="1654.3" y="832.0" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start" data-maxw="218">the same fix merged to main too</text>
<text x="32.0" y="940.0" font-size="15" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">Two events live at once share the hold, and both must pin the release the stack runs (E12); the hold lifts when the last live event is archived (O11). Whether a held deploy waits quietly or opens an issue is O6. The numbering and the branch are D3 and D4; the hold</text>
<text x="32.0" y="960.0" font-size="15" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">itself is D5.</text>
