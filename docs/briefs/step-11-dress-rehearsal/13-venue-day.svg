<text x="32.0" y="84.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">Use case: on the day before doors the venue crew walk the venue with a crew phone: every screen paired and drawing, sound on each zone, the uplink, the venue's address seen; attendees who follow an old link land on a</text>
<text x="32.0" y="110.0" font-size="18" fill="#4b5563" font-weight="400" text-anchor="start" data-maxw="1856">page that sends them to the hub.</text>
