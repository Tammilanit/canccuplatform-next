<rect x="832" y="696" width="298" height="44" rx="6" fill="#161a2e"/>
<text x="842" y="724" font-size="14" fill="#f3f5ff" font-weight="600" text-anchor="start">Countdown · 10 s</text>
<rect x="1132" y="696" width="88" height="44" rx="6" fill="url(#gh)"/>
<text x="1142" y="724" font-size="14" fill="#0b0d1a" font-weight="600" text-anchor="start">Sting · 3 s</text>
<rect x="1222" y="696" width="16" height="44" rx="6" fill="#f3f4f6"/>
<rect x="1240" y="696" width="358" height="44" rx="6" fill="#2f2a52"/>
