<text x="1132" y="764" font-size="13" fill="#111827" font-weight="700" text-anchor="middle">00:00:00</text>
<line x1="1132" y1="690" x2="1132" y2="748" stroke="#111827" stroke-width="2"/>
<text x="1231" y="782" font-size="13" fill="#374151" font-weight="400" text-anchor="middle">0.6 s: out, then in</text>
<text x="832" y="822" font-size="14.5" fill="#374151" font-weight="400" text-anchor="start">The sting starts on the dot: each player counts to the step against the server’s clock,</text>
<text x="832" y="843" font-size="14.5" fill="#374151" font-weight="400" text-anchor="start">so the entrance and the main hall show it in the same second.</text>
<text x="832" y="864" font-size="14.5" fill="#374151" font-weight="400" text-anchor="start">A player that joins late starts at the point the round has reached, not from its first step.</text>
<text x="832" y="885" font-size="14.5" fill="#374151" font-weight="400" text-anchor="start">Full screen hides the screen’s own clock; the countdown is the clock.</text>
</svg>
