<text x="269.6" y="881.5" font-size="12" fill="#111827" font-weight="700" text-anchor="middle">4</text>
<circle cx="1162" cy="162" r="12" fill="#f59e0b"/>
<text x="1162" y="167" font-size="13" fill="#111827" font-weight="700" text-anchor="middle">1</text>
<text x="1184" y="168" font-size="16" fill="#111827" font-weight="600" text-anchor="start">The two numbers that matter (D2)</text>
<text x="1184" y="192" font-size="13.5" fill="#374151" font-weight="400" text-anchor="start">How much data a restore would lose now, and how long the last restore took,</text>
<text x="1184" y="212" font-size="13.5" fill="#374151" font-weight="400" text-anchor="start">against the 30-minute target. The laptop's check is due before every event (U10).</text>
<circle cx="1162" cy="252" r="12" fill="#f59e0b"/>
<text x="1162" y="257" font-size="13" fill="#111827" font-weight="700" text-anchor="middle">2</text>
<text x="1184" y="258" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Backups (#55's, shown here)</text>
<text x="1184" y="282" font-size="13.5" fill="#374151" font-weight="400" text-anchor="start">Each base backup is checked after it is made; 7 daily and 4 weekly are kept,</text>
<text x="1184" y="302" font-size="13.5" fill="#374151" font-weight="400" text-anchor="start">WAL for 7 days (O3). This step only shows and restores them.</text>
<circle cx="1162" cy="342" r="12" fill="#f59e0b"/>
<text x="1162" y="347" font-size="13" fill="#111827" font-weight="700" text-anchor="middle">3</text>
<text x="1184" y="348" font-size="16" fill="#111827" font-weight="600" text-anchor="start">Drills, every week and before each event (O1)</text>
<text x="1184" y="372" font-size="13.5" fill="#374151" font-weight="400" text-anchor="start">CI restores the demo stack every Sunday (O4); the superadmin runs the laptop's</text>
<text x="1184" y="392" font-size="13.5" fill="#374151" font-weight="400" text-anchor="start">check before an event. Each posts its time, data age and result (O2). A drill over</text>
<text x="1184" y="412" font-size="13.5" fill="#374151" font-weight="400" text-anchor="start">target is amber and says so.</text>
<circle cx="1162" cy="452" r="12" fill="#f59e0b"/>
<text x="1162" y="457" font-size="13" fill="#111827" font-weight="700" text-anchor="middle">4</text>
<text x="1184" y="458" font-size="16" fill="#111827" font-weight="600" text-anchor="start">The emergency kit (D3)</text>
<text x="1184" y="482" font-size="13.5" fill="#374151" font-weight="400" text-anchor="start">The secrets key and deploy/.env, never next to the dump; encrypted, two</text>
