<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 05: the install guide per phone</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">05 · Install guide: one page that knows the phone it is on</text>
<g transform="translate(40,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><rect x="10" y="10" width="370" height="824" rx="36" fill="#000000" opacity="0.55"/><rect x="10" y="470" width="370" height="364" rx="24" fill="#161a2e"/><rect x="170" y="480" width="50" height="5" rx="3" fill="#343c66"/><text x="30" y="522" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Install Demo Event</text><text x="30" y="554" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">Add the hub to your home screen: it opens</text><text x="30" y="575" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">like an app, full screen, with alerts.</text><rect x="30" y="610" width="330" height="50" rx="12" fill="#3ddcff"/><text x="195.0" y="641.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Install</text><rect x="30" y="672" width="330" height="50" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="195.0" y="703.0" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="middle">Not now</text></g>
<text x="40" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Android, Chrome</text>
<text x="40" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The browser's own install</text>
<text x="40" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">prompt, offered after the</text>
<text x="40" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">first useful moment (alerts</text>
<text x="40" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">on, or a second visit), never</text>
<text x="40" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">on arrival.</text>
<g transform="translate(420,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ More</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Install</text><text x="26" y="150" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">On iPhone, alerts work only when the</text><text x="26" y="173" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">hub is on your home screen.</text><rect x="26" y="220" width="338" height="64" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><circle cx="54" cy="252" r="14" fill="#3ddcff"/><text x="54" y="258" font-size="14" fill="#0b0d1a" font-weight="800" text-anchor="middle">1</text><text x="80" y="258" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Tap Share  ⬆  in Safari's bar</text><rect x="26" y="294" width="338" height="64" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><circle cx="54" cy="326" r="14" fill="#3ddcff"/><text x="54" y="332" font-size="14" fill="#0b0d1a" font-weight="800" text-anchor="middle">2</text><text x="80" y="332" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Choose Add to Home Screen</text><rect x="26" y="368" width="338" height="64" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><circle cx="54" cy="400" r="14" fill="#3ddcff"/><text x="54" y="406" font-size="14" fill="#0b0d1a" font-weight="800" text-anchor="middle">3</text><text x="80" y="406" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Open Demo Event from your home screen</text><rect x="26" y="442" width="338" height="64" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><circle cx="54" cy="474" r="14" fill="#3ddcff"/><text x="54" y="480" font-size="14" fill="#0b0d1a" font-weight="800" text-anchor="middle">4</text><text x="80" y="480" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Turn on alerts there</text><text x="26" y="546" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Needs iOS 16.4 or later.</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="343.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">More</text></g>
<text x="420" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">iPhone, Safari</text>
<text x="420" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Safari has no install prompt:</text>
<text x="420" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the guide shows the steps with</text>
<text x="420" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the real icons. Until</text>
<text x="420" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">installed, the alerts card</text>
<text x="420" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">shows this guide instead of</text>
<text x="420" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the permission prompt (Q E3).</text>
<g transform="translate(800,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="10" y="10" width="370" height="70" rx="0" fill="#2b2d31"/><text x="195" y="56" font-size="14" fill="#f3f5ff" font-weight="600" text-anchor="middle">Discord · in-app browser</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><rect x="26" y="140" width="338" height="220" rx="16" fill="#161a2e" stroke="#ffc94d" stroke-width="1.5"/><text x="44" y="174" font-size="18" fill="#f3f5ff" font-weight="700" text-anchor="start">Open this in your browser</text><text x="44" y="206" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Discord's built-in browser can't</text><text x="44" y="226" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">install the hub or show alerts.</text><rect x="44" y="258" width="302" height="46" rx="12" fill="#3ddcff"/><text x="195.0" y="287.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Open in browser</text><text x="195" y="336" font-size="14" fill="#3ddcff" font-weight="600" text-anchor="middle">or copy the link</text><rect x="26" y="372" width="338" height="118" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="400" font-size="12" fill="#3ddcff" font-weight="700" text-anchor="start">NOW · MAIN HALL</text><text x="44" y="430" font-size="24" fill="#f3f5ff" font-weight="700" text-anchor="start">Dinner</text><text x="44" y="456" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">18:00 – 19:30 · Food court</text><rect x="44" y="468" width="300" height="6" rx="3" fill="#343c66"/><rect x="44" y="468" width="220" height="6" rx="3" fill="#3ddcff"/><rect x="26" y="502" width="338" height="84" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="528" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">NEXT</text><text x="44" y="554" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">19:40  Demo Game Cup semi-final</text><rect x="276" y="560" width="70" height="22" rx="11" fill="#ffc94d"/><text x="311.0" y="577" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">+10 min</text><text x="44" y="576" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Was 19:30 · Stage</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="800" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Inside Discord's browser</text>
<text x="800" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Links from Discord open in its</text>
<text x="800" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">in-app browser. The hub</text>
<text x="800" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">detects it and says so first;</text>
<text x="800" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">reading still works (Q E4).</text>
<g transform="translate(1180,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><rect x="135" y="260" width="120" height="120" rx="28" fill="#3ddcff"/><text x="195" y="335" font-size="40" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="195" y="430" font-size="24" fill="#f3f5ff" font-weight="700" text-anchor="middle">Demo Event</text><text x="195" y="460" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="middle">Sat 14 – Sun 15 Mar</text></g>
<text x="1180" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Opened from the home screen</text>
<text x="1180" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Icon, name, colours and splash</text>
<text x="1180" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">from the theme: theme_color</text>
<text x="1180" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">from surface, background_color</text>
<text x="1180" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">from background, icons from</text>
<text x="1180" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">images.icon or the logo</text>
<text x="1180" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(theming.md, The phone hub).</text>
<rect x="1540" y="90" width="360" height="300" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1558" y="122" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Desktop and laptop</text>
<text x="1558" y="150" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The hub works in any browser; a laptop</text>
<text x="1558" y="172" font-size="16" fill="#374151" font-weight="400" text-anchor="start">shows the same pages, centred at phone</text>
<text x="1558" y="194" font-size="16" fill="#374151" font-weight="400" text-anchor="start">width.</text>
<text x="1558" y="222" font-size="16" fill="#374151" font-weight="400" text-anchor="start">A 'Get it on your phone' card shows a</text>
<text x="1558" y="244" font-size="16" fill="#374151" font-weight="400" text-anchor="start">QR of the page.</text>
<text x="1558" y="272" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Installing on a desktop is allowed but</text>
<text x="1558" y="294" font-size="16" fill="#374151" font-weight="400" text-anchor="start">never pushed.</text>
<rect x="1540" y="420" width="360" height="110" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1554" y="448" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q U5: when to offer the install (on</text>
<text x="1554" y="470" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">arrival, after the first useful moment,</text>
<text x="1554" y="492" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">never). Q L5: the app's name on the home</text>
<text x="1554" y="514" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">screen.</text>
</svg>
