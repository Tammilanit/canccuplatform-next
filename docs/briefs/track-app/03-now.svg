 y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="40" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Guest</text>
<text x="40" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Public items only, the zone's</text>
<text x="40" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">screen as text (GET</text>
<text x="40" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">/api/screen/now), reactions if</text>
<text x="40" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the event has them on (step 4</text>
<text x="40" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">P4: the App track builds</text>
<text x="40" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">them). Venue facts a guest may</text>
<text x="40" y="858.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">see.</text>
<g transform="translate(420,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><rect x="26" y="118" width="338" height="120" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="146" font-size="12" fill="#b98cff" font-weight="700" text-anchor="start">FOR YOU</text><text x="44" y="174" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Your match · 19:40 · Stage</text><text x="44" y="196" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Team Alpha vs Team Gamma</text><text x="44" y="222" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Pizza: placed 18:20 · about 19:10</text><rect x="26" y="250" width="338" height="118" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="278" font-size="12" fill="#3ddcff" font-weight="700" text-anchor="start">NOW · MAIN HALL</text><text x="44" y="308" font-size="24" fill="#f3f5ff" font-weight="700" text-anchor="start">Dinner</text><text x="44" y="334" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">18:00 – 19:30 · Food court</text><rect x="44" y="346" width="300" height="6" rx="3" fill="#343c66"/><rect x="44" y="346" width="220" height="6" rx="3" fill="#3ddcff"/><rect x="26" y="380" width="338" height="84" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="406" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">NEXT</text><text x="44" y="432" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">19:40  Demo Game Cup semi-final</text><rect x="276" y="438" width="70" height="22" rx="11" fill="#ffc94d"/><text x="311.0" y="455" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">+10 min</text><text x="44" y="454" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Was 19:30 · Stage</text><rect x="26" y="476" width="338" height="92" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="506" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Venue</text><text x="44" y="536" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Wi-Fi DemoNet · password  Show</text><text x="44" y="556" font-size="13" fill="#3ee39a" font-weight="600" text-anchor="start">Checked in 14:02</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="420" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Member (signed in, joined)</text>
<text x="420" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">For you sits on top and shows</text>
<text x="420" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">only what exists: a match from</text>
<text x="420" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the tournament, an order from</text>
<text x="420" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">pizza. A module the event does</text>
<text x="420" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">not run adds nothing.</text>
<text x="420" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Attendee-only items and the</text>
<text x="420" y="858.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">attendee Wi-Fi join in.</text>
<g transform="translate(800,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">02:14</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><rect x="26" y="118" width="338" height="84" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="150" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Quiet hours until 08:00</text><text x="44" y="176" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Alerts wait in your inbox; urgent ones still come</text><rect x="26" y="214" width="338" height="110" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="242" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">NEXT</text><text x="44" y="270" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">09:00  Breakfast</text><text x="44" y="296" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Food court</text><rect x="26" y="336" width="338" height="84" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="366" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">On the big screen</text><text x="44" y="396" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Main hall · calm scene</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="800" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">At night</text>
<text x="800" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The hub mirrors the venue's</text>
<text x="800" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">mood: the quiet-hours item</text>
<text x="800" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">from the run of show (Notify</text>
<text x="800" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">holds pushes), a calm card,</text>
<text x="800" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">nothing that asks for a tap.</text>
<rect x="1180" y="90" width="640" height="330" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1198" y="122" font-size="18" fill="#111827" font-weight="700" text-anchor="start">What Now reads (all existing APIs)</text>
<text x="1198" y="150" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Now and next: GET /api/agenda/now?zone= (the zone from the QR, or the</text>
<text x="1198" y="172" font-size="16" fill="#374151" font-weight="400" text-anchor="start">event's main zone)</text>
<text x="1198" y="200" font-size="16" fill="#374151" font-weight="400" text-anchor="start">On the big screen: GET /api/screen/now?zone= (never the check-in QR,</text>
<text x="1198" y="222" font-size="16" fill="#374151" font-weight="400" text-anchor="start">photos or embeds)</text>
<text x="1198" y="250" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Announcements: Moments' announcements (step 4, #115)</text>
<text x="1198" y="278" font-size="16" fill="#374151" font-weight="400" text-anchor="start">For you: tournament (my matches), pizza (my orders), notify (check-ins):</text>
<text x="1198" y="300" font-size="16" fill="#374151" font-weight="400" text-anchor="start">each only when the event runs that module</text>
<text x="1198" y="328" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Venue: GET /api/tenants/current/venue-info, as the check-in page already</text>
<text x="1198" y="350" font-size="16" fill="#374151" font-weight="400" text-anchor="start">does</text>
<text x="1198" y="378" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Look: /theming/current/tokens.css (the hub uses the screen's tokens)</text>
<rect x="1180" y="450" width="640" height="88" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1194" y="478" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q U2 (what a guest sees), Q L3 (how lively the hub is), Q D6 (how Now</text>
<text x="1194" y="500" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">stays current: refresh on open and while visible, with ETags), Q U7</text>
<text x="1194" y="522" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">(reactions).</text>
<rect x="1180" y="560" width="640" height="66" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1194" y="588" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">The zone: a QR from a zone's screen carries ?zone=&lt;key&gt;, so the hub opens</text>
<text x="1194" y="610" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">on that hall's now and next (Q D5).</text>
</svg>
