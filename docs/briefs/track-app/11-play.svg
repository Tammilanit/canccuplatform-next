<text x="40" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Play, as a member</text>
<text x="40" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Names come live from the bot's</text>
<text x="40" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">read API (bot.md, Who plays</text>
<text x="40" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">what) and only for members;</text>
<text x="40" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the bus carries counts only.</text>
<text x="40" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">'Join in Discord' is a link to</text>
<text x="40" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the voice channel.</text>
