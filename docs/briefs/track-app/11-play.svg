6 4"/><text x="44" y="430" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Sign in to see who's playing</text><text x="44" y="456" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">and follow games</text><text x="44" y="492" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Names are for attendees only.</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="195.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="800" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Play, as a guest</text>
<text x="800" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Counts only, as the screen</text>
<text x="800" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">shows them; names need a</text>
<text x="800" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">signed-in member (bot.md: a</text>
<text x="800" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">guest gets 401).</text>
<rect x="1180" y="90" width="640" height="340" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1198" y="122" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Where Play's data comes from</text>
<text x="1198" y="150" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Who plays which game and who is in which voice channel: the bot's read</text>
<text x="1198" y="172" font-size="16" fill="#374151" font-weight="400" text-anchor="start">API (step 6, #122).</text>
<text x="1198" y="200" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The games, their covers and surges: the games module (Games track).</text>
<text x="1198" y="228" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Join links: a Discord voice channel link; a game's own link (a Steam or</text>
<text x="1198" y="250" font-size="16" fill="#374151" font-weight="400" text-anchor="start">lobby link) if the games catalogue gets one (Q D11).</text>
<text x="1198" y="278" font-size="16" fill="#374151" font-weight="400" text-anchor="start">LFG and casual sessions: Games track, later (0022).</text>
<rect x="1180" y="460" width="640" height="88" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1194" y="488" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q U10: is Play members only, or counts for guests too? Q P3: does Play</text>
<text x="1194" y="510" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">ship before the bot's read API (step 6) and the games module, or wait for</text>
<text x="1194" y="532" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">them? Q E9: a person who opted out of presence never shows in Play.</text>
