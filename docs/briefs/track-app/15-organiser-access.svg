<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 15: organisers from anywhere</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">15 · Organisers from anywhere: one door from the hub, and the access switch that guards it</text>
<g transform="translate(40,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><text x="26" y="128" font-size="13" fill="#a9b1d6" font-weight="600" text-anchor="start">MORE</text><rect x="26" y="150" width="338" height="54" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="184" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">My matches</text><rect x="26" y="212" width="338" height="54" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="246" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Privacy</text><rect x="26" y="274" width="338" height="54" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="308" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Install the hub</text><rect x="26" y="346" width="338" height="90" rx="14" fill="#1d2442" stroke="#b98cff" stroke-width="1.5"/><text x="44" y="380" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">Organiser tools</text><text x="44" y="406" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Run of show, Notify, Screens</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="343.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">More</text></g>
<text x="40" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">The door, by rights</text>
<text x="40" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Shown to anyone with a right</text>
<text x="40" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">at this event (event admin or</text>
<text x="40" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">crew). It opens the</text>
<text x="40" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">organiser's phone pages, which</text>
<text x="40" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">already exist; the hub builds</text>
<text x="40" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">no second admin.</text>
<line x1="325" y1="300" x2="415" y2="300" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<g transform="translate(420,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#f6f7fb"/><text x="40" y="50" font-size="16" fill="#111827" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#111827" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#2563eb"/><text x="42" y="92" font-size="13" fill="#ffffff" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#16a34a"/><text x="340.5" y="93" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Live</text><text x="26" y="128" font-size="13" fill="#6b7280" font-weight="600" text-anchor="start">RUN OF SHOW</text><rect x="26" y="150" width="338" height="70" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="44" y="180" font-size="14" fill="#6b7280" font-weight="700" text-anchor="start">18:00</text><text x="104" y="180" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Dinner</text><rect x="312" y="190" width="40" height="22" rx="11" fill="#2563eb"/><text x="332.0" y="207" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Now</text><rect x="26" y="230" width="338" height="70" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="44" y="260" font-size="14" fill="#6b7280" font-weight="700" text-anchor="start">19:40</text><text x="104" y="260" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Demo Game Cup semi-final</text><rect x="312" y="270" width="40" height="22" rx="11" fill="#d97706"/><text x="332.0" y="287" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">+10</text><rect x="26" y="310" width="338" height="70" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="44" y="340" font-size="14" fill="#6b7280" font-weight="700" text-anchor="start">21:15</text><text x="104" y="340" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Final</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#ffffff"/><line x1="10" y1="770" x2="380" y2="770" stroke="#e5e7eb" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#2563eb" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#2563eb" font-weight="700" text-anchor="middle">Run of show</text><circle cx="121.0" cy="790" r="5" fill="#6b7280" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#6b7280" font-weight="500" text-anchor="middle">Notify</text><circle cx="195.0" cy="790" r="5" fill="#6b7280" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#6b7280" font-weight="500" text-anchor="middle">Quick add</text><circle cx="269.0" cy="790" r="5" fill="#6b7280" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#6b7280" font-weight="500" text-anchor="middle">Screens</text><circle cx="343.0" cy="790" r="5" fill="#6b7280" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#6b7280" font-weight="500" text-anchor="middle">More</text></g>
<text x="420" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">The organiser's pages</text>
<text x="420" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The organiser shell (design</text>
<text x="420" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">sheet 2, bottom bar: Run of</text>
<text x="420" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">show, Notifications, Quick</text>
<text x="420" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">add, Screens, More), in the</text>
<text x="420" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">admin look, inside the same</text>
<text x="420" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">installed app.</text>
<g transform="translate(800,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#f6f7fb"/><text x="40" y="50" font-size="16" fill="#111827" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#111827" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#2563eb"/><text x="42" y="92" font-size="13" fill="#ffffff" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#16a34a"/><text x="340.5" y="93" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Live</text><text x="26" y="128" font-size="13" fill="#6b7280" font-weight="600" text-anchor="start">ADMIN</text><rect x="26" y="140" width="338" height="330" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="44" y="180" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Admin is closed from here</text><text x="44" y="214" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">Demo Event's admin opens only at the</text><text x="44" y="234" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">venue or over the organisers'</text><text x="44" y="254" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">Tailscale network.</text><text x="44" y="300" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">An event admin can open it to the</text><text x="44" y="320" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">internet, with sign-in, under Event</text><text x="44" y="340" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">→ Access.</text><text x="44" y="410" font-size="15" fill="#2563eb" font-weight="600" text-anchor="start">Back to the hub</text></g>
<text x="800" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Off-site, restricted (default)</text>
<text x="800" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">403 admin_access_restricted</text>
<text x="800" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(tenants.md, Admin access):</text>
<text x="800" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the switch is on by default</text>
<text x="800" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">and only narrows; sign-in and</text>
<text x="800" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">rights are always needed.</text>
<rect x="1180" y="90" width="700" height="330" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1198" y="122" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Event → Access (organiser, desktop)</text>
<text x="1198" y="150" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Admin from: (•) the venue or Tailscale (default) ( ) the internet, with sign-in</text>
<text x="1198" y="172" font-size="16" fill="#374151" font-weight="400" text-anchor="start">— admin_access</text>
<text x="1198" y="200" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Info pages: (•) public ( ) venue only ( ) signed-in only — info_page_mode</text>
<text x="1198" y="228" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Joining: (•) at the venue or with the link ( ) closed — membership</text>
<text x="1198" y="256" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The event's join link: Copy · Print as QR · Rotate (tenants.md, Joining the</text>
<text x="1198" y="278" font-size="16" fill="#374151" font-weight="400" text-anchor="start">event)</text>
<text x="1198" y="306" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The superadmin is reachable over Tailscale only, always (0022).</text>
<text x="1198" y="334" font-size="16" fill="#374151" font-weight="400" text-anchor="start">What the hub adds: a plain-words summary of who can see what, e.g. 'Guests can</text>
<text x="1198" y="356" font-size="16" fill="#374151" font-weight="400" text-anchor="start">read the schedule from anywhere; attendee info needs joining at the venue or</text>
<text x="1198" y="378" font-size="16" fill="#374151" font-weight="400" text-anchor="start">with the link.'</text>
<rect x="1180" y="450" width="700" height="88" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1194" y="478" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q U13: one installed app for attendees and crew (the door), or a separate</text>
<text x="1194" y="500" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">organiser install? Q D15: the settings exist in tenants; which of them does the</text>
<text x="1194" y="522" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">track build pages for, and which already exist in admin?</text>
</svg>
