<text x="40" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">The switch (exists today)</text>
<text x="40" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">memories_opt_in, global per</text>
<text x="40" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">user, default off</text>
<text x="40" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(tenants.md). Nothing reads it</text>
<text x="40" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">yet: no module keeps memories.</text>
<g transform="translate(420,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">12:00</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="309" y="76" width="55" height="22" rx="11" fill="#343c66"/><text x="336.5" y="93" font-size="12" fill="#f3f5ff" font-weight="700" text-anchor="middle">Ended</text><rect x="26" y="118" width="338" height="120" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="154" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Your Demo Event</text><text x="44" y="184" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">5 matches · 3rd in Demo Racer</text><text x="44" y="210" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">2 orders · checked in Sat 14:02</text><rect x="26" y="250" width="338" height="200" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="280" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">3 photos of you</text><rect x="44" y="300" width="94" height="120" rx="10" fill="#343c66"/><rect x="148" y="300" width="94" height="120" rx="10" fill="#343c66"/><rect x="252" y="300" width="94" height="120" rx="10" fill="#343c66"/><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="420" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">After the event</text>
<text x="420" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">A recap from what modules</text>
<text x="420" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">already keep (results, orders,</text>
<text x="420" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">check-in), plus photos where</text>
<text x="420" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the person is tagged as the</text>
<text x="420" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">subject.</text>
<g transform="translate(800,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Photo</text><rect x="26" y="130" width="338" height="260" rx="14" fill="#343c66"/><text x="195" y="270" font-size="14" fill="#a9b1d6" font-weight="600" text-anchor="middle">Photo wall · Sat 21:40</text><text x="26" y="430" font-size="18" fill="#f3f5ff" font-weight="700" text-anchor="start">Is this you?</text><rect x="26" y="450" width="338" height="48" rx="12" fill="#3ddcff"/><text x="195.0" y="480.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Yes, keep it in my memories</text><rect x="26" y="510" width="338" height="48" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="195.0" y="540.0" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="middle">Remove me from this photo</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="800" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Who is the subject?</text>
<text x="800" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Someone has to tag a person in</text>
<text x="800" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">a photo: the person</text>
<text x="800" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">themselves, the photographer,</text>
<text x="800" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">or the crew. Tagging is</text>
<text x="800" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">personal data (Q P6).</text>
<rect x="1180" y="90" width="640" height="420" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1198" y="122" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Why this is still open</text>
<text x="1198" y="150" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The step 4 plan left memories to this track (step 4 P10); tenants.md</text>
<text x="1198" y="172" font-size="16" fill="#374151" font-weight="400" text-anchor="start">names Moments as their keeper, but Moments shows photos, it does not</text>
<text x="1198" y="194" font-size="16" fill="#374151" font-weight="400" text-anchor="start">collect them.</text>
<text x="1198" y="222" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Photos today: Screen's photo wall shows uploaded assets; no module knows</text>
<text x="1198" y="244" font-size="16" fill="#374151" font-weight="400" text-anchor="start">who is in a photo.</text>
<text x="1198" y="272" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Options (Q P6): A, tag yourself in event photos, kept 12 months; B, a</text>
<text x="1198" y="294" font-size="16" fill="#374151" font-weight="400" text-anchor="start">recap of your own records only, no photos; C, move memories to Not</text>
<text x="1198" y="316" font-size="16" fill="#374151" font-weight="400" text-anchor="start">scheduled yet.</text>
<text x="1198" y="344" font-size="16" fill="#374151" font-weight="400" text-anchor="start">0022 named memories in the track; the pack recommends B now and A later.</text>
</svg>
