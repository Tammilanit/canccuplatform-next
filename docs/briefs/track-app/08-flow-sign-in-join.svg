<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 08: sign in with Discord and join the event</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">08 · Flow: sign in with Discord and join the event (from a guest to a member)</text>
<g transform="translate(40,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><rect x="26" y="118" width="338" height="250" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="154" font-size="12" fill="#b98cff" font-weight="700" text-anchor="start">FOR YOU</text><text x="44" y="188" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Sign in to see your matches,</text><text x="44" y="212" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">your order and check in</text><text x="44" y="244" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Your alerts on this phone stay as</text><text x="44" y="264" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">they are.</text><rect x="44" y="294" width="302" height="48" rx="12" fill="#3ddcff"/><text x="195.0" y="324.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Sign in with Discord</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="40" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">1 · A guest taps Sign in</text>
<text x="40" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">From For you, Alerts or any</text>
<text x="40" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">page that needs a member. The</text>
<text x="40" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">hub sends the person through</text>
<text x="40" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the central sign-in (#52) with</text>
<text x="40" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">this page as the way back.</text>
<line x1="325" y1="300" x2="415" y2="300" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<g transform="translate(420,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#f6f7fb"/><text x="40" y="50" font-size="16" fill="#111827" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#111827" font-weight="400" text-anchor="end">●●● ▮</text><rect x="10" y="10" width="370" height="824" rx="36" fill="#313338"/><text x="195" y="150" font-size="26" fill="#ffffff" font-weight="800" text-anchor="middle">Discord</text><rect x="36" y="190" width="318" height="380" rx="16" fill="#2b2d31"/><text x="195" y="240" font-size="15" fill="#dbdee1" font-weight="400" text-anchor="middle">An app wants to access</text><text x="195" y="266" font-size="15" fill="#dbdee1" font-weight="400" text-anchor="middle">your account</text><text x="60" y="320" font-size="14" fill="#dbdee1" font-weight="400" text-anchor="start">✓ Know your username and avatar</text><text x="60" y="350" font-size="13" fill="#949ba4" font-weight="400" text-anchor="start">(identify only; no email, no servers)</text><rect x="60" y="470" width="270" height="48" rx="10" fill="#5865f2"/><text x="195" y="500" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">Authorize</text></g>
<text x="420" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">2 · Discord asks once</text>
<text x="420" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Minimal scopes (#52:</text>
<text x="420" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">identify). From an installed</text>
<text x="420" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">hub the round trip must come</text>
<text x="420" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">back to the app, not a stray</text>
<text x="420" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">browser tab (Q E5).</text>
<line x1="705" y1="300" x2="795" y2="300" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<g transform="translate(800,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><rect x="26" y="118" width="338" height="290" rx="16" fill="#161a2e" stroke="#3ddcff" stroke-width="1.5"/><text x="44" y="158" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Join Demo Event?</text><text x="44" y="192" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">You're at the venue. Joining shows</text><text x="44" y="212" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">attendee info: the Wi-Fi password,</text><text x="44" y="232" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">attendee items and your own alerts.</text><rect x="44" y="286" width="302" height="48" rx="12" fill="#3ddcff"/><text x="195.0" y="316.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Join</text><text x="195" y="378" font-size="15" fill="#3ddcff" font-weight="600" text-anchor="middle">Not now</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="800" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">3 · At the venue: one tap</text>
<text x="800" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">POST</text>
<text x="800" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">/api/tenants/me/membership</text>
<text x="800" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">from a venue address. Joining</text>
<text x="800" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">is a choice the page offers,</text>
<text x="800" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">never a wall: the guest pages</text>
<text x="800" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">stay (Q U8).</text>
<g transform="translate(1180,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><rect x="26" y="118" width="338" height="200" rx="16" fill="#161a2e" stroke="#3ee39a" stroke-width="1.5"/><text x="44" y="158" font-size="18" fill="#3ee39a" font-weight="700" text-anchor="start">✓ You've joined Demo Event</text><text x="44" y="192" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Your alerts on this phone are now</text><text x="44" y="212" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">yours too: turn on your matches and</text><text x="44" y="232" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">your order under Alerts.</text><rect x="26" y="330" width="338" height="96" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="358" font-size="12" fill="#b98cff" font-weight="700" text-anchor="start">FOR YOU</text><text x="44" y="388" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Nothing yet: register for a</text><text x="44" y="410" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">tournament or join an order</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="1180" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">4 · Joined</text>
<text x="1180" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The guest subscription is</text>
<text x="1180" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">claimed (POST …/claim with the</text>
<text x="1180" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">token kept on the phone), so</text>
<text x="1180" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the person's alerts carry on</text>
<text x="1180" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">and personal topics open up.</text>
<g transform="translate(1560,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><rect x="26" y="118" width="338" height="300" rx="16" fill="#161a2e" stroke="#ffc94d" stroke-width="1.5"/><text x="44" y="158" font-size="18" fill="#f3f5ff" font-weight="700" text-anchor="start">You can't join from here</text><text x="44" y="192" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Demo Event lets people join at the</text><text x="44" y="212" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">venue, or with the event's own link</text><text x="44" y="232" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">or QR code from the organisers.</text><text x="44" y="288" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">You can still read the schedule and</text><text x="44" y="308" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">get event-wide alerts.</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="1560" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Not at the venue, no link</text>
<text x="1560" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">403 membership_closed. With</text>
<text x="1560" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the event's link</text>
<text x="1560" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(/notify/join#code=…) the same</text>
<text x="1560" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">page joins at once; a stale</text>
<text x="1560" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">link from the venue still</text>
<text x="1560" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">joins (tenants.md).</text>
</svg>
