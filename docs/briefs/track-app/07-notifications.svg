<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 07: lock screen, inbox and where a tap leads</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">07 · Notifications: on the lock screen, in the inbox, and where a tap leads</text>
<g transform="translate(40,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">19:31</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="10" y="10" width="370" height="824" rx="36" fill="#1f2937"/><text x="195" y="150" font-size="64" fill="#f3f5ff" font-weight="300" text-anchor="middle">19:31</text><text x="195" y="186" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="middle">Saturday 14 March</text><rect x="26" y="240" width="338" height="92" rx="18" fill="#f3f5ff" opacity="0.92"/><text x="44" y="266" font-size="11" fill="#475569" font-weight="700" text-anchor="start">DEMO EVENT  · urgent</text><text x="44" y="292" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Your match is called</text><text x="44" y="314" font-size="13" fill="#334155" font-weight="400" text-anchor="start">Demo Game Cup semi-final · Stage desk</text><rect x="26" y="344" width="338" height="92" rx="18" fill="#f3f5ff" opacity="0.92"/><text x="44" y="370" font-size="11" fill="#475569" font-weight="700" text-anchor="start">DEMO EVENT</text><text x="44" y="396" font-size="15" fill="#111827" font-weight="700" text-anchor="start">Demo Game Cup semi-final moved</text><text x="44" y="418" font-size="13" fill="#334155" font-weight="400" text-anchor="start">Now at 19:40 (+10 min)</text></g>
<text x="40" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Lock screen</text>
<text x="40" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Push carries only an id; the</text>
<text x="40" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">service worker loads title and</text>
<text x="40" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">text from Notify and shows</text>
<text x="40" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">them. Urgent (a called match)</text>
<text x="40" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">passes quiet hours and the</text>
<text x="40" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">cap.</text>
<g transform="translate(420,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><text x="26" y="128" font-size="13" fill="#a9b1d6" font-weight="600" text-anchor="start">INBOX</text><rect x="26" y="150" width="338" height="86" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><circle cx="44" cy="180" r="5" fill="#3ddcff"/><text x="58" y="184" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Your match is called</text><text x="58" y="208" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">19:31 · Tournament</text><rect x="26" y="246" width="338" height="86" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><circle cx="44" cy="276" r="5" fill="#3ddcff"/><text x="58" y="280" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Semi-final moved to 19:40</text><text x="58" y="304" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">19:22 · Schedule</text><rect x="26" y="342" width="338" height="86" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="58" y="376" font-size="15" fill="#f3f5ff" font-weight="500" text-anchor="start">Pizza is here at the entrance</text><text x="58" y="400" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">18:40 · Announcement</text><rect x="26" y="438" width="338" height="86" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="58" y="472" font-size="15" fill="#f3f5ff" font-weight="500" text-anchor="start">Breakfast at 09:00</text><text x="58" y="496" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">08:00 · Schedule</text><rect x="219" y="499" width="133" height="21" rx="10" fill="#343c66"/><text x="285.5" y="515" font-size="11" fill="#f3f5ff" font-weight="700" text-anchor="middle">Held: quiet hours</text><rect x="26" y="534" width="338" height="86" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="58" y="568" font-size="15" fill="#f3f5ff" font-weight="500" text-anchor="start">Demo Racer is hot: 14 playing</text><text x="58" y="592" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">17:05 · Games</text><rect x="219" y="595" width="133" height="21" rx="10" fill="#343c66"/><text x="285.5" y="611" font-size="11" fill="#f3f5ff" font-weight="700" text-anchor="middle">Not pushed: limit</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="269.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="420" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Inbox</text>
<text x="420" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">GET /api/notify/inbox:</text>
<text x="420" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">everything not yet expired,</text>
<text x="420" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">also what was held or not</text>
<text x="420" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">pushed, so nothing is lost by</text>
<text x="420" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the cap or quiet hours. Here</text>
<text x="420" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">under Alerts; Q L2 asks if it</text>
<text x="420" y="858.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">gets a tab.</text>
<g transform="translate(800,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Inbox</text><text x="26" y="150" font-size="22" fill="#f3f5ff" font-weight="700" text-anchor="start">Your match is called</text><text x="26" y="178" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">19:31 · Demo Game Cup semi-final</text><rect x="26" y="200" width="338" height="150" rx="14" fill="#1d2442" stroke="#3ddcff" stroke-width="1.5"/><text x="44" y="234" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Team Alpha vs Team Gamma</text><text x="44" y="262" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Go to: Stage desk</text><text x="44" y="290" font-size="15" fill="#3ddcff" font-weight="700" text-anchor="start">Lobby id  K7Q2</text><text x="44" y="324" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Starts 19:40</text><rect x="26" y="370" width="338" height="48" rx="12" fill="#3ddcff"/><text x="195.0" y="400.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Open my match</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="269.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="800" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">A tap opens the page</text>
<text x="800" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Each notification's url is a</text>
<text x="800" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">hub page on the event's</text>
<text x="800" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">hostname; the tournament's own</text>
<text x="800" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">page for a match (step 7)</text>
<text x="800" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">opens inside the hub's frame.</text>
<g transform="translate(1180,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><rect x="26" y="118" width="338" height="150" rx="16" fill="#161a2e" stroke="#ffc94d" stroke-width="1.5"/><text x="44" y="152" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event: new alert</text><text x="44" y="182" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Details are only shown at the venue</text><text x="44" y="202" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">for this event. Open the hub there</text><text x="44" y="222" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">to read it.</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="269.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="1180" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Off-site, venue-only event</text>
<text x="1180" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">In info-page mode venue_only a</text>
<text x="1180" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">guest's push still arrives,</text>
<text x="1180" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">but the details load only from</text>
<text x="1180" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the venue; the hub shows the</text>
<text x="1180" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">topic's generic text</text>
<text x="1180" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(notify.md, Delivery rules).</text>
<rect x="1540" y="100" width="360" height="66" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1554" y="128" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q L4: the app badge (the unread count on</text>
<text x="1554" y="150" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">the icon, where the phone supports it).</text>
<rect x="1540" y="200" width="360" height="66" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1554" y="228" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q E6: what the generic text says per</text>
<text x="1554" y="250" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">topic when details cannot load.</text>
<rect x="1540" y="300" width="360" height="110" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1554" y="328" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q O3: 2,000 phones and one event-wide</text>
<text x="1554" y="350" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">alert: Notify's delivery rows and send</text>
<text x="1554" y="372" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">loop need a load test before the large</text>
<text x="1554" y="394" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">event.</text>
</svg>
