<text x="190" y="380" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="middle">Scan with the Demo Event hub</text>
<text x="190" y="410" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="middle">Code changes every 30 s</text>
<text x="190" y="460" font-size="20" fill="#3ee39a" font-weight="700" text-anchor="middle">312 checked in</text>
<text x="40" y="530" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The entrance zone's checkin_qr</text>
<text x="40" y="552" font-size="16" fill="#374151" font-weight="400" text-anchor="start">widget (screen.md), only where</text>
<text x="40" y="574" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the organiser added it:</text>
<text x="40" y="596" font-size="16" fill="#374151" font-weight="400" text-anchor="start">check-in is never mandatory</text>
<text x="40" y="618" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(0027).</text>
