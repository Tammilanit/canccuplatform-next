"10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="800" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Done</text>
<text x="800" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">POST /api/notify/check-ins</text>
<text x="800" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">with purpose arrival; the done</text>
<text x="800" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">page of today's check-in page</text>
<text x="800" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(#441, sheet 7) inside the</text>
<text x="800" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">hub. The Wi-Fi password is</text>
<text x="800" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">every member's, check-in or</text>
<text x="800" y="858.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">not (PO 2026-11-14).</text>
