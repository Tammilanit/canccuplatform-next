<text x="420" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Scan in the hub</text>
<text x="420" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The hub's own scanner (the</text>
<text x="420" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">browser's camera and barcode</text>
<text x="420" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">reader where it has one; the</text>
<text x="420" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">phone's camera app opening</text>
<text x="420" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">/notify/check-in otherwise).</text>
<text x="420" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Needs a member (Q U9).</text>
<line x1="705" y1="300" x2="795" y2="300" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
