<text x="1180" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Match check-in (tournament:&lt;ref&gt;)</text>
<text x="1180" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Only for a session whose</text>
<text x="1180" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">organiser turned check-in on</text>
<text x="1180" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(events.md, Tournament). The</text>
<text x="1180" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">same scanner, another purpose.</text>
<rect x="1540" y="100" width="360" height="88" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1554" y="128" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q E8: a member who opted out of</text>
<text x="1554" y="150" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">presence: no check-in recorded (#294) —</text>
<text x="1554" y="172" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">what does the hub say?</text>
<rect x="1540" y="220" width="360" height="66" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1554" y="248" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q U9: does the hub offer check-in on</text>
<text x="1554" y="270" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Now, or only after a scan from the door?</text>
<rect x="1540" y="340" width="360" height="88" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1554" y="368" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q D10: the existing server-rendered</text>
<text x="1554" y="390" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">check-in page stays as the no-script</text>
<text x="1554" y="412" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">fallback the phone's camera app opens.</text>
