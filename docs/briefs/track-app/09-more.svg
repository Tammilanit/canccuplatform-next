<g transform="translate(40,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><text x="26" y="128" font-size="13" fill="#a9b1d6" font-weight="600" text-anchor="start">MORE</text><rect x="26" y="140" width="338" height="96" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><circle cx="70" cy="188" r="24" fill="#b98cff"/><text x="70" y="194" font-size="15" fill="#0b0d1a" font-weight="800" text-anchor="middle">P2</text><text x="108" y="182" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">Player Two</text><text x="108" y="206" font-size="13" fill="#3ee39a" font-weight="600" text-anchor="start">Member · checked in 14:02</text><rect x="26" y="270" width="338" height="54" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="304" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">My matches</text><text x="346" y="304" font-size="14" fill="#a9b1d6" font-weight="600" text-anchor="end">2  ›</text><rect x="26" y="332" width="338" height="54" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="366" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">My orders</text><text x="346" y="366" font-size="14" fill="#a9b1d6" font-weight="600" text-anchor