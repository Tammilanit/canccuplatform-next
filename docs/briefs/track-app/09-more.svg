cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="343.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">More</text></g>
<text x="40" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">More, signed in</text>
<text x="40" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Design decision 5: the bar</text>
<text x="40" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">always ends in More. Organiser</text>
<text x="40" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">tools shows only to someone</text>
<text x="40" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">with a right at this event and</text>
<text x="40" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">opens the organiser's phone</text>
<text x="40" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">pages (mockup 15).</text>
<g transform="translate(420,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ More</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">My matches</text><rect x="26" y="130" width="338" height="92" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="164" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Game Cup semi-final</text><text x="44" y="188" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">19:40 · Stage · vs Team Gamma</text><rect x="290" y="194" width="62" height="22" rx="11" fill="#ffc94d"/><text x="321.0" y="211" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Called</text><rect x="26" y="232" width="338" height="92" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="266" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Game Cup final</text><text x="44" y="290" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">21:15 · Stage · if you win</text><rect x="305" y="296" width="47" height="22" rx="11" fill="#3ddcff"/><text x="328.5" y="313" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Next</text><rect x="26" y="334" width="338" height="92" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="368" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Racer time trial</text><text x="44" y="392" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Done · 3rd of 12</text><rect x="290" y="398" width="62" height="22" rx="11" fill="#343c66"/><text x="321.0" y="415" font-size="12" fill="#f3f5ff" font-weight="700" text-anchor="middle">Result</text><text x="26" y="456" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">From the tournament module (step 7): its</text><text x="26" y="474" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">own page, inside the hub's frame. The</text><text x="26" y="492" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">hub keeps no copy.</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="343.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">More</text></g>
<text x="420" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">My matches (tournament's page)</text>
<text x="420" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The tournament contract's 'the</text>
<text x="420" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">caller's matches'. Match</text>
<text x="420" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">check-in appears only for</text>
<text x="420" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">sessions with check-in on</text>
<text x="420" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(0027).</text>
<g transform="translate(800,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ More</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">My order</text><rect x="26" y="118" width="338" height="170" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="150" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Order 2 · Demo Pizzeria</text><text x="44" y="176" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Placed 18:20 · about 19:10</text><rect x="44" y="194" width="300" height="6" rx="3" fill="#343c66"/><rect x="44" y="194" width="200" height="6" rx="3" fill="#3ee39a"/><text x="44" y="230" font-size="14" fill="#f3f5ff" font-weight="600" text-anchor="start">Your pizza: Margherita, no basil</text><text x="44" y="258" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Holder: Player One</text><text x="26" y="310" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">The pizza module's own attendee page</text><text x="26" y="328" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">(#119, step 5) with the hub's header and</text><text x="26" y="346" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">tab bar: one frame, one install.</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="343.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">More</text></g>
<text x="800" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">My order (pizza's page)</text>
<text x="800" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">#119 already asks for pages</text>
<text x="800" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">'ready to sit inside the phone</text>
<text x="800" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">hub's Food tab later'. The</text>
<text x="800" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">pack proposes the frame</text>
<text x="800" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">instead of a Food tab (Q L2).</text>
<rect x="1180" y="90" width="640" height="360" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1198" y="122" font-size="18" fill="#111827" font-weight="700" text-anchor="start">One frame, many owners</text>
<text x="1198" y="150" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The hub draws the frame: the event's header, the tab bar, the theme's</text>
<text x="1198" y="172" font-size="16" fill="#374151" font-weight="400" text-anchor="start">tokens.</text>
<text x="1198" y="200" font-size="16" fill="#374151" font-weight="400" text-anchor="start">A module draws its own attendee pages (pizza, tournament, games) on its</text>
<text x="1198" y="222" font-size="16" fill="#374151" font-weight="400" text-anchor="start">own paths, with the frame's markup from packages/ui, so they look like</text>
<text x="1198" y="244" font-size="16" fill="#374151" font-weight="400" text-anchor="start">one app.</text>
<text x="1198" y="272" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The installed app's scope is the whole event hostname, so a module page</text>
<text x="1198" y="294" font-size="16" fill="#374151" font-weight="400" text-anchor="start">stays inside the app (Q D3).</text>
<text x="1198" y="322" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The hub reads the modules' APIs with the person's session; it holds no</text>
<text x="1198" y="344" font-size="16" fill="#374151" font-weight="400" text-anchor="start">data of its own (notify.md, The hub).</text>
<rect x="1180" y="480" width="640" height="88" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1194" y="508" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q L2: the tab set (Now, Schedule, Play, Alerts, More) and where For you,</text>
<text x="1194" y="530" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">the inbox and Food live. Q D2: shared frame markup in packages/ui, or one</text>
<text x="1194" y="552" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">hub that embeds module views.</text>
</svg>
