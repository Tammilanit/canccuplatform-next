<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 12: your match is called</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">12 · Flow: your match is called (urgent), from the push to the stage desk</text>
<g transform="translate(40,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">19:31</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="10" y="10" width="370" height="824" rx="36" fill="#1f2937"/><text x="195" y="150" font-size="64" fill="#f3f5ff" font-weight="300" text-anchor="middle">19:31</text><rect x="26" y="240" width="338" height="100" rx="18" fill="#f3f5ff" opacity="0.95"/><text x="44" y="266" font-size="11" fill="#475569" font-weight="700" text-anchor="start">DEMO EVENT · urgent</text><text x="44" y="292" font-size="16" fill="#111827" font-weight="700" text-anchor="start">Your match is called</text><text x="44" y="316" font-size="13" fill="#334155" font-weight="400" text-anchor="start">Demo Game Cup semi-final · Stage desk</text></g>
<text x="40" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">1 · 19:31, in quiet or not</text>
<text x="40" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">tournament.match.called →</text>
<text x="40" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Notify's tournament topic,</text>
<text x="40" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">personal part, urgent: pushed</text>
<text x="40" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">through quiet hours and the</text>
<text x="40" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">hourly cap; a Discord DM if no</text>
<text x="40" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">push reaches the player</text>
<text x="40" y="858.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(dm_fallback).</text>
<line x1="325" y1="300" x2="415" y2="300" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="370.0" y="290" font-size="14" fill="#6b7280" font-weight="600" text-anchor="middle">tap</text>
<g transform="translate(420,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ My matches</text><text x="26" y="150" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Semi-final · best of three</text><rect x="26" y="170" width="338" height="160" rx="14" fill="#1d2442" stroke="#ffc94d" stroke-width="1.5"/><rect x="44" y="188" width="107" height="22" rx="11" fill="#ffc94d"/><text x="97.5" y="205" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Called 19:31</text><text x="44" y="240" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">Team Alpha vs Team Gamma</text><text x="44" y="268" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Go to the stage desk</text><text x="44" y="300" font-size="18" fill="#3ddcff" font-weight="800" text-anchor="start">Lobby id  K7Q2</text><rect x="26" y="350" width="338" height="48" rx="12" fill="#3ddcff"/><text x="195.0" y="380.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Check in at the desk</text><rect x="26" y="410" width="338" height="48" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="195.0" y="440.0" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="middle">I can't make it</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="420" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">2 · The match page</text>
<text x="420" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The tournament's page in the</text>
<text x="420" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">hub's frame. 'Check in' only</text>
<text x="420" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">when the session has check-in</text>
<text x="420" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">on; 'I can't make it' tells</text>
<text x="420" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the organiser (step 7 decides,</text>
<text x="420" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Q P4).</text>
<line x1="705" y1="300" x2="795" y2="300" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ah)"/>
<g transform="translate(800,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ My matches</text><text x="26" y="150" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Semi-final · in play</text><rect x="26" y="118" width="338" height="10" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><rect x="26" y="170" width="338" height="150" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="206" font-size="15" fill="#a9b1d6" font-weight="600" text-anchor="start">Game 2 of 3</text><text x="44" y="240" font-size="18" fill="#f3f5ff" font-weight="700" text-anchor="start">Team Alpha 1 – 0 Team Gamma</text><text x="44" y="274" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Scores are entered by the crew</text><rect x="26" y="332" width="338" height="84" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="362" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">On the big screen</text><text x="44" y="392" font-size="14" fill="#b98cff" font-weight="600" text-anchor="start">Main hall shows your match</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="800" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">3 · During the match</text>
<text x="800" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Scoring is manual (0027): the</text>
<text x="800" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">hub shows what the crew enters</text>
<text x="800" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">and never asks players to</text>
<text x="800" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">report, unless step 7 decides</text>
<text x="800" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">otherwise.</text>
<rect x="1180" y="90" width="640" height="330" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1198" y="122" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Rules this flow keeps</text>
<text x="1198" y="150" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Urgent only where the topic's trigger says so: the called match, an</text>
<text x="1198" y="172" font-size="16" fill="#374151" font-weight="400" text-anchor="start">urgent announcement, an emergency.</text>
<text x="1198" y="200" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Urgent never overrides an opt-out: a topic switched off gets nothing</text>
<text x="1198" y="222" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(notify.md).</text>
<text x="1198" y="250" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Notify never reads a Person or a name from the event: recipients are</text>
<text x="1198" y="272" font-size="16" fill="#374151" font-weight="400" text-anchor="start">user ids only (events.md, People in events).</text>
<rect x="1180" y="450" width="640" height="88" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1194" y="478" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q P4: how much of the player's side lives in the hub (match page, lobby</text>
<text x="1194" y="500" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">id, can't make it, result reporting) and how much stays in the tournament</text>
<text x="1194" y="522" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">module's pages for step 7 to decide.</text>
</svg>
