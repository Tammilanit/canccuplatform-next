<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1060" width="1920" height="1060" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 13: the privacy centre</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">13 · The privacy centre: what this event keeps about you, and your controls</text>
<g transform="translate(40,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ More</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Privacy</text><text x="26" y="150" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="start">What Demo Event keeps about you</text><rect x="26" y="168" width="338" height="58" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="194" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Alerts</text><text x="44" y="214" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">2 phones, your choices, 3 follows</text><text x="346" y="204" font-size="18" fill="#a9b1d6" font-weight="600" text-anchor="end">›</text><rect x="26" y="232" width="338" height="58" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="258" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Check-in</text><text x="44" y="278" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Arrival 14:02</text><text x="346" y="268" font-size="18" fill="#a9b1d6" font-weight="600" text-anchor="end">›</text><rect x="26" y="296" width="338" height="58" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="322" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Pizza</text><text x="44" y="342" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">1 order</text><text x="346" y="332" font-size="18" fill="#a9b1d6" font-weight="600" text-anchor="end">›</text><rect x="26" y="360" width="338" height="58" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="386" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Tournament</text><text x="44" y="406" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">3 results</text><text x="346" y="396" font-size="18" fill="#a9b1d6" font-weight="600" text-anchor="end">›</text><rect x="26" y="424" width="338" height="58" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="450" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Discord activity</text><text x="44" y="470" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Presence samples</text><text x="346" y="460" font-size="18" fill="#a9b1d6" font-weight="600" text-anchor="end">›</text><rect x="26" y="494" width="338" height="64" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="522" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Don't record my presence</text><text x="44" y="544" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Check-ins, activity, voice</text><rect x="300" y="513" width="46" height="26" rx="13" fill="#343c66"/><circle cx="313" cy="526" r="10" fill="#ffffff"/><rect x="26" y="566" width="338" height="64" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="594" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Keep my memories</text><text x="44" y="616" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Photos of you, after the event</text><rect x="300" y="585" width="46" height="26" rx="13" fill="#343c66"/><circle cx="313" cy="598" r="10" fill="#ffffff"/><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="343.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">More</text></g>
<text x="40" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Privacy centre</text>
<text x="40" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Every module's GET</text>
<text x="40" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">/api/&lt;module&gt;/me/export,</text>
<text x="40" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">summarised</text>
<text x="40" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(contracts/README.md,</text>
<text x="40" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Privacy). The two switches are</text>
<text x="40" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the global privacy flags in</text>
<text x="40" y="858.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">tenants (presence_opt_out,</text>
<text x="40" y="880.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">memories_opt_in).</text>
<g transform="translate(420,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Privacy</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Your data</text><rect x="26" y="140" width="338" height="50" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="195.0" y="171.0" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="middle">Download my data</text><rect x="26" y="202" width="338" height="50" rx="12" fill="#161a2e" stroke="#ff6b7d" stroke-width="1.5"/><text x="195.0" y="233.0" font-size="16" fill="#ff6b7d" font-weight="700" text-anchor="middle">Delete my data at this event</text><rect x="26" y="264" width="338" height="50" rx="12" fill="#161a2e" stroke="#ff6b7d" stroke-width="1.5"/><text x="195.0" y="295.0" font-size="16" fill="#ff6b7d" font-weight="700" text-anchor="middle">Leave Demo Event</text><rect x="26" y="326" width="338" height="50" rx="12" fill="#161a2e" stroke="#ff6b7d" stroke-width="1.5"/><text x="195.0" y="357.0" font-size="16" fill="#ff6b7d" font-weight="700" text-anchor="middle">Delete my account</text><text x="26" y="408" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Deleting at this event keeps your</text><text x="26" y="428" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">account and your other events. Leaving</text><text x="26" y="448" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">also ends your membership. Deleting your</text><text x="26" y="468" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">account removes you from every event on</text><text x="26" y="488" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">this platform.</text><text x="26" y="528" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Raw presence goes 30 days after the</text><text x="26" y="546" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">event ends; everything else becomes</text><text x="26" y="564" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">anonymous after 12 months.</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="343.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">More</text></g>
<text x="420" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Your controls</text>
<text x="420" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Leave is DELETE</text>
<text x="420" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">/api/tenants/me/membership;</text>
<text x="420" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">account deletion is the</text>
<text x="420" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">superadmin's today, and the</text>
<text x="420" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">contract hands self-service to</text>
<text x="420" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">this page (Q D12).</text>
<g transform="translate(800,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Your data</text><text x="195" y="92" font-size="17" fill="#f3f5ff" font-weight="700" text-anchor="middle">Download</text><rect x="26" y="140" width="338" height="54" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="174" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Alerts</text><text x="346" y="174" font-size="14" fill="#3ee39a" font-weight="700" text-anchor="end">✓</text><rect x="26" y="202" width="338" height="54" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="236" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Check-in</text><text x="346" y="236" font-size="14" fill="#3ee39a" font-weight="700" text-anchor="end">✓</text><rect x="26" y="264" width="338" height="54" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="298" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Pizza</text><text x="346" y="298" font-size="14" fill="#3ee39a" font-weight="700" text-anchor="end">✓</text><rect x="26" y="326" width="338" height="54" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="360" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Tournament</text><text x="346" y="360" font-size="14" fill="#a9b1d6" font-weight="700" text-anchor="end">…</text><rect x="26" y="388" width="338" height="54" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="422" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Discord activity</text><text x="346" y="422" font-size="14" fill="#3ee39a" font-weight="700" text-anchor="end">✓</text><rect x="26" y="450" width="338" height="54" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="484" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Games</text><text x="346" y="484" font-size="14" fill="#a9b1d6" font-weight="700" text-anchor="end">Nothing kept</text><rect x="26" y="512" width="338" height="54" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="546" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Moments</text><text x="346" y="546" font-size="14" fill="#a9b1d6" font-weight="700" text-anchor="end">Nothing kept</text><rect x="26" y="584" width="338" height="48" rx="12" fill="#3ddcff"/><text x="195.0" y="614.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Save as one file (JSON)</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="343.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">More</text></g>
<text x="800" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Download</text>
<text x="800" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The page calls each module the</text>
<text x="800" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">event runs; 404 means it keeps</text>
<text x="800" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">nothing on anyone. One file,</text>
<text x="800" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">made on the phone, never</text>
<text x="800" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">stored on the server (Q D13).</text>
<g transform="translate(1180,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Your data</text><rect x="10" y="10" width="370" height="824" rx="36" fill="#000000" opacity="0.55"/><rect x="10" y="300" width="370" height="534" rx="24" fill="#161a2e"/><rect x="170" y="310" width="50" height="5" rx="3" fill="#343c66"/><text x="30" y="352" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Delete your data at Demo Event?</text><text x="30" y="384" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">Your alerts, choices, check-ins, orders</text><text x="30" y="405" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">and results at this event go now. Results</text><text x="30" y="426" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">and totals stay without your name.</text><text x="30" y="455" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">This can't be undone.</text><rect x="30" y="490" width="330" height="50" rx="12" fill="#3ddcff"/><text x="195.0" y="521.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Hold to delete</text><rect x="30" y="552" width="330" height="50" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="195.0" y="583.0" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="middle">Cancel</text></g>
<text x="1180" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Delete, with a hold</text>
<text x="1180" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Each module's DELETE</text>
<text x="1180" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">/api/&lt;module&gt;/me; the page</text>
<text x="1180" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">lists the answers and retries</text>
<text x="1180" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">a module that failed. A hold,</text>
<text x="1180" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">as for an emergency in Moments</text>
<text x="1180" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">(Q U11).</text>
<rect x="1540" y="100" width="360" height="88" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1554" y="128" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q U12: does a guest get a privacy page</text>
<text x="1554" y="150" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">(delete this phone's subscription) or</text>
<text x="1554" y="172" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">only a link from Alerts?</text>
<rect x="1540" y="220" width="360" height="88" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1554" y="248" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q E10: a module that is down during</text>
<text x="1554" y="270" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">delete: retry from the page, or a</text>
<text x="1554" y="292" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">server-side job that finishes it?</text>
<rect x="1540" y="340" width="360" height="88" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1554" y="368" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q O5: the privacy centre must be in</text>
<text x="1554" y="390" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">place before the dress rehearsal (step</text>
<text x="1554" y="412" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">11): the track's only date-bound item.</text>
</svg>
