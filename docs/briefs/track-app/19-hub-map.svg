<text x="58" y="706" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Module pages in the frame: /pizza/… (#119), the tournament's my matches (step 7), the games' pages</text>
<text x="58" y="734" font-size="16" fill="#374151" font-weight="400" text-anchor="start">/notify/manifest.webmanifest, /notify/sw.js · the PWA (scope / by the Service-Worker-Allowed header, Q</text>
