<text x="40" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">The run of show</text>
<text x="40" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">One continuous list (design</text>
<text x="40" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">decision 6); the day switch</text>
<text x="40" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">jumps and follows the scroll.</text>
<text x="40" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">A delay is one solid badge</text>
<text x="40" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">everywhere (decision 3).</text>
<g transform="translate(420,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><text x="26" y="92" font-size="16" fill="#3ddcff" font-weight="600" text-anchor="start">‹ Schedule</text><text x="26" y="150" font-size="22" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Game Cup semi-final</text><text x="26" y="178" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">Sat 19:40 – 20:40 · Stage</text><rect x="26" y="200" width="338" height="64" rx="12" fill="#1d2442" stroke="#ffc94d" stroke-width="1.5"/><text x="44" y="228" font-size="15" fill="#ffc94d" font-weight="700" text-anchor="start">Moved by 10 min</text><text x="44" y="250" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Planned for 19:30</text><text x="26" y="300" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">Best of three, Team Alpha vs Team Gamma.</text><text x="26" y="321" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">Watch on the main hall screen or in the</text><text x="26" y="342" font-size="15" fill="#a9b1d6" font-weight="400" text-anchor="start">stage area.</text><rect x="26" y="380" width="338" height="48" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="195.0" y="410.0" font-size="16" fill="#3ddcff" font-weight="700" text-anchor="middle">☆ Follow this item</text><text x="26" y="450" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Its reminders and changes reach you even</text><text x="26" y="468" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">with the Schedule alerts off. Members</text><text x="26" y="486" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">only.</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="121.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="420" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">One item (/notify/agenda/{id})</text>
<text x="420" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">The page every schedule</text>
<text x="420" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">notification opens (notify.md:</text>
<text x="420" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">url /notify/agenda/{id}).</text>
<text x="420" y="792.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Following one item is the PO's</text>
<text x="420" y="814.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">decision of 2026-11-14 on</text>
<text x="420" y="836.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">#160; Q D7 settles how Notify</text>
<text x="420" y="858.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">does it.</text>
<g transform="translate(800,80) scale(0.7)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><text x="26" y="128" font-size="13" fill="#a9b1d6" font-weight="600" text-anchor="start">FILTER</text><rect x="26" y="150" width="338" height="56" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="185" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Tournament</text><rect x="300" y="165" width="46" height="26" rx="13" fill="#3ddcff"/><circle cx="333" cy="178" r="10" fill="#ffffff"/><rect x="26" y="216" width="338" height="56" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="251" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Food</text><rect x="300" y="231" width="46" height="26" rx="13" fill="#3ddcff"/><circle cx="333" cy="244" r="10" fill="#ffffff"/><rect x="26" y="282" width="338" height="56" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="317" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Social</text><rect x="300" y="297" width="46" height="26" rx="13" fill="#343c66"/><circle cx="313" cy="310" r="10" fill="#ffffff"/><rect x="26" y="348" width="338" height="56" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="383" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Main hall only</text><rect x="300" y="363" width="46" height="26" rx="13" fill="#343c66"/><circle cx="313" cy="376" r="10" fill="#ffffff"/><text x="26" y="444" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Kinds and zones come from the agenda</text><text x="26" y="464" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">(agenda.kind.*); nothing to set up.</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="121.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="800" y="700.8" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Filter by kind and zone</text>
<text x="800" y="726.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Kept on the phone only; a</text>
<text x="800" y="748.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">guest's filter needs no</text>
<text x="800" y="770.8" font-size="16" fill="#374151" font-weight="400" text-anchor="start">account.</text>
<rect x="1180" y="90" width="640" height="330" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1198" y="122" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Rules carried over</text>
<text x="1198" y="150" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Guests see public items; members also see attendees items; crew items</text>
<text x="1198" y="172" font-size="16" fill="#374151" font-weight="400" text-anchor="start">never reach the hub (agenda.md visibility).</text>
<text x="1198" y="200" font-size="16" fill="#374151" font-weight="400" text-anchor="start">A quiet change (announce: false) still shows the new time here, with no</text>
<text x="1198" y="222" font-size="16" fill="#374151" font-weight="400" text-anchor="start">push (agenda.md, Notification channels).</text>
<text x="1198" y="250" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Quiet hours are an item of their own kind, drawn as the night's band,</text>
<text x="1198" y="272" font-size="16" fill="#374151" font-weight="400" text-anchor="start">not a session.</text>
<rect x="1180" y="450" width="640" height="88" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1194" y="478" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Q D7: how the per-item follow works (decided: keep it): an entity-scoped</text>
<text x="1194" y="500" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">personal part on the schedule topic. Q D8: an .ics export of the run of</text>
<text x="1194" y="522" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">show?</text>
