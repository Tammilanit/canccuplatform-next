<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1180" width="1920" height="1180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Mockup 01: three directions for the phone hub</title>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="0" y="0" width="1920" height="1180" rx="0" fill="#f3f4f6"/>
<text x="24" y="44" font-size="28" fill="#1f2937" font-weight="700" text-anchor="start">01 · Three directions for the phone hub, the same moment in each: 18:42, a guest scans the hall screen's QR</text>
<rect x="24" y="70" width="600" height="1090" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="40" y="112" font-size="26" fill="#111827" font-weight="700" text-anchor="start">A · The pocket screen</text>
<text x="40" y="142" font-size="17" fill="#6b7280" font-weight="600" text-anchor="start">A read-only mirror of the Pulse</text>
<rect x="664" y="70" width="600" height="1090" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="680" y="112" font-size="26" fill="#111827" font-weight="700" text-anchor="start">B · The event companion</text>
<text x="680" y="142" font-size="17" fill="#6b7280" font-weight="600" text-anchor="start">A signed-in personal app</text>
<rect x="1304" y="70" width="600" height="1090" rx="18" fill="#eef6ff" stroke="#2563eb" stroke-width="3"/>
<text x="1320" y="112" font-size="26" fill="#111827" font-weight="700" text-anchor="start">C · Guest first, grows with you</text>
<text x="1320" y="142" font-size="17" fill="#2563eb" font-weight="600" text-anchor="start">One hub at three depths (recommended)</text>
<g transform="translate(40,160) scale(0.6)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><rect x="26" y="118" width="338" height="118" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="146" font-size="12" fill="#3ddcff" font-weight="700" text-anchor="start">NOW · MAIN HALL</text><text x="44" y="176" font-size="24" fill="#f3f5ff" font-weight="700" text-anchor="start">Dinner</text><text x="44" y="202" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">18:00 – 19:30 · Food court</text><rect x="44" y="214" width="300" height="6" rx="3" fill="#343c66"/><rect x="44" y="214" width="220" height="6" rx="3" fill="#3ddcff"/><rect x="26" y="248" width="338" height="84" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="274" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">NEXT</text><text x="44" y="300" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">19:40  Demo Game Cup semi-final</text><rect x="276" y="306" width="70" height="22" rx="11" fill="#ffc94d"/><text x="311.0" y="323" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">+10 min</text><text x="44" y="322" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Was 19:30 · Stage</text><rect x="26" y="344" width="338" height="150" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="374" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">On the big screen</text><text x="44" y="404" font-size="15" fill="#f3f5ff" font-weight="600" text-anchor="start">Main hall · Standings</text><text x="44" y="430" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">1 Team Alpha 42 · 2 Team Gamma 38</text><text x="44" y="464" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">No sign-in. No personal pages.</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="71.66666666666666" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="71.66666666666666" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="318.3333333333333" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="318.3333333333333" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text></g>
<text x="300" y="190" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Attendees: open, read,</text>
<text x="300" y="212" font-size="16" fill="#374151" font-weight="400" text-anchor="start">turn on event-wide alerts.</text>
<text x="300" y="234" font-size="16" fill="#374151" font-weight="400" text-anchor="start">My matches and my order</text>
<text x="300" y="256" font-size="16" fill="#374151" font-weight="400" text-anchor="start">stay on each module's own</text>
<text x="300" y="278" font-size="16" fill="#374151" font-weight="400" text-anchor="start">pages, reached by links.</text>
<text x="300" y="360" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Organisers: nothing to set</text>
<text x="300" y="382" font-size="16" fill="#374151" font-weight="400" text-anchor="start">up; the screen's QR</text>
<text x="300" y="404" font-size="16" fill="#374151" font-weight="400" text-anchor="start">already points here.</text>
<text x="300" y="470" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Venue staff: nothing</text>
<text x="300" y="492" font-size="16" fill="#374151" font-weight="400" text-anchor="start">changes.</text>
<text x="40" y="720" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Trade-offs: the fastest to ship and the hardest to</text>
<text x="40" y="742" font-size="16" fill="#374151" font-weight="400" text-anchor="start">break; it meets 0022's guest rule on day one. But the</text>
<text x="40" y="764" font-size="16" fill="#374151" font-weight="400" text-anchor="start">hub never knows you: check-in, your match being called</text>
<text x="40" y="786" font-size="16" fill="#374151" font-weight="400" text-anchor="start">and your pizza all live elsewhere, so the phone stays</text>
<text x="40" y="808" font-size="16" fill="#374151" font-weight="400" text-anchor="start">five sites, the legacy's problem (N8). Play and the</text>
<text x="40" y="830" font-size="16" fill="#374151" font-weight="400" text-anchor="start">privacy centre have no home.</text>
<text x="40" y="900" font-size="22" fill="#111827" font-weight="700" text-anchor="start">Cost: S</text>
<g transform="translate(680,160) scale(0.6)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><rect x="26" y="118" width="338" height="260" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="195" y="188" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="middle">Sign in to continue</text><text x="60" y="222" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Demo Event uses Discord to show</text><text x="60" y="242" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">your matches, your order and who's</text><text x="60" y="262" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">playing.</text><rect x="44" y="304" width="302" height="48" rx="12" fill="#3ddcff"/><text x="195.0" y="334.0" font-size="16" fill="#0b0d1a" font-weight="700" text-anchor="middle">Sign in with Discord</text><rect x="26" y="390" width="338" height="110" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="420" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start">Your feed</text><text x="44" y="450" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Team Alpha plays at 19:40</text><text x="44" y="474" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">Player Two is in voice</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="47.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Feed</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Me</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Chat</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="940" y="190" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Attendees: a personal feed</text>
<text x="940" y="212" font-size="16" fill="#374151" font-weight="400" text-anchor="start">after sign-in: matches,</text>
<text x="940" y="234" font-size="16" fill="#374151" font-weight="400" text-anchor="start">orders, friends, who's</text>
<text x="940" y="256" font-size="16" fill="#374151" font-weight="400" text-anchor="start">playing, perhaps chat.</text>
<text x="940" y="360" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Organisers: a crew mode</text>
<text x="940" y="382" font-size="16" fill="#374151" font-weight="400" text-anchor="start">inside the same app.</text>
<text x="940" y="470" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Venue staff: a second</text>
<text x="940" y="492" font-size="16" fill="#374151" font-weight="400" text-anchor="start">admin on the phone.</text>
<text x="680" y="720" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Trade-offs: the richest hub, but a sign-in wall breaks</text>
<text x="680" y="742" font-size="16" fill="#374151" font-weight="400" text-anchor="start">0022's 'guests without signing in', and almost nothing</text>
<text x="680" y="764" font-size="16" fill="#374151" font-weight="400" text-anchor="start">ships before membership (#150), central sign-in (#52),</text>
<text x="680" y="786" font-size="16" fill="#374151" font-weight="400" text-anchor="start">pizza (5), tournament (7), the bot (6) and Games. Needs</text>
<text x="680" y="808" font-size="16" fill="#374151" font-weight="400" text-anchor="start">a client-side app stack, a third way of building pages,</text>
<text x="680" y="830" font-size="16" fill="#374151" font-weight="400" text-anchor="start">and duplicates module pages.</text>
<text x="680" y="900" font-size="22" fill="#111827" font-weight="700" text-anchor="start">Cost: L–XL</text>
<g transform="translate(1320,160) scale(0.6)"><rect x="0" y="0" width="390" height="844" rx="44" fill="#0f172a"/><rect x="10" y="10" width="370" height="824" rx="36" fill="#0b0d1a"/><text x="40" y="50" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start">18:42</text><text x="350" y="50" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="end">●●● ▮</text><rect x="26" y="70" width="32" height="32" rx="9" fill="#3ddcff"/><text x="42" y="92" font-size="13" fill="#0b0d1a" font-weight="800" text-anchor="middle">DE</text><text x="68" y="93" font-size="20" fill="#f3f5ff" font-weight="700" text-anchor="start">Demo Event</text><rect x="317" y="76" width="47" height="22" rx="11" fill="#3ee39a"/><text x="340.5" y="93" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">Live</text><rect x="26" y="118" width="338" height="96" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="146" font-size="12" fill="#b98cff" font-weight="700" text-anchor="start">FOR YOU</text><text x="44" y="174" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">Your match 19:40 · Stage</text><text x="44" y="198" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Pizza: placed · about 19:10</text><rect x="26" y="226" width="338" height="118" rx="16" fill="#1d2442" stroke="#343c66" stroke-width="1.5"/><text x="44" y="254" font-size="12" fill="#3ddcff" font-weight="700" text-anchor="start">NOW · MAIN HALL</text><text x="44" y="284" font-size="24" fill="#f3f5ff" font-weight="700" text-anchor="start">Dinner</text><text x="44" y="310" font-size="14" fill="#a9b1d6" font-weight="400" text-anchor="start">18:00 – 19:30 · Food court</text><rect x="44" y="322" width="300" height="6" rx="3" fill="#343c66"/><rect x="44" y="322" width="220" height="6" rx="3" fill="#3ddcff"/><rect x="26" y="356" width="338" height="84" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="382" font-size="12" fill="#a9b1d6" font-weight="700" text-anchor="start">NEXT</text><text x="44" y="408" font-size="15" fill="#f3f5ff" font-weight="700" text-anchor="start">19:40  Demo Game Cup semi-final</text><rect x="276" y="414" width="70" height="22" rx="11" fill="#ffc94d"/><text x="311.0" y="431" font-size="12" fill="#0b0d1a" font-weight="700" text-anchor="middle">+10 min</text><text x="44" y="430" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start">Was 19:30 · Stage</text><rect x="26" y="452" width="338" height="70" rx="16" fill="#161a2e" stroke="#343c66" stroke-width="1.5"/><text x="44" y="482" font-size="14" fill="#f3f5ff" font-weight="600" text-anchor="start">Main hall shows: Standings</text><text x="44" y="506" font-size="14" fill="#3ddcff" font-weight="700" text-anchor="start">♥  ★  GG</text><rect x="10" y="770" width="370" height="64" rx="0" fill="#161a2e"/><line x1="10" y1="770" x2="380" y2="770" stroke="#343c66" stroke-width="1"/><circle cx="47.0" cy="790" r="6" fill="#3ddcff" opacity="1"/><text x="47.0" y="815" font-size="11" fill="#3ddcff" font-weight="700" text-anchor="middle">Now</text><circle cx="121.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="121.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Schedule</text><circle cx="195.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="195.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Play</text><circle cx="269.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="269.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">Alerts</text><circle cx="343.0" cy="790" r="5" fill="#a9b1d6" opacity="0.55"/><text x="343.0" y="815" font-size="11" fill="#a9b1d6" font-weight="500" text-anchor="middle">More</text></g>
<text x="1580" y="190" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Attendees: a guest gets</text>
<text x="1580" y="212" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Now, Schedule and alerts</text>
<text x="1580" y="234" font-size="16" fill="#374151" font-weight="400" text-anchor="start">at once; signing in adds</text>
<text x="1580" y="256" font-size="16" fill="#374151" font-weight="400" text-anchor="start">For you, check-in and</text>
<text x="1580" y="278" font-size="16" fill="#374151" font-weight="400" text-anchor="start">personal alerts; module</text>
<text x="1580" y="300" font-size="16" fill="#374151" font-weight="400" text-anchor="start">pages open inside the</text>
<text x="1580" y="322" font-size="16" fill="#374151" font-weight="400" text-anchor="start">hub's frame.</text>
<text x="1580" y="400" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Organisers: one More →</text>
<text x="1580" y="422" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Organiser tools door into</text>
<text x="1580" y="444" font-size="16" fill="#374151" font-weight="400" text-anchor="start">the existing organiser</text>
<text x="1580" y="466" font-size="16" fill="#374151" font-weight="400" text-anchor="start">pages.</text>
<text x="1580" y="520" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Venue staff: the same</text>
<text x="1580" y="542" font-size="16" fill="#374151" font-weight="400" text-anchor="start">door, by their rights.</text>
<text x="1320" y="720" font-size="16" fill="#374151" font-weight="400" text-anchor="start">Trade-offs: ships in slices that each stand alone (guest</text>
<text x="1320" y="742" font-size="16" fill="#374151" font-weight="400" text-anchor="start">hub, alerts, signed-in, Play, privacy); each module</text>
<text x="1320" y="764" font-size="16" fill="#374151" font-weight="400" text-anchor="start">keeps its own attendee pages but they share one frame,</text>
<text x="1320" y="786" font-size="16" fill="#374151" font-weight="400" text-anchor="start">one tab bar and one install. Needs a route map in the</text>
<text x="1320" y="808" font-size="16" fill="#374151" font-weight="400" text-anchor="start">contract and a PWA scope over the whole event hostname.</text>
<text x="1320" y="900" font-size="22" fill="#111827" font-weight="700" text-anchor="start">Cost: M</text>
<rect x="1320" y="930" width="560" height="66" rx="10" fill="#fef9c3" stroke="#facc15" stroke-width="1.5"/>
<text x="1334" y="958" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">Recommended. Q L1 picks the direction; Q D1–D3 settle where the</text>
<text x="1334" y="980" font-size="15" fill="#713f12" font-weight="500" text-anchor="start">hub lives and how it is built.</text>
</svg>
