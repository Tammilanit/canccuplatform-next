<text x="1176.6" y="741.5" font-size="12" fill="#c5cae3" font-weight="600" text-anchor="start" data-box="1155.6 1240">2 offline</text>
<line x1="682" y1="758" x2="1240" y2="758" stroke="#343c66" stroke-width="1"/>
<text x="682" y="785" font-size="14" fill="#f3f5ff" font-weight="400" text-anchor="start" data-box="682 1240">Discord bot</text>
<rect x="1140.96" y="768" width="99.04" height="22" rx="11" fill="#2a2f4d" stroke="#4a5078" stroke-width="1"/>
<circle cx="1152.96" cy="779" r="3.5" fill="#a9b1d6"/>
<text x="1161.96" y="783.5" font-size="12" fill="#c5cae3" font-weight="600" text-anchor="start" data-box="1140.96 1240">Not bound</text>
<line x1="682" y1="800" x2="1240" y2="800" stroke="#343c66" stroke-width="1"/>
