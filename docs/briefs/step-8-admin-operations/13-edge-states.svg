<text x="1328" y="656" font-size="16" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="1328 1850">Health can&#x27;t be reached</text>
<text x="1328" y="682" font-size="13" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="1328 1850">The menu&#x27;s note says &quot;Health: no answer&quot;.</text>
<text x="1328" y="704" font-size="13" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="1328 1850">Docker restarts admin; while it is down nothing</text>
<text x="1328" y="726" font-size="13" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="1328 1850">alerts. Step 10&#x27;s outside watchdog closes this gap.</text>
<text x="1328" y="760" font-size="12.5" fill="#ffd36d" font-weight="400" text-anchor="start" data-box="1328 1850">No second watcher in step 8 (E3).</text>
