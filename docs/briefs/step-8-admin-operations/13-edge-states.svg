<text x="2123.34" y="412.68" font-size="13" fill="#c5cae3" font-weight="600" text-anchor="middle" data-box="2090.66 2156.03">Open</text>
<rect x="32" y="540" width="602" height="330" rx="14" fill="#0b0d1a"/>
<text x="54" y="574" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start" data-box="54 612">O8 · Several screens, one zone</text>
<text x="54" y="596" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="54 612">Health, event crew: a power strip feeds three screens</text>
<rect x="54" y="620" width="558" height="236" rx="12" fill="#161a2e" stroke="#343c66" stroke-width="1"/>
<rect x="54" y="630" width="3" height="216" rx="1.5" fill="#f87171"/>
<rect x="72" y="636" width="66.8961" height="22" rx="11" fill="#4a2430" stroke="#a8464f" stroke-width="1"/>
<circle cx="84" cy="647" r="3.5" fill="#f87171"/>
<text x="93" y="651.5" font-size="12" fill="#ffb4bd" font-weight="600" text-anchor="start" data-box="72 138.896">Down</text>
<text x="72" y="686" font-size="15.5" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="70 596">3 screens in Main hall are dark</text>
<text x="72" y="712" font-size="13" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="70 596">Main hall screens 1, 2 and 3: no word</text>
<text x="72" y="732" font-size="13" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="70 596">since 21:29. Main hall shows nowhere now.</text>
<text x="72" y="752" font-size="13" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="70 596">One incident for the zone, not three.</text>
<text x="72" y="778" font-size="12.5" fill="#ffd36d" font-weight="400" text-anchor="start" data-box="70 596">Told #crew-alerts · @Crew on duty</text>
<rect x="72" y="802" width="54.4495" height="32" rx="10" fill="#3ddcff"/>
<text x="99.2248" y="822.68" font-size="13" fill="#0b0d1a" font-weight="700" text-anchor="middle" data-box="72 126.45">Ack</text>
<rect x="134.45" y="802" width="125.006" height="32" rx="10" fill="none" stroke="#616788" stroke-width="1"/>
<text x="196.952" y="822.68" font-size="13" fill="#c5cae3" font-weight="600" text-anchor="middle" data-box="134.45 259.455">Open devices</text>
<rect x="660" y="540" width="602" height="330" rx="14" fill="#0b0d1a"/>
<text x="682" y="574" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start" data-box="682 1240">E10 · A draft event</text>
<text x="682" y="596" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="682 1240">Health of a draft: the state shows, nobody is paged</text>
