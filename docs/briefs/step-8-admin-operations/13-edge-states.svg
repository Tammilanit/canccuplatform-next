<rect x="1191.31" y="810" width="48.6883" height="22" rx="11" fill="#1e4244" stroke="#2a7e64" stroke-width="1"/>
<circle cx="1203.31" cy="821" r="3.5" fill="#3ee39a"/>
<text x="1212.31" y="825.5" font-size="12" fill="#7cecba" font-weight="600" text-anchor="start" data-box="1191.31 1240">OK</text>
<rect x="1288" y="540" width="602" height="330" rx="14" fill="#0b0d1a"/>
<text x="1310" y="574" font-size="16" fill="#f3f5ff" font-weight="700" text-anchor="start" data-box="1310 1868">E3 · Admin itself is down</text>
<text x="1310" y="596" font-size="13" fill="#a9b1d6" font-weight="400" text-anchor="start" data-box="1310 1868">Any organiser page: the shell can&#x27;t reach Health</text>
