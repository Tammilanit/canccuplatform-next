<text x="1956" y="686" font-size="15.5" fill="#f3f5ff" font-weight="600" text-anchor="start" data-box="1954 2480">Lobby screen is still dark</text>
<text x="1956" y="712" font-size="13" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="1954 2480">The mute by Player Three ended at 23:00.</text>
<text x="1956" y="732" font-size="13" fill="#c5cae3" font-weight="400" text-anchor="start" data-box="1954 2480">It has been dark since 21:50.</text>
