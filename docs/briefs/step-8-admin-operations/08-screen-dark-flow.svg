<text x="520" y="970" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle" data-box="32 2528">confirmed (2 min) · posted</text>
<circle cx="1010" cy="920" r="7" fill="#374151"/>
<text x="1010" y="950" font-size="14" fill="#111827" font-weight="700" text-anchor="middle" data-box="32 2528">21:33:40</text>
<text x="1010" y="970" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle" data-box="32 2528">acked: reminders stop</text>
<circle cx="1520" cy="920" r="7" fill="#374151"/>
<text x="1520" y="950" font-size="14" fill="#111827" font-weight="700" text-anchor="middle" data-box="32 2528">21:40:31</text>
<text x="1520" y="970" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle" data-box="32 2528">online again</text>
<circle cx="2010" cy="920" r="7" fill="#374151"/>
<text x="2010" y="950" font-size="14" fill="#111827" font-weight="700" text-anchor="middle" data-box="32 2528">21:41:01</text>
<text x="2010" y="970" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle" data-box="32 2528">back for 30 s · edited</text>
<circle cx="2290" cy="920" r="7" fill="#374151"/>
<text x="2290" y="950" font-size="14" fill="#111827" font-weight="700" text-anchor="middle" data-box="32 2528">22:01</text>
<text x="2290" y="970" font-size="13" fill="#6b7280" font-weight="400" text-anchor="middle" data-box="32 2528">no reminder: acked</text>
<text x="32" y="1020" font-size="15" fill="#374151" font-weight="400" text-anchor="start" data-box="32 2528">Had nobody acked, a reminder would reply under the post at 22:01 and every 30 min after, until the screen is back (U5, D2). During the run of show&#x27;s quiet hours nothing is posted (E9).</text>
