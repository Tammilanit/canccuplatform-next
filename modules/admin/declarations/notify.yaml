settings:
  # No default: the contract's default is every registered topic, which only
  # the topic registry knows.
  - key: topics
    type: list
    label: Topics offered at this event
  - key: hourly_cap
    type: integer
    min: 1
    max: 60
    label: Pushes per recipient per hour
    default: 6
  - key: dm_fallback
    type: boolean
    label: Fall back to a Discord DM for personal notifications
    default: true
  - key: schedule_lead_minutes
    type: integer
    label: Schedule notification lead (minutes)
    default: 10
  - key: check_in_rotation_seconds
    type: integer
    min: 15
    max: 120
    label: Check-in code rotation (seconds)
    default: 30
groups:
  - id: topics
    label: Topics
    description: What people can choose to hear about at this event.
    keys: [topics]
  - id: push_limits
    label: Push limits
    description: How often one person is notified, and how.
    keys: [hourly_cap, dm_fallback, schedule_lead_minutes]
  - id: check_in
    label: Check-in codes
    description: How often the code on the check-in screen changes.
    keys: [check_in_rotation_seconds]
