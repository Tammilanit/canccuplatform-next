settings:
  - key: ordering_open
    type: boolean
    label: People can order food
    help: "Off: nobody can start or join an order; the Food page shows the note below."
    default: true
  - key: ordering_note
    type: string
    label: The note on the Food page while ordering is off
    help: "Shown to attendees on the Food page while ordering is off."
    example: "Breakfast orders open at 09:00"
    short: Note while closed
    default: ""
  - key: open_by
    type: string
    choices: [anyone, crew]
    label: Who may start an order
    help: "Crew: only people with the right to open orders can start one."
    default: anyone
  - key: max_open_orders
    type: integer
    min: 1
    max: 20
    label: Orders open at once
    help: "How many orders can be open at the same time in the event."
    default: 3
  - key: max_items_per_person
    type: integer
    min: 1
    max: 20
    label: Pizzas per person in one order
    help: "How many pizzas one person can add to one order."
    default: 5
  - key: settle_to_payer
    type: boolean
    label: An order may be settled with whoever paid it
    help: "On: people pay back whoever paid the order, instead of the organiser."
    default: false
  - key: last_call_minutes
    type: integer
    min: 1
    max: 60
    label: Last call before the close (minutes)
    help: "People in an order hear the last call this long before it closes."
    short: Last call
    default: 10
  - key: auto_close
    type: boolean
    label: An open order closes at its close time
    help: "Off: the holder closes the order by hand."
    short: Close at the time
    default: true
  - key: remind_holder_minutes
    type: integer
    min: 5
    max: 240
    label: Remind the holder of a stalled order after (minutes)
    help: "A closed order that is not called in reminds its holder after this."
    short: Remind the holder
    default: 30
  - key: remind_crew_minutes
    type: integer
    min: 10
    max: 480
    label: Then remind the crew too, after (minutes)
    help: "If it is still not called in, the crew hears about it after this."
    short: Then the crew too
    default: 60
  - key: release_after_minutes
    type: integer
    min: 30
    max: 720
    label: Release a holder who never calls it in, after (minutes)
    help: "A holder who never calls the order in is released after this, so someone else can."
    short: Release a stalled holder
    default: 120
  - key: arrival_check_minutes
    type: integer
    min: 5
    max: 240
    label: Ask "has it arrived?" this long past the estimate (minutes)
    help: "The holder is asked whether the food came, this long after the pizzeria's estimate."
    short: Arrived? past the estimate
    default: 30
  - key: arrival_check_no_estimate_minutes
    type: integer
    min: 15
    max: 480
    label: Without an estimate, ask after the call-in (minutes)
    help: "When the pizzeria gave no estimate, the question comes this long after the call-in."
    short: Arrived? without an estimate
    default: 90
  - key: done_after_arrival_minutes
    type: integer
    min: 15
    max: 720
    label: An arrived order is done after (minutes)
    help: "An order whose food came is marked done after this."
    short: Done after arrival
    default: 120
  - key: close_forgotten
    type: boolean
    label: Close forgotten orders when the event day turns at 06:00
    short: Close forgotten orders
    help: Never called in is cancelled; called in but not done is done, flagged in the record.
    default: true
  - key: ai_reader
    type: boolean
    label: Read receipts and menus from photos (an outside service; a person confirms)
    help: "Photos are sent to an outside service, and a person checks what it read. Needs a key in Integrations."
    short: AI reader
    default: false
  - key: ai_reader_daily_reads
    type: integer
    min: 1
    max: 1000
    label: Reads a day, at most, for the event
    help: "The most photos the reader reads in one event day, to cap the cost."
    short: Reads a day
    default: 100
  - key: ai_reader_monthly_limit_usd
    type: integer
    min: 0
    max: 1000
    label: Monthly spend limit in dollars (0 for none)
    help: "Copy it from the provider's Console. Integrations shows the month's reads against it; the provider stops reads itself."
    short: Monthly limit
    default: 0
groups:
  - id: ordering
    label: Ordering
    description: Who orders food, and how much at once.
    keys: [ordering_open, ordering_note, open_by, max_open_orders, max_items_per_person]
  - id: settling
    label: Settling up
    description: Who people pay for their food after the event.
    keys: [settle_to_payer]
  - id: reader
    label: AI reader
    description: Reading receipts and menus from photos; works only once Integrations has a key.
    keys: [ai_reader, ai_reader_daily_reads, ai_reader_monthly_limit_usd]
  - id: times
    label: Times and forgotten orders
    description: When the app reminds the holder and the crew, and what it closes by itself.
    keys:
      [
        last_call_minutes,
        auto_close,
        remind_holder_minutes,
        remind_crew_minutes,
        release_after_minutes,
        arrival_check_minutes,
        arrival_check_no_estimate_minutes,
        done_after_arrival_minutes,
        close_forgotten,
      ]
