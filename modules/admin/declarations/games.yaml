settings:
  - key: surges
    type: boolean
    label: Detect surges
    default: true
  - key: surge_threshold
    type: integer
    min: 2
    max: 500
    label: Players on one game that start a surge
    default: 4
  - key: surge_cooldown_minutes
    type: integer
    min: 1
    max: 1440
    label: Surge cooldown (minutes)
    default: 15
  - key: attendee_additions
    type: boolean
    label: Members may add games
    default: true
groups:
  - id: surges
    label: Surges
    description: When many players start the same game, the screens say so.
    keys: [surges, surge_threshold, surge_cooldown_minutes]
  - id: members
    label: Games members add
    description: Games that are not on the list yet.
    keys: [attendee_additions]
