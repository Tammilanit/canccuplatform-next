settings:
  - key: heartbeat_seconds
    type: integer
    min: 5
    max: 60
    label: Screen heartbeat (seconds)
    default: 15
  - key: offline_after_seconds
    type: integer
    min: 15
    max: 300
    label: Screen offline after (seconds)
    default: 45
  # Each item must be an https:// origin; a declaration cannot say so, so the
  # screen module checks it when it reads the list.
  - key: web_allowlist
    type: list
    label: Web pages screens may show (https:// origins)
    default: []
  - key: break_min_gap_seconds
    type: integer
    min: 0
    max: 3600
    label: Minimum gap between breaks (seconds)
    default: 60
  - key: progress_bars
    type: boolean
    label: Show progress bars
    default: true
  - key: ticker_appearance
    type: string
    choices: [default, high_contrast, minimal, broadcast]
    label: Ticker appearance
    default: default
  - key: ready_timeout_seconds
    type: integer
    min: 1
    max: 30
    label: Wait for content to be ready (seconds)
    default: 8
  - key: ready_fallback_asset_id
    type: string
    label: Asset shown when content is not ready in time
    default: ""
  - key: burn_in_drift
    type: boolean
    label: Shift the screen layout slowly against burn-in
    default: false
  # Screen studio's Motion card writes both through admin's internal settings write.
  - key: motion_level
    type: string
    choices: [none, calm, lively, party]
    label: Energy level
    default: lively
  - key: follow_the_day
    type: boolean
    label: Follow the day (calmer at doors and wind-down, livelier at peaks)
    default: true
groups:
  - id: playing
    label: Playing
    description: What a screen does between slides.
    keys: [break_min_gap_seconds, ticker_appearance, progress_bars, burn_in_drift]
  - id: motion
    label: Motion
    description: How lively the screens move, unless a zone pins its own level.
    keys: [motion_level, follow_the_day]
  - id: network
    label: When the network is slow
    description: How long a screen waits before it says so.
    keys: [heartbeat_seconds, offline_after_seconds, ready_timeout_seconds, ready_fallback_asset_id]
  - id: web_pages
    label: Web pages
    description: Outside pages a screen may show.
    keys: [web_allowlist]
