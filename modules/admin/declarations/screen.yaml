settings:
  - key: heartbeat_seconds
    type: integer
    min: 5
    max: 60
    label: Screen heartbeat (seconds)
    short: Heartbeat
    help: How often a screen checks in.
    default: 15
  - key: offline_after_seconds
    type: integer
    min: 15
    max: 300
    label: Screen offline after (seconds)
    short: Mark offline after
    help: "Shorter: more false alarms on a slow uplink."
    default: 45
  # Each item must be an https:// origin; a declaration cannot say so, so the
  # screen module checks it when it reads the list.
  - key: web_allowlist
    type: list
    label: Web pages screens may show (https:// origins)
    help: "A screen shows a web page only from these sites. Empty: no web pages."
    example: "https://example.org, https://stream.example.net"
    default: []
  - key: break_min_gap_seconds
    type: integer
    min: 0
    max: 3600
    label: Minimum gap between breaks (seconds)
    help: "Break playlists never interrupt the screen again sooner than this."
    short: Least time between breaks
    default: 60
  - key: progress_bars
    type: boolean
    label: Show progress bars
    help: A thin bar under each rotating slide.
    default: true
  - key: ticker_appearance
    type: string
    choices: [default, high_contrast, minimal, broadcast]
    label: Ticker appearance
    help: "How the ticker line at the foot of the screens looks."
    short: Ticker look
    default: default
  - key: ready_timeout_seconds
    type: integer
    min: 1
    max: 30
    label: Wait for content to be ready (seconds)
    help: "How long a screen waits for a slide to load before it shows the fallback."
    default: 8
  - key: ready_fallback_asset_id
    type: string
    label: Asset shown when content is not ready in time
    help: "Shown when a slide does not load in time: an asset's id from the Content library. Empty: the screen keeps the last slide."
    example: "the asset's id from Content"
    default: ""
  - key: burn_in_drift
    type: boolean
    label: Shift the screen layout slowly against burn-in
    help: "For screens that show the same layout for days: moves it a few pixels now and then."
    default: false
  # Screen studio's Motion card writes both through admin's internal settings write.
  - key: motion_level
    type: string
    choices: [none, calm, lively, party]
    label: Energy level
    help: "How lively the screens move, unless a zone sets its own."
    default: lively
  - key: follow_the_day
    type: boolean
    label: Follow the day (calmer at doors and wind-down, livelier at peaks)
    help: "Calmer at doors and wind-down, livelier at the peaks."
    default: true
  - key: stage_art
    type: boolean
    label: Show a hot game's art on the stage
    help: "A hot game's box shows its cover art on the stage."
    default: true
  - key: food_holder_names
    type: boolean
    label: Name the holder of a pizza order in the food box ("collect from …")
    help: "The screens' food box names who holds each order, as in \"collect from …\"."
    short: Holder names
    default: true
groups:
  - id: playing
    label: Playing
    description: What a screen does between slides.
    keys: [break_min_gap_seconds, ticker_appearance, progress_bars, burn_in_drift]
  - id: motion
    label: Motion
    description: How lively the screens move, unless a zone pins its own level.
    keys: [motion_level, follow_the_day, stage_art]
  - id: network
    label: When the network is slow
    description: How long a screen waits before it says so.
    keys: [heartbeat_seconds, offline_after_seconds, ready_timeout_seconds, ready_fallback_asset_id]
  - id: web_pages
    label: Web pages
    description: Outside pages a screen may show.
    keys: [web_allowlist]
  - id: food
    label: Food
    description: What the screens' food box shows of the pizza orders.
    keys: [food_holder_names]
