openapi: 3.1.0
info:
  title: Moments API
  version: 1.0.0
  summary: The arbiter of the screens' moments, engine part, and its cues and sound.
  description: |
    Machine-readable part of the moments contract. Prose, the arbiter's rules, rules, history and events:
    contracts/moments.md. Conventions (snake_case, RFC 3339 UTC times, error body): contracts/README.md.
    The event (tenant) comes from the hostname; only the internal request names a tenant, whose `tenant_id`
    the calling module's kit sets.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Same origin, behind Caddy; the hostname selects the event.
tags:
  - name: moments
    description: Running moments and the crew's actions on them.
  - name: emergency
    description: The emergency takeover, per event and venue-wide.
  - name: settings
    description: The priority order and the built-in rules.
  - name: scenes
    description: The venue's autopilot, the mood of each zone, and the crew button.
  - name: history
    description: What played where, why, and how it ended.
  - name: cues
    description: Cues and sound (#113), the sound desk; the paths are in moments/cues.openapi.yaml.
  - name: announcements
    description: The announcement composer (#115); the paths are in moments/announcements.openapi.yaml.
  - name: storyboards
    description: Storyboards (#114), the sequences for the peaks; the paths are in moments/storyboards.openapi.yaml, a story's shape in moments/storyboard.schema.json.
  - name: privacy
    description: The caller's own rows (contracts/README.md, Privacy).
  - name: internal
    description: Module paths on the stack's internal network; the edge Caddy never routes them.
security:
  - session: []
paths:
  /api/moments/moments:
    $ref: "moments/crew.openapi.yaml#/~1api~1moments~1moments"
  /api/moments/moments/{moment_id}/end:
    $ref: "moments/crew.openapi.yaml#/~1api~1moments~1moments~1{moment_id}~1end"
  /api/moments/moments/{moment_id}/forward:
    $ref: "moments/crew.openapi.yaml#/~1api~1moments~1moments~1{moment_id}~1forward"
  /api/moments/moments/{moment_id}/extend:
    $ref: "moments/crew.openapi.yaml#/~1api~1moments~1moments~1{moment_id}~1extend"
  /api/moments/spotlight:
    $ref: "moments/crew.openapi.yaml#/~1api~1moments~1spotlight"
  /api/moments/emergency:
    $ref: "moments/crew.openapi.yaml#/~1api~1moments~1emergency"
  /api/moments/emergency/end:
    $ref: "moments/crew.openapi.yaml#/~1api~1moments~1emergency~1end"
  /api/moments/venue-emergency:
    $ref: "moments/crew.openapi.yaml#/~1api~1moments~1venue-emergency"
  /api/moments/venue-emergency/end:
    $ref: "moments/crew.openapi.yaml#/~1api~1moments~1venue-emergency~1end"
  /api/moments/priorities:
    $ref: "moments/priorities.openapi.yaml#/~1api~1moments~1priorities"
  /api/moments/rules:
    $ref: "moments/priorities.openapi.yaml#/~1api~1moments~1rules"
  /api/moments/rules/{rule_id}:
    $ref: "moments/priorities.openapi.yaml#/~1api~1moments~1rules~1{rule_id}"
  /api/moments/scenes:
    $ref: "moments/scenes.openapi.yaml#/~1api~1moments~1scenes"
  /api/moments/scenes/reset:
    $ref: "moments/scenes.openapi.yaml#/~1api~1moments~1scenes~1reset"
  /api/moments/scenes/{scene_key}/take:
    $ref: "moments/scenes.openapi.yaml#/~1api~1moments~1scenes~1{scene_key}~1take"
  /api/moments/history:
    $ref: "moments/history.openapi.yaml#/~1api~1moments~1history"
  /api/moments/history.csv:
    $ref: "moments/history.openapi.yaml#/~1api~1moments~1history.csv"
  /api/moments/me/export:
    $ref: "moments/history.openapi.yaml#/~1api~1moments~1me~1export"
  /api/moments/me:
    $ref: "moments/history.openapi.yaml#/~1api~1moments~1me"
  /api/moments/sound:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sound"
  /api/moments/sound/settings:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sound~1settings"
  /api/moments/sound/mute:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sound~1mute"
  /api/moments/sound/check:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sound~1check"
  /api/moments/sound/log:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sound~1log"
  /api/moments/cues:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1cues"
  /api/moments/cues/{cue}:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1cues~1{cue}"
  /api/moments/sounds:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sounds"
  /api/moments/sounds/{sound_id}:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sounds~1{sound_id}"
  /api/moments/sounds/pack/{file}:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sounds~1pack~1{file}"
  /api/moments/announcements:
    $ref: "moments/announcements.openapi.yaml#/~1api~1moments~1announcements"
  /api/moments/announcements/preview:
    $ref: "moments/announcements.openapi.yaml#/~1api~1moments~1announcements~1preview"
  /api/moments/announcements/{announcement_id}:
    $ref: "moments/announcements.openapi.yaml#/~1api~1moments~1announcements~1{announcement_id}"
  /api/moments/announcements/{announcement_id}/withdraw:
    $ref: "moments/announcements.openapi.yaml#/~1api~1moments~1announcements~1{announcement_id}~1withdraw"
  /api/moments/announcement-templates:
    $ref: "moments/announcements.openapi.yaml#/~1api~1moments~1announcement-templates"
  /api/moments/announcement-templates/{template_key}:
    $ref: "moments/announcements.openapi.yaml#/~1api~1moments~1announcement-templates~1{template_key}"
  /api/moments/storyboards:
    $ref: "moments/storyboards.openapi.yaml#/~1api~1moments~1storyboards"
  /api/moments/storyboards/reset:
    $ref: "moments/storyboards.openapi.yaml#/~1api~1moments~1storyboards~1reset"
  /api/moments/storyboards/{story_key}/take:
    $ref: "moments/storyboards.openapi.yaml#/~1api~1moments~1storyboards~1{story_key}~1take"
  /api/moments/storyboards/runs/{run_id}/stop:
    $ref: "moments/storyboards.openapi.yaml#/~1api~1moments~1storyboards~1runs~1{run_id}~1stop"
  /api/moments/storyboards/runs/{run_id}/finale:
    $ref: "moments/storyboards.openapi.yaml#/~1api~1moments~1storyboards~1runs~1{run_id}~1finale"
  /internal/moments/moments:
    post:
      tags: [internal]
      operationId: requestMomentInternal
      summary: A module requests a moment
      description: |
        The kit's service identity (`x-canccu-service`), no session. The request runs through the same arbiter
        as a rule's: 201 started (it may wait in a zone's queue), 200 renewed, 409 `moment_refused` only for one
        owner per happening.
      security:
        - {}
      parameters:
        - name: tenant_id
          in: query
          required: true
          description: The tenant the calling module serves, set by its kit, never from a client's input.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MomentRequest"
      responses:
        "200":
          $ref: "#/components/responses/MomentAnswer"
        "201":
          $ref: "#/components/responses/MomentAnswer"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          description: "`service_unauthenticated`: no valid service identity."
          content:
            application/json:
              schema:
                $ref: "common.openapi.yaml#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: canccu_session
      description: Opaque session id (contracts/admin.md, Session and rights). Rights are checked through admin.
  parameters:
    MomentId:
      name: moment_id
      in: path
      required: true
      description: The moment.
      schema:
        type: string
    AnnouncementId:
      name: announcement_id
      in: path
      required: true
      description: The announcement.
      schema:
        type: string
    TemplateKey:
      name: template_key
      in: path
      required: true
      description: The announcement template.
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{1,31}$"
    StoryKey:
      name: story_key
      in: path
      required: true
      description: The story.
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{0,39}$"
    RunId:
      name: run_id
      in: path
      required: true
      description: A run of a story.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: The same key from the same person within 24 hours answers as the first time and does nothing again.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{8,64}$"
    HistoryZone:
      name: zone
      in: query
      description: This zone's rows and the whole-moment rows.
      schema:
        $ref: "#/components/schemas/ZoneKey"
    HistoryRegion:
      name: region
      in: query
      description: Rows of this region.
      schema:
        $ref: "#/components/schemas/Role"
    HistoryOrigin:
      name: origin
      in: query
      description: Rows of moments of this origin.
      schema:
        $ref: "#/components/schemas/Origin"
    HistoryAction:
      name: action
      in: query
      description: Rows of this action.
      schema:
        $ref: "#/components/schemas/HistoryAction"
  responses:
    AnnouncementAnswer:
      description: The announcement.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Announcement"
    MomentAnswer:
      description: The moment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Moment"
    VenueAnswer:
      description: The events it reached.
      content:
        application/json:
          schema:
            type: object
            required: [tenant_ids]
            properties:
              tenant_ids:
                type: array
                items:
                  type: string
    Conflict:
      description: |
        `version_conflict`: a stale `revision`; `event_archived`: the event is read-only; `moment_refused`: every
        region the moment may take is held by a higher rank on every zone it names (the body's `error` adds
        `retry_after_seconds` and `held_by`); `emergency_active`: an emergency already runs; `not_running`: the
        moment has ended, the announcement ended or was withdrawn, the story is off or its loop ended;
        `not_fired`: a story's condition or run mode said no (the message says which).
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    StoryboardsAnswer:
      description: The event's stories and settings, the presets and the live and recent runs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Storyboards"
    StoryboardRunAnswer:
      description: The run.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StoryboardRun"
    ScenesAnswer:
      description: The scenes, each zone's scene now and the crew button pressed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Scenes"
  schemas:
    Storyboards:
      type: object
      required: [stories, settings, revision, presets, runs]
      properties:
        stories:
          type: array
          items:
            allOf:
              - $ref: "moments/storyboard.schema.json"
              - type: object
                required: [free_variables, rule_off]
                properties:
                  free_variables:
                    type: array
                    items:
                      type: string
                  rule_off:
                    type: [string, "null"]
                    description: |
                      The built-in rule this story takes over while on (SD6), or null. Pizza orders ready takes
                      over only the arrived orders (`pizza.order.arrived`): its `pizza` rule still shows each
                      order placed.
        settings:
          $ref: "moments/storyboard.schema.json#/$defs/Settings"
        revision:
          type: integer
        presets:
          type: array
          items:
            type: string
        runs:
          type: array
          items:
            $ref: "#/components/schemas/StoryboardRun"
    StoryboardRun:
      description: One run of a story from its trigger to its end (contracts/moments.md, Storyboards).
      type: object
      required: [id, story_key, name, source, status, test, zones, t, round, rounds_played, has_finale, started_at, ended_at, end_reason]
      properties:
        id:
          type: string
        story_key:
          type: string
        name:
          type: string
        source:
          description: What `per_source` keys on (`item:<id>`, `match:<id>`, `clock:<time>`, …).
          type: string
        status:
          type: string
          enum: [live, ended]
        test:
          type: boolean
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
        t:
          description: The trigger time T the rounds count from.
          type: string
          format: date-time
        round:
          description: The round on screen, or null between rounds.
          type: [object, "null"]
          required: [number, finale, until]
          properties:
            number:
              type: integer
            finale:
              type: boolean
            until:
              type: string
              format: date-time
        rounds_played:
          type: integer
        has_finale:
          type: boolean
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        end_reason:
          type: [string, "null"]
          enum: [planned, stopped, cancelled, time_limit, cleared, null]
    ZoneKey:
      type: string
      pattern: "^[a-z0-9_-]{2,32}$"
    Class:
      type: string
      enum: [emergency, stream, announcement, spotlight, storyboard, tournament, finals, hot_game, reactions, ticker]
    Role:
      type: string
      enum: [full, hero, rail, venue_rail, ticker, overlay]
    Origin:
      type: string
      enum: [rule, crew, emergency, module]
    HistoryAction:
      type: string
      enum: [started, refused, placed, hidden, queued, back, changed, ended, moved, round_started, round_skipped, loop_ended, not_fired]
    Order:
      type: array
      description: Every class once, highest first, `emergency` first.
      minItems: 10
      maxItems: 10
      uniqueItems: true
      items:
        $ref: "#/components/schemas/Class"
    ZoneOrder:
      type: object
      required: [zone_key, order]
      properties:
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        order:
          $ref: "#/components/schemas/Order"
    AirtimeSettings:
      type: object
      additionalProperties: false
      description: The arbiter's airtime (#777). Each field is optional on `PUT`; a missing one keeps its stored value.
      properties:
        min_on_air_seconds:
          type: integer
          minimum: 60
          maximum: 120
          description: The floor a shown moment holds the hero against all but the emergency and a person's action. Default 90.
        gap_seconds:
          type: integer
          minimum: 0
          maximum: 30
          description: The breathing gap the hero stays free between two moments. Default 10.
        stale_after_minutes:
          type: object
          description: Per class, how long a waiting moment may wait before it ends `stale`. Default 30 each.
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 240
    ZoneQueue:
      type: object
      required: [zone_key, holder, free_until, waiting, stale]
      properties:
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        holder:
          type: [string, "null"]
          description: The moment that holds the hero, or null.
        free_until:
          type: [string, "null"]
          format: date-time
          description: The breathing gap's end, while it runs.
        waiting:
          type: array
          description: In queue order.
          items:
            type: object
            required: [moment_id, title, class, since, in_rail]
            properties:
              moment_id:
                type: string
              title:
                type: string
              class:
                $ref: "#/components/schemas/Class"
              since:
                type: string
                format: date-time
              in_rail:
                type: boolean
        stale:
          type: array
          description: The last hour's, newest first, at most 10.
          items:
            type: object
            required: [title, class, at]
            properties:
              title:
                type: string
              class:
                $ref: "#/components/schemas/Class"
              at:
                type: string
                format: date-time
    PriorityOrders:
      type: object
      required: [order, zones, ranks, revision]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneOrder"
        ranks:
          type: object
          description: Each class's rank in the event's order.
          additionalProperties:
            type: integer
        airtime:
          $ref: "#/components/schemas/AirtimeSettings"
        revision:
          type: integer
    Qr:
      type: object
      required: [path, label]
      properties:
        path:
          type: string
          pattern: "^/[^/]"
          maxLength: 512
        label:
          type: string
          maxLength: 60
    Binding:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [none, leaderboard, session]
        ref:
          type: [string, "null"]
    Source:
      type: object
      required: [module, event_id, ref]
      properties:
        module:
          type: string
        event_id:
          type: [string, "null"]
        ref:
          type: [string, "null"]
    Placement:
      type: object
      required: [zone_key, state, role, since]
      properties:
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        state:
          type: string
          enum: [placed, hidden, unplaced, left]
        role:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        since:
          type: string
          format: date-time
    MomentRequest:
      type: object
      additionalProperties: false
      required: [class, template, content]
      properties:
        class:
          $ref: "#/components/schemas/Class"
        template:
          type: string
        content:
          type: object
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
        regions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Role"
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 7200
        patience_seconds:
          type: integer
          minimum: 0
          maximum: 7200
          deprecated: true
          description: Deprecated (#777). May shorten, never lengthen, the moment's `stale_after`.
        qr:
          $ref: "#/components/schemas/Qr"
        binding:
          $ref: "#/components/schemas/Binding"
        source:
          $ref: "#/components/schemas/Source"
        dedupe_key:
          type: string
          maxLength: 200
    Moment:
      type: object
      required: [id, class, rank, kind, regions, template, content, zones, origin, rule_id, source, actor, starts_at, expires_at, patience_seconds, qr, binding, placements, ended_at, end_reason]
      properties:
        id:
          type: string
        class:
          $ref: "#/components/schemas/Class"
        rank:
          type: integer
        kind:
          type: string
          enum: [takeover, block, overlay]
        regions:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        template:
          type: string
        content:
          type: object
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
        origin:
          $ref: "#/components/schemas/Origin"
        rule_id:
          type: [string, "null"]
        source:
          $ref: "#/components/schemas/Source"
        actor:
          oneOf:
            - type: object
              required: [user_id, name]
              properties:
                user_id:
                  type: string
                name:
                  type: string
            - type: "null"
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        patience_seconds:
          type: integer
          deprecated: true
          description: Deprecated (#777). How long after its start, or its last new content, it may still wait for a place before it ends `stale`.
        qr:
          oneOf:
            - $ref: "#/components/schemas/Qr"
            - type: "null"
        binding:
          oneOf:
            - $ref: "#/components/schemas/Binding"
            - type: "null"
        placements:
          type: array
          items:
            $ref: "#/components/schemas/Placement"
        ended_at:
          type: [string, "null"]
          format: date-time
        end_reason:
          type: [string, "null"]
          description: "`stale`: it waited past its class's `stale_after` (#777). `preempted` is deprecated and no longer sent."
          enum: [expired, cleared, preempted, source_ended, stale, null]
    SpotlightRequest:
      type: object
      additionalProperties: false
      required: [show]
      properties:
        show:
          type: string
          enum: [standings, bracket, photo, message]
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 7200
          default: 300
        session_id:
          type: string
        photo_url:
          type: string
          pattern: "^/[^/]"
        caption:
          type: string
          maxLength: 140
        title:
          type: string
          minLength: 1
          maxLength: 80
        body:
          type: string
          maxLength: 280
        qr:
          $ref: "#/components/schemas/Qr"
    EmergencyRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        body:
          type: string
          maxLength: 280
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
    EmergencyEnd:
      type: object
      properties:
        all_clear:
          type: boolean
          default: false
    RuleSettings:
      type: object
      required: [enabled, template, class, regions, ttl_seconds, zones, cue]
      properties:
        enabled:
          type: boolean
        template:
          type: string
        class:
          $ref: "#/components/schemas/Class"
        regions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Role"
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 7200
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
        cue:
          type: [string, "null"]
          maxLength: 64
    Rule:
      allOf:
        - $ref: "#/components/schemas/RuleSettings"
        - type: object
          required: [rule_id, on, templates, revision]
          properties:
            rule_id:
              type: string
            "on":
              type: array
              description: The catalog events it fires on.
              items:
                type: string
            templates:
              type: array
              description: The templates it may use.
              items:
                type: string
            revision:
              type: integer
    HistoryRow:
      type: object
      required: [seq, at, zone_key, action, moment_id, class, origin, title, region, why, displaced, outcome, actor_name]
      properties:
        seq:
          type: integer
        at:
          type: string
          format: date-time
        zone_key:
          type: [string, "null"]
        action:
          $ref: "#/components/schemas/HistoryAction"
        moment_id:
          type: [string, "null"]
        class:
          $ref: "#/components/schemas/Class"
        origin:
          $ref: "#/components/schemas/Origin"
        title:
          type: string
        region:
          type: [string, "null"]
        why:
          type: string
        displaced:
          type: [string, "null"]
        outcome:
          type: [string, "null"]
        actor_name:
          type: [string, "null"]
    SceneKey:
      type: string
      pattern: "^[a-z][a-z0-9_-]{1,31}$"
    SceneCondition:
      description: |
        When a scene holds; any one of a scene's conditions is enough (contracts/moments.md, Scenes).
        `time`: every day of the event from `from` to `to` (HH:MM in the event's time zone; past midnight when
        `to` is earlier). `agenda`: an item of one of `kinds` runs on the zone, or, with `starts_within_minutes`,
        starts within that many minutes. `checkins`: over `over` arrival check-ins in the last hour. `presence`:
        members online `over` and/or `under` a count (never while no count is known). `games`: a game is
        surging. `crew`: the scene's crew button, holding `minutes` per press.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, from, to]
          properties:
            type: { const: time }
            from: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
            to: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        - type: object
          additionalProperties: false
          required: [type, kinds]
          properties:
            type: { const: agenda }
            kinds:
              type: array
              minItems: 1
              items: { type: string }
            starts_within_minutes: { type: integer, minimum: 1, maximum: 720 }
        - type: object
          additionalProperties: false
          required: [type, over]
          properties:
            type: { const: checkins }
            over: { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { const: presence }
            over: { type: integer, minimum: 0 }
            under: { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { const: games }
        - type: object
          additionalProperties: false
          required: [type, minutes]
          properties:
            type: { const: crew }
            minutes: { type: integer, minimum: 1, maximum: 720 }
    SceneMotion:
      description: A level, or `calmer` and `livelier`, one step from the event's level as Follow the day moves it.
      type: [string, "null"]
      enum: [none, calm, lively, party, calmer, livelier, null]
    StageMood:
      description: The stage's mood, one of its phase tints (contracts/screen.md, The stage).
      type: [string, "null"]
      enum: [build_up, doors, peak, wind_down, quiet_hours, null]
    ScenePalette:
      description: "The theme's primary and accent colours while the scene holds (L14, the palette only)."
      type: [object, "null"]
      additionalProperties: false
      properties:
        primary: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        accent: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
    HeroFeature:
      type: string
      enum: [bracket, leaderboard, countdown, playlist, photo, hot_game, today_numbers]
    SceneChanges:
      type: object
      additionalProperties: false
      required: [motion, layouts, stage_mood, palette, sound, quiet, hero_off]
      properties:
        motion:
          $ref: "#/components/schemas/SceneMotion"
        layouts:
          description: Zone key to layout id; a zone not named keeps its own layout.
          type: object
          additionalProperties:
            type: string
        stage_mood:
          $ref: "#/components/schemas/StageMood"
        palette:
          $ref: "#/components/schemas/ScenePalette"
        sound:
          description: Sound on or off for the sound gates (#113); null keeps the zone's.
          type: [boolean, "null"]
        quiet:
          description: Quiet mode, the level at most `calm`; the sound gates play urgent only (#113).
          type: boolean
        hero_off:
          description: The hero's features the scene switches off ("no slides at the peak").
          type: array
          items:
            $ref: "#/components/schemas/HeroFeature"
    Scene:
      type: object
      additionalProperties: false
      required: [key, name, preset, zones, when, then, hold_minutes, blend_seconds]
      properties:
        key:
          $ref: "#/components/schemas/SceneKey"
        name:
          type: string
          minLength: 1
          maxLength: 60
        preset:
          description: The preset it was copied from (`quiet`, `wind_down`, `doors`, `peak`, `daytime`), or null.
          type: [string, "null"]
        zones:
          description: The zones it applies to; empty, every zone.
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
        when:
          description: Any one is enough; an empty list always holds.
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/SceneCondition"
        then:
          $ref: "#/components/schemas/SceneChanges"
        hold_minutes:
          description: How long it stays on against any scene lower in the list, so scenes never flip back and forth.
          type: integer
          minimum: 0
          maximum: 240
        blend_seconds:
          description: How long the screens take to blend its palette and mood in.
          type: integer
          minimum: 0
          maximum: 600
    Scenes:
      type: object
      required: [scenes, revision, copied, zones, crew]
      properties:
        scenes:
          type: array
          items:
            $ref: "#/components/schemas/Scene"
        revision:
          type: integer
          minimum: 0
        copied:
          description: False until the event's first use copied the presets.
          type: boolean
        zones:
          description: Each zone's scene now, as last sent in `moments.scene.changed`.
          type: array
          items:
            type: object
            required: [zone_key, scene_key, since, why, heartbeat_bpm]
            properties:
              zone_key:
                $ref: "#/components/schemas/ZoneKey"
              scene_key:
                type: [string, "null"]
              since:
                type: string
                format: date-time
              why:
                type: string
              heartbeat_bpm:
                type: integer
                minimum: 4
                maximum: 30
        crew:
          description: The crew button pressed now, or null.
          type: [object, "null"]
          required: [scene_key, zones, until]
          properties:
            scene_key:
              $ref: "#/components/schemas/SceneKey"
            zones:
              type: array
              items:
                $ref: "#/components/schemas/ZoneKey"
            until:
              type: string
              format: date-time
    SoundCategory:
      type: string
      description: The six fixed categories, highest priority first; only `urgent` interrupts a playing sound.
      enum: [urgent, result, attention, something_new, ended, ambient]
    EffectName:
      type: string
      description: The box effects of design sheet 14.
      enum: [pop, tilt, flip, ripple, slide, glow, ring_burst]
    CueInput:
      type: object
      required: [category, enabled, level, cooldown_seconds, catch_up_seconds, once_per_source, sounds, effects, hold_seconds, revision]
      properties:
        category:
          $ref: "#/components/schemas/SoundCategory"
        enabled:
          type: boolean
          description: The sound's on/off; the picture plays either way.
        level:
          type: integer
          minimum: 0
          maximum: 100
          description: Percent, times the category's level and the master volume.
        cooldown_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Not again on a zone for this long.
        catch_up_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: How late a screen that missed it may still start it (D17).
        catch_up_before_start:
          description: |
            Minutes before the source's start, `[from, to]`: the cue sounds only in that window, and catches up
            until its end (the legacy tournament windows, T−29 to T−15 and T−14 to T−2). A moment's cue measures
            from its source's start where it has one (a run-of-show item's, as an announcement's), else from the
            moment's own start, which is past the window: there the cue does not sound. A new photo's or a
            storyboard step's cue has no start to measure from and is not held to the window.
          oneOf:
            - type: "null"
            - type: array
              minItems: 2
              maxItems: 2
              items:
                type: integer
        once_per_source:
          type: boolean
          description: One source (a match, an order) sounds once on a zone in 7 days.
        sounds:
          type: array
          maxItems: 20
          description: Library sound ids, picked at random, never the same twice running on a zone.
          items:
            type: string
        voice_line:
          type: [string, "null"]
          description: A library sound played right after the sound, counted with it as one.
        effects:
          type: array
          description: The picture's pool, picked at random, never the same twice running; empty for sound only.
          items:
            $ref: "#/components/schemas/EffectName"
        hold_seconds:
          type: integer
          minimum: 60
          maximum: 120
          description: How long the frame and glow hold before they fade over 10 s (L8).
        revision:
          type: integer
          minimum: 0
    Cue:
      allOf:
        - $ref: "#/components/schemas/CueInput"
        - type: object
          required: [name, builtin]
          properties:
            name:
              type: string
            builtin:
              type: boolean
              description: One of the 25 seeded cues; false for the event's own.
    SoundSettingsInput:
      type: object
      required: [enabled, volume, hourly_budget, per_minute, per_source_seconds, categories, revision]
      properties:
        enabled:
          type: boolean
          description: The master switch.
        volume:
          type: integer
          minimum: 0
          maximum: 100
        hourly_budget:
          type: integer
          minimum: 0
          maximum: 1000
          description: Sounds per zone per hour (20 by default); urgent passes and counts.
        per_minute:
          type: integer
          minimum: 1
          maximum: 60
          description: The flood guard per zone (3 by default); urgent passes and counts.
        per_source_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: The flood guard per cue and source (10 by default).
        categories:
          type: object
          description: Exactly the six categories.
          additionalProperties: false
          required: [urgent, result, attention, something_new, ended, ambient]
          properties:
            urgent:
              $ref: "#/components/schemas/CategorySettings"
            result:
              $ref: "#/components/schemas/CategorySettings"
            attention:
              $ref: "#/components/schemas/CategorySettings"
            something_new:
              $ref: "#/components/schemas/CategorySettings"
            ended:
              $ref: "#/components/schemas/CategorySettings"
            ambient:
              $ref: "#/components/schemas/CategorySettings"
        revision:
          type: integer
          minimum: 0
    CategorySettings:
      type: object
      required: [enabled, level]
      properties:
        enabled:
          type: boolean
        level:
          type: integer
          minimum: 0
          maximum: 100
    SoundSettings:
      allOf:
        - $ref: "#/components/schemas/SoundSettingsInput"
        - type: object
          required: [muted_until]
          properties:
            muted_until:
              type: [string, "null"]
              format: date-time
    SoundDesk:
      type: object
      required: [settings, categories, zones]
      properties:
        settings:
          $ref: "#/components/schemas/SoundSettings"
        categories:
          type: array
          items:
            type: object
            required: [name, priority, interrupts, plays_at_calm]
            properties:
              name:
                $ref: "#/components/schemas/SoundCategory"
              priority:
                type: integer
              interrupts:
                type: boolean
              plays_at_calm:
                type: boolean
        zones:
          type: array
          items:
            type: object
            required: [zone_key, minute, hour, energy, lets_through, sound_screen]
            properties:
              zone_key:
                $ref: "#/components/schemas/ZoneKey"
              minute:
                type: integer
              hour:
                type: integer
              energy:
                description: "`party`, `lively`, `calm` or `quiet`; null when Screen does not answer."
                type: [string, "null"]
              lets_through:
                type: [array, "null"]
                items:
                  $ref: "#/components/schemas/SoundCategory"
              sound_screen:
                description: The zone's sound screen as Screen reports it (E12, E13), or null for none.
                type: [object, "null"]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  online:
                    type: boolean
                  audio_unlocked:
                    type: [boolean, "null"]
    LibrarySound:
      type: object
      required: [id, title, url, length_ms, source, asset_id, size_bytes, used_by, warning]
      properties:
        id:
          type: string
          description: "`pack.<name>` for the default pack, `snd_<asset id>` for the event's."
        title:
          type: string
        url:
          type: string
          description: The pack's file under `/api/moments/sounds/pack/`, or the asset's under `/api/screen/files/`.
        length_ms:
          type: integer
        source:
          type: string
          enum: [pack, upload]
        asset_id:
          type: [string, "null"]
        size_bytes:
          type: [integer, "null"]
        used_by:
          type: array
          items:
            type: string
        warning:
          type: [string, "null"]
    SoundLogRow:
      type: object
      required: [seq, at, zone_key, cue, sound, outcome, reason, detail, source]
      properties:
        seq:
          type: integer
        at:
          type: string
          format: date-time
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        cue:
          type: string
        sound:
          type: [string, "null"]
        outcome:
          type: string
          enum: [played, queued, suppressed, dropped, missed]
        reason:
          type: string
          description: A reason code (contracts/moments.md, The sound log).
        detail:
          type: [string, "null"]
        source:
          type: [string, "null"]
    AnnouncementLevel:
      type: string
      enum: [info, urgent]
      description: Emergency is not a level here; it is Emergency's own flow.
    AnnouncementChannels:
      type: object
      properties:
        screen:
          type: boolean
          default: true
          description: The card, in the rail (urgent also the hero), else the ticker.
        ticker:
          type: boolean
          default: false
          description: A ticker line, a claim in the `ticker` role owned by Moments (D13).
        discord:
          type: boolean
          default: false
          description: The bot's post in the event's announcements channel (step 6).
        push:
          type: boolean
          default: false
          description: Notify's `announcements` topic (D20).
    AnnouncementWhen:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [now, at, item]
        at:
          type: string
          format: date-time
          description: For `at`, at most 14 days ahead.
        minutes_before:
          type: integer
          minimum: 0
          maximum: 1440
          default: 0
          description: For `item`, before the item's start; it follows the item's delays (E15).
    AnnouncementInput:
      type: object
      required: [title, level]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: With placeholders; at most 60 characters once filled.
        body:
          type: string
          maxLength: 400
          default: ""
          description: With placeholders; at most 140 characters once filled.
        level:
          $ref: "#/components/schemas/AnnouncementLevel"
        full_screen:
          type: boolean
          default: false
        channels:
          $ref: "#/components/schemas/AnnouncementChannels"
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
          default: []
        duration_seconds:
          type: integer
          minimum: 60
          maximum: 7200
          default: 300
        item_id:
          type: [string, "null"]
          description: The run-of-show item its `item.` placeholders read, and for `when.mode` `item` its time.
        variables:
          type: object
          additionalProperties:
            type: string
            maxLength: 60
          description: The values of its free variables, by name.
        when:
          $ref: "#/components/schemas/AnnouncementWhen"
        template_key:
          type: [string, "null"]
          description: The template it started from, kept for the record.
    AnnouncementEdit:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          maxLength: 400
        variables:
          type: object
          additionalProperties:
            type: string
            maxLength: 60
    Announcement:
      type: object
      required: [id, status, level, full_screen, title_text, body_text, variables, item_id, title, body, channels,
        zones, duration_seconds, when, fire_at, sent_at, expires_at, updated_until, ended_at, end_reason, why,
        actor, moments]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [scheduled, live, ended, withdrawn]
        level:
          $ref: "#/components/schemas/AnnouncementLevel"
        full_screen:
          type: boolean
        title_text:
          type: string
        body_text:
          type: string
        variables:
          type: object
          additionalProperties:
            type: string
        item_id:
          type: [string, "null"]
        title:
          type: [string, "null"]
          description: As filled when it was sent; null while scheduled.
        body:
          type: [string, "null"]
        channels:
          $ref: "#/components/schemas/AnnouncementChannels"
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
        duration_seconds:
          type: integer
        when:
          $ref: "#/components/schemas/AnnouncementWhen"
        fire_at:
          type: [string, "null"]
          format: date-time
        sent_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        updated_until:
          type: [string, "null"]
          format: date-time
          description: The "Updated" chip shows until then.
        ended_at:
          type: [string, "null"]
          format: date-time
        end_reason:
          type: [string, "null"]
          enum: [expired, withdrawn, item_cancelled, item_removed, ended_on_air, null]
        why:
          type: [string, "null"]
        actor:
          type: [object, "null"]
          required: [user_id, name]
          properties:
            user_id:
              type: string
            name:
              type: string
        moments:
          type: object
          required: [card, line]
          properties:
            card:
              type: [string, "null"]
            line:
              type: [string, "null"]
    AnnouncementPreview:
      type: object
      required: [title, body, regions, line, push, discord, zones]
      properties:
        title:
          type: string
        body:
          type: string
        regions:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          description: The card's chain; empty when the screen card is off.
        line:
          type: [string, "null"]
          description: The ticker line's text, or null when that channel is off.
        push:
          type: [object, "null"]
          required: [title, body, urgent]
          properties:
            title:
              type: string
            body:
              type: string
            urgent:
              type: boolean
        discord:
          type: [object, "null"]
          required: [text]
          properties:
            text:
              type: string
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
          description: The zones it reaches (every zone Moments knows when it names none).
    AnnouncementTemplateInput:
      type: object
      required: [name, title, level, revision]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          maxLength: 400
          default: ""
        level:
          $ref: "#/components/schemas/AnnouncementLevel"
        revision:
          type: integer
          minimum: 0
    AnnouncementTemplate:
      type: object
      required: [key, name, title, body, level, builtin, variables, revision]
      properties:
        key:
          type: string
        name:
          type: string
        title:
          type: string
        body:
          type: string
        level:
          $ref: "#/components/schemas/AnnouncementLevel"
        builtin:
          type: boolean
        variables:
          type: array
          items:
            type: string
          description: The free variables its texts name, in order of first use.
        revision:
          type: integer
