openapi: 3.1.0
info:
  title: Moments API
  version: 1.0.0
  summary: The arbiter of the screens' moments, engine part, and its cues and sound.
  description: |
    Machine-readable part of the moments contract. Prose, the arbiter's rules, rules, history and events:
    contracts/moments.md. Conventions (snake_case, RFC 3339 UTC times, error body): contracts/README.md.
    The event (tenant) comes from the hostname; only the internal request names a tenant, whose `tenant_id`
    the calling module's kit sets.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Same origin, behind Caddy; the hostname selects the event.
tags:
  - name: moments
    description: Running moments and the crew's actions on them.
  - name: emergency
    description: The emergency takeover, per event and venue-wide.
  - name: settings
    description: The priority order and the built-in rules.
  - name: scenes
    description: The venue's autopilot, the mood of each zone, and the crew button.
  - name: history
    description: What played where, why, and how it ended.
  - name: cues
    description: Cues and sound (#113), the sound desk; the paths are in moments/cues.openapi.yaml.
  - name: privacy
    description: The caller's own rows (contracts/README.md, Privacy).
  - name: internal
    description: Module paths on the stack's internal network; the edge Caddy never routes them.
security:
  - session: []
paths:
  /api/moments/moments:
    get:
      tags: [moments]
      operationId: listMoments
      summary: The running moments, with the zones Moments knows
      description: Right `moments.read`. Highest rank first, each with its placements per zone.
      responses:
        "200":
          description: Running moments.
          content:
            application/json:
              schema:
                type: object
                required: [moments, zones]
                properties:
                  moments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Moment"
                  zones:
                    type: array
                    items:
                      $ref: "#/components/schemas/ZoneKey"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
  /api/moments/moments/{moment_id}/end:
    post:
      tags: [moments]
      operationId: endMoment
      summary: End a moment everywhere, or on one zone
      description: |
        Right `moments.take`. Without `zone_key`, ends a crew moment everywhere; with it, any moment on that
        zone only ("End in zone"). An emergency ends only through the emergency paths. Audited.
      parameters:
        - $ref: "#/components/parameters/MomentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                zone_key:
                  $ref: "#/components/schemas/ZoneKey"
      responses:
        "200":
          $ref: "#/components/responses/MomentAnswer"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/moments/moments/{moment_id}/extend:
    post:
      tags: [moments]
      operationId: extendMoment
      summary: Move a moment's end on
      description: Right `moments.take`. `expires_at` moves on by `seconds`, at most 7200 s after now. Audited.
      parameters:
        - $ref: "#/components/parameters/MomentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seconds]
              properties:
                seconds:
                  type: integer
                  minimum: 1
                  maximum: 3600
      responses:
        "200":
          $ref: "#/components/responses/MomentAnswer"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/moments/spotlight:
    post:
      tags: [moments]
      operationId: startSpotlight
      summary: Start a crew spotlight in the hero
      description: Right `moments.take`. "From the crew" on screen; the history keeps the name. Audited.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpotlightRequest"
      responses:
        "201":
          $ref: "#/components/responses/MomentAnswer"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/moments/emergency:
    post:
      tags: [emergency]
      operationId: startEmergency
      summary: Start the event's emergency
      description: Right `moments.emergency`. Full screen at rank 100 on the zones, no end time. Audited.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyRequest"
      responses:
        "201":
          $ref: "#/components/responses/MomentAnswer"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/moments/emergency/end:
    post:
      tags: [emergency]
      operationId: endEmergency
      summary: End the event's emergency
      description: Right `moments.emergency`. With `all_clear`, an "All clear" card takes the rail for 60 s. Audited.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyEnd"
      responses:
        "200":
          $ref: "#/components/responses/MomentAnswer"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.openapi.yaml#/components/responses/NotFound"
          description: "`not_found`: no emergency runs."
        "409":
          $ref: "#/components/responses/Conflict"
  /api/moments/venue-emergency:
    post:
      tags: [emergency]
      operationId: startVenueEmergency
      summary: Start the emergency of every event at a venue
      description: The superadmin, on the superadmin hostname only. Each event's emergency is audited there.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EmergencyRequest"
                - type: object
                  required: [venue_id]
                  properties:
                    venue_id:
                      type: string
      responses:
        "200":
          $ref: "#/components/responses/VenueAnswer"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.openapi.yaml#/components/responses/NotFound"
          description: "`not_found`: no event at the venue that is not archived."
  /api/moments/venue-emergency/end:
    post:
      tags: [emergency]
      operationId: endVenueEmergency
      summary: End the emergency of every event at a venue
      description: The superadmin, on the superadmin hostname only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EmergencyEnd"
                - type: object
                  required: [venue_id]
                  properties:
                    venue_id:
                      type: string
      responses:
        "200":
          $ref: "#/components/responses/VenueAnswer"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.openapi.yaml#/components/responses/NotFound"
  /api/moments/priorities:
    get:
      tags: [settings]
      operationId: getPriorities
      summary: The event's priority order and the zones' own
      description: Right `moments.read`.
      responses:
        "200":
          description: The orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriorityOrders"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
    put:
      tags: [settings]
      operationId: putPriorities
      summary: Replace the priority orders
      description: |
        Right `moments.settings.write`. Each order names every class once, `emergency` first. Every running
        moment is ranked again at once; none ends. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [order, zones, revision]
              properties:
                order:
                  $ref: "#/components/schemas/Order"
                zones:
                  type: array
                  items:
                    $ref: "#/components/schemas/ZoneOrder"
                revision:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: The orders as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriorityOrders"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/moments/rules:
    get:
      tags: [settings]
      operationId: listRules
      summary: The built-in rules and their settings
      description: Right `moments.read`.
      responses:
        "200":
          description: Every built-in rule.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/Rule"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
  /api/moments/rules/{rule_id}:
    put:
      tags: [settings]
      operationId: putRule
      summary: Change one built-in rule's settings
      description: Right `moments.settings.write`. Audited.
      parameters:
        - name: rule_id
          in: path
          required: true
          description: The rule.
          schema:
            type: string
            enum: [match_called, standings, finals_result, pizza, hot_game]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RuleSettings"
                - type: object
                  required: [revision]
                  properties:
                    revision:
                      type: integer
                      minimum: 0
      responses:
        "200":
          description: The rule as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/moments/scenes:
    get:
      tags: [scenes]
      operationId: getScenes
      summary: The event's scenes, each zone's scene now, and the crew button pressed
      description: |
        Right `moments.read`. Before the event's first use the list is the presets, `revision` 0 and `copied`
        false; the first scene pass copies them (contracts/moments.md, Scenes).
      responses:
        "200":
          $ref: "#/components/responses/ScenesAnswer"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
    put:
      tags: [scenes]
      operationId: putScenes
      summary: Replace the event's scenes, in priority order
      description: |
        Right `moments.settings.write`. Every zone is put in its scene at once. A stale `revision` is 409
        `version_conflict`; an archived event is 409 `event_archived`. Audited (`moments.scenes.changed`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scenes, revision]
              properties:
                scenes:
                  type: array
                  maxItems: 20
                  items:
                    $ref: "#/components/schemas/Scene"
                revision:
                  type: integer
                  minimum: 0
      responses:
        "200":
          $ref: "#/components/responses/ScenesAnswer"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/moments/scenes/reset:
    post:
      tags: [scenes]
      operationId: resetScenes
      summary: Put the presets of this platform version back in place of the event's scenes
      description: |
        Right `moments.settings.write`, with the list's `revision` (O7). Audited (`moments.scenes.reset`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision:
                  type: integer
                  minimum: 0
      responses:
        "200":
          $ref: "#/components/responses/ScenesAnswer"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/moments/scenes/{scene_key}/take:
    post:
      tags: [scenes]
      operationId: takeScene
      summary: Press a scene's crew button ("Peak now"), or press it again to take it off
      description: |
        Right `moments.scenes.take`. One tap, no confirmation (U11). The scene wins on `zones` (empty: every
        zone) for its crew condition's `minutes`, over the whole list, until that time ends or the same button
        is pressed again (E7); another scene's press replaces it. A scene without a crew condition is 400
        `invalid_request`. Audited (`moments.scene.taken`, `moments.scene.released`).
      parameters:
        - name: scene_key
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SceneKey"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                zones:
                  type: array
                  items:
                    $ref: "#/components/schemas/ZoneKey"
      responses:
        "200":
          $ref: "#/components/responses/ScenesAnswer"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/moments/history:
    get:
      tags: [history]
      operationId: listHistory
      summary: The history, newest first
      description: Right `moments.read`.
      parameters:
        - $ref: "#/components/parameters/HistoryZone"
        - $ref: "#/components/parameters/HistoryRegion"
        - $ref: "#/components/parameters/HistoryOrigin"
        - $ref: "#/components/parameters/HistoryAction"
        - name: limit
          in: query
          description: Rows per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: before
          in: query
          description: The `seq` of the last row of the previous page.
          schema:
            type: integer
      responses:
        "200":
          description: A page of rows.
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryRow"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
  /api/moments/history.csv:
    get:
      tags: [history]
      operationId: exportHistory
      summary: The history as CSV
      description: Right `moments.read`. The same filters; at most 10,000 rows.
      parameters:
        - $ref: "#/components/parameters/HistoryZone"
        - $ref: "#/components/parameters/HistoryRegion"
        - $ref: "#/components/parameters/HistoryOrigin"
        - $ref: "#/components/parameters/HistoryAction"
      responses:
        "200":
          description: "Columns: at, zone, action, moment, class, region, why, displaced, outcome."
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
  /api/moments/me/export:
    get:
      tags: [privacy]
      operationId: exportMine
      summary: The caller's history rows at this event
      responses:
        "200":
          description: The rows that name the caller.
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryRow"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
  /api/moments/me:
    delete:
      tags: [privacy]
      operationId: deleteMine
      summary: Remove the caller's name and id from the history
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
  /api/moments/sound:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sound"
  /api/moments/sound/settings:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sound~1settings"
  /api/moments/sound/mute:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sound~1mute"
  /api/moments/sound/check:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sound~1check"
  /api/moments/sound/log:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sound~1log"
  /api/moments/cues:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1cues"
  /api/moments/cues/{cue}:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1cues~1{cue}"
  /api/moments/sounds:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sounds"
  /api/moments/sounds/{sound_id}:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sounds~1{sound_id}"
  /api/moments/sounds/pack/{file}:
    $ref: "moments/cues.openapi.yaml#/~1api~1moments~1sounds~1pack~1{file}"
  /internal/moments/moments:
    post:
      tags: [internal]
      operationId: requestMomentInternal
      summary: A module requests a moment
      description: |
        The kit's service identity (`x-canccu-service`), no session. The request runs through the same arbiter
        as a rule's: 201 started, 200 renewed, 409 `moment_refused` with a retry.
      security:
        - {}
      parameters:
        - name: tenant_id
          in: query
          required: true
          description: The tenant the calling module serves, set by its kit, never from a client's input.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MomentRequest"
      responses:
        "200":
          $ref: "#/components/responses/MomentAnswer"
        "201":
          $ref: "#/components/responses/MomentAnswer"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          description: "`service_unauthenticated`: no valid service identity."
          content:
            application/json:
              schema:
                $ref: "common.openapi.yaml#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: canccu_session
      description: Opaque session id (contracts/admin.md, Session and rights). Rights are checked through admin.
  parameters:
    MomentId:
      name: moment_id
      in: path
      required: true
      description: The moment.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: The same key from the same person within 24 hours answers as the first time and does nothing again.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{8,64}$"
    HistoryZone:
      name: zone
      in: query
      description: This zone's rows and the whole-moment rows.
      schema:
        $ref: "#/components/schemas/ZoneKey"
    HistoryRegion:
      name: region
      in: query
      description: Rows of this region.
      schema:
        $ref: "#/components/schemas/Role"
    HistoryOrigin:
      name: origin
      in: query
      description: Rows of moments of this origin.
      schema:
        $ref: "#/components/schemas/Origin"
    HistoryAction:
      name: action
      in: query
      description: Rows of this action.
      schema:
        $ref: "#/components/schemas/HistoryAction"
  responses:
    MomentAnswer:
      description: The moment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Moment"
    VenueAnswer:
      description: The events it reached.
      content:
        application/json:
          schema:
            type: object
            required: [tenant_ids]
            properties:
              tenant_ids:
                type: array
                items:
                  type: string
    Conflict:
      description: |
        `version_conflict`: a stale `revision`; `event_archived`: the event is read-only; `moment_refused`: every
        region the moment may take is held by a higher rank on every zone it names (the body's `error` adds
        `retry_after_seconds` and `held_by`); `emergency_active`: an emergency already runs; `not_running`: the
        moment has ended.
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    ScenesAnswer:
      description: The scenes, each zone's scene now and the crew button pressed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Scenes"
  schemas:
    ZoneKey:
      type: string
      pattern: "^[a-z0-9_-]{2,32}$"
    Class:
      type: string
      enum: [emergency, stream, announcement, spotlight, storyboard, tournament, finals, hot_game, reactions, ticker]
    Role:
      type: string
      enum: [full, hero, rail, venue_rail, ticker, overlay]
    Origin:
      type: string
      enum: [rule, crew, emergency, module]
    HistoryAction:
      type: string
      enum: [started, refused, placed, hidden, queued, back, changed, ended]
    Order:
      type: array
      description: Every class once, highest first, `emergency` first.
      minItems: 10
      maxItems: 10
      uniqueItems: true
      items:
        $ref: "#/components/schemas/Class"
    ZoneOrder:
      type: object
      required: [zone_key, order]
      properties:
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        order:
          $ref: "#/components/schemas/Order"
    PriorityOrders:
      type: object
      required: [order, zones, ranks, revision]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneOrder"
        ranks:
          type: object
          description: Each class's rank in the event's order.
          additionalProperties:
            type: integer
        revision:
          type: integer
    Qr:
      type: object
      required: [path, label]
      properties:
        path:
          type: string
          pattern: "^/[^/]"
          maxLength: 512
        label:
          type: string
          maxLength: 60
    Binding:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [none, leaderboard, session]
        ref:
          type: [string, "null"]
    Source:
      type: object
      required: [module, event_id, ref]
      properties:
        module:
          type: string
        event_id:
          type: [string, "null"]
        ref:
          type: [string, "null"]
    Placement:
      type: object
      required: [zone_key, state, role, since]
      properties:
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        state:
          type: string
          enum: [placed, hidden, unplaced, left]
        role:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        since:
          type: string
          format: date-time
    MomentRequest:
      type: object
      additionalProperties: false
      required: [class, template, content]
      properties:
        class:
          $ref: "#/components/schemas/Class"
        template:
          type: string
        content:
          type: object
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
        regions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Role"
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 7200
        patience_seconds:
          type: integer
          minimum: 0
          maximum: 7200
        qr:
          $ref: "#/components/schemas/Qr"
        binding:
          $ref: "#/components/schemas/Binding"
        source:
          $ref: "#/components/schemas/Source"
        dedupe_key:
          type: string
          maxLength: 200
    Moment:
      type: object
      required: [id, class, rank, kind, regions, template, content, zones, origin, rule_id, source, actor, starts_at, expires_at, patience_seconds, qr, binding, placements, ended_at, end_reason]
      properties:
        id:
          type: string
        class:
          $ref: "#/components/schemas/Class"
        rank:
          type: integer
        kind:
          type: string
          enum: [takeover, block, overlay]
        regions:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        template:
          type: string
        content:
          type: object
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
        origin:
          $ref: "#/components/schemas/Origin"
        rule_id:
          type: [string, "null"]
        source:
          $ref: "#/components/schemas/Source"
        actor:
          oneOf:
            - type: object
              required: [user_id, name]
              properties:
                user_id:
                  type: string
                name:
                  type: string
            - type: "null"
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        patience_seconds:
          type: integer
        qr:
          oneOf:
            - $ref: "#/components/schemas/Qr"
            - type: "null"
        binding:
          oneOf:
            - $ref: "#/components/schemas/Binding"
            - type: "null"
        placements:
          type: array
          items:
            $ref: "#/components/schemas/Placement"
        ended_at:
          type: [string, "null"]
          format: date-time
        end_reason:
          type: [string, "null"]
          enum: [expired, cleared, preempted, source_ended, null]
    SpotlightRequest:
      type: object
      additionalProperties: false
      required: [show]
      properties:
        show:
          type: string
          enum: [standings, bracket, photo, message]
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 7200
          default: 300
        session_id:
          type: string
        photo_url:
          type: string
          pattern: "^/[^/]"
        caption:
          type: string
          maxLength: 140
        title:
          type: string
          minLength: 1
          maxLength: 80
        body:
          type: string
          maxLength: 280
        qr:
          $ref: "#/components/schemas/Qr"
    EmergencyRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        body:
          type: string
          maxLength: 280
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
    EmergencyEnd:
      type: object
      properties:
        all_clear:
          type: boolean
          default: false
    RuleSettings:
      type: object
      required: [enabled, template, class, regions, ttl_seconds, zones, cue]
      properties:
        enabled:
          type: boolean
        template:
          type: string
        class:
          $ref: "#/components/schemas/Class"
        regions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Role"
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 7200
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
        cue:
          type: [string, "null"]
          maxLength: 64
    Rule:
      allOf:
        - $ref: "#/components/schemas/RuleSettings"
        - type: object
          required: [rule_id, on, templates, revision]
          properties:
            rule_id:
              type: string
            "on":
              type: array
              description: The catalog events it fires on.
              items:
                type: string
            templates:
              type: array
              description: The templates it may use.
              items:
                type: string
            revision:
              type: integer
    HistoryRow:
      type: object
      required: [seq, at, zone_key, action, moment_id, class, origin, title, region, why, displaced, outcome, actor_name]
      properties:
        seq:
          type: integer
        at:
          type: string
          format: date-time
        zone_key:
          type: [string, "null"]
        action:
          $ref: "#/components/schemas/HistoryAction"
        moment_id:
          type: [string, "null"]
        class:
          $ref: "#/components/schemas/Class"
        origin:
          $ref: "#/components/schemas/Origin"
        title:
          type: string
        region:
          type: [string, "null"]
        why:
          type: string
        displaced:
          type: [string, "null"]
        outcome:
          type: [string, "null"]
        actor_name:
          type: [string, "null"]
    SceneKey:
      type: string
      pattern: "^[a-z][a-z0-9_-]{1,31}$"
    SceneCondition:
      description: |
        When a scene holds; any one of a scene's conditions is enough (contracts/moments.md, Scenes).
        `time`: every day of the event from `from` to `to` (HH:MM in the event's time zone; past midnight when
        `to` is earlier). `agenda`: an item of one of `kinds` runs on the zone, or, with `starts_within_minutes`,
        starts within that many minutes. `checkins`: over `over` arrival check-ins in the last hour. `presence`:
        members online `over` and/or `under` a count (never while no count is known). `games`: a game is
        surging. `crew`: the scene's crew button, holding `minutes` per press.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, from, to]
          properties:
            type: { const: time }
            from: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
            to: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        - type: object
          additionalProperties: false
          required: [type, kinds]
          properties:
            type: { const: agenda }
            kinds:
              type: array
              minItems: 1
              items: { type: string }
            starts_within_minutes: { type: integer, minimum: 1, maximum: 720 }
        - type: object
          additionalProperties: false
          required: [type, over]
          properties:
            type: { const: checkins }
            over: { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { const: presence }
            over: { type: integer, minimum: 0 }
            under: { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { const: games }
        - type: object
          additionalProperties: false
          required: [type, minutes]
          properties:
            type: { const: crew }
            minutes: { type: integer, minimum: 1, maximum: 720 }
    SceneMotion:
      description: A level, or `calmer` and `livelier`, one step from the event's level as Follow the day moves it.
      type: [string, "null"]
      enum: [none, calm, lively, party, calmer, livelier, null]
    StageMood:
      description: The stage's mood, one of its phase tints (contracts/screen.md, The stage).
      type: [string, "null"]
      enum: [build_up, doors, peak, wind_down, quiet_hours, null]
    ScenePalette:
      description: "The theme's primary and accent colours while the scene holds (L14, the palette only)."
      type: [object, "null"]
      additionalProperties: false
      properties:
        primary: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        accent: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
    HeroFeature:
      type: string
      enum: [bracket, leaderboard, countdown, playlist, photo, hot_game, today_numbers]
    SceneChanges:
      type: object
      additionalProperties: false
      required: [motion, layouts, stage_mood, palette, sound, quiet, hero_off]
      properties:
        motion:
          $ref: "#/components/schemas/SceneMotion"
        layouts:
          description: Zone key to layout id; a zone not named keeps its own layout.
          type: object
          additionalProperties:
            type: string
        stage_mood:
          $ref: "#/components/schemas/StageMood"
        palette:
          $ref: "#/components/schemas/ScenePalette"
        sound:
          description: Sound on or off for the sound gates (#113); null keeps the zone's.
          type: [boolean, "null"]
        quiet:
          description: Quiet mode, the level at most `calm`; the sound gates play urgent only (#113).
          type: boolean
        hero_off:
          description: The hero's features the scene switches off ("no slides at the peak").
          type: array
          items:
            $ref: "#/components/schemas/HeroFeature"
    Scene:
      type: object
      additionalProperties: false
      required: [key, name, preset, zones, when, then, hold_minutes, blend_seconds]
      properties:
        key:
          $ref: "#/components/schemas/SceneKey"
        name:
          type: string
          minLength: 1
          maxLength: 60
        preset:
          description: The preset it was copied from (`quiet`, `wind_down`, `doors`, `peak`, `daytime`), or null.
          type: [string, "null"]
        zones:
          description: The zones it applies to; empty, every zone.
          type: array
          items:
            $ref: "#/components/schemas/ZoneKey"
        when:
          description: Any one is enough; an empty list always holds.
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/SceneCondition"
        then:
          $ref: "#/components/schemas/SceneChanges"
        hold_minutes:
          description: How long it stays on against any scene lower in the list, so scenes never flip back and forth.
          type: integer
          minimum: 0
          maximum: 240
        blend_seconds:
          description: How long the screens take to blend its palette and mood in.
          type: integer
          minimum: 0
          maximum: 600
    Scenes:
      type: object
      required: [scenes, revision, copied, zones, crew]
      properties:
        scenes:
          type: array
          items:
            $ref: "#/components/schemas/Scene"
        revision:
          type: integer
          minimum: 0
        copied:
          description: False until the event's first use copied the presets.
          type: boolean
        zones:
          description: Each zone's scene now, as last sent in `moments.scene.changed`.
          type: array
          items:
            type: object
            required: [zone_key, scene_key, since, why, heartbeat_bpm]
            properties:
              zone_key:
                $ref: "#/components/schemas/ZoneKey"
              scene_key:
                type: [string, "null"]
              since:
                type: string
                format: date-time
              why:
                type: string
              heartbeat_bpm:
                type: integer
                minimum: 4
                maximum: 30
        crew:
          description: The crew button pressed now, or null.
          type: [object, "null"]
          required: [scene_key, zones, until]
          properties:
            scene_key:
              $ref: "#/components/schemas/SceneKey"
            zones:
              type: array
              items:
                $ref: "#/components/schemas/ZoneKey"
            until:
              type: string
              format: date-time
    SoundCategory:
      type: string
      description: The six fixed categories, highest priority first; only `urgent` interrupts a playing sound.
      enum: [urgent, result, attention, something_new, ended, ambient]
    EffectName:
      type: string
      description: The box effects of design sheet 14.
      enum: [pop, tilt, flip, ripple, slide, glow, ring_burst]
    CueInput:
      type: object
      required: [category, enabled, level, cooldown_seconds, catch_up_seconds, once_per_source, sounds, effects, hold_seconds, revision]
      properties:
        category:
          $ref: "#/components/schemas/SoundCategory"
        enabled:
          type: boolean
          description: The sound's on/off; the picture plays either way.
        level:
          type: integer
          minimum: 0
          maximum: 100
          description: Percent, times the category's level and the master volume.
        cooldown_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Not again on a zone for this long.
        catch_up_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: How late a screen that missed it may still start it (D17).
        catch_up_before_start:
          description: |
            Minutes before the source's start, `[from, to]`: the cue sounds only in that window, and catches up
            until its end (the legacy tournament windows, T−29 to T−15 and T−14 to T−2).
          oneOf:
            - type: "null"
            - type: array
              minItems: 2
              maxItems: 2
              items:
                type: integer
        once_per_source:
          type: boolean
          description: One source (a match, an order) sounds once on a zone in 7 days.
        sounds:
          type: array
          maxItems: 20
          description: Library sound ids, picked at random, never the same twice running on a zone.
          items:
            type: string
        voice_line:
          type: [string, "null"]
          description: A library sound played right after the sound, counted with it as one.
        effects:
          type: array
          description: The picture's pool, picked at random, never the same twice running; empty for sound only.
          items:
            $ref: "#/components/schemas/EffectName"
        hold_seconds:
          type: integer
          minimum: 60
          maximum: 120
          description: How long the frame and glow hold before they fade over 10 s (L8).
        revision:
          type: integer
          minimum: 0
    Cue:
      allOf:
        - $ref: "#/components/schemas/CueInput"
        - type: object
          required: [name, builtin]
          properties:
            name:
              type: string
            builtin:
              type: boolean
              description: One of the 25 seeded cues; false for the event's own.
    SoundSettingsInput:
      type: object
      required: [enabled, volume, hourly_budget, per_minute, per_source_seconds, categories, revision]
      properties:
        enabled:
          type: boolean
          description: The master switch.
        volume:
          type: integer
          minimum: 0
          maximum: 100
        hourly_budget:
          type: integer
          minimum: 0
          maximum: 1000
          description: Sounds per zone per hour (20 by default); urgent passes and counts.
        per_minute:
          type: integer
          minimum: 1
          maximum: 60
          description: The flood guard per zone (3 by default); urgent passes and counts.
        per_source_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: The flood guard per cue and source (10 by default).
        categories:
          type: object
          description: Exactly the six categories.
          additionalProperties: false
          required: [urgent, result, attention, something_new, ended, ambient]
          properties:
            urgent:
              $ref: "#/components/schemas/CategorySettings"
            result:
              $ref: "#/components/schemas/CategorySettings"
            attention:
              $ref: "#/components/schemas/CategorySettings"
            something_new:
              $ref: "#/components/schemas/CategorySettings"
            ended:
              $ref: "#/components/schemas/CategorySettings"
            ambient:
              $ref: "#/components/schemas/CategorySettings"
        revision:
          type: integer
          minimum: 0
    CategorySettings:
      type: object
      required: [enabled, level]
      properties:
        enabled:
          type: boolean
        level:
          type: integer
          minimum: 0
          maximum: 100
    SoundSettings:
      allOf:
        - $ref: "#/components/schemas/SoundSettingsInput"
        - type: object
          required: [muted_until]
          properties:
            muted_until:
              type: [string, "null"]
              format: date-time
    SoundDesk:
      type: object
      required: [settings, categories, zones]
      properties:
        settings:
          $ref: "#/components/schemas/SoundSettings"
        categories:
          type: array
          items:
            type: object
            required: [name, priority, interrupts, plays_at_calm]
            properties:
              name:
                $ref: "#/components/schemas/SoundCategory"
              priority:
                type: integer
              interrupts:
                type: boolean
              plays_at_calm:
                type: boolean
        zones:
          type: array
          items:
            type: object
            required: [zone_key, minute, hour, energy, lets_through, sound_screen]
            properties:
              zone_key:
                $ref: "#/components/schemas/ZoneKey"
              minute:
                type: integer
              hour:
                type: integer
              energy:
                description: "`party`, `lively`, `calm` or `quiet`; null when Screen does not answer."
                type: [string, "null"]
              lets_through:
                type: [array, "null"]
                items:
                  $ref: "#/components/schemas/SoundCategory"
              sound_screen:
                description: The zone's sound screen as Screen reports it (E12, E13), or null for none.
                type: [object, "null"]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  online:
                    type: boolean
                  audio_unlocked:
                    type: [boolean, "null"]
    LibrarySound:
      type: object
      required: [id, title, url, length_ms, source, asset_id, size_bytes, used_by, warning]
      properties:
        id:
          type: string
          description: "`pack.<name>` for the default pack, `snd_<asset id>` for the event's."
        title:
          type: string
        url:
          type: string
          description: The pack's file under `/api/moments/sounds/pack/`, or the asset's under `/api/screen/files/`.
        length_ms:
          type: integer
        source:
          type: string
          enum: [pack, upload]
        asset_id:
          type: [string, "null"]
        size_bytes:
          type: [integer, "null"]
        used_by:
          type: array
          items:
            type: string
        warning:
          type: [string, "null"]
    SoundLogRow:
      type: object
      required: [seq, at, zone_key, cue, sound, outcome, reason, detail, source]
      properties:
        seq:
          type: integer
        at:
          type: string
          format: date-time
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        cue:
          type: string
        sound:
          type: [string, "null"]
        outcome:
          type: string
          enum: [played, queued, suppressed, dropped, missed]
        reason:
          type: string
          description: A reason code (contracts/moments.md, The sound log).
        detail:
          type: [string, "null"]
        source:
          type: [string, "null"]
