  /api/pizza/pizzerias/{pizzeria_id}:
    $ref: "pizza/menus.openapi.yaml#/~1api~1pizza~1pizzerias~1{pizzeria_id}"
  /api/pizza/pizzerias/{pizzeria_id}/menu:
    $ref: "pizza/menus.openapi.yaml#/~1api~1pizza~1pizzerias~1{pizzeria_id}~1menu"
  /api/pizza/menu/import/preview:
    $ref: "pizza/menus.openapi.yaml#/~1api~1pizza~1menu~1import~1preview"
  /api/pizza/menu/import:
    $ref: "pizza/menus.openapi.yaml#/~1api~1pizza~1menu~1import"
  /api/pizza/menu.csv:
    $ref: "pizza/menus.openapi.yaml#/~1api~1pizza~1menu.csv"
  /api/pizza/record:
    $ref: "pizza/menus.openapi.yaml#/~1api~1pizza~1record"
  /api/pizza/export:
    $ref: "pizza/menus.openapi.yaml#/~1api~1pizza~1export"
  /api/pizza/export.csv:
    $ref: "pizza/menus.openapi.yaml#/~1api~1pizza~1export.csv"
  /api/pizza/me/orders:
    $ref: "pizza/menus.openapi.yaml#/~1api~1pizza~1me~1orders"
  /api/pizza/me/export:
    $ref: "pizza/menus.openapi.yaml#/~1api~1pizza~1me~1export"
  /api/pizza/me:
    $ref: "pizza/menus.openapi.yaml#/~1api~1pizza~1me"
  /api/pizza/stream:
    $ref: "pizza/menus.openapi.yaml#/~1api~1pizza~1stream"
  /api/pizza/health:
    get:
      tags: [orders]
      operationId: health
      summary: Health
      description: The shared health shape (contracts/admin.md); Caddy maps it to the module's `/health`.
      security:
        - {}
      responses:
        "200":
          description: "`ok` or `degraded`."
          content:
            application/json:
              schema:
                type: object
        "503":
          description: "`down`."
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: canccu_session
      description: Opaque session id (contracts/admin.md, Session and rights). Rights are checked through admin.
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      description: Order id.
      schema:
        $ref: "#/components/schemas/Id"
    ItemId:
      name: item_id
      in: path
      required: true
      description: Pizza (row) id.
      schema:
        $ref: "#/components/schemas/Id"
    ReceiptId:
      name: receipt_id
      in: path
      required: true
      description: Receipt id.
      schema:
        $ref: "#/components/schemas/Id"
    PizzeriaId:
      name: pizzeria_id
      in: path
      required: true
      description: Pizzeria id.
      schema:
        $ref: "#/components/schemas/Id"
    Day:
      name: day
      in: query
      description: One event day, which turns at 06:00 in the event's time zone; without it, the whole event.
      schema:
        $ref: "#/components/schemas/Day"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: The same key from the same person within 24 hours answers as the first time and does nothing again (E2).
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{8,64}$"
  responses:
    BadRequest:
      description: |
        `invalid_request`: a field is missing or invalid, named in the error's `field`; or
        `menu_csv_invalid`: the menu CSV has errors, listed in the error's `errors` (`row`, `column`,
        `message`), and nothing was imported.
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    Forbidden:
      description: |
        `missing_right`; `not_a_member` (signed in, not a member of the event); `not_holder` (only the
        order's holder or the crew); `not_owner` (someone else's pizza); `closed` (the owner's change
        after the order closed); `money_locked` (the holder after the event day turned);
        `not_a_member` also for "Pay me with";
        `ordering_closed`; `info_pages_closed` (a guest where the info-page mode keeps them out);
        `admin_access_restricted` (a right used away from the venue and Tailscale).
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    NotFound:
      description: "`not_found`: no such order, pizza or pizzeria at this event."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    Conflict:
      description: |
        `another_open` (with `open`: the order open at that pizzeria), `too_many_open`, `already_holding`,
        `claimed` (with `holder` and `since`), `item_limit`, `closed` (with `open_orders`, the event's
        other open orders), `placed`, `not_placed`, `not_arrived`, `cancelled`, `done`, `has_pizzas`,
        `prices_missing`, `settle_to_payer_off`, `pizzeria_exists`, `conflict` (it changed meanwhile),
        `event_archived`; and for money: `too_many_receipts`, `not_settled_to_payer`, `reader_off` (the
        AI reader is off, has no key, or its key was refused).
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    UnsupportedMediaType:
      description: "`unsupported_media_type`: the body is not of a type this path takes (JSON, `text/csv` for the menu import, a JPEG, PNG or WebP photo for a receipt or a menu read)."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    TooLarge:
      description: "`file_too_large`: a photo over 30 MB."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    ReaderLimit:
      description: "`reader_limit`: the event's reads for this event day are used up (`ai_reader_daily_reads`)."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    ReaderFailed:
      description: |
        `reader_failed`: the read gave nothing, and `reason` says why (#789): `timeout` (past
        `timeoutFor(pages)`: 50 s for a page and 10 s for each further one, at most 100 s),
        `service_down` (the provider failed or is overloaded), `rate_limited` (with `retry_after_s`),
        `out_of_credit` (the provider account's balance or spend limit is used up; the crew is told),
        `declined` (the model would not read it), `unreadable` (not a receipt or a menu, or not
        readable: `message` is the model's own reason) or `failed` (any other). Or
        `reader_key_rejected`: the provider refused the key, and the reader stops until a key is set
        again (the crew is told). A failed read changes no price, total or menu; typing still works.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReaderError"
    SecretsUnavailable:
      description: "`secrets_unavailable`: the platform has no secrets key, so no API key can be kept."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
  schemas:
    Id:
      type: string
      description: A random id, never a number to count through.
      pattern: "^[a-z]{2,4}_[A-Za-z0-9_-]{8,40}$"
    Day:
      type: string
      description: An event day, `YYYY-MM-DD`.
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    NullableTime:
      type: [string, "null"]
      format: date-time
    UserRef:
      type: object
      required: [user_id, name]
      properties:
        user_id:
          type: string
        name:
          type: [string, "null"]
    OrderState:
      type: string
      enum: [open, closed, placed, arrived, done, cancelled]
    Order:
      type: object
      description: |
        An order as the caller may see it (contracts/pizza.md, Who sees what). Every caller gets the base
        fields; a member also `holder`, `you_hold`, `note`, `cancel_reason`, `mine`, `my_amount_cents`,
        `my_amount_estimated` and `lines`; a person in the order (and the holder and the crew) also
        `settle_to`, `pay_to` (how to pay the payer, when it settles to them) and `my_paid` (their own
        Paid mark, or null); the holder and the crew `items` instead of `lines`, the pizzeria's `phone`
        and `website`, `claimed_at`, `nudged_at`, `payer`, `total_cents` and `split`.
      required: [id, seq, day, state, pizzeria, closes_at, target_at, pizza_count, people_count, revision, stale]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        seq:
          type: integer
          minimum: 1
        day:
          $ref: "#/components/schemas/Day"
        state:
          $ref: "#/components/schemas/OrderState"
        pizzeria:
          type: object
          required: [id, name, service]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
            service:
              $ref: "#/components/schemas/Service"
            phone:
              type: [string, "null"]
            website:
              type: [string, "null"]
        closes_at:
          type: string
          format: date-time
        target_at:
          type: string
          format: date-time
          description: The same time as `closes_at`, under the legacy's name.
        estimate_at:
          $ref: "#/components/schemas/NullableTime"
        pickup:
          type: [string, "null"]
        opened_at:
          type: string
          format: date-time
        closed_at:
          $ref: "#/components/schemas/NullableTime"
        placed_at:
          $ref: "#/components/schemas/NullableTime"
        arrived_at:
          $ref: "#/components/schemas/NullableTime"
        done_at:
          $ref: "#/components/schemas/NullableTime"
        done_reason:
          type: [string, "null"]
          enum: [handed_out, holder, timer, null]
        cancelled_at:
          $ref: "#/components/schemas/NullableTime"
        pizza_count:
          type: integer
        people_count:
          type: integer
        revision:
          type: integer
        stale:
          type: boolean
          description: Open or closed from an earlier event day; any member may cancel it (E10).
        holder:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        you_hold:
          type: boolean
        note:
          type: [string, "null"]
        cancel_reason:
          type: [string, "null"]
        mine:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        my_amount_cents:
          type: [integer, "null"]
        lines:
          type: array
          description: Everyone's pizzas without names or notes.
          items:
            type: object
            required: [count, label]
            properties:
              count:
                type: integer
              label:
                type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        claimed_at:
          $ref: "#/components/schemas/NullableTime"
        nudged_at:
          $ref: "#/components/schemas/NullableTime"
        payer:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        total_cents:
          type: [integer, "null"]
        split:
          type: [string, "null"]
          enum: [exact, even, null]
        settle_to:
          $ref: "#/components/schemas/SettleTo"
    OrderList:
      type: object
      required: [day, orders]
      properties:
        day:
          $ref: "#/components/schemas/Day"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
    LiveChange:
      type: object
      description: One `change` of the live stream; never who or what (contracts/pizza.md, Live).
      required: [type, order_id, revision]
      properties:
        type:
          type: string
          description: The `pizza.order.*` or `pizza.item.*` event behind it.
        order_id:
          $ref: "#/components/schemas/Id"
        state:
          type: string
          description: The order's state, on an order's event.
        revision:
          type: integer
    OrderNew:
      type: object
      required: [pizzeria_id, closes_at]
      properties:
        pizzeria_id:
          $ref: "#/components/schemas/Id"
        closes_at:
          type: string
          format: date-time
          description: In the future.
        note:
          type: [string, "null"]
          maxLength: 200
    OrderEdit:
      type: object
      description: Only the fields given change; see contracts/pizza.md for when each may.
      properties:
        closes_at:
          type: string
          format: date-time
        note:
          type: [string, "null"]
          maxLength: 200
        pizzeria_id:
          $ref: "#/components/schemas/Id"
        estimate_at:
          $ref: "#/components/schemas/NullableTime"
        placed_at:
          type: string
          format: date-time
        pickup:
          type: [string, "null"]
          maxLength: 80
    StepBody:
      type: object
      description: |
        The step's fields, all optional. `place`: `estimate_minutes` (0–240) or `estimate_at`, `at` (when
        it was called in), `payer_user_id`. `arrive`: `pickup`. `cancel`, `release`, `take-over`: `reason`.
      properties:
        estimate_minutes:
          type: integer
          minimum: 0
          maximum: 240
        estimate_at:
          type: string
          format: date-time
        at:
          type: string
          format: date-time
        payer_user_id:
          type: string
        pickup:
          type: [string, "null"]
          maxLength: 80
        reason:
          type: [string, "null"]
          maxLength: 200
    Item:
      type: object
      description: A pizza as ordered (D15). `user_id` and `name` for the holder and the crew only.
      required: [id, kind, label, price_cents, handed_out, mine]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        user_id:
          type: [string, "null"]
        name:
          type: [string, "null"]
        kind:
          type: string
          enum: [menu, custom, text]
        number:
          type: [string, "null"]
        label:
          type: string
        description:
          type: [string, "null"]
        toppings:
          type: [array, "null"]
          items:
            type: string
        text:
          type: [string, "null"]
        note:
          type: [string, "null"]
        comment:
          type: [string, "null"]
        price_cents:
          type: [integer, "null"]
        handed_out:
          type: boolean
        mine:
          type: boolean
    ItemNew:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [menu, custom, text]
        menu_item_id:
          $ref: "#/components/schemas/Id"
        toppings:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
        text:
          type: string
          minLength: 1
          maxLength: 80
        note:
          type: [string, "null"]
          maxLength: 120
        comment:
          type: [string, "null"]
          maxLength: 120
    Summary:
      type: object
      required: [header, pizza_count, lines, who, text]
      properties:
        header:
          type: string
        pizza_count:
          type: integer
        lines:
          type: array
          items:
            type: object
            required: [count, label, note]
            properties:
              count:
                type: integer
              label:
                type: string
              note:
                type: [string, "null"]
        who:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name:
                type: string
              count:
                type: integer
        text:
          type: string
    History:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [at, actor, kind, detail]
            properties:
              at:
                type: string
                format: date-time
              actor:
                oneOf:
                  - $ref: "#/components/schemas/UserRef"
                  - type: "null"
              kind:
                type: string
              detail:
                type: object
    PersonAmount:
      type: object
      required: [user_id, name, units, amount_cents]
      properties:
        user_id:
          type: [string, "null"]
        name:
          type: [string, "null"]
        units:
          type: integer
        amount_cents:
          type: [integer, "null"]
        paid:
          type: [boolean, "null"]
          description: "In the money's `people`: the payer's Paid mark; null where there is none (settled through the organiser, or the payer)."
    Money:
      type: object
      required: [order_id, payer, total_cents, split, split_effective, exact_possible, estimated, settle_to, people]
      properties:
        order_id:
          $ref: "#/components/schemas/Id"
        payer:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        total_cents:
          type: [integer, "null"]
        total_set_at:
          $ref: "#/components/schemas/NullableTime"
        total_set_by:
          type: [object, "null"]
          properties:
            name:
              type: [string, "null"]
        total_receipt_id:
          type: [string, "null"]
          description: The receipt whose read the total was confirmed from; null when it was typed in.
        split:
          type: [string, "null"]
          enum: [exact, even, null]
        split_effective:
          type: string
          enum: [exact, even]
        exact_possible:
          type: boolean
        estimated:
          type: boolean
          description: No total yet; the amounts are the menu's prices.
        extras_cents:
          type: [integer, "null"]
        settle_to:
          $ref: "#/components/schemas/SettleTo"
        total_effective_cents:
          type: [integer, "null"]
        people:
          type: array
          items:
            $ref: "#/components/schemas/PersonAmount"
        pay_to:
          oneOf:
            - $ref: "#/components/schemas/PayTo"
            - type: "null"
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/Receipt"
        prices:
          type: array
          items:
            type: object
            required: [item_id, label, price_cents]
            properties:
              item_id:
                $ref: "#/components/schemas/Id"
              user_id:
                type: [string, "null"]
              label:
                type: string
              price_cents:
                type: [integer, "null"]
    MoneyEdit:
      type: object
      properties:
        total_cents:
          type: [integer, "null"]
          minimum: 0
          maximum: 500000
        split:
          type: [string, "null"]
          enum: [exact, even, null]
        settle_to:
          $ref: "#/components/schemas/SettleTo"
        payer_user_id:
          type: string
        prices:
          type: array
          description: Pizzas' prices set in the same change, as a confirmed receipt read sets them.
          items:
            type: object
            required: [item_id, price_cents]
            properties:
              item_id:
                $ref: "#/components/schemas/Id"
              price_cents:
                type: [integer, "null"]
                minimum: 0
                maximum: 99999
        receipt_id:
          type: [string, "null"]
          description: With `total_cents`, the receipt of this order whose read is being confirmed.
    PayDetails:
      type: object
      required: [mobilepay, iban, updated_at]
      properties:
        mobilepay:
          type: [string, "null"]
        iban:
          type: [string, "null"]
        updated_at:
          $ref: "#/components/schemas/NullableTime"
    PayTo:
      type: object
      required: [user_id, name, mobilepay, iban]
      properties:
        user_id:
          type: string
        name:
          type: [string, "null"]
        mobilepay:
          type: [string, "null"]
        iban:
          type: [string, "null"]
    Receipt:
      type: object
      required: [id, order_id, type, bytes, added_at, added_by, read]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        order_id:
          $ref: "#/components/schemas/Id"
        type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        bytes:
          type: integer
        added_at:
          type: string
          format: date-time
        added_by:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        read:
          oneOf:
            - $ref: "#/components/schemas/ReceiptRead"
            - type: "null"
    ReceiptRead:
      type: object
      description: |
        The last machine read: a suggestion only. Each pizza gets the unit price of the line that names
        it (menu number first, then name); a price unlike the pizza's is `differs`, a pizza with no line
        has `line` null, and item lines that cover no or too few pizzas are in `unmatched_lines`.
      required: [read_at, total_cents, lines, pizzas, unmatched_lines, extras_cents, adds_up]
      properties:
        read_at:
          type: string
          format: date-time
        total_cents:
          type: [integer, "null"]
        lines:
          type: array
          items:
            type: object
            required: [text, number, name, quantity, amount_cents, kind]
            properties:
              unsure:
                type: boolean
                description: The photo did not make the line clear (a partly read receipt, #789); absent on older reads.
              text:
                type: string
              number:
                type: [string, "null"]
              name:
                type: string
              quantity:
                type: integer
              amount_cents:
                type: integer
              kind:
                type: string
                enum: [item, extra]
        pizzas:
          type: array
          items:
            type: object
            required: [item_id, label, price_cents, suggested_cents, line, differs]
            properties:
              item_id:
                $ref: "#/components/schemas/Id"
              user_id:
                type: [string, "null"]
              name:
                type: [string, "null"]
              label:
                type: string
              price_cents:
                type: [integer, "null"]
              suggested_cents:
                type: [integer, "null"]
              line:
                type: [integer, "null"]
              differs:
                type: boolean
        unmatched_lines:
          type: array
          items:
            type: integer
        extras_cents:
          type: integer
        adds_up:
          type: boolean
    MenuRead:
      type: object
      required: [pizzeria_id, csv, items, unsure]
      properties:
        pizzeria_id:
          $ref: "#/components/schemas/Id"
        csv:
          type: string
          description: A menu CSV (contracts/pizza.md, The menu CSV) for the import's preview.
        items:
          type: integer
        unsure:
          type: array
          description: The menu numbers the read was unsure of.
          items:
            type: string
    ReaderError:
      description: The shared error body, with why a read gave nothing (#789, additive).
      allOf:
        - $ref: "common.openapi.yaml#/components/schemas/Error"
        - type: object
          properties:
            error:
              type: object
              properties:
                reason:
                  type: string
                  enum: [timeout, service_down, rate_limited, out_of_credit, declined, unreadable, failed]
                retry_after_s:
                  type: integer
                  minimum: 1
                  maximum: 120
                  description: With `rate_limited`, the wait the provider asked for.
    ReadLog:
      type: object
      description: |
        One month's reads by event day, newest first (at most 500 listed; the totals count every
        read), and the month's totals against the account's monthly limit (#789 item 12).
      required: [month, reads, totals]
      properties:
        month:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        reads:
          type: array
          items:
            type: object
            required: [at, kind, pages, outcome, reason, input_tokens, output_tokens, cost_micro_usd, ms]
            properties:
              at:
                type: string
                format: date-time
              kind:
                type: string
                enum: [receipt, menu]
              pages:
                type: integer
                minimum: 1
                maximum: 6
              outcome:
                type: string
                description: "`ok`, `rejected` (a refused key), or a `reason` of `ReaderError`."
                enum:
                  [ok, rejected, timeout, service_down, rate_limited, out_of_credit, declined, unreadable, failed]
              reason:
                type: [string, "null"]
                maxLength: 200
                description: The model's own words for an unreadable photo.
              input_tokens:
                type: [integer, "null"]
              output_tokens:
                type: [integer, "null"]
              cost_micro_usd:
                type: integer
                minimum: 0
                description: The tokens at the model's prices, rounded up; 0 when the provider billed nothing.
              ms:
                type: [integer, "null"]
        totals:
          type: object
          required: [reads, cost_micro_usd, limit_micro_usd]
          properties:
            reads:
              type: integer
            cost_micro_usd:
              type: integer
            limit_micro_usd:
              type: [integer, "null"]
              description: "`ai_reader_monthly_limit_usd` in micro-dollars; null when it is 0 (none set)."
    ReaderKey:
      type: object
      required: [provider, model, set, last4, set_by, set_at, last_used_at, rejected, reads_this_month]
      properties:
        provider:
          type: string
        model:
          type: string
        set:
          type: boolean
        last4:
          type: [string, "null"]
        set_by:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        set_at:
          $ref: "#/components/schemas/NullableTime"
        last_used_at:
          $ref: "#/components/schemas/NullableTime"
        rejected:
          type: boolean
        reads_this_month:
          type: integer
    Service:
      type: string
      enum: [delivery, takeaway]
    SettleTo:
      type: string
      enum: [organiser, payer]
    MenuLine:
      type: object
      required: [id, name, description, price_cents]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        number:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        price_cents:
          type: [integer, "null"]
        hidden:
          type: boolean
    Pizzeria:
      type: object
      required: [id, name, website, service]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        website:
          type: [string, "null"]
        service:
          $ref: "#/components/schemas/Service"
        phone:
          type: [string, "null"]
          description: For the crew and the menu writers.
        hidden:
          type: boolean
        menu:
          type: object
          required: [items, base, toppings]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/MenuLine"
            base:
              oneOf:
                - $ref: "#/components/schemas/MenuLine"
                - type: "null"
            toppings:
              type: array
              items:
                $ref: "#/components/schemas/MenuLine"
    PizzeriaSave:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: [string, "null"]
          maxLength: 40
        website:
          type: [string, "null"]
          format: uri
        service:
          $ref: "#/components/schemas/Service"
        hidden:
          type: boolean
          description: "`PATCH` only: hides the pizzeria; it is never deleted."
    MenuInput:
      type: object
      description: A whole menu; the profile's `pizza` section has the same fields.
      properties:
        items:
          type: array
          items:
            type: object
            required: [number, name]
            properties:
              number:
                type: string
                maxLength: 8
              name:
                type: string
                maxLength: 80
              description:
                type: [string, "null"]
                maxLength: 300
              price:
                type: [integer, "null"]
                minimum: 0
                maximum: 99999
                description: In cents.
        base:
          oneOf:
            - $ref: "#/components/schemas/MenuEntryInput"
            - type: "null"
        toppings:
          type: array
          items:
            $ref: "#/components/schemas/MenuEntryInput"
    MenuEntryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: [string, "null"]
          maxLength: 300
        price:
          type: [integer, "null"]
          minimum: 0
          maximum: 99999
    Issue:
      type: object
      required: [row, column, message]
      properties:
        row:
          type: [integer, "null"]
          description: The CSV row; the header is row 1. Null for the whole file.
        column:
          type: [string, "null"]
        message:
          type: string
    Counts:
      type: object
      required: [added, updated, hidden]
      properties:
        added:
          type: integer
        updated:
          type: integer
        hidden:
          type: integer
    ImportPreview:
      type: object
      required: [errors, warnings, pizzerias]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        pizzerias:
          type: array
          items:
            type: object
            required: [name, status, items, base, toppings]
            properties:
              name:
                type: string
              status:
                type: string
                enum: [new, matched]
              items:
                $ref: "#/components/schemas/Counts"
              base:
                type: [string, "null"]
              toppings:
                type: integer
    ImportResult:
      type: object
      required: [pizzerias, pizzerias_added, items, warnings]
      properties:
        pizzerias:
          type: integer
        pizzerias_added:
          type: integer
        items:
          $ref: "#/components/schemas/Counts"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
    Record:
      type: object
      description: The daily record (mockup 12).
      required: [days, flags]
      properties:
        days:
          type: array
          items:
            type: object
            required: [day, label, order_count, total_cents, incomplete, orders]
            properties:
              day:
                $ref: "#/components/schemas/Day"
              label:
                type: string
              order_count:
                type: integer
              total_cents:
                type: integer
              incomplete:
                type: boolean
              orders:
                type: array
                items:
                  type: object
                  description: The order's own fields as stored, with `split_effective` and `people`.
                  required: [id, day, seq, state, pizzeria, people]
                  properties:
                    id:
                      $ref: "#/components/schemas/Id"
                    day:
                      $ref: "#/components/schemas/Day"
                    seq:
                      type: integer
                    state:
                      $ref: "#/components/schemas/OrderState"
                    pizzeria:
                      type: string
                    total_cents:
                      type: [integer, "null"]
                    payer_name:
                      type: [string, "null"]
                    split_effective:
                      type: string
                      enum: [exact, even]
                    placed_at:
                      $ref: "#/components/schemas/NullableTime"
                    arrived_at:
                      $ref: "#/components/schemas/NullableTime"
                    done_at:
                      $ref: "#/components/schemas/NullableTime"
                    edits_after_placed:
                      type: integer
                    closed_by_timer:
                      type: boolean
                    total_from_receipt:
                      type: boolean
                    paid_count:
                      type: integer
                    receipts:
                      type: integer
                    people:
                      type: array
                      items:
                        allOf:
                          - $ref: "#/components/schemas/PersonAmount"
                          - type: object
                            properties:
                              comments:
                                type: array
                                items:
                                  type: string
        flags:
          type: array
          items:
            type: object
            required: [order_id, kind, text]
            properties:
              order_id:
                $ref: "#/components/schemas/Id"
              kind:
                type: string
                enum: [no_total, edited_after_placed, released, cancelled_after_placed, closed_by_timer]
              text:
                type: string
    Export:
      type: object
      required: [file_name, csv, left_out]
      properties:
        file_name:
          type: string
        csv:
          type: string
          description: The export CSV (contracts/pizza.md, The export CSV).
        left_out:
          type: array
          items:
            type: object
            required: [order_id, pizzeria, reason]
            properties:
              order_id:
                type: string
                description: The export's `order_id`, `<day>-<seq>`.
              pizzeria:
                type: string
              reason:
                type: string
                enum: [no_total]
    MyExport:
      type: object
      description: Everything the module holds on the caller at this event (contracts/README.md, Privacy).
      required: [items, amounts, orders, history]
      properties:
        items:
          type: array
          items:
            type: object
        amounts:
          type: array
          items:
            type: object
            required: [order_id, amount_cents]
            properties:
              order_id:
                $ref: "#/components/schemas/Id"
              amount_cents:
                type: [integer, "null"]
        orders:
          type: array
          items:
            type: object
        pay_details:
          $ref: "#/components/schemas/PayDetails"
        paid_marks:
          type: array
          description: The orders whose payer marked the caller paid.
          items:
            type: object
        reader:
          type: [object, "null"]
          description: While the event's AI reader is on, the outside provider it sends photos to.
        history:
          type: array
          items:
            type: object
