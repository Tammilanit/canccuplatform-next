# Part of pizza.openapi.yaml: path items only, referenced from its `paths`
# and linted through it (contracts/README.md, Shared components).
/api/pizza/orders:
  get:
    tags: [orders]
    operationId: listOrders
    summary: The event's orders
    description: |
      The orders not over yet and today's, or one event day's with `day`, each as the caller may see it
      (contracts/pizza.md, Who sees what). Guests only where the info-page mode lets them in.
    parameters:
      - name: day
        in: query
        description: One event day.
        schema:
          $ref: "../pizza.openapi.yaml#/components/schemas/Day"
    responses:
      "200":
        description: The orders.
        content:
          application/json:
            schema:
              $ref: "../pizza.openapi.yaml#/components/schemas/OrderList"
      "400":
        $ref: "../pizza.openapi.yaml#/components/responses/BadRequest"
      "403":
        $ref: "../pizza.openapi.yaml#/components/responses/Forbidden"
  post:
    tags: [orders]
    operationId: openOrder
    summary: Open an order
    description: |
      A member; only `pizza.order.open` when the event's `open_by` is `crew`. The opener holds it. One open
      order per pizzeria, `max_open_orders` per event, one held per person. Emits `pizza.order.opened`.
    security:
      - session: []
    parameters:
      - $ref: "../pizza.openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../pizza.openapi.yaml#/components/schemas/OrderNew"
    responses:
      "201":
        description: The new order.
        content:
          application/json:
            schema:
              $ref: "../pizza.openapi.yaml#/components/schemas/Order"
      "400":
        $ref: "../pizza.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../pizza.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../pizza.openapi.yaml#/components/responses/Conflict"
/api/pizza/orders/{order_id}:
  parameters:
    - $ref: "../pizza.openapi.yaml#/components/parameters/OrderId"
  get:
    tags: [orders]
    operationId: getOrder
    summary: Read an order
    description: As the caller may see it.
    responses:
      "200":
        description: The order.
        content:
          application/json:
            schema:
              $ref: "../pizza.openapi.yaml#/components/schemas/Order"
      "403":
        $ref: "../pizza.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../pizza.openapi.yaml#/components/responses/NotFound"
  patch:
    tags: [orders]
    operationId: editOrder
    summary: Edit an order
    description: |
      Holder or crew (audited). The close time and the pizzeria while not called in (the pizzeria only while
      it has no pizzas: 409 `has_pizzas`), the note, and the estimate, call-in time and pickup once called in.
      Emits `pizza.order.changed`.
    security:
      - session: []
    parameters:
      - $ref: "../pizza.openapi.yaml#/components/parameters/IdempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../pizza.openapi.yaml#/components/schemas/OrderEdit"
    responses:
      "200":
        description: The order.
        content:
          application/json:
            schema:
              $ref: "../pizza.openapi.yaml#/components/schemas/Order"
      "400":
        $ref: "../pizza.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../pizza.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../pizza.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../pizza.openapi.yaml#/components/responses/Conflict"
