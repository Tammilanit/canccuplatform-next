openapi: 3.1.0
info:
  title: Admin API
  version: 1.6.0
  summary: Settings, health, session and rights, profile save and load.
  description: |
    Machine-readable part of the admin contract. Prose, rules and events: contracts/admin.md.
    Conventions (snake_case, RFC 3339 UTC times, error body): contracts/README.md.
    The `/health` operation and the `Health` schema are shared: every module serves the same shape.
    Paths under /internal/admin are for other modules on the stack's internal network only and name the tenant
    in `tenant_id`.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Same origin, behind Caddy.
tags:
  - name: health
    description: Health of a module. Every module serves it.
  - name: settings
    description: Per-module settings stored by admin.
  - name: session
    description: The signed-in user and their rights.
  - name: rights
    description: The rights granted to an event's members one by one, and the named presets.
  - name: sign-in
    description: The central sign-in host's provider paths (contracts/admin.md, Sign-in providers).
  - name: profile
    description: Export and import of the event profile.
  - name: internal
    description: Module paths on the stack's internal network; the edge Caddy never routes them.
security:
  - session: []
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health of this module
      description: Served by every module at its own `/health`. No authentication.
      security: []
      responses:
        "200":
          description: Status `ok` or `degraded`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Status `down`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/admin/health/note:
    get:
      tags: [health]
      operationId: getHealthNote
      summary: What the organiser menu's Health item says
      description: |
        Needs right `admin.settings.read`. From admin's latest check of every part, never waiting for a new one;
        `ok` with no text before the first check (contracts/admin.md, Health note).
      responses:
        "200":
          description: The note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthNote"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
  /api/admin/settings/{module}:
    parameters:
      - $ref: "#/components/parameters/Module"
    get:
      tags: [settings]
      operationId: getSettings
      summary: Read a module's settings
      description: Needs right `admin.settings.read`, or `<module>.settings.read` for that module's own settings.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [settings]
      operationId: putSettings
      summary: Replace a module's settings
      description: |
        Needs right `admin.settings.write`. Optimistic concurrency: send the `settings_version` you read;
        a stale one gets 409 `version_conflict`. On success `settings_version` goes up by one and
        `admin.settings.changed` is emitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/admin/settings/{module}:
    parameters:
      - $ref: "#/components/parameters/Module"
    get:
      tags: [internal]
      operationId: getSettingsInternal
      summary: A module reads its own settings for one tenant
      description: |
        For the kit's settings client: a module reads its own settings for the tenant it serves, on admin's
        internal address, where no hostname names a tenant. The same answer as `GET /api/admin/settings/{module}`
        for that tenant. Every module may also read `admin`'s own settings (the event's `language`); any other
        module's settings are 403 `service_forbidden`. Internal network only.
      security:
        - {}
      parameters:
        - name: tenant_id
          in: query
          required: true
          description: The tenant the calling module serves, set by its kit, never from a client's input.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ServiceUnauthenticated"
        "403":
          $ref: "#/components/responses/ServiceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [internal]
      operationId: patchSettingsInternal
      summary: A module writes its own settings for one tenant
      description: |
        Sets the keys in `values` and keeps every other key. Only the module itself: the service identity's caller
        must be `{module}` (403 `service_forbidden` otherwise); the shared key proves a module of this stack, not
        which one. Only the keys and value types the module's own contract lists for its settings (400
        `invalid_request` otherwise). A stale `settings_version` is 409 `version_conflict`: read again and retry.
        An archived event is 409 `event_archived`; the calling module refuses its own writes on an archived event
        before it calls. On success `settings_version` goes up by one and `admin.settings.changed` is emitted with
        `actor_user_id`, its `keys` being the keys in `values` whose value changed. The calling module writes
        admin first, commits its own store only after a 200, and audits the change that caused the write; it
        ignores the `admin.settings.changed` of its own write. Internal network only.
      security:
        - {}
      parameters:
        - name: tenant_id
          in: query
          required: true
          description: The tenant the calling module serves, set by its kit, never from a client's input.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ServiceUnauthenticated"
        "403":
          $ref: "#/components/responses/ServiceForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/admin/profile/theme:
    get:
      tags: [internal, profile]
      operationId: getProfileThemeInternal
      summary: The event profile's theme tokens and main logo, for theming
      description: |
        The short form of the event's design that theming applies while the event has no published revision
        (contracts/theming.md). Theming reads it when it holds no copy and again on `admin.profile.loaded`. An
        event without a profile, or whose profile has no `theme` or no `logos.main`, answers `theme: {}` or
        `logo_main: null`; an event the tenants module does not know is 404 `not_found`. Only theming calls it,
        with its service identity; any other module is 403 `service_forbidden`. Internal network only.
      security:
        - {}
      parameters:
        - name: tenant_id
          in: query
          required: true
          description: The tenant the calling module serves, set by its kit, never from a client's input.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
      responses:
        "200":
          description: The profile's theme and main logo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileThemeInternal"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /internal/admin/profile/logo:
    get:
      tags: [internal, profile]
      operationId: getProfileLogoInternal
      summary: The bytes of the event profile's main logo
      description: |
        The file `logos.main` names, as stored with the profile, so theming can serve it at revision 0 without
        reading admin's files. Its SHA-256 is `logo_main.sha256` of `GET /internal/admin/profile/theme`. 404
        `not_found` when the profile names no main logo, or for an unknown tenant. The `ETag` is the bytes'
        SHA-256: when it differs from `logo_main.sha256`, a new profile came in between, and theming reads
        `/internal/admin/profile/theme` again. Only theming calls it, as above. Internal network only.
      security:
        - {}
      parameters:
        - name: tenant_id
          in: query
          required: true
          description: The tenant the calling module serves, set by its kit, never from a client's input.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
      responses:
        "200":
          description: The logo file.
          headers:
            ETag:
              description: The SHA-256 of the bytes, hex, in double quotes.
              schema:
                type: string
                pattern: "^\"[0-9a-f]{64}\"$"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/session:
    get:
      tags: [session]
      operationId: getSession
      summary: The signed-in user and their rights
      description: |
        Modules check rights by calling this with the user's `canccu_session` cookie and looking for the
        right in `rights`. The kit wraps this call.
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
  /api/admin/session/sign-out:
    post:
      tags: [session]
      operationId: signOut
      summary: End the session
      responses:
        "204":
          description: Signed out; the cookie is cleared.
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
  /api/admin/rights/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [rights]
      operationId: getUserRights
      summary: The rights granted to one member of this event
      description: |
        Needs right `admin.rights.write`. The rights granted to the user one by one in the request's event, not
        those the event-admin role brings (`event_admin` says whether the user holds it). A member with none
        has an empty list and `rights_version` 0; a user who is not a member is 404 `not_found`.
      responses:
        "200":
          description: The granted rights.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRights"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [rights]
      operationId: putUserRights
      summary: Replace the rights granted to one member of this event
      description: |
        Needs right `admin.rights.write`, and the caller must hold every right the request adds or removes
        (otherwise 403 `missing_right`), so a granted `admin.rights.write` never passes on more than its holder
        has. The list replaces the granted rights; an empty list takes them all away. Optimistic concurrency:
        send the `rights_version` you read; a stale one gets 409 `version_conflict`. A role-only right
        (contracts/tenants.md, Users, roles and membership) is 400 `right_role_only`; a user who is not a member
        of the event is 404 `not_found`, and an archived event 409 `event_archived`. Audited; emits `admin.rights.changed` with the full new list. Granting
        a preset (`GET /api/admin/rights/presets`) is this one call with the preset's rights added to the list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRightsUpdate"
      responses:
        "200":
          description: The granted rights after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRights"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
          description: |
            `invalid_request`: a right that is not `<module>.<right>`; `right_role_only`: a right only the
            event-admin role holds.
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/rights/presets:
    get:
      tags: [rights]
      operationId: getRightsPresets
      summary: The named sets of rights admin grants in one action
      description: |
        Needs right `admin.rights.write`. Each preset is a name for a list of rights defined by a module's
        contract, such as `screen_crew` (contracts/screen.md, Rights), not a role: once granted, each right
        stands alone and can be taken away alone.
      responses:
        "200":
          description: The presets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RightsPresets"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
  /api/admin/auth/providers:
    get:
      tags: [sign-in]
      operationId: listSignInProviders
      summary: The enabled sign-in providers
      description: |
        On the central sign-in host. The providers in `CANCCU_SIGN_IN_PROVIDERS`, in that order, so the sign-in page
        shows one choice per provider without naming any itself. No session.
      security: []
      responses:
        "200":
          description: The enabled providers; today only `discord`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInProviders"
  /api/admin/auth/{provider}/start:
    parameters:
      - $ref: "#/components/parameters/Provider"
    post:
      tags: [sign-in]
      operationId: startSignIn
      summary: Start signing in with a redirect provider
      description: |
        On the central sign-in host, from its sign-in page. Answers where to send the browser: for `discord`
        Discord's authorize URL with the minimal scopes (`identify`; #52), the redirect URI below and a single-use
        `state` with PKCE, kept server-side with `return_to`. The 200 also sets the flow cookie
        (contracts/admin.md, Sign-in providers): `__Host-canccu_sign_in` over HTTPS (Secure, Path=/, no Domain;
        `canccu_sign_in` on plain http), HttpOnly, SameSite=Lax, living as long as the `state`; only its hash is
        kept with the `state`. The origin check stops another site from starting a sign-in in the browser; the
        flow cookie stops a callback URL that someone else started from signing this browser in. No session.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInStart"
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInStarted"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
          description: "`return_to_invalid` (see `SignInStart`), or a malformed body."
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
          description: |
            `bad_origin`: the request's `Origin` is not the sign-in host; `origin_refused`: `Origin: null`
            (contracts/README.md).
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`not_found`: the provider is unknown, not enabled, or has no redirect flow."
  /api/admin/auth/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/Provider"
    get:
      tags: [sign-in]
      operationId: finishSignIn
      summary: The redirect provider's callback
      description: |
        On the central sign-in host; the provider's registered redirect URI (for Discord
        `https://<sign-in host>/api/admin/auth/discord/callback`). The `state` must be known, unused, unexpired
        and match the browser's flow cookie set by start. On success the identity is mapped to a user
        (`POST /internal/tenants/identities/sign-in`), the session is made, and the browser goes to `return_to`'s
        hostname with the one-time hand-off code (#52). Failures are pages on the sign-in host: `state_invalid`
        (the `state` is unknown, used or expired, or the flow cookie is missing or does not match: a `state`
        started in another browser), `sign_in_failed` (the person cancelled at the provider, for `discord` an
        `error` such as `access_denied`, or the provider refused or could not be reached). The `state` is used up
        and the flow cookie cleared on every outcome. No session.
      security: []
      parameters:
        - name: state
          in: query
          required: false
          description: The `state` from start.
          schema:
            type: string
            maxLength: 512
        - name: code
          in: query
          required: false
          description: For `discord`, the authorization code; absent when the person cancelled.
          schema:
            type: string
            maxLength: 512
        - name: error
          in: query
          required: false
          description: For `discord`, the OAuth error (for example `access_denied`); it ends in `sign_in_failed`.
          schema:
            type: string
            maxLength: 128
        - name: error_description
          in: query
          required: false
          description: For `discord`, the OAuth error's text; never shown as given.
          schema:
            type: string
            maxLength: 1024
      responses:
        "200":
          description: Signed in without a `return_to`, as a page on the sign-in host.
          content:
            text/html:
              schema:
                type: string
        "303":
          description: Signed in; to the hand-off on `return_to`'s hostname.
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: An absolute URL on `return_to`'s hostname.
        "400":
          description: "`state_invalid` or `sign_in_failed`, as a page."
          content:
            text/html:
              schema:
                type: string
        "404":
          description: "`not_found` as a page: the provider is unknown, not enabled, or has no redirect flow."
          content:
            text/html:
              schema:
                type: string
  /api/admin/profile:
    get:
      tags: [profile]
      operationId: exportProfile
      summary: Export the current profile
      description: Needs right `admin.profile.read`. A zip of `profile.yaml` and `assets/` (contracts/profile.md).
      responses:
        "200":
          description: The profile as a zip.
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
    put:
      tags: [profile]
      operationId: importProfile
      summary: Import a profile
      description: |
        Needs right `admin.profile.write`. The profile is upgraded step by step to the current
        `schema_version`, validated, then applied. Emits `admin.profile.loaded`.
        Errors: 400 `profile_invalid`, 400 `profile_too_new`.
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              contentMediaType: application/zip
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResult"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.openapi.yaml#/components/responses/Forbidden"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: canccu_session
      description: >-
        Opaque session id, stored in Postgres. Set by sign-in (issue #10). From the central sign-in host (#52) on,
        over HTTPS the cookie is `__Host-canccu_session` (Secure, Path=/, no Domain); plain-http stacks keep this name
        (contracts/admin.md, Session and rights).
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: |
        A sign-in provider's id; today only `discord`. Any other value, also one that does not fit
        `SignInProvider`, is 404 `not_found`, never 400.
      schema:
        type: string
        maxLength: 64
    UserId:
      name: user_id
      in: path
      required: true
      description: Platform user id.
      schema:
        $ref: "#/components/schemas/UserId"
    Module:
      name: module
      in: path
      required: true
      description: Module name.
      schema:
        $ref: "#/components/schemas/ModuleName"
  responses:
    NotFound:
      description: |
        Unknown module, or unknown tenant on an internal path; for rights, a user who is not a member of the
        event.
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    Conflict:
      description: |
        `version_conflict` (the settings, or a member's granted rights, changed since they were read);
        `event_archived` (granting rights, or a module writing its own settings, in an archived event, which is
        read-only).
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    ServiceUnauthenticated:
      description: "`service_unauthenticated`: no valid `x-canccu-service` header (an internal path, no session)."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    ServiceForbidden:
      description: "`service_forbidden`: the calling module may not use this path (it is not `{module}`)."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
  schemas:
    ModuleName:
      type: string
      enum: [screen, tournament, pizza, bot, admin, games, moments, voices, cast, agenda, notify]
    HealthStatus:
      type: string
      enum: [ok, degraded, down]
    Health:
      type: object
      required: [status, module, version, time, checks]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        module:
          $ref: "#/components/schemas/ModuleName"
        version:
          type: string
          description: Platform version (git tag) the module runs.
          examples: [v0.1.0]
        time:
          type: string
          format: date-time
        checks:
          type: object
          description: One entry per dependency, e.g. `postgres`, `valkey`.
          additionalProperties:
            type: object
            required: [status]
            properties:
              status:
                $ref: "#/components/schemas/HealthStatus"
              detail:
                type: string
    HealthNote:
      type: object
      required: [status, text]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        text:
          type: string
          description: How many parts are down and slow, down first; empty with `ok`.
          examples: ["1 down, 2 slow"]
    SettingValue:
      anyOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items:
            anyOf:
              - type: string
              - type: number
              - type: boolean
    ProfileThemeInternal:
      type: object
      required: [theme, logo_main]
      properties:
        theme:
          description: The profile's `theme` as it is (contracts/profile.md); `{}` when it has none.
          $ref: "profile.schema.json#/properties/theme"
        logo_main:
          description: The file `logos.main` names, or `null` when the profile names none.
          oneOf:
            - type: object
              required: [sha256, bytes]
              properties:
                sha256:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                  description: Changes whenever the file does, so theming fetches the bytes only when it differs.
                bytes:
                  type: integer
                  minimum: 0
            - type: "null"
    Settings:
      type: object
      required: [module, settings_version, values]
      properties:
        module:
          $ref: "#/components/schemas/ModuleName"
        settings_version:
          type: integer
          minimum: 0
          description: Starts at 0 for a module with no stored settings; +1 on every write.
        values:
          type: object
          description: Never secrets.
          additionalProperties:
            $ref: "#/components/schemas/SettingValue"
        groups:
          type: array
          description: |
            How the organiser's Settings form groups the module's declared settings, in the order the form
            shows them. Every declared key is in exactly one group; `[]` for a module that declares none. A
            client that draws no form ignores it, and a form draws no key it leaves out; an answer without it
            reads as `[]`. A deploy can change it without a new `settings_version`.
          items:
            $ref: "#/components/schemas/SettingsGroup"
    SettingsGroup:
      type: object
      required: [id, label, description, keys]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: Unique in the module.
          examples: [network]
        label:
          type: string
          description: The group's heading, in the event's language (admin's `language` setting).
          examples: [When the network is slow]
        description:
          type: string
          description: One line under the heading, in the same language; may be empty.
          examples: [How long a screen waits before it says so.]
        keys:
          type: array
          description: The group's settings, in the order the form shows them.
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,63}$"
    SettingsUpdate:
      type: object
      required: [settings_version, values]
      properties:
        settings_version:
          type: integer
          minimum: 0
        values:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SettingValue"
    SettingsPatch:
      type: object
      required: [settings_version, values, actor_user_id]
      properties:
        settings_version:
          type: integer
          minimum: 0
        values:
          type: object
          description: The keys to set; keys left out keep their values.
          minProperties: 1
          additionalProperties:
            $ref: "#/components/schemas/SettingValue"
        actor_user_id:
          type: string
          description: |
            The user whose change in the calling module caused this write. Always a user: a module never mirrors
            a system change through this path.
    Session:
      type: object
      required: [user, rights, expires_at]
      properties:
        user:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              description: Platform user id.
            name:
              type: string
              description: Display name.
        rights:
          type: array
          items:
            type: string
            pattern: "^[a-z]+\\.[a-z0-9_.]+$"
            examples: [admin.settings.write]
        expires_at:
          type: string
          format: date-time
        superadmin:
          type: boolean
          description: |
            True only for a session bound to the platform (signed in for the superadmin hostname) of a user who
            is a superadmin and whose sign-in identity for this session has `mfa_enabled` (contracts/tenants.md,
            Sign-in identities). Every other session is false, also a superadmin's on a tenant's hostname, with
            or without a support window. A missing field counts as false. Modules check it through the kit, and
            still answer superadmin paths only on the superadmin hostname.
    UserId:
      type: string
      description: The same as `UserId` in tenants.openapi.yaml.
      pattern: "^u_[A-Za-z0-9]{1,40}$"
      examples: [u_123]
    Right:
      type: string
      pattern: "^[a-z]+\\.[a-z0-9_.]+$"
      examples: [screen.devices.pair]
    UserRights:
      type: object
      required: [user_id, rights, rights_version, event_admin]
      properties:
        user_id:
          $ref: "#/components/schemas/UserId"
        rights:
          type: array
          description: The rights granted one by one, sorted; never those of the role.
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Right"
        rights_version:
          type: integer
          minimum: 0
          description: |
            0 while nothing was ever granted to the user in this event; +1 on every change. It keeps counting when
            the grants are dropped (the member left), so a write read before that is stale.
        event_admin:
          type: boolean
          description: The user holds the event-admin role, so every right whatever the list says.
    UserRightsUpdate:
      type: object
      required: [rights, rights_version]
      additionalProperties: false
      properties:
        rights:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Right"
        rights_version:
          type: integer
          minimum: 0
    RightsPresets:
      type: object
      required: [presets]
      properties:
        presets:
          type: array
          items:
            type: object
            required: [id, module, rights]
            properties:
              id:
                type: string
                pattern: "^[a-z][a-z0-9_]{1,63}$"
                examples: [screen_crew]
              module:
                type: string
                description: The module whose contract defines the preset.
                examples: [screen]
              rights:
                type: array
                items:
                  $ref: "#/components/schemas/Right"
    SignInProvider:
      type: string
      description: |
        A sign-in provider's id (the same as `SignInProvider` in tenants.openapi.yaml). Today only `discord`; clients
        accept other values.
      pattern: "^[a-z][a-z0-9_]{1,31}$"
      examples: [discord]
    SignInProviders:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [id, kind]
            properties:
              id:
                $ref: "#/components/schemas/SignInProvider"
              kind:
                type: string
                description: |
                  `redirect` (start and callback, like `discord`) or `credentials` (a form posted to the sign-in
                  host; none yet). More kinds may be added.
                examples: [redirect]
    SignInStart:
      type: object
      additionalProperties: false
      properties:
        return_to:
          type: string
          format: uri
          maxLength: 2048
          description: |
            The absolute URL to come back to after sign-in: `https` on an `active` hostname of a tenant or on a
            platform hostname, checked against the registry, never taken from `Host`; on the IP-mode demo stack,
            which has one host and plain http, `http` on that host. Anything else is 400 `return_to_invalid`.
            Without it, the callback answers a page on the sign-in host. The session is scoped by it
            (contracts/admin.md, Sign-in providers).
    SignInStarted:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          format: uri
          description: The provider's page to send the browser to.
    ProfileResult:
      type: object
      required: [name, schema_version]
      properties:
        name:
          type: string
        schema_version:
          type: integer
          description: Version after upgrade (the current one).
        upgraded_from:
          type: integer
          description: Present when the imported profile was older.
