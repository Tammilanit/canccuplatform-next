# Part of tenants.openapi.yaml: path items only, referenced from its `paths`
# and linted through it (contracts/README.md, Shared components).
/api/tenants/audit:
  get:
    tags: [audit, superadmin]
    operationId: listAudit
    summary: The whole audit log
    description: Superadmin. Without filters all entries; `tenant_id` for one tenant's, `platform=true` for platform entries only.
    security:
      - session: []
    parameters:
      - name: tenant_id
        in: query
        description: Only this tenant's entries.
        schema:
          $ref: "../tenants.openapi.yaml#/components/schemas/TenantId"
      - name: platform
        in: query
        description: Only entries with no tenant. Not together with `tenant_id`.
        schema:
          type: boolean
          default: false
      - $ref: "../tenants.openapi.yaml#/components/parameters/Before"
      - $ref: "../tenants.openapi.yaml#/components/parameters/Limit"
    responses:
      "200":
        description: A page of entries.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/AuditPage"
      "400":
        $ref: "../tenants.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
/api/tenants/registry:
  get:
    tags: [superadmin]
    operationId: listTenants
    summary: All tenants
    description: Superadmin.
    security:
      - session: []
    parameters:
      - name: status
        in: query
        description: Only tenants in this status.
        schema:
          $ref: "../tenants.openapi.yaml#/components/schemas/Status"
    responses:
      "200":
        description: The tenants, by id.
        content:
          application/json:
            schema:
              type: object
              required: [tenants]
              properties:
                tenants:
                  type: array
                  items:
                    $ref: "../tenants.openapi.yaml#/components/schemas/Tenant"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
  post:
    tags: [superadmin]
    operationId: createTenant
    summary: Create a tenant
    description: |
      Superadmin. Starts as `draft`, with no hostname (`primary_hostname` is `null` until one is added).
      An id used before, also by a deleted tenant, is 409 `tenant_exists`. With a venue, its profile is
      copied into the event's venue info. Audited. Emits `tenants.tenant.created` on the platform stream.
    security:
      - session: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../tenants.openapi.yaml#/components/schemas/TenantNew"
    responses:
      "201":
        description: The tenant.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/Tenant"
      "400":
        $ref: "../tenants.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../tenants.openapi.yaml#/components/responses/Conflict"
/api/tenants/registry/{tenant_id}:
  parameters:
    - $ref: "../tenants.openapi.yaml#/components/parameters/TenantId"
  get:
    tags: [superadmin]
    operationId: getTenant
    summary: One tenant
    description: Superadmin.
    security:
      - session: []
    responses:
      "200":
        description: The tenant.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/Tenant"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
  patch:
    tags: [superadmin]
    operationId: updateTenant
    summary: Change a tenant
    description: |
      Superadmin. The fields of `TenantPatch` plus `venue_id` and `series_id`. A new venue copies its profile
      into the event's venue info and also emits `tenants.venue_info.changed` with `copied: true`. Audited.
      Emits `tenants.tenant.changed`.
    security:
      - session: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../tenants.openapi.yaml#/components/schemas/RegistryPatch"
    responses:
      "200":
        description: The tenant.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/Tenant"
      "400":
        $ref: "../tenants.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../tenants.openapi.yaml#/components/responses/Conflict"
  delete:
    tags: [superadmin]
    operationId: deleteTenant
    summary: Delete a tenant and all its data
    description: |
      Superadmin; only `draft` or `archived` (409 `tenant_live`). Every module deletes the tenant's rows,
      keys, streams and files; its hostnames become `held`, keeping the tenant id as plain text. The id is
      never reused. Audited. Emits `tenants.tenant.deleted`.
    security:
      - session: []
    responses:
      "204":
        description: Deleted.
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../tenants.openapi.yaml#/components/responses/Conflict"
