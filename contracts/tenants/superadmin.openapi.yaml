      - session: []
    parameters:
      - name: q
        in: query
        required: true
        description: Part of a name, or a Discord user id.
        schema:
          type: string
          minLength: 2
          maxLength: 100
      - $ref: "../tenants.openapi.yaml#/components/parameters/Limit"
    responses:
      "200":
        description: Matching users, at most `limit`.
        content:
          application/json:
