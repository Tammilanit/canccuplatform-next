      "200":
        description: The tenant's event admins.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/AdminList"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../tenants.openapi.yaml#/components/responses/Conflict"
  delete:
    tags: [superadmin]
    operationId: removeTenantAdmin
    summary: Remove an event admin of a tenant
    description: Superadmin; the last one may go. Audited. Emits `tenants.admin.removed` on that tenant's stream.
    security:
      - session: []
    responses:
      "204":
        description: Removed.
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
/api/tenants/registry/{tenant_id}/hostnames:
  parameters:
    - $ref: "../tenants.openapi.yaml#/components/parameters/TenantId"
  get:
    tags: [superadmin]
    operationId: listHostnames
    summary: A tenant's hostnames
    description: Superadmin. Held ones too.
    security:
      - session: []
    responses:
      "200":
        description: The hostnames.
        content:
          application/json:
            schema:
              type: object
              required: [hostnames]
              properties:
                hostnames:
                  type: array
                  items:
                    $ref: "../tenants.openapi.yaml#/components/schemas/Hostname"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
  post:
    tags: [superadmin]
    operationId: addHostname
    summary: Add a hostname to a tenant
    description: |
      Superadmin. A `platform` hostname is `active` at once; a `custom` one is `pending` until verified by
      its TXT record. The first hostname of a tenant becomes its primary. Audited. Emits `tenants.hostname.changed`.
    security:
      - session: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../tenants.openapi.yaml#/components/schemas/HostnameNew"
    responses:
      "201":
        description: The hostname.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/Hostname"
      "400":
        $ref: "../tenants.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../tenants.openapi.yaml#/components/responses/Conflict"
/api/tenants/hostnames/{hostname}:
  parameters:
    - $ref: "../tenants.openapi.yaml#/components/parameters/HostnameParam"
  patch:
    tags: [superadmin]
    operationId: updateHostname
    summary: Make a hostname its tenant's primary
    description: |
      Superadmin; only an `active` one: a `pending` or `held` hostname is 409 `hostname_not_active`.
      Audited. Emits `tenants.hostname.changed`.
    security:
      - session: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../tenants.openapi.yaml#/components/schemas/HostnamePatch"
    responses:
      "200":
        description: The hostname.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/Hostname"
      "400":
        $ref: "../tenants.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../tenants.openapi.yaml#/components/responses/Conflict"
  delete:
    tags: [superadmin]
    operationId: removeHostname
    summary: Remove a hostname
    description: |
      Superadmin. It becomes `held` for 30 days. The primary hostname can go only when another is made
      primary first (409 `primary_hostname`). Audited. Emits `tenants.hostname.changed`.
    security:
      - session: []
    responses:
      "204":
        description: Held.
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../tenants.openapi.yaml#/components/responses/Conflict"
/api/tenants/hostnames/{hostname}/verify:
  parameters:
    - $ref: "../tenants.openapi.yaml#/components/parameters/HostnameParam"
  post:
    tags: [superadmin]
    operationId: verifyHostname
    summary: Check a custom hostname's TXT record
    description: Superadmin. On a match it becomes `active`; otherwise 409 `verification_failed`. Audited.
    security:
      - session: []
    responses:
      "200":
        description: The verified hostname.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/Hostname"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../tenants.openapi.yaml#/components/responses/Conflict"
