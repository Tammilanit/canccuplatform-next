    summary: Make a user a superadmin
    description: Superadmin. The user needs an identity with `mfa_enabled` (409 `mfa_required`). Audited.
    security:
      - session: []
    responses:
      "200":
        description: The new superadmin.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/User"
      "401":
        $ref: "../common.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../tenants.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../tenants.openapi.yaml#/components/responses/Conflict"
  delete:
