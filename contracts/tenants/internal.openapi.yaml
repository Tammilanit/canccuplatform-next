# Part of tenants.openapi.yaml: path items only, referenced from its `paths`
# and linted through it (contracts/README.md, Shared components).
/internal/tenants/resolve:
  get:
    tags: [internal]
    operationId: resolveTenant
    summary: Resolve a hostname to its tenant context
    description: For the kit, which caches the answer and drops it on the tenants events. Internal network only.
    security:
      - {}
    parameters:
      - name: host
        in: query
        required: true
        description: The request's hostname, lowercase, without a port.
        schema:
          $ref: "../tenants.openapi.yaml#/components/schemas/HostnameValue"
    responses:
      "200":
        description: The tenant context.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/TenantContext"
      "400":
        $ref: "../tenants.openapi.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
/internal/tenants/tenants/{tenant_id}:
  parameters:
    - $ref: "../tenants.openapi.yaml#/components/parameters/TenantId"
  get:
    tags: [internal]
    operationId: getTenantContextById
    summary: A tenant's context by its id
    description: |
      The same `TenantContext` as `resolve`, looked up by tenant id instead of hostname, for a module that acts
      on another event than the request's: Screen checks that a move's target event has the device's venue and
      builds a device's home URL from its current event's `primary_hostname` (contracts/screen.md, Moving).
      Every status, also `draft` and `archived`; a deleted or unknown tenant is 404 `not_found`. Its answer
      never tells a client which events exist: the caller passes on only what its own contract allows.
      Internal network only.
    security:
      - {}
    responses:
      "200":
        description: The tenant context.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/TenantContext"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
/internal/tenants/tenants/{tenant_id}/users/{user_id}:
  parameters:
    - $ref: "../tenants.openapi.yaml#/components/parameters/TenantId"
    - $ref: "../tenants.openapi.yaml#/components/parameters/UserId"
  get:
    tags: [internal, people]
    operationId: getMembershipInternal
    summary: Whether a user is a member of an event and holds its event-admin role
    description: |
      For a module that checks rights on another user than the caller, or on the caller without forwarding
      their cookie, such as admin's rights grants (contracts/admin.md, Granting rights). Every status of the
      event, also `draft` and `archived`; a deleted or unknown tenant is 404 `not_found`. An unknown or
      deleted user is never 404: it answers `member` and `event_admin` false, so the answer does not tell
      which user ids exist. Narrower than `GET /internal/tenants/users/{user_id}`, which carries the Discord
      id and identities. Internal network only.
    security:
      - {}
    responses:
      "200":
        description: The user's membership and role in the event.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/MembershipInternal"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
/internal/tenants/ip-mode:
  get:
    tags: [internal]
    operationId: resolveIpMode
    summary: The demo tenant's context for the IP-mode demo stack
    description: |
      For the kit, for a request whose host is an IP address. Answers the `demo` tenant's context only while
      the tenants module's version is `dev` and `demo` is the only tenant; otherwise 404 `not_found`.
      Internal network only.
    security:
      - {}
    responses:
      "200":
        description: The demo tenant's context.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/TenantContext"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
/internal/tenants/ask:
  get:
    tags: [internal]
    operationId: askCertificate
    summary: May the edge Caddy get a certificate for this domain
    description: Caddy's on-demand TLS `ask`. 200 only for an `active` hostname. Internal network only.
    security:
      - {}
    parameters:
      - name: domain
        in: query
        required: true
        description: The domain Caddy asks about.
        schema:
          type: string
          maxLength: 253
    responses:
      "200":
        description: Allowed.
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
/internal/tenants/venues/{venue_id}:
  parameters:
    - $ref: "../tenants.openapi.yaml#/components/parameters/VenueId"
  get:
    tags: [internal]
    operationId: getVenueInternal
    summary: A venue's name and addresses
    description: For Screen and the kit. Internal network only.
    security:
      - {}
    responses:
      "200":
        description: The venue without its profile.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/VenueRef"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
/internal/tenants/users/{user_id}:
  parameters:
    - $ref: "../tenants.openapi.yaml#/components/parameters/UserId"
  get:
    tags: [internal]
    operationId: getUserInternal
    summary: A user, with Discord id and privacy flags
    description: For modules that need them (the bot, Notify, presence data). Internal network only.
    security:
      - {}
    responses:
      "200":
        description: The user.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/UserInternal"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
/internal/tenants/audit:
  post:
    tags: [internal, audit]
    operationId: appendAudit
    summary: Append an audit entry
    description: |
      For other modules, in the request that made the change. Allowed also for archived tenants.
      Internal network only.
    security:
      - {}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../tenants.openapi.yaml#/components/schemas/AuditAppend"
    responses:
      "201":
        description: The stored entry.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/AuditEntry"
      "400":
        $ref: "../tenants.openapi.yaml#/components/responses/BadRequest"
/internal/tenants/identities/sign-in:
  post:
    tags: [internal, people]
    operationId: signInIdentity
    summary: Map a verified sign-in identity to its user
    description: |
      For the central sign-in, after any provider has verified the person (contracts/admin.md, Sign-in
      providers). Finds the user of (`provider`, `subject`), or creates a user with that identity; updates the
      identity's `mfa_enabled`, and the user's `name` only when this is the identity the user was created with.
      The same call for every provider. Internal network only.
    security:
      - {}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../tenants.openapi.yaml#/components/schemas/IdentitySignIn"
    responses:
      "200":
        description: The user, and whether this call created it.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/IdentitySignInResult"
      "400":
        $ref: "../tenants.openapi.yaml#/components/responses/BadRequest"
      "409":
        $ref: "../tenants.openapi.yaml#/components/responses/Conflict"
        description: "`provider_disabled`: the provider is not in `CANCCU_SIGN_IN_PROVIDERS`."
/internal/tenants/storage/reserve:
  parameters:
    - $ref: "../tenants.openapi.yaml#/components/parameters/TenantQuery"
  post:
    tags: [internal, storage]
    operationId: reserveStorage
    summary: Reserve bytes of the event's storage quota before writing a file
    description: |
      A module calls it before it writes a file to the event's part of the files volume (contracts/tenants.md,
      Storage quota). Adds `bytes` to the module's count in one step with the check, so two uploads at once
      never both pass the quota. Over the quota is 413 `storage_quota_exceeded`, which the module passes on to
      its client; an archived event is 409 `event_archived`. A module that then fails to write the file
      releases the bytes again. Internal network only.
    security:
      - {}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../tenants.openapi.yaml#/components/schemas/StorageChange"
    responses:
      "200":
        description: Reserved; the event's usage after it.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/StorageUsage"
      "400":
        $ref: "../tenants.openapi.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../tenants.openapi.yaml#/components/responses/Conflict"
      "413":
        $ref: "../tenants.openapi.yaml#/components/responses/QuotaExceeded"
/internal/tenants/storage/release:
  parameters:
    - $ref: "../tenants.openapi.yaml#/components/parameters/TenantQuery"
  post:
    tags: [internal, storage]
    operationId: releaseStorage
    summary: Give back bytes when a file is deleted, or was never written
    description: |
      Subtracts `bytes` from the module's count, never below 0. In every status of the event, also
      `archived`, since retention deletes files there. Internal network only.
    security:
      - {}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../tenants.openapi.yaml#/components/schemas/StorageChange"
    responses:
      "200":
        description: Released; the event's usage after it.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/StorageUsage"
      "400":
        $ref: "../tenants.openapi.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
/internal/tenants/storage/modules/{module}:
  parameters:
    - $ref: "../tenants.openapi.yaml#/components/parameters/TenantQuery"
    - $ref: "../tenants.openapi.yaml#/components/parameters/StorageModule"
  put:
    tags: [internal, storage]
    operationId: setStorageCount
    summary: Set a module's count to what its files take
    description: |
      The repair for a count that drifted, for example after a crash between a reserve and its release: the
      module counts its own files of the event plus its open reservations (bytes reserved for files not yet
      written or not yet released, so an upload under way is not lost) and sets its count to that, whatever the quota. In every status
      of the event. Internal network only.
    security:
      - {}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../tenants.openapi.yaml#/components/schemas/StorageSet"
    responses:
      "200":
        description: Set; the event's usage after it.
        content:
          application/json:
            schema:
              $ref: "../tenants.openapi.yaml#/components/schemas/StorageUsage"
      "400":
        $ref: "../tenants.openapi.yaml#/components/responses/BadRequest"
      "404":
        $ref: "../tenants.openapi.yaml#/components/responses/NotFound"
