openapi: 3.1.0
info:
  title: Notify API
  version: 1.2.1
  summary: Web Push subscriptions, notifications, check-in and privacy for the phone hub.
  description: |
    Machine-readable part of the notify contract. Prose, topics, delivery rules and events: contracts/notify.md.
    Conventions (snake_case, RFC 3339 UTC times, error body): contracts/README.md.
    The event (tenant) comes from the hostname; no /api/ operation names a tenant. Paths under /internal/notify
    are for other modules on the stack's internal network only; a per-event one names the tenant in `tenant_id`.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Same origin, behind Caddy; the hostname selects the event.
tags:
  - name: push
    description: Web Push key and subscriptions.
  - name: notifications
    description: Notification details and the inbox.
  - name: check-in
    description: Check-in by the rotating QR code.
  - name: me
    description: The caller's own settings, channels, follows and privacy.
  - name: topics
    description: The topic registry and each event's topic configuration.
security:
  - session: []
paths:
  /api/notify/push-key:
    get:
      tags: [push]
      operationId: getPushKey
      summary: The VAPID public key
      description: Passed to `PushManager.subscribe` as `applicationServerKey`. No authentication.
      security: []
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema:
                type: object
                required: [vapid_public_key]
                properties:
                  vapid_public_key:
                    type: string
                    description: Uncompressed P-256 public key, base64url without padding.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/notify/topics:
    get:
      tags: [push]
      operationId: listTopics
      summary: Topics offered at this event
      description: The enabled topics, with their parts, channels and defaults. No authentication.
      security: []
      responses:
        "200":
          description: The topics.
          content:
            application/json:
              schema:
                type: object
                required: [topics]
                properties:
                  topics:
                    type: array
                    items:
                      $ref: "#/components/schemas/TopicInfo"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/notify/topic-types:
    get:
      tags: [topics]
      operationId: listTopicTypes
      summary: Every topic type, with this event's configuration
      description: Needs right `notify.topics.write`. Module topic types and this event's custom topics.
      responses:
        "200":
          description: The topic types.
          content:
            application/json:
              schema:
                type: object
                required: [topic_types]
                properties:
                  topic_types:
                    type: array
                    items:
                      $ref: "#/components/schemas/TopicTypeConfigured"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/notify/topic-types/{topic}:
    parameters:
      - $ref: "#/components/parameters/TopicKey"
    put:
      tags: [topics]
      operationId: saveCustomTopic
      summary: Add or replace one of this event's custom topics
      description: |
        Needs right `notify.topics.write`. Only for keys starting with `custom_` (others 400 `invalid_request`).
        Without `revision` it adds the topic (409 `topic_exists` when taken); with it, it replaces it (409
        `version_conflict` when stale). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomTopicSave"
      responses:
        "200":
          description: The replaced topic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicTypeConfigured"
        "201":
          description: The new topic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicTypeConfigured"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [topics]
      operationId: removeCustomTopic
      summary: Remove one of this event's custom topics
      description: Needs right `notify.topics.write`. Also removes people's choices for it. Audited.
      parameters:
        - name: revision
          in: query
          required: true
          description: The custom topic's revision as read.
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/notify/topic-types/{topic}/config:
    parameters:
      - $ref: "#/components/parameters/TopicKey"
    put:
      tags: [topics]
      operationId: configureTopic
      summary: Configure a topic for this event
      description: |
        Needs right `notify.topics.write`. Fields left out stay as they are. A stale `config_version` is 409
        `version_conflict`; a parameter outside the type's limits or a channel the type does not allow is 400
        `invalid_request`. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicConfigSave"
      responses:
        "200":
          description: The topic type with its new configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicTypeConfigured"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/notify/topic-types/{topic}:
    parameters:
      - $ref: "#/components/parameters/TopicKey"
    put:
      tags: [topics]
      operationId: registerTopicType
      summary: Register a module's topic type
      description: |
        For modules, at start; idempotent, a new registration replaces the old one. Global, for every event.
        Keys starting with `custom_` are 400 `invalid_request`, and so is a trigger whose `event` the `owner` does
        not emit (its first part must equal `owner`); a key registered by another owner is 409 `topic_owned`.
        Every change is kept in Notify's registration history. Internal network only.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicType"
      responses:
        "200":
          description: The stored registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/notify/subscriptions:
    post:
      tags: [push]
      operationId: subscribe
      summary: Subscribe this browser
      description: |
        Without a session a guest subscription (event-wide parts only); with one, the user's. The same
        `endpoint` again replaces the old subscription only for its owner (the same user's session, or the old
        subscription's token); otherwise 409 `subscription_exists`. A personal part without a session is 401
        `sign_in_required`. In info-page mode `sign_in` a guest gets 403 `info_pages_closed`.
      security:
        - {}
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionNew"
      responses:
        "201":
          description: The subscription and its token; the token is shown only here.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Subscription"
                  - type: object
                    required: [subscription_token]
                    properties:
                      subscription_token:
                        type: string
                        description: "Stored only as a hash. Send as `Authorization: Bearer <token>`."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`subscription_exists`: this push endpoint belongs to another subscriber."
  /api/notify/subscriptions/{subscription_id}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      tags: [push]
      operationId: getSubscription
      summary: Read a subscription
      security:
        - session: []
        - subscriptionToken: []
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [push]
      operationId: updateSubscription
      summary: Change a subscription's preferences
      description: Topic parts left out stay as they are. A personal part on a guest subscription is 401 `sign_in_required`.
      security:
        - session: []
        - subscriptionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [push]
      operationId: unsubscribe
      summary: Unsubscribe
      security:
        - session: []
        - subscriptionToken: []
      responses:
        "204":
          description: Deleted; nothing more is pushed to it.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notify/subscriptions/{subscription_id}/claim:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      tags: [push]
      operationId: claimSubscription
      summary: Make a guest subscription the signed-in user's
      description: Needs the session and the subscription's token.
      security:
        - session: []
          subscriptionToken: []
      responses:
        "200":
          description: The subscription, now the user's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notify/notifications/{notification_id}:
    parameters:
      - name: notification_id
        in: path
        required: true
        description: From the push payload or the inbox.
        schema:
          $ref: "#/components/schemas/NotificationId"
    get:
      tags: [notifications]
      operationId: getNotification
      summary: A notification's details
      description: |
        `public`: anyone holding the id whom the event's info-page mode lets in; `attendees`: current
        members only; personal: only its user. Otherwise 404 `not_found`.
      security:
        - {}
        - session: []
      responses:
        "200":
          description: The notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notify/inbox:
    get:
      tags: [notifications]
      operationId: getInbox
      summary: The caller's notifications that have not expired
      description: |
        Newest first: the event-wide ones of the caller's audience (`attendees` only for current members,
        also through a token) and, with a session, their own personal ones. Includes notifications that were
        not pushed.
      security:
        - session: []
        - subscriptionToken: []
      parameters:
        - name: since
          in: query
          description: Only notifications created after this time.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The inbox.
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/notify/check-in/code:
    get:
      tags: [check-in]
      operationId: getCheckInCode
      summary: The current rotating check-in code
      description: |
        Needs right `notify.checkin.display`. The code is the first 128 bits of HMAC-SHA256 (per-event key)
        over event id, purpose and period number, base64url without padding; it rotates every
        `check_in_rotation_seconds` and is valid for its own period and the next one.
      parameters:
        - name: purpose
          in: query
          required: true
          description: "`arrival`, or `<module>:<ref>` for a check-in another module owns."
          schema:
            $ref: "#/components/schemas/Purpose"
      responses:
        "200":
          description: The code and the URL to put in the QR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInCodeNow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /internal/notify/check-in/code:
    get:
      tags: [check-in]
      operationId: getCheckInCodeInternal
      summary: The current rotating check-in code, for a module
      description: |
        For the screen module's server, which shows the code on the event's screens (contracts/screen.md,
        `checkin_qr`); a device has no session. The same answer as `GET /api/notify/check-in/code`, for the
        given tenant. Internal network only.
      security:
        - {}
      parameters:
        - name: tenant_id
          in: query
          required: true
          description: The tenant the calling module serves, set by its kit, never from a client's input.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
        - name: purpose
          in: query
          required: true
          description: "`arrival`, or `<module>:<ref>` for a check-in another module owns."
          schema:
            $ref: "#/components/schemas/Purpose"
      responses:
        "200":
          description: The code and the URL to put in the QR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInCodeNow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /internal/notify/check-ins/count:
    get:
      tags: [check-in]
      operationId: getCheckInCountInternal
      summary: How many members have checked in for a purpose, for a module
      description: |
        For the screen module's server, which shows the count of `arrival` check-ins in its Right now box
        (contracts/screen.md, `stats`' `checked_in`) and reads it again on `notify.checkin.recorded`. Each member
        counts once per purpose. A count names nobody. Internal network only.
      security:
        - {}
      parameters:
        - name: tenant_id
          in: query
          required: true
          description: The tenant the calling module serves, set by its kit, never from a client's input.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
        - name: purpose
          in: query
          required: true
          description: "`arrival`, or `<module>:<ref>` for a check-in another module owns."
          schema:
            $ref: "#/components/schemas/Purpose"
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notify/check-ins:
    post:
      tags: [check-in]
      operationId: checkIn
      summary: Check in with a scanned code
      description: |
        Needs a session of a member of the event. The server recomputes the code for `purpose` for the current
        and the previous period; a code of the 10 periods before is 400 `code_expired`, anything else 400
        `code_invalid`. Emits `notify.checkin.recorded`. The same user and purpose again returns the first
        check-in with 200 and emits nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, code]
              properties:
                purpose:
                  $ref: "#/components/schemas/Purpose"
                code:
                  $ref: "#/components/schemas/CheckInCode"
      responses:
        "200":
          description: Already checked in for this purpose.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"
        "201":
          description: Checked in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckIn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/notify/check-ins/mine:
    get:
      tags: [check-in]
      operationId: listMyCheckIns
      summary: The caller's check-ins at this event
      responses:
        "200":
          description: The check-ins.
          content:
            application/json:
              schema:
                type: object
                required: [check_ins]
                properties:
                  check_ins:
                    type: array
                    items:
                      $ref: "#/components/schemas/CheckIn"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/notify/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The caller's own Notify settings
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [me]
      operationId: updateMe
      summary: Change the caller's own Notify settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Me"
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Delete everything Notify holds on the caller at this event
      description: |
        Subscriptions, preferences, personal notifications and check-ins. Ends every push to the caller.
        Needs a session; a guest deletes its subscription with `DELETE /api/notify/subscriptions/{subscription_id}`.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/notify/me/follows:
    get:
      tags: [me]
      operationId: listFollows
      summary: The entities the caller follows at this event
      responses:
        "200":
          description: The follows.
          content:
            application/json:
              schema:
                type: object
                required: [follows]
                properties:
                  follows:
                    type: array
                    items:
                      $ref: "#/components/schemas/Follow"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/notify/me/follows/{topic}/{entity_id}:
    parameters:
      - $ref: "#/components/parameters/TopicKey"
      - name: entity_id
        in: path
        required: true
        description: The entity's id in its owner module (for the `game` topic, a game of the games catalogue).
        schema:
          $ref: "#/components/schemas/EntityId"
    put:
      tags: [me]
      operationId: follow
      summary: Follow an entity
      description: |
        Needs a session of a member (401 `sign_in_required` otherwise). A topic without an entity-scoped
        personal part is 400 `not_followable`; over 200 follows is 409 `follow_limit`. Notify does not check
        that the entity exists.
      responses:
        "200":
          description: Already followed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Follow"
        "201":
          description: Followed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Follow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [me]
      operationId: unfollow
      summary: Stop following an entity
      responses:
        "204":
          description: Not followed (also when it was not).
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/notify/me/export:
    get:
      tags: [me]
      operationId: exportMe
      summary: Export everything Notify holds on the caller at this event
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: canccu_session
      description: Opaque session id (contracts/admin.md, Session and rights). Rights are checked through admin.
    subscriptionToken:
      type: http
      scheme: bearer
      description: The `subscription_token` returned once on subscribe; lets a guest manage its subscription.
  parameters:
    TopicKey:
      name: topic
      in: path
      required: true
      description: Topic key.
      schema:
        $ref: "#/components/schemas/TopicKey"
    SubscriptionId:
      name: subscription_id
      in: path
      required: true
      description: Subscription id.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,64}$"
  responses:
    BadRequest:
      description: "`invalid_request`; for check-in also `code_invalid` or `code_expired`; for a follow `not_followable`."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    Unauthorized:
      description: "`not_signed_in`, or `sign_in_required` for a personal topic part without a session."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    Forbidden:
      description: |
        `missing_right`; `not_a_member` (check-in by someone not a member of the event); or
        `info_pages_closed` (the event's info-page mode does not let this request in).
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    NotFound:
      description: "`not_found`: no such subscription, notification, topic or tenant, or the caller may not see it."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    Conflict:
      description: |
        `version_conflict` (stale `revision` or `config_version`), `topic_exists`, `topic_owned` (the key
        belongs to another module) or `follow_limit`.
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
  schemas:
    Topic:
      type: string
      description: |
        A registered topic key (contracts/notify.md, Topic registry): built in are `schedule`, `announcements`,
        `food`, `tournament`, `play` and `game`; events add `custom_…` ones. Clients ignore topics they do not know.
      pattern: "^[a-z][a-z0-9_]{0,31}$"
      examples: [schedule]
    TopicInfo:
      type: object
      required: [topic, parts]
      properties:
        topic:
          $ref: "#/components/schemas/Topic"
        title:
          type: string
        description:
          type: string
        owner:
          type: string
        custom:
          type: boolean
          description: One of this event's own topics.
        scopes:
          type: object
          description: Per part, its scope (and for `entity` the entity type), and the channels this event allows with their defaults.
          properties:
            event:
              $ref: "#/components/schemas/PartInfo"
            personal:
              $ref: "#/components/schemas/PartInfo"
        parts:
          type: object
          description: The parts this topic has, with their defaults for a new subscription.
          properties:
            event:
              type: object
              required: [default]
              properties:
                default:
                  type: boolean
            personal:
              type: object
              required: [default, needs_sign_in]
              properties:
                default:
                  type: boolean
                needs_sign_in:
                  type: boolean
                  const: true
    Preferences:
      type: object
      description: Per topic, which parts are on. A topic or part left out takes its default.
      propertyNames:
        $ref: "#/components/schemas/Topic"
      additionalProperties:
        type: object
        properties:
          event:
            type: boolean
          personal:
            type: boolean
    PartInfo:
      type: object
      required: [scope, channels, defaults]
      properties:
        scope:
          type: string
          enum: [event, user, entity]
        entity_type:
          type: string
        channels:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Channel"
        defaults:
          $ref: "#/components/schemas/ChannelSwitches"
    TopicKey:
      type: string
      description: A module's topic key, or `custom_…` for an event's own topic.
      pattern: "^[a-z][a-z0-9_]{0,31}$"
      examples: [schedule, game, custom_cosplay]
    Channel:
      type: string
      description: A channel Notify delivers on. Consumers ignore channels they do not know.
      enum: [push, discord_dm]
    ChannelSwitches:
      type: object
      properties:
        push:
          type: boolean
        discord_dm:
          type: boolean
    Path:
      type: string
      description: A dot path into the event envelope, e.g. `data.item.kind` or `correlation_id`.
      pattern: "^[a-z_][a-z0-9_]*(\\.[a-z_][a-z0-9_]*)*$"
    Condition:
      type: object
      required: [field, op]
      properties:
        field:
          $ref: "#/components/schemas/Path"
        op:
          type: string
          enum: [eq, ne, in, not_in, exists, within_minutes, nearest_in]
        value:
          description: The value to compare with (`eq`, `ne`, `in`, `not_in`, `within_minutes`).
        param:
          type: string
          description: A parameter of the topic type to compare with, instead of `value`.
        list:
          $ref: "#/components/schemas/Path"
    TopicParam:
      type: object
      required: [key, type, default]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        type:
          type: string
          enum: [integer, boolean, string]
        default:
          type: [integer, boolean, string]
        min:
          type: integer
        max:
          type: integer
        description:
          type: string
          maxLength: 200
    TopicPart:
      type: object
      required: [scope, channels, defaults]
      properties:
        scope:
          type: string
          description: "`event` for the event part; `user` or `entity` for the personal part."
          enum: [event, user, entity]
        channels:
          type: array
          description: The channels a person may pick from for this part.
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Channel"
        defaults:
          $ref: "#/components/schemas/ChannelSwitches"
        entity:
          type: object
          description: For scope `entity`.
          required: [type]
          properties:
            type:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,31}$"
              examples: [game]
            merged:
              type: object
              required: [event, from, into]
              properties:
                event:
                  type: string
                from:
                  $ref: "#/components/schemas/Path"
                into:
                  $ref: "#/components/schemas/Path"
            removed:
              type: object
              required: [event, id]
              properties:
                event:
                  type: string
                id:
                  $ref: "#/components/schemas/Path"
    Audience:
      type: object
      description: "`field`: a path to the event's visibility; or a fixed `value`. It must match the event catalog."
      properties:
        field:
          $ref: "#/components/schemas/Path"
        value:
          type: string
          enum: [public, attendees]
    Trigger:
      type: object
      required: [event, part, title, body]
      properties:
        event:
          type: string
          description: The event type, as in contracts/events.md.
          pattern: "^[a-z]+(\\.[a-z][a-z0-9_]*){2}$"
        part:
          type: string
          enum: [event, personal]
        audience:
          $ref: "#/components/schemas/Audience"
        recipients:
          type: object
          description: "Personal part: `user_field` (scope `user`) or `entity_field` (scope `entity`)."
          properties:
            user_field:
              $ref: "#/components/schemas/Path"
            entity_field:
              $ref: "#/components/schemas/Path"
        where:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        channels_field:
          $ref: "#/components/schemas/Path"
        dedupe_by:
          type: array
          description: Paths, or `audience`; default the event's `id`.
          items:
            type: string
        urgent:
          oneOf:
            - type: boolean
            - type: object
              required: [field]
              properties:
                field:
                  $ref: "#/components/schemas/Path"
        title:
          type: string
          description: Template; `{<path>}` or `{param.<key>}`, optional formatter `|time`, `|date` or `|signed`.
          maxLength: 200
        body:
          type: string
          maxLength: 400
        url:
          type: string
          maxLength: 200
        expires_at:
          $ref: "#/components/schemas/Path"
        expires_after_minutes:
          type: integer
          minimum: 1
          maximum: 10080
          description: Minutes after creation. With `expires_at` too, used only when that path's value is missing or null.
    TopicType:
      type: object
      required: [key, owner, title, parts, triggers]
      properties:
        key:
          $ref: "#/components/schemas/TopicKey"
        owner:
          type: string
          description: The registering module.
          pattern: "^[a-z]+$"
        title:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: string
          maxLength: 200
        parts:
          type: object
          minProperties: 1
          properties:
            event:
              $ref: "#/components/schemas/TopicPart"
            personal:
              $ref: "#/components/schemas/TopicPart"
        params:
          type: array
          items:
            $ref: "#/components/schemas/TopicParam"
        triggers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Trigger"
    TopicConfig:
      type: object
      required: [config_version, enabled, params, channels]
      properties:
        config_version:
          type: integer
          minimum: 0
        enabled:
          type: boolean
        params:
          type: object
          description: Parameter values for this event; a parameter left out takes its default.
          additionalProperties:
            type: [integer, boolean, string]
        channels:
          type: array
          description: The channels this event allows, a subset of the type's.
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Channel"
    TopicConfigSave:
      type: object
      required: [config_version]
      properties:
        config_version:
          type: integer
          minimum: 0
        enabled:
          type: boolean
        params:
          type: object
          additionalProperties:
            type: [integer, boolean, string]
        channels:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Channel"
    CustomTopicSave:
      type: object
      required: [based_on, title, where]
      properties:
        revision:
          type: integer
          minimum: 1
          description: Required to replace; left out to add.
        based_on:
          $ref: "#/components/schemas/TopicKey"
        title:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: string
          maxLength: 200
        defaults:
          type: object
          description: |
            Per part, the channel defaults for people who have not chosen. A default may be `true` only where the
            base's default for that part and channel is `true`; anything else is 400 `invalid_request`.
          properties:
            event:
              $ref: "#/components/schemas/ChannelSwitches"
            personal:
              $ref: "#/components/schemas/ChannelSwitches"
        where:
          type: array
          minItems: 1
          description: Added to every trigger of the base; it can only narrow.
          items:
            $ref: "#/components/schemas/Condition"
    TopicTypeConfigured:
      type: object
      required: [topic_type, config]
      properties:
        topic_type:
          $ref: "#/components/schemas/TopicType"
        custom:
          type: object
          description: Present for an event's own topic.
          required: [based_on, where, revision]
          properties:
            based_on:
              $ref: "#/components/schemas/TopicKey"
            where:
              type: array
              items:
                $ref: "#/components/schemas/Condition"
            revision:
              type: integer
              minimum: 1
        config:
          $ref: "#/components/schemas/TopicConfig"
    EntityId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
      examples: [g_42]
    Follow:
      type: object
      required: [topic, entity_id, created_at]
      properties:
        topic:
          $ref: "#/components/schemas/TopicKey"
        entity_id:
          $ref: "#/components/schemas/EntityId"
        created_at:
          type: string
          format: date-time
    PushSubscription:
      type: object
      description: As the browser's `PushSubscription.toJSON()` gives it.
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string
    SubscriptionNew:
      type: object
      required: [push]
      properties:
        push:
          $ref: "#/components/schemas/PushSubscription"
        preferences:
          $ref: "#/components/schemas/Preferences"
    Subscription:
      type: object
      description: Never contains the push endpoint's keys.
      required: [id, kind, preferences, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [guest, user]
        preferences:
          $ref: "#/components/schemas/Preferences"
        created_at:
          type: string
          format: date-time
    NotificationId:
      type: string
      description: Random and unguessable.
      pattern: "^[A-Za-z0-9_-]{16,64}$"
    Notification:
      type: object
      required: [id, topic, part, audience, title, body, urgent, created_at, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/NotificationId"
        topic:
          $ref: "#/components/schemas/Topic"
        part:
          type: string
          enum: [event, personal]
        audience:
          type: string
          enum: [public, attendees, personal]
        title:
          type: string
          maxLength: 80
        body:
          type: string
          maxLength: 300
        url:
          type: string
          description: A page of the hub, relative to the event's hostname.
        urgent:
          type: boolean
        entity:
          type: object
          description: For an entity-scoped topic, the entity it is about.
          required: [type, id]
          properties:
            type:
              type: string
            id:
              $ref: "#/components/schemas/EntityId"
        pushed:
          type: boolean
          description: In the inbox, whether it was pushed to the caller (not held by cap, quiet hours or opt-out).
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    Purpose:
      type: string
      pattern: "^(arrival|[a-z]+:[A-Za-z0-9_-]{1,64})$"
      examples: [arrival, "tournament:s_12"]
    CheckInCode:
      type: string
      description: 128 bits of HMAC-SHA256, base64url without padding.
      pattern: "^[A-Za-z0-9_-]{22}$"
    CheckInCount:
      type: object
      required: [purpose, count]
      properties:
        purpose:
          $ref: "#/components/schemas/Purpose"
        count:
          type: integer
          minimum: 0
          description: The members checked in for `purpose` at this event, each once.
    CheckInCodeNow:
      type: object
      required: [purpose, code, url, valid_until, rotates_at]
      properties:
        purpose:
          $ref: "#/components/schemas/Purpose"
        code:
          $ref: "#/components/schemas/CheckInCode"
        url:
          type: string
          description: |
            Absolute URL on the event's `primary_hostname`: `https://<primary_hostname>/notify/check-in?p=<purpose>&c=<code>`.
            While the event has no `primary_hostname`, the path alone, which a page resolves against its own origin
            before it draws the QR (contracts/notify.md, Check-in by the rotating QR).
        valid_until:
          type: string
          format: date-time
        rotates_at:
          type: string
          format: date-time
    CheckIn:
      type: object
      required: [id, purpose, checked_in_at]
      properties:
        id:
          type: string
        purpose:
          $ref: "#/components/schemas/Purpose"
        checked_in_at:
          type: string
          format: date-time
    Me:
      type: object
      properties:
        dm_fallback:
          type: boolean
          default: true
          description: |
            Personal notifications fall back to a Discord DM when no push reaches the caller, unless the caller
            explicitly set `discord_dm: false` for that topic and part in `channels`. No DM goes out while the
            event's Discord client cannot send one (no guild bound, or the client paused or failed).
        channels:
          type: object
          description: |
            Per topic and part, the caller's channels; left out takes the part's defaults. An explicit
            `discord_dm: false` also stops the DM fallback for that topic and part; a default does not.
          propertyNames:
            $ref: "#/components/schemas/Topic"
          additionalProperties:
            type: object
            properties:
              event:
                $ref: "#/components/schemas/ChannelSwitches"
              personal:
                $ref: "#/components/schemas/ChannelSwitches"
    Export:
      type: object
      required: [subscriptions, me, notifications, check_ins]
      properties:
        follows:
          type: array
          items:
            $ref: "#/components/schemas/Follow"
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
        me:
          $ref: "#/components/schemas/Me"
        notifications:
          type: array
          description: The caller's personal notifications.
          items:
            $ref: "#/components/schemas/Notification"
        check_ins:
          type: array
          items:
            $ref: "#/components/schemas/CheckIn"
