                $ref: "#/components/schemas/AuditEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
  /internal/tenants/identities/sign-in:
    post:
      tags: [internal, people]
      operationId: signInIdentity
      summary: Map a verified sign-in identity to its user
      description: |
        For the central sign-in, after any provider has verified the person (contracts/admin.md, Sign-in
        providers). Finds the user of (`provider`, `subject`), or creates a user with that identity; updates the
        identity's `mfa_enabled`, and the user's `name` only when this is the identity the user was created with.
        The same call for every provider. Internal network only.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentitySignIn"
      responses:
        "200":
          description: The user, and whether this call created it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySignInResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`provider_disabled`: the provider is not in `CANCCU_SIGN_IN_PROVIDERS`."
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: canccu_session
      description: |
        Opaque session id (contracts/admin.md, Session and rights), bound to one tenant, or to the platform on
        the superadmin hostname. Rights are checked through admin.
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: Tenant id.
      schema:
        $ref: "#/components/schemas/TenantId"
    UserId:
      name: user_id
      in: path
      required: true
      description: User id.
      schema:
        $ref: "#/components/schemas/UserId"
    VenueId:
      name: venue_id
      in: path
      required: true
      description: Venue id.
      schema:
        $ref: "#/components/schemas/Id"
    SeriesId:
      name: series_id
      in: path
      required: true
      description: Series id.
      schema:
        $ref: "#/components/schemas/Id"
    HostnameParam:
      name: hostname
      in: path
      required: true
      description: The hostname, lowercase.
      schema:
        $ref: "#/components/schemas/HostnameValue"
    Before:
      name: before
      in: query
      description: Only entries older than this entry id (the last id of the previous page).
      schema:
        $ref: "#/components/schemas/Id"
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  requestBodies:
    FloorPlan:
      required: true
      description: The image, up to 10 MB. SVG is refused.
      content:
        image/png:
          schema:
            $ref: "#/components/schemas/Binary"
        image/jpeg:
          schema:
            $ref: "#/components/schemas/Binary"
        image/webp:
          schema:
            $ref: "#/components/schemas/Binary"
  responses:
    BadRequest:
      description: "`invalid_request`: a field is missing or invalid; `unknown_flag` for an undeclared flag."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    Forbidden:
      description: |
        `missing_right`; `superadmin_required`; `mfa_required` (a superadmin whose session's identity has no
        second factor, today Discord two-factor); `admin_access_restricted` (the event's `admin_access` is
        `restricted` and the request is neither from the venue nor over Tailscale); `info_pages_closed` (the info-page mode does not let this request in);
        `membership_closed` (a self-join that `membership`, the event's status or the request's place does not
        allow); `join_code_invalid` (a join code that is not the current one, from outside the venue).
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    NotFound:
      description: |
        `not_found`: no such tenant, hostname, venue, series, user or entry; also every superadmin path on a
        hostname other than the superadmin hostname, and an unknown host.
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    Conflict:
      description: |
        `version_conflict` (stale `revision` or `flags_version`), `event_archived`, `invalid_transition`,
        `already_cloned`, `no_venue`, `last_admin`, `last_superadmin`, `mfa_required`, `tenant_exists`,
        `tenant_live`, `venue_in_use`, `hostname_taken`, `hostname_held`, `hostname_reserved`, `primary_hostname`,
        `hostname_not_active`, `verification_failed`.
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    TooLarge:
      description: "`file_too_large`: over 10 MB."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    UnsupportedType:
      description: "`unsupported_type`: not PNG, JPEG or WebP."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
  schemas:
    Binary:
      type: string
      format: binary
    Id:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
    TenantId:
      type: string
      description: Lowercase letters, digits and `-`, 3–32 characters, starting with a letter; never changes.
      pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
      examples: [demo]
    UserId:
      type: string
      pattern: "^u_[A-Za-z0-9]{1,40}$"
      examples: [u_123]
    HostnameValue:
      type: string
      description: A fully qualified hostname, lowercase, no trailing dot.
      pattern: "^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"
      examples: [demo.example.org]
    Cidr:
      type: string
      description: An IPv4 or IPv6 address or prefix in CIDR notation; a plain address is a single host.
      maxLength: 49
      examples: ["192.0.2.10/32", "2001:db8:1::/48"]
    Status:
      type: string
      enum: [draft, live, archived]
    InfoPageMode:
      type: string
      enum: [public, venue_only, sign_in]
    Membership:
      type: string
      description: |
        `venue_or_link`: a signed-in user joins from one of the venue's addresses or with the event's join code
        (the default). `closed`: only event admins add members.
      enum: [venue_or_link, closed]
    AdminAccess:
      type: string
      enum: [restricted, internet]
    TimeZone:
      type: string
      description: An IANA time zone name.
      maxLength: 64
      examples: [Europe/Berlin]
    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
    DraftTenant:
      type: object
      description: What a guest sees of a `draft` event.
      required: [id, status]
      properties:
        id:
          $ref: "#/components/schemas/TenantId"
        status:
          const: draft
    PublicTenant:
      type: object
      description: What a guest sees of the event.
      required: [id, name, status, time_zone, starts_at, ends_at, venue, primary_hostname, info_page_mode, membership]
      properties:
        id:
          $ref: "#/components/schemas/TenantId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: "#/components/schemas/Status"
        time_zone:
          $ref: "#/components/schemas/TimeZone"
        starts_at:
          type: [string, "null"]
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
        venue:
          oneOf:
            - $ref: "#/components/schemas/NamedRef"
            - type: "null"
        primary_hostname:
          description: "`null` until the first hostname is added, or while none is `active`."
          oneOf:
            - $ref: "#/components/schemas/HostnameValue"
            - type: "null"
        info_page_mode:
          $ref: "#/components/schemas/InfoPageMode"
        membership:
          $ref: "#/components/schemas/Membership"
    Tenant:
      description: The whole tenant, for event admins and the superadmin.
      allOf:
        - $ref: "#/components/schemas/PublicTenant"
        - type: object
          required: [series_id, admin_access, venue_ip_check, archived_at, presence_delete_at, personal_anonymise_at, cloned_from, created_at, revision]
          properties:
            series_id:
              type: [string, "null"]
            admin_access:
              $ref: "#/components/schemas/AdminAccess"
            venue_ip_check:
              $ref: "#/components/schemas/VenueIpCheck"
            archived_at:
              type: [string, "null"]
              format: date-time
            presence_delete_at:
              type: [string, "null"]
              format: date-time
              description: "`archived_at` plus 30 days; the presence data of the event is deleted then."
            personal_anonymise_at:
              type: [string, "null"]
              format: date-time
              description: "`archived_at` plus 12 calendar months; the event's other personal data is anonymised then."
            cloned_from:
              type: [string, "null"]
              description: The source tenant id once the tenants part of a clone has run.
            created_at:
              type: string
              format: date-time
            revision:
              type: integer
              minimum: 1
    TenantPatch:
      type: object
      description: "`revision` plus the fields to change; fields left out stay as they are."
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
        time_zone:
          $ref: "#/components/schemas/TimeZone"
        starts_at:
          type: [string, "null"]
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
        info_page_mode:
          $ref: "#/components/schemas/InfoPageMode"
        membership:
          $ref: "#/components/schemas/Membership"
        admin_access:
          $ref: "#/components/schemas/AdminAccess"
    RegistryPatch:
      description: As `TenantPatch`, plus the venue and the series (`null` removes them).
      allOf:
        - $ref: "#/components/schemas/TenantPatch"
        - type: object
          properties:
            venue_id:
              type: [string, "null"]
            series_id:
              type: [string, "null"]
    TenantNew:
      type: object
      required: [id, name, time_zone]
      properties:
        id:
          $ref: "#/components/schemas/TenantId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        time_zone:
          $ref: "#/components/schemas/TimeZone"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        venue_id:
          $ref: "#/components/schemas/Id"
        series_id:
          $ref: "#/components/schemas/Id"
        admin_user_ids:
          type: array
          description: The first event admins.
          items:
            $ref: "#/components/schemas/UserId"
    StatusChange:
      type: object
      required: [status, revision]
      properties:
        status:
          type: string
          enum: [live, archived]
        revision:
          type: integer
          minimum: 1
    Flags:
      type: object
      required: [flags_version, flags]
      properties:
        flags_version:
          type: integer
          minimum: 0
          description: 0 while no flag is stored; +1 on every write.
        flags:
          $ref: "#/components/schemas/FlagMap"
    FlagMap:
      type: object
      description: Flag name (`<module>.<feature>`) to on or off.
      propertyNames:
        pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"
      additionalProperties:
        type: boolean
      examples:
        - bot.stats: false
    FlagsWrite:
      type: object
      required: [flags_version, flags]
      properties:
        flags_version:
          type: integer
          minimum: 0
        flags:
          $ref: "#/components/schemas/FlagMap"
    CloneRequest:
      type: object
      required: [source_tenant_id, shift_seconds]
      properties:
        source_tenant_id:
          $ref: "#/components/schemas/TenantId"
        shift_seconds:
          type: integer
          description: Added to the source's dates.
    Series:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 120
    SeriesWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    SeriesView:
      type: object
      required: [series, events]
      properties:
        series:
          $ref: "#/components/schemas/Series"
        events:
          type: array
          description: The series' events, oldest first.
          items:
            type: object
            required: [id, name, status, starts_at, ends_at, caller_is_admin]
            properties:
              id:
                $ref: "#/components/schemas/TenantId"
              name:
                type: string
              status:
                $ref: "#/components/schemas/Status"
              starts_at:
                type: [string, "null"]
                format: date-time
              ends_at:
                type: [string, "null"]
                format: date-time
              caller_is_admin:
                type: boolean
    Visibility:
      type: string
      enum: [public, attendees]
    Wifi:
      type: object
      required: [ssid, password, note, visibility]
      properties:
        ssid:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: [string, "null"]
          description: A passphrase of 8–63 characters, or a 64-hex-digit key.
          maxLength: 64
        note:
          type: [string, "null"]
          maxLength: 500
        visibility:
          $ref: "#/components/schemas/Visibility"
    VenueProfile:
      type: object
      required: [house_rules, wifi, floor_plan]
      properties:
        house_rules:
          type: string
          maxLength: 20000
        wifi:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Wifi"
        floor_plan:
          $ref: "#/components/schemas/FloorPlanRef"
    VenueProfileWrite:
      type: object
      required: [house_rules, wifi]
      properties:
        house_rules:
          type: string
          maxLength: 20000
        wifi:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Wifi"
    FloorPlanRef:
      oneOf:
        - type: "null"
        - type: object
          required: [content_type, updated_at]
          properties:
            content_type:
              type: string
              enum: [image/png, image/jpeg, image/webp]
            updated_at:
              type: string
              format: date-time
    VenueRef:
      type: object
      required: [id, name, addresses]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 120
        addresses:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Cidr"
    Venue:
      allOf:
        - $ref: "#/components/schemas/VenueRef"
        - type: object
          required: [profile, revision]
          properties:
            profile:
              $ref: "#/components/schemas/VenueProfile"
            revision:
              type: integer
              minimum: 1
    VenueNew:
      type: object
      required: [name, addresses]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        addresses:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Cidr"
        profile:
          $ref: "#/components/schemas/VenueProfileWrite"
    VenuePatch:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
        addresses:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Cidr"
        profile:
          $ref: "#/components/schemas/VenueProfileWrite"
    VenueInfo:
      type: object
      description: The event's copy of its venue's profile; Wi-Fi networks the caller may not see are left out.
      required: [venue_id, copied_at, house_rules, wifi, floor_plan, revision]
      properties:
        venue_id:
          type: [string, "null"]
        copied_at:
          type: [string, "null"]
          format: date-time
        house_rules:
          type: string
          maxLength: 20000
        wifi:
          type: array
          items:
            $ref: "#/components/schemas/Wifi"
        floor_plan:
          $ref: "#/components/schemas/FloorPlanRef"
        revision:
          type: integer
          minimum: 0
    VenueInfoWrite:
      allOf:
        - $ref: "#/components/schemas/VenueProfileWrite"
        - type: object
          required: [revision]
          properties:
            revision:
              type: integer
              minimum: 0
    VenueIpCheck:
      type: object
      required: [enabled, disabled_until, reason]
      properties:
        enabled:
          type: boolean
        disabled_until:
          type: [string, "null"]
          format: date-time
          description: While off, when it turns itself back on.
        reason:
          type: [string, "null"]
          maxLength: 500
    VenueIpCheckWrite:
      oneOf:
        - type: object
          required: [enabled]
          properties:
            enabled:
              const: true
        - type: object
          required: [enabled, reason, until]
          properties:
            enabled:
              const: false
            reason:
              type: string
              minLength: 1
              maxLength: 500
            until:
              type: string
              format: date-time
              description: At most 48 hours ahead.
    Hostname:
      type: object
      required: [hostname, tenant_id, kind, status, primary, verification, held_until]
      properties:
        hostname:
          $ref: "#/components/schemas/HostnameValue"
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        kind:
          type: string
          enum: [platform, custom]
        status:
          type: string
          enum: [pending, active, held]
        primary:
          type: boolean
        verification:
          description: For a `pending` custom hostname, the TXT record to create; otherwise `null`.
          oneOf:
            - type: "null"
            - type: object
              required: [txt_name, txt_value]
              properties:
                txt_name:
                  type: string
                  examples: [_canccu-verify.demo.example.org]
                txt_value:
                  type: string
        held_until:
          type: [string, "null"]
          format: date-time
    HostnameNew:
      type: object
      required: [hostname]
      properties:
        hostname:
          $ref: "#/components/schemas/HostnameValue"
    HostnamePatch:
      type: object
      required: [primary]
      properties:
        primary:
          const: true
    User:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        name:
          type: string
    Privacy:
      type: object
      required: [presence_opt_out, memories_opt_in]
      properties:
        presence_opt_out:
          type: boolean
          description: No module records presence data about the user; held presence data is deleted.
        memories_opt_in:
          type: boolean
          description: Moments keeps the user's memories past the event.
    UserInternal:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [discord_user_id, privacy]
          properties:
            discord_user_id:
              type: string
              pattern: "^[0-9]{1,20}$"
              description: |
                Derived: the subject of the user's `discord` identity. Always set while `discord` is the only
                enabled sign-in provider, so every account is a Discord account (contracts/tenants.md, Sign-in
                identities).
            identities:
              type: array
              description: All of the user's sign-in identities, at most one per provider.
              items:
                $ref: "#/components/schemas/Identity"
            privacy:
              $ref: "#/components/schemas/Privacy"
    SignInProvider:
      type: string
      description: |
        A sign-in provider's id. Today only `discord` exists; more may be added, so clients accept other values.
        Which are enabled is the platform setting `CANCCU_SIGN_IN_PROVIDERS` (contracts/admin.md).
      pattern: "^[a-z][a-z0-9_]{1,31}$"
      examples: [discord]
    Identity:
      type: object
      required: [provider, subject, mfa_enabled, linked_at]
      properties:
        provider:
          $ref: "#/components/schemas/SignInProvider"
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            The account's stable id at the provider. For `discord` the Discord user id, matching `^[0-9]{1,20}$`
            (400 otherwise); each later provider's contract sets its own rule.
          examples: ["100000000000000001"]
        mfa_enabled:
          type: boolean
          description: |
            Whether the account has a second factor, as the provider last reported it (Discord's `mfa_enabled`).
            The superadmin check reads it on the identity the session signed in with.
        linked_at:
          type: string
          format: date-time
    IdentitySignIn:
      type: object
      required: [provider, subject, name, mfa_enabled]
      additionalProperties: false
      properties:
        provider:
          $ref: "#/components/schemas/SignInProvider"
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: "For `discord`, matching `^[0-9]{1,20}$`; otherwise 400."
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            The name the provider reports. It sets the user's `name` on create, and later only when this is the
            identity the user was created with.
        mfa_enabled:
          type: boolean
    IdentitySignInResult:
      type: object
      required: [user, created]
      properties:
        user:
          $ref: "#/components/schemas/UserInternal"
        created:
          type: boolean
          description: True when this sign-in created the user.
    Role:
      type: string
      description: Per-tenant roles; more may be added.
      enum: [event_admin]
    Me:
      type: object
      required: [user, member, roles, superadmin, support_until, privacy]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        member:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        superadmin:
          type: boolean
        support_until:
          type: [string, "null"]
          format: date-time
          description: The end of the caller's open support window here, if any.
        privacy:
          oneOf:
            - $ref: "#/components/schemas/Privacy"
            - type: "null"
    JoinRequest:
      type: object
      properties:
        join_code:
          $ref: "#/components/schemas/JoinCode"
    JoinCode:
      type: string
      description: 128 random bits, base64url without padding.
      pattern: "^[A-Za-z0-9_-]{22}$"
    JoinLink:
      type: object
      required: [join_code, url, rotated_at]
      properties:
        join_code:
          $ref: "#/components/schemas/JoinCode"
        url:
          type: [string, "null"]
          description: |
            `https://<primary_hostname>/notify/join#code=<join_code>`, the hub's join page; the code is in the
            fragment so it reaches no server log. `null` while the event has no primary hostname.
        rotated_at:
          type: string
          format: date-time
          description: When the code was made, at creation or by the last rotation.
    Member:
      type: object
      required: [user, joined_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        joined_at:
          type: string
          format: date-time
    MemberPage:
      type: object
      required: [members, next_cursor]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        next_cursor:
          type: [string, "null"]
    AdminList:
      type: object
      required: [admins]
      properties:
        admins:
          type: array
          items:
            $ref: "#/components/schemas/User"
    SupportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    SupportWindow:
      type: object
      required: [user_id, reason, until]
      properties:
        user_id:
          $ref: "#/components/schemas/UserId"
        reason:
          type: string
        until:
          type: string
          format: date-time
    TenantContext:
      type: object
      description: What the kit needs to serve a request for this tenant.
      required: [tenant_id, status, primary_hostname, time_zone, info_page_mode, membership, admin_access, venue, venue_ip_check, flags_version, flags]
      properties:
        tenant_id:
          $ref: "#/components/schemas/TenantId"
        status:
          $ref: "#/components/schemas/Status"
        primary_hostname:
          description: "`null` until the first hostname is added, or while none is `active`."
          oneOf:
            - $ref: "#/components/schemas/HostnameValue"
            - type: "null"
        time_zone:
          $ref: "#/components/schemas/TimeZone"
        info_page_mode:
          $ref: "#/components/schemas/InfoPageMode"
        membership:
          $ref: "#/components/schemas/Membership"
        admin_access:
          $ref: "#/components/schemas/AdminAccess"
        venue:
          oneOf:
            - $ref: "#/components/schemas/VenueRef"
            - type: "null"
        venue_ip_check:
          $ref: "#/components/schemas/VenueIpCheck"
        flags_version:
          type: integer
          minimum: 0
        flags:
          $ref: "#/components/schemas/FlagMap"
    AuditActor:
      type: object
      required: [kind, ref, superadmin, support]
      properties:
        kind:
          type: string
          enum: [user, system, module]
        ref:
          type: [string, "null"]
          description: The user's audit reference (`aud_…`) for `user`, the module name for `module`, `null` for `system`.
        superadmin:
          type: boolean
        support:
          type: boolean
          description: Done inside a support window.
    AuditEntry:
      type: object
      required: [id, time, tenant_id, actor, action, target, changes, reason, correlation_id]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        time:
          type: string
          format: date-time
        tenant_id:
          type: [string, "null"]
          description: "`null` for a platform entry."
        actor:
          $ref: "#/components/schemas/AuditActor"
        actor_user:
          description: Added on read while the user exists; absent once the user is deleted.
          $ref: "#/components/schemas/User"
        action:
          type: string
          pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*){2}$"
          examples: [tenants.venue_ip_check.changed]
        target:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              examples: [venue]
            id:
              type: string
        changes:
          type: object
          description: Field name to `{"old", "new"}`. Secret values never appear; a changed secret shows only its name.
          additionalProperties:
            type: object
            properties:
              old: {}
              new: {}
        reason:
          type: [string, "null"]
        correlation_id:
          type: [string, "null"]
    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
    AuditAppend:
      type: object
      description: |
        `tenant_id` `null` for a platform entry. `actor_user_id` is turned into the user's audit reference;
        without it the actor is the calling module. Callers never send `superadmin` or `support`: the tenants
        module sets `actor.superadmin` from the user row, and `actor.support` when the user has an open
        support window in `tenant_id` at append time.
      required: [tenant_id, module, action, target]
      properties:
        tenant_id:
          type: [string, "null"]
        module:
          type: string
          description: The appending module; equals the first part of `action`.
        actor_user_id:
          $ref: "#/components/schemas/UserId"
        action:
          type: string
          pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*){2}$"
        target:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
            id:
              type: string
        changes:
          type: object
          additionalProperties:
            type: object
            properties:
              old: {}
              new: {}
        reason:
          type: string
          maxLength: 500
        correlation_id:
          type: string
