      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
  post:
    tags: [ticker]
    operationId: addTickerWindow
    summary: Add a ticker window
    description: Right `screen.ticker.write`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/TickerWindow"
    responses:
      "201":
        description: The window.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/TickerWindow"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/ticker/windows/{window_id}:
  parameters:
    - name: window_id
      in: path
