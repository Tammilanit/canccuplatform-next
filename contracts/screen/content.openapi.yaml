# Part of screen.openapi.yaml: path items only, referenced from its `paths`
# and linted through it (contracts/README.md, Shared components).
/api/screen/assets:
  get:
    tags: [content]
    operationId: listAssets
    summary: The asset library
    description: Right `screen.content.read`.
    parameters:
      - name: q
        in: query
        description: Title contains this text.
        schema:
          type: string
          maxLength: 120
      - name: kind
        in: query
        description: Only this kind.
        schema:
          $ref: "../screen.openapi.yaml#/components/schemas/AssetKind"
      - $ref: "../screen.openapi.yaml#/components/parameters/Cursor"
    responses:
      "200":
        description: A page of assets.
        content:
          application/json:
            schema:
              type: object
              required: [assets, next_cursor]
              properties:
                assets:
                  type: array
                  items:
                    $ref: "../screen.openapi.yaml#/components/schemas/Asset"
                next_cursor:
                  type: [string, "null"]
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
  post:
    tags: [content]
    operationId: addAsset
    summary: Upload a file, or add a web or YouTube URL
    description: |
      Right `screen.content.write`. A file ≤ 100 MiB, checked by content. A `pptx` or `pdf` upload submits a render job.
      400 `origin_not_allowed` for a web URL off `web_allowlist`; 400 `media_unsupported` for a video or audio
      file the screens do not play; 413 `file_too_large` or `storage_quota_exceeded`.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/AssetUpload"
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/AssetUrl"
    responses:
      "201":
        description: The asset.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Asset"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
      "413":
        $ref: "../screen.openapi.yaml#/components/responses/TooLarge"
/api/screen/assets/name-check:
  post:
    tags: [content]
    operationId: checkAssetNames
    summary: Same-name matches before an upload
    description: Right `screen.content.write`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [names]
            properties:
              names:
                type: array
                maxItems: 100
                items:
                  type: string
                  maxLength: 200
    responses:
      "200":
        description: For each name, the assets with the same title.
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  items:
                    type: object
                    required: [name, asset_ids]
                    properties:
                      name:
                        type: string
                      asset_ids:
                        type: array
                        items:
                          $ref: "../screen.openapi.yaml#/components/schemas/Id"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/assets/{asset_id}:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/AssetId"
  patch:
    tags: [content]
    operationId: editAsset
    summary: Rename an asset or reset its health
    description: Right `screen.content.write`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 200
              reset_health:
                type: boolean
    responses:
      "200":
        description: The asset.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Asset"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
  delete:
    tags: [content]
    operationId: deleteAsset
    summary: Delete an asset
    description: |
      Right `screen.content.write`. 409 `asset_in_use` while a playlist, an active push or the `ready_fallback_asset_id` setting refers to it. Its files and renders are deleted
      only when nothing else of the tenant refers to them: no other asset version (also a kept undo version), render, photo or claim sound.
    responses:
      "204":
        description: Deleted.
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/assets/{asset_id}/replace:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/AssetId"
  post:
    tags: [content]
    operationId: replaceAsset
    summary: Replace an asset's file
    description: Right `screen.content.write`. Keeps the previous version for one undo; slide ranges are clamped to the new deck.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/AssetUpload"
    responses:
      "200":
        description: The asset with its new version.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Asset"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../screen.openapi.yaml#/components/responses/TooLarge"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/assets/{asset_id}/revert:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/AssetId"
  post:
    tags: [content]
    operationId: revertAsset
    summary: Undo the last replace
    description: Right `screen.content.write`. 409 `nothing_to_revert`.
    responses:
      "200":
        description: The asset with its previous version.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Asset"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/files/{file}:
  parameters:
    - name: file
      in: path
      required: true
      description: Content-addressed file name, `<sha256>.<ext>`.
      schema:
        type: string
        pattern: "^[a-f0-9]{64}\\.[a-z0-9]{1,8}$"
  get:
    tags: [content]
    operationId: getFile
    summary: A media file of the event
    description: |
      For the event's devices (cookie and venue address) and sessions with `screen.content.read`. Immutable.
      Served only when the name resolves to an asset version or photo of the current tenant; the storage path is built from
      that row, never from the request.
    security:
      - device: []
      - session: []
    responses:
      "200":
        description: The file, with the content type set from its checked content.
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
/api/screen/art/{art}:
  parameters:
    - name: art
      in: path
      required: true
      description: "`<art_id>.webp`: the SHA-256 of the blurred art's bytes."
      schema:
        type: string
        pattern: "^[a-f0-9]{64}\\.webp$"
  get:
    tags: [content]
    operationId: getStageArt
    summary: A game's art, blurred for the stage
    description: |
      For the event's devices (cookie and venue address) and sessions with `screen.devices.read` (contracts/screen.md, The
      stage). Immutable. Served from Screen's cache of the current tenant only; an id the cache no longer holds is 404
      until Screen next composes the zone, which makes the art again.
    security:
      - device: []
      - session: []
    responses:
      "200":
        description: The blurred art.
        content:
          image/webp:
            schema:
              type: string
              contentMediaType: image/webp
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
/api/screen/renders/{asset_id}/{asset_version}/{slide}:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/AssetId"
    - name: asset_version
      in: path
      required: true
      description: The asset version the slides were rendered from.
      schema:
        type: integer
        minimum: 1
        maximum: 999999999
    - name: slide
      in: path
      required: true
      description: "`slide-<n>.png`, 1-based."
      schema:
        type: string
        pattern: "^slide-[0-9]{1,3}\\.png$"
  get:
    tags: [render]
    operationId: getSlide
    summary: A rendered slide of a PPTX or PDF deck
    description: |
      For the event's devices and sessions with `screen.content.read`. Immutable. Served only when it resolves to a
      render of the current tenant; the storage path is built from that row, never from the request.
    security:
      - device: []
      - session: []
    responses:
      "200":
        description: The slide.
        content:
          image/png:
            schema:
              type: string
              contentMediaType: image/png
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
/api/screen/playlists:
  get:
    tags: [content]
    operationId: listPlaylists
    summary: The event's playlists
    description: Right `screen.content.read`.
    responses:
      "200":
        description: The playlists with their items.
        content:
          application/json:
            schema:
              type: object
              required: [playlists]
              properties:
                playlists:
                  type: array
                  items:
                    $ref: "../screen.openapi.yaml#/components/schemas/Playlist"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
  post:
    tags: [content]
    operationId: addPlaylist
    summary: Add a playlist
    description: Right `screen.content.write`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/Playlist"
    responses:
      "201":
        description: The playlist.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Playlist"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/playlists/{playlist_id}:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/PlaylistId"
  get:
    tags: [content]
    operationId: getPlaylist
    summary: Read a playlist
    description: Right `screen.content.read`.
    responses:
      "200":
        description: The playlist.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Playlist"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
  put:
    tags: [content]
    operationId: savePlaylist
    summary: Replace a playlist and its items
    description: Right `screen.content.write`, with the `revision` read.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/Playlist"
    responses:
      "200":
        description: The playlist.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Playlist"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
  delete:
    tags: [content]
    operationId: deletePlaylist
    summary: Delete a playlist with its items and windows
    description: Right `screen.content.write`.
    responses:
      "204":
        description: Deleted.
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/schedules:
  get:
    tags: [content]
    operationId: listSchedules
    summary: Schedule windows
    description: Right `screen.content.read`.
    parameters:
      - name: zone
        in: query
        description: Only this zone's windows.
        schema:
          $ref: "../screen.openapi.yaml#/components/schemas/ZoneKey"
    responses:
      "200":
        description: The windows.
        content:
          application/json:
            schema:
              type: object
              required: [schedules]
              properties:
                schedules:
                  type: array
                  items:
                    $ref: "../screen.openapi.yaml#/components/schemas/Schedule"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
  post:
    tags: [content]
    operationId: addSchedule
    summary: Add a schedule window
    description: Right `screen.content.write`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/Schedule"
          examples:
            weekly_null_agenda_item:
              summary: A weekly window with an explicit null `agenda_item_id`
              value: {zone_key: main, playlist_id: pl_1, priority: 10, days: [6, 7], start_minute: 600, end_minute: 1320, agenda_item_id: null}
            weekly_without_agenda_item:
              summary: A weekly window without the `agenda_item_id` key
              value: {zone_key: main, playlist_id: pl_1, priority: 10, days: [6], start_minute: 1200, end_minute: 1440}
            agenda_bound:
              summary: A window bound to a run-of-show item
              value: {zone_key: main, playlist_id: pl_2, priority: 50, agenda_item_id: it_8}
    responses:
      "201":
        description: The window.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Schedule"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/schedules/simulate:
  get:
    tags: [content]
    operationId: simulateSchedule
    summary: What a zone would play at a time
    description: Right `screen.content.read`.
    parameters:
      - name: zone
        in: query
        required: true
        description: Zone key.
        schema:
          $ref: "../screen.openapi.yaml#/components/schemas/ZoneKey"
      - name: at
        in: query
        required: true
        description: The time, RFC 3339.
        schema:
          type: string
          format: date-time
    responses:
      "200":
        description: The winning window, playlist, layout and break, if any.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Simulation"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
/api/screen/schedules/calendar:
  get:
    tags: [content]
    operationId: scheduleCalendar
    summary: The schedule calendar between two times
    description: |
      Right `screen.content.read`. Built in screen with the same scheduler the tick and simulate use, so a
      page draws the calendar without a copy of the rule. One entry per zone (or the one `zone`): each
      window's runs between `from` and `to` (agenda-bound windows at their items' current times), the
      segments, and the break playlists that interrupt the zone. Screen reads the agenda as a module, so a window
      bound to a crew-only item keeps its runs; the answer names that item only to a caller holding
      `agenda.crew.read`. Rules: contracts/screen.md, Schedule windows.
    parameters:
      - name: from
        in: query
        required: true
        description: The start, RFC 3339.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        description: The end, RFC 3339; after `from` and at most 31 days after it.
        schema:
          type: string
          format: date-time
      - name: zone
        in: query
        description: Only this zone.
        schema:
          $ref: "../screen.openapi.yaml#/components/schemas/ZoneKey"
    responses:
      "200":
        description: The calendar view-model.
        content:
          application/json:
            schema:
              type: object
              required: [from, to, time_zone, zones]
              properties:
                from:
                  $ref: "../screen.openapi.yaml#/components/schemas/Time"
                to:
                  $ref: "../screen.openapi.yaml#/components/schemas/Time"
                time_zone:
                  type: string
                  description: The event's time zone (IANA), for laying the instants out in days.
                zones:
                  type: array
                  items:
                    type: object
                    required: [zone_key, windows, segments, breaks]
                    properties:
                      zone_key:
                        $ref: "../screen.openapi.yaml#/components/schemas/ZoneKey"
                      windows:
                        type: array
                        description: The zone's windows with at least one run in the range.
                        items:
                          type: object
                          required: [schedule_id, playlist_id, priority, layout_id, agenda_item_id, agenda_item_crew, runs]
                          properties:
                            schedule_id:
                              $ref: "../screen.openapi.yaml#/components/schemas/Id"
                            playlist_id:
                              $ref: "../screen.openapi.yaml#/components/schemas/Id"
                            priority:
                              type: integer
                            layout_id:
                              type: [string, "null"]
                            agenda_item_id:
                              type: [string, "null"]
                              description: Null for a weekly window, and for a crew-only item when the caller lacks `agenda.crew.read`.
                            agenda_item_crew:
                              type: boolean
                              description: The window is bound to a crew-only (`visibility` `crew`) item.
                            runs:
                              type: array
                              items:
                                type: object
                                required: [starts_at, ends_at]
                                properties:
                                  starts_at:
                                    $ref: "../screen.openapi.yaml#/components/schemas/Time"
                                  ends_at:
                                    $ref: "../screen.openapi.yaml#/components/schemas/Time"
                      segments:
                        type: array
                        description: |
                          Spans in time order, cut wherever the set of active runs changes (also where an active
                          window starts a new run, which can change the winner); no segment is given for a span
                          where no window is active. Each names its winner and every active window it beat, with
                          the rule it lost on: `priority`, `start` (began earlier), `playlist_priority` or `id`.
                        items:
                          type: object
                          required: [starts_at, ends_at, winner, losers]
                          properties:
                            starts_at:
                              $ref: "../screen.openapi.yaml#/components/schemas/Time"
                            ends_at:
                              $ref: "../screen.openapi.yaml#/components/schemas/Time"
                            winner:
                              $ref: "../screen.openapi.yaml#/components/schemas/Id"
                            losers:
                              type: array
                              items:
                                type: object
                                required: [schedule_id, lost_on]
                                properties:
                                  schedule_id:
                                    $ref: "../screen.openapi.yaml#/components/schemas/Id"
                                  lost_on:
                                    type: string
                                    enum: [priority, start, playlist_priority, id]
                      breaks:
                        type: array
                        description: The break playlists that interrupt the zone, with the spans their daily window allows (the whole range without one).
                        items:
                          type: object
                          required: [playlist_id, period_seconds, break_seconds, spans]
                          properties:
                            playlist_id:
                              $ref: "../screen.openapi.yaml#/components/schemas/Id"
                            period_seconds:
                              type: integer
                            break_seconds:
                              type: integer
                            spans:
                              type: array
                              items:
                                type: object
                                required: [starts_at, ends_at]
                                properties:
                                  starts_at:
                                    $ref: "../screen.openapi.yaml#/components/schemas/Time"
                                  ends_at:
                                    $ref: "../screen.openapi.yaml#/components/schemas/Time"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
/api/screen/schedules/{schedule_id}:
  parameters:
    - name: schedule_id
      in: path
      required: true
      description: Schedule window id.
      schema:
        $ref: "../screen.openapi.yaml#/components/schemas/Id"
  put:
    tags: [content]
    operationId: saveSchedule
    summary: Replace a schedule window
    description: Right `screen.content.write`, with the `revision` read (required here, read-only on POST); a stale one is 409 `version_conflict` (read again and retry).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/Schedule"
    responses:
      "200":
        description: The window.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Schedule"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
  delete:
    tags: [content]
    operationId: deleteSchedule
    summary: Delete a schedule window
    description: Right `screen.content.write`. With `revision`, a stale one is 409 `version_conflict`.
    parameters:
      - name: revision
