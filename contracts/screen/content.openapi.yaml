/api/screen/render-jobs:
  get:
    tags: [render]
    operationId: listRenderJobs
    summary: Render jobs
    description: Right `screen.content.read`.
    parameters:
      - name: asset_id
        in: query
        description: Only this asset's jobs.
        schema:
          $ref: "../screen.openapi.yaml#/components/schemas/Id"
    responses:
      "200":
        description: The jobs, newest first.
        content:
          application/json:
            schema:
              type: object
              required: [jobs]
              properties:
                jobs:
                  type: array
                  items:
                    $ref: "../screen.openapi.yaml#/components/schemas/RenderJob"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
  post:
    tags: [render]
    operationId: submitRenderJob
    summary: Submit a render job for a PPTX or PDF asset
    description: Right `screen.content.write`. One live job per asset version; a second submit answers it (200). Emits `screen.render.queued`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [asset_id]
            properties:
              asset_id:
                $ref: "../screen.openapi.yaml#/components/schemas/Id"
    responses:
      "200":
        description: The existing live job.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/RenderJob"
      "202":
        description: The new job, queued.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/RenderJob"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
        description: "`invalid_request`, or `not_pptx`: the asset is neither a PPTX nor a PDF deck (the code keeps its first name)."
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/render-jobs/{job_id}:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/JobId"
  get:
    tags: [render]
    operationId: getRenderJob
    summary: A render job's status
    description: Right `screen.content.read`.
    responses:
      "200":
        description: The job.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/RenderJob"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
  delete:
    tags: [render]
    operationId: cancelRenderJob
    summary: Cancel a queued or running job
    description: Right `screen.content.write`. 409 `render_finished` once it ended. Emits `screen.render.cancelled`.
    responses:
      "204":
        description: Cancelled.
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/render-jobs/{job_id}/result:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/JobId"
  get:
    tags: [render]
    operationId: getRenderResult
    summary: The rendered slides
    description: Right `screen.content.read`. 409 `render_not_finished` until the job `succeeded`. `warnings` name what may make a slide look different from the deck, such as a missing font.
    responses:
