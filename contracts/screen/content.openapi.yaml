# Part of screen.openapi.yaml: path items only, referenced from its `paths`
# and linted through it (contracts/README.md, Shared components).
/api/screen/assets:
  get:
    tags: [content]
    operationId: listAssets
    summary: The asset library
    description: Right `screen.content.read`.
    parameters:
      - name: q
        in: query
        description: Title contains this text.
        schema:
          type: string
          maxLength: 120
      - name: kind
        in: query
        description: Only this kind.
        schema:
          $ref: "../screen.openapi.yaml#/components/schemas/AssetKind"
      - $ref: "../screen.openapi.yaml#/components/parameters/Cursor"
    responses:
      "200":
        description: A page of assets.
        content:
          application/json:
            schema:
              type: object
              required: [assets, next_cursor]
              properties:
                assets:
                  type: array
                  items:
                    $ref: "../screen.openapi.yaml#/components/schemas/Asset"
                next_cursor:
                  type: [string, "null"]
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
  post:
    tags: [content]
    operationId: addAsset
    summary: Upload a file, or add a web or YouTube URL
    description: |
      Right `screen.content.write`. A file ≤ 100 MiB, checked by content. A `pptx` or `pdf` upload submits a render job.
      400 `origin_not_allowed` for a web URL off `web_allowlist`; 413 `file_too_large`.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/AssetUpload"
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/AssetUrl"
    responses:
      "201":
        description: The asset.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Asset"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
      "413":
        $ref: "../common.openapi.yaml#/components/responses/TooLarge"
/api/screen/assets/name-check:
  post:
    tags: [content]
    operationId: checkAssetNames
    summary: Same-name matches before an upload
    description: Right `screen.content.write`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [names]
            properties:
              names:
                type: array
                maxItems: 100
                items:
                  type: string
                  maxLength: 200
    responses:
      "200":
        description: For each name, the assets with the same title.
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  items:
                    type: object
                    required: [name, asset_ids]
                    properties:
                      name:
                        type: string
                      asset_ids:
                        type: array
                        items:
                          $ref: "../screen.openapi.yaml#/components/schemas/Id"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/assets/{asset_id}:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/AssetId"
  patch:
    tags: [content]
    operationId: editAsset
    summary: Rename an asset or reset its health
    description: Right `screen.content.write`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 200
              reset_health:
                type: boolean
    responses:
      "200":
        description: The asset.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Asset"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
  delete:
    tags: [content]
    operationId: deleteAsset
    summary: Delete an asset
    description: |
      Right `screen.content.write`. 409 `asset_in_use` while a playlist, an active push or the `ready_fallback_asset_id` setting refers to it. Its files and renders are deleted
      only when nothing else of the tenant refers to them: no other asset version (also a kept undo version), render, photo or claim sound.
    responses:
      "204":
        description: Deleted.
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/assets/{asset_id}/replace:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/AssetId"
  post:
    tags: [content]
    operationId: replaceAsset
    summary: Replace an asset's file
    description: Right `screen.content.write`. Keeps the previous version for one undo; slide ranges are clamped to the new deck.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/AssetUpload"
    responses:
      "200":
        description: The asset with its new version.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Asset"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "413":
        $ref: "../common.openapi.yaml#/components/responses/TooLarge"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/assets/{asset_id}/revert:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/AssetId"
  post:
    tags: [content]
    operationId: revertAsset
    summary: Undo the last replace
    description: Right `screen.content.write`. 409 `nothing_to_revert`.
    responses:
      "200":
        description: The asset with its previous version.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Asset"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/files/{file}:
  parameters:
    - name: file
      in: path
      required: true
      description: Content-addressed file name, `<sha256>.<ext>`.
      schema:
        type: string
        pattern: "^[a-f0-9]{64}\\.[a-z0-9]{1,8}$"
  get:
    tags: [content]
    operationId: getFile
    summary: A media file of the event
    description: |
      For the event's devices (cookie and venue address) and sessions with `screen.content.read`. Immutable.
      Served only when the name resolves to an asset version or photo of the current tenant; the storage path is built from
      that row, never from the request.
    security:
      - device: []
      - session: []
    responses:
      "200":
        description: The file, with the content type set from its checked content.
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
/api/screen/renders/{asset_id}/{asset_version}/{slide}:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/AssetId"
    - name: asset_version
      in: path
      required: true
      description: The asset version the slides were rendered from.
      schema:
        type: integer
        minimum: 1
        maximum: 999999999
    - name: slide
      in: path
      required: true
      description: "`slide-<n>.png`, 1-based."
      schema:
        type: string
        pattern: "^slide-[0-9]{1,3}\\.png$"
  get:
    tags: [render]
    operationId: getSlide
    summary: A rendered slide of a PPTX or PDF deck
    description: |
      For the event's devices and sessions with `screen.content.read`. Immutable. Served only when it resolves to a
      render of the current tenant; the storage path is built from that row, never from the request.
    security:
      - device: []
      - session: []
    responses:
      "200":
        description: The slide.
        content:
          image/png:
            schema:
              type: string
              contentMediaType: image/png
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
/api/screen/playlists:
  get:
    tags: [content]
    operationId: listPlaylists
    summary: The event's playlists
    description: Right `screen.content.read`.
    responses:
      "200":
        description: The playlists with their items.
        content:
          application/json:
            schema:
              type: object
              required: [playlists]
              properties:
                playlists:
                  type: array
                  items:
                    $ref: "../screen.openapi.yaml#/components/schemas/Playlist"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
  post:
    tags: [content]
    operationId: addPlaylist
    summary: Add a playlist
    description: Right `screen.content.write`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/Playlist"
    responses:
      "201":
        description: The playlist.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Playlist"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/playlists/{playlist_id}:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/PlaylistId"
  get:
    tags: [content]
    operationId: getPlaylist
    summary: Read a playlist
    description: Right `screen.content.read`.
    responses:
      "200":
        description: The playlist.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Playlist"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
  put:
    tags: [content]
    operationId: savePlaylist
    summary: Replace a playlist and its items
    description: Right `screen.content.write`, with the `revision` read.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/Playlist"
    responses:
      "200":
        description: The playlist.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Playlist"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
  delete:
    tags: [content]
    operationId: deletePlaylist
    summary: Delete a playlist with its items and windows
    description: Right `screen.content.write`.
    responses:
      "204":
        description: Deleted.
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/schedules:
  get:
    tags: [content]
    operationId: listSchedules
    summary: Schedule windows
    description: Right `screen.content.read`.
    parameters:
      - name: zone
        in: query
        description: Only this zone's windows.
        schema:
          $ref: "../screen.openapi.yaml#/components/schemas/ZoneKey"
    responses:
      "200":
        description: The windows.
        content:
          application/json:
            schema:
              type: object
              required: [schedules]
              properties:
                schedules:
                  type: array
                  items:
                    $ref: "../screen.openapi.yaml#/components/schemas/Schedule"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
  post:
    tags: [content]
    operationId: addSchedule
    summary: Add a schedule window
    description: Right `screen.content.write`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/Schedule"
          examples:
            weekly_null_agenda_item:
              summary: A weekly window with an explicit null `agenda_item_id`
              value: {zone_key: main, playlist_id: pl_1, priority: 10, days: [6, 7], start_minute: 600, end_minute: 1320, agenda_item_id: null}
            weekly_without_agenda_item:
              summary: A weekly window without the `agenda_item_id` key
              value: {zone_key: main, playlist_id: pl_1, priority: 10, days: [6], start_minute: 1200, end_minute: 1440}
            agenda_bound:
              summary: A window bound to a run-of-show item
              value: {zone_key: main, playlist_id: pl_2, priority: 50, agenda_item_id: it_8}
    responses:
      "201":
        description: The window.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Schedule"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/schedules/simulate:
  get:
    tags: [content]
    operationId: simulateSchedule
    summary: What a zone would play at a time
    description: Right `screen.content.read`.
    parameters:
      - name: zone
        in: query
        required: true
        description: Zone key.
        schema:
          $ref: "../screen.openapi.yaml#/components/schemas/ZoneKey"
      - name: at
        in: query
        required: true
        description: The time, RFC 3339.
        schema:
          type: string
          format: date-time
    responses:
      "200":
        description: The winning window, playlist, layout and break, if any.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Simulation"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
/api/screen/schedules/{schedule_id}:
  parameters:
    - name: schedule_id
      in: path
      required: true
      description: Schedule window id.
      schema:
        $ref: "../screen.openapi.yaml#/components/schemas/Id"
  put:
    tags: [content]
    operationId: saveSchedule
    summary: Replace a schedule window
    description: Right `screen.content.write`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/Schedule"
    responses:
      "200":
        description: The window.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Schedule"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
  delete:
    tags: [content]
    operationId: deleteSchedule
    summary: Delete a schedule window
    description: Right `screen.content.write`.
    responses:
      "204":
        description: Deleted.
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/push:
  post:
    tags: [content]
    operationId: pushContent
    summary: Play a playlist or asset now in zones
    description: Right `screen.push.write`. `zones` empty means every zone. Emits `screen.content.pushed`. Overrides are pushed through Moments.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/Push"
    responses:
      "201":
        description: The push.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Push"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/push/{push_id}:
  parameters:
    - name: push_id
      in: path
      required: true
      description: Push id.
      schema:
        $ref: "../screen.openapi.yaml#/components/schemas/Id"
  delete:
    tags: [content]
    operationId: clearPush
    summary: End a push
    description: Right `screen.push.write`. Emits `screen.content.cleared`.
    responses:
      "204":
        description: Ended.
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/render-jobs:
  get:
    tags: [render]
    operationId: listRenderJobs
    summary: Render jobs
    description: Right `screen.content.read`.
    parameters:
      - name: asset_id
        in: query
        description: Only this asset's jobs.
        schema:
          $ref: "../screen.openapi.yaml#/components/schemas/Id"
    responses:
      "200":
        description: The jobs, newest first.
        content:
          application/json:
            schema:
              type: object
              required: [jobs]
              properties:
                jobs:
                  type: array
                  items:
                    $ref: "../screen.openapi.yaml#/components/schemas/RenderJob"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
  post:
    tags: [render]
    operationId: submitRenderJob
    summary: Submit a render job for a PPTX or PDF asset
    description: Right `screen.content.write`. One live job per asset version; a second submit answers it (200). Emits `screen.render.queued`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [asset_id]
            properties:
              asset_id:
                $ref: "../screen.openapi.yaml#/components/schemas/Id"
    responses:
      "200":
        description: The existing live job.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/RenderJob"
      "202":
        description: The new job, queued.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/RenderJob"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
        description: "`invalid_request`, or `not_pptx`: the asset is neither a PPTX nor a PDF deck (the code keeps its first name)."
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/render-jobs/{job_id}:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/JobId"
  get:
    tags: [render]
    operationId: getRenderJob
    summary: A render job's status
    description: Right `screen.content.read`.
    responses:
      "200":
        description: The job.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/RenderJob"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
  delete:
    tags: [render]
    operationId: cancelRenderJob
    summary: Cancel a queued or running job
    description: Right `screen.content.write`. 409 `render_finished` once it ended. Emits `screen.render.cancelled`.
    responses:
      "204":
        description: Cancelled.
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/render-jobs/{job_id}/result:
  parameters:
    - $ref: "../screen.openapi.yaml#/components/parameters/JobId"
  get:
    tags: [render]
    operationId: getRenderResult
    summary: The rendered slides
    description: Right `screen.content.read`. 409 `render_not_finished` until the job `succeeded`. `warnings` name what may make a slide look different from the deck, such as a missing font.
    responses:
      "200":
        description: The slides.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/RenderResult"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/ticker:
  get:
    tags: [ticker]
    operationId: getTicker
    summary: The ticker now
    description: Right `screen.ticker.write` or `screen.content.read`.
    responses:
      "200":
        description: The ticker.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Ticker"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
  put:
    tags: [ticker]
    operationId: setTicker
    summary: Set the ticker
    description: Right `screen.ticker.write` (also the bot's `/ticker set`, with the person's rights). Emits `screen.ticker.changed`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/TickerSet"
    responses:
      "200":
        description: The ticker.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Ticker"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
  delete:
    tags: [ticker]
    operationId: clearTicker
    summary: Clear the ticker
    description: Right `screen.ticker.write`. Emits `screen.ticker.changed`.
    responses:
      "204":
        description: Cleared.
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/ticker/windows:
  get:
    tags: [ticker]
    operationId: listTickerWindows
