/api/screen/photos:
  get:
    tags: [photos]
    operationId: listPhotos
    summary: Carousel photos
    description: Right `screen.content.read`. Flag `screen.photos`.
    responses:
      "200":
        description: The photos, newest first.
        content:
          application/json:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  items:
                    $ref: "../screen.openapi.yaml#/components/schemas/Photo"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
  post:
    tags: [photos]
    operationId: addPhoto
    summary: Add a carousel photo
    description: Right `screen.photos.write`. Flag `screen.photos` (otherwise 403 `feature_off`). Emits `screen.photo.added`.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: "../screen.openapi.yaml#/components/schemas/PhotoUpload"
    responses:
      "201":
        description: The photo.
        content:
          application/json:
            schema:
              $ref: "../screen.openapi.yaml#/components/schemas/Photo"
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
      "413":
        $ref: "../common.openapi.yaml#/components/responses/TooLarge"
/api/screen/photos/{photo_id}:
  parameters:
    - name: photo_id
      in: path
      required: true
      description: Photo id.
      schema:
        $ref: "../screen.openapi.yaml#/components/schemas/Id"
  delete:
    tags: [photos]
    operationId: deletePhoto
    summary: Remove a carousel photo
    description: Right `screen.photos.write`. Emits `screen.photo.removed`.
    responses:
      "204":
        description: Removed.
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../screen.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
/api/screen/clone:
  post:
    tags: [clone]
    operationId: cloneScreen
    summary: Copy screen content from another event of the series
    description: Event-admin role on both events of one series (otherwise 403 `missing_right`). Audited.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [source_tenant_id]
            properties:
              source_tenant_id:
                type: string
                pattern: "^[a-z][a-z0-9-]{2,31}$"
    responses:
      "200":
        description: What was copied.
        content:
          application/json:
            schema:
              type: object
              required: [zones, assets, playlists, schedules, schedules_dropped, ticker_windows]
              properties:
                zones:
                  type: integer
                schedules_dropped:
                  type: integer
                  description: Agenda-bound windows not copied, because their item maps to no item of this event.
                assets:
                  type: integer
                playlists:
                  type: integer
                schedules:
                  type: integer
                ticker_windows:
                  type: integer
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
