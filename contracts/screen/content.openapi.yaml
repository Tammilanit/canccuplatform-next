/api/screen/clone:
  post:
    tags: [clone]
    operationId: cloneScreen
    summary: Copy screen content from another event of the series
    description: |
      Event-admin role on both events of one series (otherwise 403 `missing_right`). Audited. All or nothing:
      a clone whose files would pass this event's storage quota is 413 `storage_quota_exceeded` and copies nothing.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [source_tenant_id]
            properties:
              source_tenant_id:
                type: string
                pattern: "^[a-z][a-z0-9-]{2,31}$"
    responses:
      "200":
        description: What was copied.
        content:
          application/json:
            schema:
              type: object
              required: [zones, assets, playlists, schedules, schedules_dropped, ticker_windows]
              properties:
                zones:
                  type: integer
                schedules_dropped:
                  type: integer
                  description: Agenda-bound windows not copied, because their item maps to no item of this event.
                assets:
                  type: integer
                playlists:
                  type: integer
                schedules:
                  type: integer
                ticker_windows:
                  type: integer
      "400":
        $ref: "../screen.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../screen.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../screen.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../screen.openapi.yaml#/components/responses/Conflict"
      "413":
        $ref: "../screen.openapi.yaml#/components/responses/TooLarge"
        description: "`storage_quota_exceeded`: the copied files would pass this event's storage quota; nothing was copied."
