# Part of theming.openapi.yaml (contracts/README.md, Parts): the presets and applying one, and the draft as a
# package, its upload and its export (contracts/theming.md, Presets; The theme package; Reuse: series and export).
/api/theming/presets:
  get:
    tags: [presets]
    operationId: listPresets
    summary: The presets and their colour schemes
    description: Needs right `theming.theme.write`. In the Theme studio gallery's order.
    responses:
      "200":
        description: The presets.
        content:
          application/json:
            schema:
              type: object
              required: [presets, mine]
              properties:
                mine:
                  description: The event's saved presets (My presets), newest first.
                  type: array
                  items:
                    $ref: "#/MyPreset"
                presets:
                  type: array
                  items:
                    type: object
                    required: [id, name, embeds, schemes]
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      embeds:
                        description: Applying it changes the embeds, which needs `theming.embeds.write`.
                        type: boolean
                      schemes:
                        type: array
                        items:
                          type: object
                          required: [id, name, kind, brand, colors]
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            kind:
                              type: string
                              enum: [dark, light, contrast, accent]
                            brand:
                              $ref: "../theme.schema.json#/$defs/scheme/properties/brand"
                            colors:
                              description: "The whole colour-token set: the scheme's own, or generated from `brand`."
                              type: object
                              additionalProperties:
                                $ref: "../theming.openapi.yaml#/components/schemas/Color"
      "401":
        $ref: "../theming.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../theming.openapi.yaml#/components/responses/Forbidden"
  post:
    tags: [presets]
    operationId: saveMyPreset
    summary: Save the draft as one of the event's presets
    description: |
      Needs right `theming.theme.write`. Keeps the draft's manifest and every file it holds under `name`; the files
      count against the storage quota and are served nowhere. 404 `no_draft` without a draft; 409 `preset_limit`
      past 24 an event.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 60
    responses:
      "201":
        description: The saved preset.
        content:
          application/json:
            schema:
              $ref: "#/MyPreset"
      "400":
        $ref: "../theming.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../theming.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../theming.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../theming.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../theming.openapi.yaml#/components/responses/Conflict"
/api/theming/presets/{id}:
  delete:
    tags: [presets]
    operationId: deleteMyPreset
    summary: Delete one of the event's saved presets
    description: |
      Needs right `theming.theme.write`. Frees the files only it held. A draft made from it keeps its look. 404 for
      an id the event has no preset of.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^event:[1-9][0-9]{0,8}$"
    responses:
      "204":
        description: Deleted.
      "401":
        $ref: "../theming.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../theming.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../theming.openapi.yaml#/components/responses/NotFound"
/api/theming/draft/preset:
  put:
    tags: [presets]
    operationId: applyPreset
    summary: Apply a preset to the draft (and Reset to it)
    description: |
      Needs right `theming.theme.write`, and `theming.embeds.write` when the preset's embeds differ from the
      draft's. Replaces the draft's content with the preset's package under the scheme, keeping the event's
      `images.logo` and `images.icon` (with their files), `brand.logo_plate` and `brand.embed_color`, and sets
      `preset`. Starts the draft when `draft_version` is absent and there is none. Through the package upload's
      checks. A saved preset (`event:<n>`, from `mine`) takes no `scheme`: its own manifest and files replace the
      draft's, with the same kept, and `preset` becomes `{id: "event:<n>", scheme: own}`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [preset]
            properties:
              preset:
                type: string
              scheme:
                description: Required for a platform preset; a saved preset (`event:<n>`) has none.
                type: string
              draft_version:
                description: The draft's current version; absent when no draft exists yet.
                type: integer
                minimum: 0
    responses:
      "200":
        $ref: "../theming.openapi.yaml#/components/responses/DraftOk"
      "400":
        $ref: "../theming.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../theming.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../theming.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../theming.openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../theming.openapi.yaml#/components/responses/Conflict"
/api/theming/draft/package:
  get:
    tags: [draft]
    operationId: exportDraft
    summary: Download the draft as a package zip
    description: |
      Needs right `theming.theme.write`. The same format as an upload: another event that uploads it gets the same
      manifest and files. 404 `no_draft` without a draft.
    responses:
      "200":
        description: The package.
        headers:
          Content-Disposition:
            description: "`attachment; filename=\"theme-draft.zip\"`."
            schema:
              type: string
        content:
          application/zip:
            schema:
              type: string
              format: binary
      "401":
        $ref: "../theming.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../theming.openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../theming.openapi.yaml#/components/responses/NotFound"
  put:
    tags: [draft]
    operationId: putDraftPackage
    summary: Upload a whole package
    description: |
      Needs right `theming.theme.write`, and `theming.embeds.write` when the embeds differ from the draft's.
      A zip of a package folder (`theme.yaml` at its root) replaces the draft's content; creates the draft
      when there is none. A zip that breaks the archive rules (absolute paths, links, nested archives, over
      300 files, over 40 MB unpacked, an unpacking ratio over 100:1) is refused whole: 400 `package_refused`.
    parameters:
      - name: draft_version
        in: query
        description: The draft's current version; absent when no draft exists yet.
        schema:
          type: integer
          minimum: 1
    requestBody:
      required: true
      content:
        application/zip:
          schema:
            type: string
            format: binary
    responses:
      "200":
        $ref: "../theming.openapi.yaml#/components/responses/DraftOk"
      "400":
        $ref: "../theming.openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../theming.openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../theming.openapi.yaml#/components/responses/Forbidden"
      "409":
        $ref: "../theming.openapi.yaml#/components/responses/Conflict"
      "413":
        $ref: "../theming.openapi.yaml#/components/responses/TooLarge"
MyPreset:
  description: One of the event's saved presets (contracts/theming.md, Presets, My presets).
  type: object
  required: [id, name, created_at, embeds, colors]
  properties:
    id:
      description: "`event:<n>`, as `PUT /api/theming/draft/preset` takes it."
      type: string
      pattern: "^event:[1-9][0-9]{0,8}$"
    name:
      type: string
    created_at:
      type: string
      format: date-time
    embeds:
      description: Applying it changes the embeds, which needs `theming.embeds.write`.
      type: boolean
    colors:
      description: Its whole colour-token set, for the gallery's thumbnail.
      type: object
      additionalProperties:
        $ref: "../theming.openapi.yaml#/components/schemas/Color"
