openapi: 3.1.0
info:
  title: Bot API
  version: 1.0.0
  summary: An event's Discord connection, its guild binding, the command registration, its counts, and who plays what.
  description: |
    Machine-readable part of the bot contract (connections, and the who-plays-what read API). Prose, the client pool, isolation, secrets and
    events: contracts/bot.md. Conventions (snake_case, RFC 3339 UTC times, error body): contracts/README.md.
    Paths under /api/bot act on the event (tenant) of the request's hostname, except the install callback,
    which answers only on the central sign-in host, and the superadmin paths, which answer only on the
    superadmin hostname. Bot tokens and client secrets are write-only: no response carries them.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Same origin, behind Caddy; the hostname selects the event, the central sign-in host or the superadmin hostname.
tags:
  - name: connection
    description: Which Discord application serves the event, and its client's status.
  - name: guild
    description: Binding the event's Discord server through the OAuth bot-install flow, and its slash commands.
  - name: presence
    description: Who plays which game and who is in which voice channel, live; the names behind the bus's counts.
  - name: counts
    description: The event's counts per hour (online, in voice, messages) and its top games, never who.
  - name: setup
    description: The guild's purposes, the pick lists, creating what is missing, and the check with its fixes.
  - name: clone
    description: Moving the connection and binding from the last event of a series.
  - name: providers
    description: An outside provider's bearer secret per event, for the commands that call it.
  - name: superadmin
    description: On the superadmin hostname only.
security:
  - session: []
paths:
  /api/bot/connection:
    get:
      tags: [connection]
      operationId: getConnection
      summary: The event's connection, client status and binding
      description: |
        Right `bot.connection.read`. Never returns a credential's value. 503 `discord_not_configured` for an
        event on the shared bot when the platform runs none (no `CANCCU_BOT_*`).
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: "`discord_not_configured`: the event is on the shared bot and the platform runs none."
          content:
            application/json:
              schema:
                $ref: "common.openapi.yaml#/components/schemas/Error"
    put:
      tags: [connection]
      operationId: setConnection
      summary: Bring an own application, rotate a credential, or go back to the shared bot
      description: |
        The event-admin role itself. For `mode: own` the module checks the credentials it gets with Discord
        before storing: 400 `token_invalid`, `application_mismatch`, `client_secret_invalid` (no client-credentials
        token for the application). 409 `application_reserved` (the shared application), `application_taken`
        (another event holds it), `guild_bound` (changing the application or the mode while a guild is bound),
        `version_conflict`, `event_archived` (for `mode: own`; `mode: shared` is also allowed on an archived event,
        like `DELETE`). A credential left out keeps its stored value; a new application needs both. Audited (which
        credential, never the value). Emits `bot.connection.changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionUpdate"
      responses:
        "200":
          description: The connection after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [connection]
      operationId: clearConnection
      summary: Go back to the shared bot and erase the own credentials
      description: |
        The event-admin role itself. The same as `PUT` with `mode: shared`: 409 `guild_bound` while a guild is
        bound, 409 `version_conflict` for a stale `revision`. Also allowed on an archived event. Audited. Emits
        `bot.connection.changed` when the mode changed.
      parameters:
        - name: revision
          in: query
          required: true
          description: The connection's `revision` the caller read, so a clear never erases credentials set since.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The connection, now `shared`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/bot/guild/bind:
    post:
      tags: [guild]
      operationId: startBind
      summary: Start binding a guild through the OAuth bot-install flow
      description: |
        The event-admin role itself. Answers Discord's authorize URL for the event's application, with the scopes
        `bot`, `applications.commands`, `identify` and `guilds`, the redirect URI on the central sign-in host and a
        single-use `state` valid for 10 minutes, kept server-side with the event, the caller and the application.
        409 `guild_bound` (the event already has a guild), `connection_incomplete` (an own application without
        both credentials), `event_archived`. 503 `discord_not_configured` for an event on the shared bot when the
        platform runs none, or when the platform has no address for Discord to come back to (no sign-in host
        and no public URL).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindStart"
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: "`discord_not_configured`: no shared bot for an event on it, or no callback address."
          content:
            application/json:
              schema:
                $ref: "common.openapi.yaml#/components/schemas/Error"
  /api/bot/install/callback:
    get:
      tags: [guild]
      operationId: finishBind
      summary: Discord's redirect after the bot install (central sign-in host only)
      description: |
        Answers only on the central sign-in host; elsewhere 404 `not_found`. No session: the event, the user and
        the application come from the stored `state`. The module exchanges `code`, checks that the Discord user is
        the user who started, that they own the guild or hold Manage Server or Administrator on it (from their
        guild list), that the bot is in the guild, that the guild is bound to no other event and that the event's
        connection did not change. It also checks again that the event still exists (otherwise `state_invalid`),
        is not archived (`event_archived`) and still has no guild (`guild_bound`). The checks and the bind run in
        one transaction under unique keys (one binding per event, one route per guild), so racing binds cannot
        both win. Then it binds the guild, registers its commands, audits the bind and emits `bot.guild.bound`.
        The user's Discord access token is dropped after the checks. The browser goes back to the event's primary
        hostname with `bind=ok` or `bind=<error code>`, or, without an active primary hostname, gets a page on the
        sign-in host: `discord_user_mismatch`, `manage_server_required`, `bot_not_in_guild`, `guild_bound`,
        `event_archived`, `connection_changed`, `code_exchange_failed`, `access_denied` (the person cancelled on
        Discord) or `discord_unavailable`.
      security:
        - {}
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
        - name: code
          in: query
          description: Absent when the person cancelled; Discord then sends `error`.
          schema:
            type: string
            maxLength: 256
        - name: guild_id
          in: query
          schema:
            $ref: "#/components/schemas/Snowflake"
        - name: error
          in: query
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: |
            A page on the central sign-in host naming the result, when the event has no active primary hostname
            to go back to (contracts/tenants.md, Tenants).
          content:
            text/html:
              schema:
                type: string
        "303":
          description: Back to the admin pages on the event's primary hostname, with `bind=ok` or `bind=<error code>`.
          headers:
            Location:
              description: An absolute URL on the event's primary hostname.
              schema:
                type: string
                format: uri
        "400":
          description: |
            `state_invalid`: a page on the sign-in host, because the state is unknown, used or expired, or its
            event was deleted, so there is no event to go back to.
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/bot/guild:
    delete:
      tags: [guild]
      operationId: unbindGuild
      summary: Unbind the event's guild
      description: |
        The event-admin role itself; also on an archived event. Removes the event's commands from the guild and
        its route; the shared bot leaves the guild, an own bot stays but serves it no more. Audited. Emits
        `bot.guild.unbound` with `reason: unbound`.
      responses:
        "204":
          description: Unbound.
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/bot/guild/commands/sync:
    post:
      tags: [guild]
      operationId: syncCommands
      summary: Register the guild's commands again now
      description: |
        The event-admin role itself. Writes the commands of the event's enabled flags in one bulk overwrite, in
        the background; the binding's `commands` shows the result. 404 `not_found` without a binding;
        409 `event_archived`.
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Binding"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/bot/guild/purposes:
    get:
      tags: [setup]
      operationId: getPurposes
      summary: The purposes and what serves each in the guild
      description: |
        Right `bot.connection.read`, under the event's admin-access rule. Every purpose of the catalogue, in its
        order, with its state read live from Discord: `bound` (its channel or role is in the guild), `missing`
        (none picked, or the picked one was deleted in Discord: `target_id` stays, `target_name` is null) or
        `not_on` (its feature's flag is off). 404 `not_found` without a binding; 409 `event_archived`;
        503 `discord_unavailable`.
      responses:
        "200":
          description: The purposes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purposes"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DiscordUnavailable"
  /api/bot/guild/purposes/{purpose}:
    parameters:
      - name: purpose
        in: path
        required: true
        description: A purpose of the catalogue (contracts/bot.md, Purposes); any other is 404.
        schema:
          $ref: "#/components/schemas/PurposeName"
    put:
      tags: [setup]
      operationId: setPurpose
      summary: Pick the channel or role that serves a purpose, or clear it
      description: |
        The event-admin role itself. `target_id` must be a channel of the purpose's kind in the guild (a text or
        announcement channel, or a category), or a role that is neither `@everyone` nor managed by an
        integration; otherwise 400 `target_invalid`. `null` clears it. Audited (`bot.purpose.changed`); emits
        `bot.purposes.changed`. 409 `event_archived`; 503 `discord_unavailable`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurposeUpdate"
      responses:
        "200":
          description: The purpose as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purpose"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DiscordUnavailable"
  /api/bot/guild/purposes/create-missing:
    post:
      tags: [setup]
      operationId: createMissingPurposes
      summary: Create every missing channel and role from its template
      description: |
        The event-admin role itself. Each purpose that is on and `missing` gets a new channel or role from its
        template and is bound to it: roles first, then channels. Roles are made only while the bot holds Manage
        roles and its role is above every bound role (`role_order`, E6); channels only while it holds Manage
        channels (`missing_permission`); one Discord refuses is `discord_refused`. Audited
        (`bot.purposes.created`); emits `bot.purposes.changed` when anything was made. 409 `event_archived`;
        503 `discord_unavailable`.
      responses:
        "200":
          description: What was made, what was not and why, and the purposes now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMissingResult"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DiscordUnavailable"
  /api/bot/guild/channels:
    get:
      tags: [setup]
      operationId: listGuildChannels
      summary: The guild's channels, for the pick lists
      description: |
        Right `bot.connection.read`. Read live from Discord, in the guild's order. 404 `not_found` without a
        binding; 409 `event_archived`; 503 `discord_unavailable`.
      responses:
        "200":
          description: The channels.
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/GuildChannel"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DiscordUnavailable"
  /api/bot/guild/roles:
    get:
      tags: [setup]
      operationId: listGuildRoles
      summary: The guild's roles, for the pick lists
      description: |
        Right `bot.connection.read`. Read live from Discord, highest first, without `@everyone`. 404 `not_found`
        without a binding; 409 `event_archived`; 503 `discord_unavailable`.
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/GuildRole"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DiscordUnavailable"
  /api/bot/guild/check:
    get:
      tags: [setup]
      operationId: getCheck
      summary: The last check of the guild
      description: |
        Right `bot.connection.read`. The last result for the bound guild (kept a week), or a new one when there
        is none. 404 `not_found` without a binding; 409 `event_archived`; 503 `discord_unavailable`.
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DiscordUnavailable"
    post:
      tags: [setup]
      operationId: runCheck
      summary: Run the check again
      description: Right `bot.connection.read`; reads Discord and changes nothing there. As the `GET`, run now.
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DiscordUnavailable"
  /api/bot/guild/check/fix:
    post:
      tags: [setup]
      operationId: fixCheck
      summary: Make the fixes the bot can make itself for one feature
      description: |
        The event-admin role itself. For each of the feature's rows with `fix_action: allow_in_channel`, the bot
        allows itself, in its own overwrite in that channel, what the channel took from its role. Audited
        (`bot.check.fixed`) when anything changed; answers the check run again. An unknown feature is 400
        `invalid_request`; 409 `event_archived`; 503 `discord_unavailable`. A row is offered only where the bot can
        view the channel and holds Manage roles there; when Discord refuses every change, 502 `discord_refused`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [feature]
              properties:
                feature:
                  $ref: "#/components/schemas/CheckFeatureName"
      responses:
        "200":
          description: The check after the fixes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Check"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: "`discord_refused`: Discord refused every change the bot tried."
          content:
            application/json:
              schema:
                $ref: "common.openapi.yaml#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/DiscordUnavailable"
  /api/bot/providers/{provider}/secret:
    parameters:
      - name: provider
        in: path
        required: true
        description: An outside provider, lowercase `snake_case`, at most 32 characters; any other is 404.
        schema:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
    put:
      tags: [providers]
      operationId: putProviderSecret
      summary: Set an outside provider's bearer secret for the event
      description: |
        The event-admin role itself (bot.md, Provider secrets). Write-only: encrypted, bound to the event and the
        provider, never answered, logged or emitted; audited without the value. 409 `event_archived`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret:
                  type: string
                  minLength: 1
                  maxLength: 512
                  writeOnly: true
      responses:
        "204":
          description: Set.
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [providers]
      operationId: deleteProviderSecret
      summary: Clear an outside provider's bearer secret
      description: The event-admin role itself, also on an archived event. 204 whether or not one was set.
      responses:
        "204":
          description: Cleared.
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/bot/presence/playing:
    get:
      tags: [presence]
      operationId: getPlaying
      summary: Who plays which game now
      description: |
        A signed-in member of the event, or right `bot.presence.read`. The guild members' "playing" activities,
        grouped by the event's games (matched as in contracts/games.md). Activities of a hidden game are left out
        entirely; unmatched activities form one entry with `game_id: null` and `name: null`. Only platform users
        are named; other guild members are only counted. Users with the presence opt-out never appear. `available: false` with empty lists when no guild is bound,
        the client is not ready or the feed's feature flag is off.
      parameters:
        - name: game_id
          in: query
          required: false
          description: Only this game of the catalogue.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: The activities now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playing"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/bot/presence/voice:
    get:
      tags: [presence]
      operationId: getVoice
      summary: Who is in which voice channel now
      description: |
        A signed-in member of the event, or right `bot.presence.read`. The voice channels with people in them,
        only those every member of the guild can see. Only platform users are named; other guild members are
        only counted. Users with the presence opt-out never appear.
        `available: false` with empty lists as for `getPlaying`.
      responses:
        "200":
          description: The voice channels now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voice"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/bot/stats:
    get:
      tags: [counts]
      operationId: getStats
      summary: The event's hourly counts and top games
      description: |
        A member of the event, and a guest as the info-page mode allows (contracts/tenants.md: nothing in a draft
        event or in `sign_in` mode, only from the venue in `venue_only`): counts only, never who. The hours already folded
        (an hour is folded in the minute after it ends) from the last `hours` hours, oldest first; an hour with no
        count is left out. `top_games` adds up player-minutes per game of the event's catalogue, matched as in
        contracts/games.md (The catalogue), at most 10, most player-hours first; an activity that matches no active
        game is never named. Everyone the opt-out filter leaves out was never counted (contracts/bot.md, Counts).
      security: []
      parameters:
        - name: hours
          in: query
          required: false
          description: How many hours back from the start of the current hour.
          schema:
            type: integer
            minimum: 1
            maximum: 72
            default: 24
      responses:
        "200":
          description: The series and the top games.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "400":
          $ref: "common.openapi.yaml#/components/responses/BadRequest"
        "403":
          description: "`info_pages_closed`: a guest the event's info-page mode keeps out."
          content:
            application/json:
              schema:
                $ref: "common.openapi.yaml#/components/schemas/Error"
        "404":
          $ref: "common.openapi.yaml#/components/responses/NotFound"
  /api/bot/clone:
    post:
      tags: [clone]
      operationId: cloneBot
      summary: Move the connection and binding from the last event of the series
      description: |
        The event-admin role itself on this event and on the source, both in one series (otherwise
        403 `missing_right`). 409 `source_live`, `already_connected` (this event has its own binding or
        application), `event_archived`. Own credentials move inside the module, re-encrypted for this event. Nothing
        to move is not an error. In the same transaction the guild route and an own application's route point to
        this event, and a moved own client is closed and opened again for it. Audited in both events. Emits `bot.connection.changed` and `bot.guild.unbound`
        (`reason: moved`) on the source and `bot.connection.changed` and `bot.guild.bound` on this event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneRequest"
      responses:
        "200":
          description: What moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloneResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/bot/guilds/{guild_id}/unbind:
    post:
      tags: [superadmin]
      operationId: superadminUnbindGuild
      summary: Unbind any guild
      description: |
        Superadmin with `mfa_enabled` on the session's identity (contracts/tenants.md, Sign-in identities), on the
        superadmin hostname only (elsewhere 404 `not_found`). Audited with the reason. Emits `bot.guild.unbound` with `reason: superadmin` on the event's stream.
      parameters:
        - name: guild_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Snowflake"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reason"
      responses:
        "204":
          description: Unbound.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  responses:
    BadRequest:
      description: |
        `invalid_request` (a field is missing or invalid), `token_invalid` (Discord refused the bot token),
        `application_mismatch` (the token belongs to another application), `client_secret_invalid` (Discord
        refused the client secret) or `target_invalid` (not a channel or role of the guild that can serve the
        purpose).
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    Forbidden:
      description: |
        `missing_right` (the right is missing, or the call needs the event-admin role itself), `not_a_member`
        (who-plays-what for a signed-in user who is not a member of the event and lacks the right), `mfa_required`
        (a superadmin without Discord two-factor) or `admin_access_restricted` (contracts/tenants.md, Admin access).
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    NotFound:
      description: "`not_found`: no binding, no such guild binding, or the path does not answer on this hostname."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    Conflict:
      description: |
        `version_conflict` (stale `revision`), `application_reserved`, `application_taken`, `guild_bound`,
        `connection_incomplete`, `source_live`, `already_connected` or `event_archived` (the event is read-only).
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    DiscordUnavailable:
      description: "`discord_unavailable`: Discord did not answer, or the bot can no longer read the guild."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
  schemas:
    Snowflake:
      type: string
      description: A Discord id, as a string.
      pattern: "^[0-9]{17,20}$"
    UserId:
      type: string
      pattern: "^u_[A-Za-z0-9]{1,40}$"
      examples: [u_123]
    TenantId:
      type: string
      description: Lowercase letters, digits and `-`, 3–32 characters, starting with a letter (contracts/tenants.md).
      pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
      examples: [demo]
    Mode:
      type: string
      enum: [shared, own]
    BotUser:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/Snowflake"
        name:
          type: string
          maxLength: 100
    Credentials:
      type: object
      description: Which credentials are stored, never their values.
      required: [bot_token_set, client_secret_set, updated_at, updated_by]
      properties:
        bot_token_set:
          type: boolean
        client_secret_set:
          type: boolean
        updated_at:
          type: string
          format: date-time
        updated_by:
          description: The user who last changed a credential; `null` after that user was deleted.
          oneOf:
            - $ref: "#/components/schemas/UserId"
            - type: "null"
    ClientStatus:
      type: object
      required: [status, error_code, since]
      properties:
        status:
          type: string
          enum: [connecting, ready, rate_limited, paused, failed]
        error_code:
          oneOf:
            - type: string
              enum: [token_invalid, intents_missing, invalid_requests, discord_unavailable]
            - type: "null"
        since:
          type: string
          format: date-time
    CommandsState:
      type: object
      required: [status, flags_version, registered_at, error_code]
      properties:
        status:
          type: string
          enum: [registered, pending, failed, removed]
        flags_version:
          description: The event's `flags_version` the registered commands follow (contracts/tenants.md, Feature flags).
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
        registered_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        error_code:
          oneOf:
            - type: string
              pattern: "^[a-z][a-z0-9_]*$"
              examples: [rate_limited]
            - type: "null"
    Binding:
      type: object
      required: [guild_id, guild_name, application_id, bound_by, bound_at, commands]
      properties:
        guild_id:
          $ref: "#/components/schemas/Snowflake"
        guild_name:
          type: string
          maxLength: 100
        application_id:
          $ref: "#/components/schemas/Snowflake"
        bound_by:
          description: The user who bound it (a clone keeps it); `null` after that user was deleted.
          oneOf:
            - $ref: "#/components/schemas/UserId"
            - type: "null"
        bound_at:
          type: string
          format: date-time
        commands:
          $ref: "#/components/schemas/CommandsState"
    Connection:
      type: object
      required: [mode, application_id, bot_user, credentials, client, guild, revision]
      properties:
        mode:
          $ref: "#/components/schemas/Mode"
        application_id:
          $ref: "#/components/schemas/Snowflake"
        bot_user:
          oneOf:
            - $ref: "#/components/schemas/BotUser"
            - type: "null"
        credentials:
          description: For `own` only; `null` for `shared`.
          oneOf:
            - $ref: "#/components/schemas/Credentials"
            - type: "null"
        client:
          $ref: "#/components/schemas/ClientStatus"
        guild:
          oneOf:
            - $ref: "#/components/schemas/Binding"
            - type: "null"
        revision:
          type: integer
          minimum: 0
    ConnectionUpdate:
      type: object
      required: [mode, revision]
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/Mode"
        application_id:
          description: Required for `own`; not allowed for `shared`.
          $ref: "#/components/schemas/Snowflake"
        bot_token:
          description: Write-only. Required for a new own application; left out, the stored one is kept.
          type: string
          minLength: 50
          maxLength: 200
          writeOnly: true
        client_secret:
          description: Write-only. Required for a new own application; left out, the stored one is kept.
          type: string
          minLength: 16
          maxLength: 128
          writeOnly: true
        revision:
          type: integer
          minimum: 0
    BindStart:
      type: object
      additionalProperties: false
      properties:
        guild_id:
          description: Preselects this guild on Discord's page.
          $ref: "#/components/schemas/Snowflake"
    BindStarted:
      type: object
      required: [authorize_url, expires_at]
      properties:
        authorize_url:
          type: string
          format: uri
          examples: ["https://discord.com/oauth2/authorize?client_id=100000000000000002&scope=bot+applications.commands+identify+guilds"]
        expires_at:
          description: When the `state` in the URL expires.
          type: string
          format: date-time
    CloneRequest:
      type: object
      required: [source_tenant_id]
      additionalProperties: false
      properties:
        source_tenant_id:
          $ref: "#/components/schemas/TenantId"
    CloneResult:
      type: object
      required: [moved_connection, moved_binding, connection]
      properties:
        moved_connection:
          description: True when the source's own application moved.
          type: boolean
        moved_binding:
          type: boolean
        connection:
          $ref: "#/components/schemas/Connection"
    Player:
      type: object
      description: |
        A platform user on a board. Guild members without a platform account are never listed (they cannot opt
        out), only counted. Never a Discord id.
      required: [user_id, name]
      additionalProperties: false
      properties:
        user_id:
          $ref: "#/components/schemas/UserId"
        name:
          type: string
          maxLength: 100
          description: The platform name.
    Playing:
      type: object
      required: [available, as_of, games]
      additionalProperties: false
      properties:
        available:
          type: boolean
          description: "`false`: no guild bound, the client not ready, or the feed's feature flag off; `games` is then empty."
        as_of:
          type: [string, "null"]
          format: date-time
          description: When the bot last updated the state; `null` when not available.
        games:
          type: array
          items:
            type: object
            required: [game_id, name, player_count, players]
            additionalProperties: false
            properties:
              game_id:
                type: [string, "null"]
                description: The game in the event's catalogue; `null` for the one entry grouping every unmatched activity.
              name:
                type: [string, "null"]
                description: The game's name; `null` for the unmatched entry (activity names are never shown).
              player_count:
                type: integer
                minimum: 0
                description: Everyone playing it except opted-out users, also guild members who are not listed.
              players:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    Voice:
      type: object
      required: [available, as_of, channels]
      additionalProperties: false
      properties:
        available:
          type: boolean
          description: As for `Playing`; `channels` is then empty.
        as_of:
          type: [string, "null"]
          format: date-time
        channels:
          type: array
          items:
            type: object
            required: [channel_id, name, member_count, members]
            additionalProperties: false
            properties:
              channel_id:
                $ref: "#/components/schemas/Snowflake"
              name:
                type: string
                maxLength: 100
              member_count:
                type: integer
                minimum: 0
                description: Everyone in the channel except opted-out users, also guild members who are not listed.
              members:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    Stats:
      type: object
      required: [hours, top_games]
      additionalProperties: false
      properties:
        hours:
          type: array
          items:
            type: object
            required: [hour, online, online_max, in_voice, messages]
            additionalProperties: false
            properties:
              hour:
                type: string
                format: date-time
                description: The hour's start.
              online:
                type: [number, "null"]
                minimum: 0
                description: Members online, the average of the hour's minutes; `null` while the presence feed was off.
              online_max:
                type: [integer, "null"]
                minimum: 0
                description: The most members online in one minute of the hour.
              in_voice:
                type: [number, "null"]
                minimum: 0
                description: Members in voice, the average of the hour's minutes; `null` while the voice feed was off.
              messages:
                type: [integer, "null"]
                minimum: 0
                description: Messages in the hour, in channels everyone can read; `null` while the messages feed was off.
        top_games:
          type: array
          maxItems: 10
          items:
            type: object
            required: [game_id, name, player_hours]
            additionalProperties: false
            properties:
              game_id:
                type: string
              name:
                type: string
                description: The game's name in the catalogue, never an activity's.
              player_hours:
                type: number
                minimum: 0
                description: Player-minutes over the hours asked for, divided by 60 and rounded to two decimals.
    Reason:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    PurposeName:
      type: string
      enum: [announcements, now_and_next, food, photos, crew, tournaments, match_voice, crew_role, attendee_role]
    Purpose:
      type: object
      required: [purpose, kind, flag, state, target_id, target_name, template_name]
      properties:
        purpose:
          $ref: "#/components/schemas/PurposeName"
        kind:
          type: string
          enum: [channel, category, role]
        flag:
          type: [string, "null"]
          description: The feature flag it serves; null when every event uses it.
          examples: [pizza.enabled]
        state:
          type: string
          enum: [bound, missing, not_on]
        target_id:
          description: The picked channel or role; kept when it was deleted in Discord (`missing`).
          oneOf:
            - $ref: "#/components/schemas/Snowflake"
            - type: "null"
        target_name:
          type: [string, "null"]
          description: Its name in Discord now; null unless `bound`.
        template_name:
          type: string
          description: The name "Create what is missing" gives it.
          examples: [now-and-next]
    Purposes:
      type: object
      required: [purposes]
      properties:
        purposes:
          type: array
          items:
            $ref: "#/components/schemas/Purpose"
    PurposeUpdate:
      type: object
      additionalProperties: false
      required: [target_id]
      properties:
        target_id:
          oneOf:
            - $ref: "#/components/schemas/Snowflake"
            - type: "null"
    CreateMissingResult:
      type: object
      required: [created, skipped, purposes]
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/PurposeName"
        skipped:
          type: array
          items:
            type: object
            required: [purpose, reason]
            properties:
              purpose:
                $ref: "#/components/schemas/PurposeName"
              reason:
                type: string
                enum: [missing_permission, role_order, discord_refused]
        purposes:
          type: array
          items:
            $ref: "#/components/schemas/Purpose"
    GuildChannel:
      type: object
      required: [id, name, type, parent_id, position]
      properties:
        id:
          $ref: "#/components/schemas/Snowflake"
        name:
          type: string
        type:
          type: integer
          description: Discord's channel type (0 text, 2 voice, 4 category, 5 announcement, …).
        parent_id:
          oneOf:
            - $ref: "#/components/schemas/Snowflake"
            - type: "null"
        position:
          type: [integer, "null"]
    GuildRole:
      type: object
      required: [id, name, position, managed]
      properties:
        id:
          $ref: "#/components/schemas/Snowflake"
        name:
          type: string
        position:
          type: integer
        managed:
          type: boolean
          description: Held by an integration (a bot's own role); such a role cannot serve a purpose.
    CheckFeatureName:
      type: string
      enum: [announcements, now_and_next, food, photos, crew, tournaments, presence, roles]
    CheckRow:
      type: object
      required: [need, where, ok, missing, fix, fix_action]
      properties:
        need:
          type: string
          enum: [purpose, permission, intent, role_order]
        where:
          type: object
          required: [type, id, name]
          properties:
            type:
              type: string
              enum: [channel, category, role, application]
            id:
              oneOf:
                - $ref: "#/components/schemas/Snowflake"
                - type: "null"
            name:
              type: [string, "null"]
              description: The channel's or role's name in Discord, or the intent's name.
        ok:
          type: boolean
        missing:
          type: array
          description: For a `permission` row, the permissions the bot lacks there, as Discord names them.
          items:
            type: string
          examples: [["Pin messages"]]
        fix:
          type: [string, "null"]
          description: One whole sentence that fixes the row; null when it is ok.
        fix_action:
          type: [string, "null"]
          enum: [create_missing, allow_in_channel, null]
          description: |
            Set when the bot can fix the row itself: `create_missing` through `POST
            /api/bot/guild/purposes/create-missing`, `allow_in_channel` through `POST /api/bot/guild/check/fix`.
    Check:
      type: object
      required: [checked_at, gaps, features]
      properties:
        checked_at:
          type: string
          format: date-time
        gaps:
          type: integer
          minimum: 0
          description: The rows that are not ok, over every feature.
        features:
          type: array
          items:
            type: object
            required: [feature, flag, state, rows]
            properties:
              feature:
                $ref: "#/components/schemas/CheckFeatureName"
              flag:
                type: [string, "null"]
              state:
                type: string
                enum: [ok, gaps, not_on]
              rows:
                type: array
                description: Empty when the feature is not on.
                items:
                  $ref: "#/components/schemas/CheckRow"
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: canccu_session
      description: Opaque session id (contracts/admin.md, Session and rights). Rights are checked through admin.
