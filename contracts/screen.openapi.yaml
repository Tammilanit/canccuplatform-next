              properties:
                source_tenant_id:
                  type: string
                  pattern: "^[a-z][a-z0-9-]{2,31}$"
      responses:
        "200":
          description: What was copied.
          content:
            application/json:
              schema:
                type: object
                required: [zones, assets, playlists, schedules, schedules_dropped, ticker_windows]
                properties:
                  zones:
                    type: integer
                  schedules_dropped:
                    type: integer
                    description: Agenda-bound windows not copied, because their item maps to no item of this event.
                  assets:
                    type: integer
                  playlists:
                    type: integer
                  schedules:
                    type: integer
                  ticker_windows:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: canccu_session
      description: Opaque session id (contracts/admin.md, Session and rights). Rights are checked through admin.
    device:
      type: apiKey
      in: cookie
      name: canccu_device
      description: |
        The device token (contracts/screen.md, Devices). Served only with a request from the event's venue addresses,
        unless the event's venue IP check is off.
    pairing:
      type: apiKey
      in: cookie
      name: canccu_pairing
      description: Set by startPairing, so only the browser that asked can collect the device token.
  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      description: Device id.
      schema:
        $ref: "#/components/schemas/Id"
    ZoneKey:
      name: zone_key
      in: path
      required: true
      description: Zone key.
      schema:
        $ref: "#/components/schemas/ZoneKey"
    AssetId:
      name: asset_id
      in: path
      required: true
      description: Asset id.
      schema:
        $ref: "#/components/schemas/Id"
    PlaylistId:
      name: playlist_id
      in: path
      required: true
      description: Playlist id.
      schema:
        $ref: "#/components/schemas/Id"
    JobId:
      name: job_id
      in: path
      required: true
      description: Render job id.
      schema:
        $ref: "#/components/schemas/Id"
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 200
  responses:
    BadRequest:
      description: "`invalid_request`, `origin_not_allowed`, `unknown_zone`, `unknown_layout` or `code_invalid`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "`not_signed_in`: no valid session; or `device_unknown` on device calls."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DeviceUnauthorized:
      description: "`device_unknown`: no device cookie, or its token is unknown or revoked; the page goes back to pairing."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        `missing_right`, `venue_ip_refused` (a device or pairing request not from the event's venue addresses),
        `info_pages_closed`, `admin_access_restricted` or `feature_off`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`: no such object in this event."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        `version_conflict`, `device_moved` (the device serves another event, or none), `no_venue`, `zone_exists`,
        `zone_in_use`, `asset_in_use`, `photo_exists`, `nothing_to_revert`, `render_not_finished`, `render_finished`,
        `already_cloned` or `event_archived`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooMany:
      description: "`rate_limited`: for pairing, over 10 open codes for the event or over 3 for one address."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: "`file_too_large`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              pattern: "^[a-z][a-z0-9_]*$"
              examples: [venue_ip_refused]
            message:
              type: string
    Health:
      type: object
      description: The shape every module serves (contracts/admin.openapi.yaml, Health).
      required: [status, module, version, time, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        module:
          type: string
          const: screen
        version:
          type: string
        time:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [ok, degraded, down]
              detail:
                type: string
    Id:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
      examples: [dv_1]
    ZoneKey:
      type: string
      pattern: "^[a-z0-9][a-z0-9_-]{1,31}$"
      examples: [main]
    Time:
      type: string
      format: date-time
    Pairing:
      type: object
      required: [pairing_id, code, expires_at, poll_seconds]
      properties:
        pairing_id:
          $ref: "#/components/schemas/Id"
        code:
          type: string
          description: Eight characters to show large, without look-alike characters.
          pattern: "^[A-HJ-NP-Z2-9]{8}$"
        expires_at:
          $ref: "#/components/schemas/Time"
        poll_seconds:
          type: integer
          const: 2
    PairingStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [waiting, paired, expired]
        device:
          $ref: "#/components/schemas/Device"
    PairingClaim:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: "^[A-HJ-NP-Z2-9]{8}$"
        name:
          type: string
          minLength: 1
          maxLength: 80
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
    MirrorTarget:
      type: object
      description: Exactly one of the two.
      oneOf:
        - required: [device_id]
          not:
            required: [zone_key]
        - required: [zone_key]
          not:
            required: [device_id]
      properties:
        device_id:
          $ref: "#/components/schemas/Id"
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
    NowPlaying:
      type: object
      required: [region_id, widget]
      properties:
        region_id:
          type: string
        widget:
          type: string
        item_id:
          type: [string, "null"]
        claim_id:
          type: [string, "null"]
    DeviceHealth:
      type: object
      required: [online, last_seen_at]
      properties:
        online:
          type: boolean
        last_seen_at:
          type: [string, "null"]
          format: date-time
        now_playing:
          oneOf:
            - $ref: "#/components/schemas/NowPlaying"
            - type: "null"
        state_lag:
          type: integer
          description: How many state versions the device is behind its zone.
        bundle_version:
          type: [string, "null"]
        theme_revision:
          type: [integer, "null"]
        audio_unlocked:
          type: boolean
        viewport:
          $ref: "#/components/schemas/Viewport"
    Viewport:
      type: object
      required: [width, height]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    Device:
      type: object
      required: [id, name, zone_key, mirror_of]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        zone_key:
          type: [string, "null"]
        mirror_of:
          oneOf:
            - $ref: "#/components/schemas/MirrorTarget"
            - type: "null"
        paired_at:
          $ref: "#/components/schemas/Time"
        health:
          $ref: "#/components/schemas/DeviceHealth"
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    DeviceRename:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    Assignment:
      type: object
      description: Exactly one of `zone_key` and `mirror_of`.
      oneOf:
        - required: [zone_key]
          not:
            required: [mirror_of]
        - required: [mirror_of]
          not:
            required: [zone_key]
      properties:
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        mirror_of:
          $ref: "#/components/schemas/MirrorTarget"
    Command:
      type: object
      required: [command]
      properties:
        command:
          type: string
          enum: [reload, identify]
    RegistryDevice:
      type: object
      required: [id, name, venue_id, current_tenant_id, created_at, revoked_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        venue_id:
          type: [string, "null"]
        current_tenant_id:
          type: [string, "null"]
        created_at:
          $ref: "#/components/schemas/Time"
        revoked_at:
          type: [string, "null"]
          format: date-time
    RegistryDevicePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        venue_id:
          type: string
        current_tenant_id:
          type: [string, "null"]
    DeviceHome:
      type: object
      required: [url]
      properties:
        url:
          type: [string, "null"]
          description: "`https://<primary hostname>/screen/#transfer=<code>` for the current token (the code is single use and lives 60 seconds); `https://<primary hostname>/screen/` without a code for a superseded token."
    Transfer:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 16
          maxLength: 64
    Heartbeat:
      type: object
      required: [state_version, bundle_version, theme_revision]
      properties:
        state_version:
          type: integer
          minimum: 0
        now_playing:
          $ref: "#/components/schemas/NowPlaying"
        bundle_version:
          type: string
        theme_revision:
          type: integer
        audio_unlocked:
          type: boolean
        viewport:
          $ref: "#/components/schemas/Viewport"
        claims_sounded:
          type: array
          maxItems: 50
          items:
            type: string
        errors:
          type: array
          maxItems: 20
          items:
            type: object
            required: [code]
            properties:
              code:
                type: string
                examples: [ready_timeout, youtube_error, media_error]
              item_id:
                type: string
              detail:
                type: string
                maxLength: 500
    HeartbeatAck:
      type: object
      required: [server_time]
      properties:
        server_time:
          $ref: "#/components/schemas/Time"
    WidgetEntry:
      type: object
      description: A widget entry as in contracts/theme.schema.json (`widget`); `props` per widget type in contracts/screen.md.
      required: [widget]
      properties:
        widget:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
        template:
          type: string
        embed:
          type: string
        props:
          type: object
          additionalProperties:
            type: [string, number, boolean]
    RegionSettings:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        widgets:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/WidgetEntry"
        rotation:
          type: string
          enum: [sequence, shuffle]
          default: sequence
        dwell_seconds:
          type: integer
          minimum: 5
          maximum: 3600
        skip_empty:
          type: boolean
          default: true
        idle:
          type: string
          enum: [logo, blank, collapse]
          default: logo
    Role:
      type: string
      enum: [full, hero, rail, venue_rail, ticker, header, backdrop, overlay]
    Zone:
      type: object
      required: [key, name]
      properties:
        key:
          $ref: "#/components/schemas/ZoneKey"
        name:
          type: string
          minLength: 1
          maxLength: 80
        layout_id:
          type: [string, "null"]
          description: A layout of the current theme, or `pulse` / `pulse_portrait`; null uses `pulse`.
        regions:
          type: object
          description: Keyed by region id of the layout.
          additionalProperties:
            $ref: "#/components/schemas/RegionSettings"
        sound:
          type: object
          properties:
            enabled:
              type: boolean
              default: true
            device_id:
              type: [string, "null"]
        revision:
          type: integer
          minimum: 1
          description: Read-only on POST; required on PUT.
    WidgetView:
      type: object
      description: One widget with its view-model (contracts/screen.md, Widgets).
      required: [widget, view]
      properties:
        widget:
          type: string
        template:
          type: [string, "null"]
        embed:
          type: [string, "null"]
        dwell_seconds:
          type: integer
        stale_after_seconds:
          type: [integer, "null"]
        view:
          type: object
          description: The widget type's fields plus `qr`, `stale` and `empty`.
          properties:
            qr:
              oneOf:
                - $ref: "#/components/schemas/Qr"
                - type: "null"
            stale:
              type: boolean
            empty:
              type: boolean
    Qr:
      type: object
      required: [url, label, image_url]
      properties:
        url:
          type: string
          format: uri
        label:
          type: string
        image_url:
          type: string
          description: A `data:image/svg+xml` QR code made by Screen.
    Sound:
      type: object
      required: [play]
      properties:
        cue:
          type: [string, "null"]
        url:
          type: [string, "null"]
        volume:
          type: number
          minimum: 0
          maximum: 1
        play:
          type: string
          enum: [once, loop]
    Step:
      type: object
      required: [template, content, duration_ms]
      properties:
        template:
          type: string
        content:
          type: object
        duration_ms:
          type: integer
          minimum: 500
          maximum: 60000
        sound:
          oneOf:
            - $ref: "#/components/schemas/Sound"
            - type: "null"
    Claim:
      type: object
      description: A Moments override placed on this region (contracts/screen.md, Moments drive it).
      required: [override_id, role, rank, template, content, starts_at, ends_at, hidden]
      properties:
        override_id:
          type: string
        hidden:
          type: boolean
          description: Placed but not drawn under a higher-ranked `full` claim; shown once that claim ends.
        role:
          $ref: "#/components/schemas/Role"
        rank:
          type: integer
        template:
          type: string
        content:
          type: object
        steps:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Step"
        sound:
          oneOf:
            - $ref: "#/components/schemas/Sound"
            - type: "null"
        on_end:
          type: string
          enum: [resume, next]
        starts_at:
          $ref: "#/components/schemas/Time"
        ends_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
          description: The override's `expires_at` (else `starts_at` plus `ttl_seconds`); the screen ends the claim then, also offline. Renewals move it; `starts_at` never moves.
    Region:
      type: object
      required: [id, role, area, layer, rotation, cycle_started_at, widgets, claim]
      properties:
        id:
          type: string
        role:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        area:
          type: object
          required: [column, row, columns, rows]
          properties:
            column:
              type: integer
            row:
              type: integer
            columns:
              type: integer
            rows:
              type: integer
        layer:
          type: integer
        rotation:
          type: string
          enum: [sequence, shuffle]
        order:
          type: array
          description: Indexes into `widgets` for the current cycle.
          items:
            type: integer
        cycle_started_at:
          $ref: "#/components/schemas/Time"
        idle:
          type: string
          enum: [logo, blank, collapse]
        widgets:
          type: array
          items:
            $ref: "#/components/schemas/WidgetView"
        claim:
          oneOf:
            - $ref: "#/components/schemas/Claim"
            - type: "null"
    Ticker:
      type: object
      required: [text, until, source]
      properties:
        text:
          type: [string, "null"]
          maxLength: 280
        until:
          type: [string, "null"]
          format: date-time
        source:
          type: [string, "null"]
          enum: [admin, bot, window, pizza, null]
        appearance:
          type: string
          enum: [default, high_contrast, minimal, broadcast]
    TickerSet:
      type: object
      required: [text, until]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 280
        until:
          type: [string, "null"]
          format: date-time
    TickerWindow:
      type: object
      required: [text, days, start_minute, end_minute]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        text:
          type: string
          minLength: 1
          maxLength: 280
        days:
          $ref: "#/components/schemas/Days"
        start_minute:
          $ref: "#/components/schemas/Minute"
        end_minute:
          $ref: "#/components/schemas/Minute"
    Days:
      type: array
      description: ISO weekdays, 1 = Monday.
      minItems: 1
      maxItems: 7
      uniqueItems: true
      items:
        type: integer
        minimum: 1
        maximum: 7
    Minute:
      type: integer
      description: Minutes after midnight in the event's time zone; 1440 is midnight at the end of the day.
      minimum: 0
      maximum: 1440
    ScreenState:
      type: object
      required: [state_version, time, tenant, device, zone, bundle, theme, layout, regions, unplaced, hidden, ticker, sound, prefetch, offline]
      properties:
        state_version:
          type: integer
          minimum: 0
        time:
          $ref: "#/components/schemas/Time"
        tenant:
          type: object
          required: [id, name, time_zone, status]
          properties:
            id:
              type: string
            name:
              type: string
            time_zone:
              type: string
            status:
              type: string
              enum: [draft, live, archived]
        device:
          type: object
          required: [id, name, mirror]
          properties:
            id:
              type: string
            name:
              type: string
            mirror:
              type: boolean
        zone:
          type: [object, "null"]
          description: Null for a device with no zone; `layout` is then null and `regions` empty.
          required: [key, name, epoch]
          properties:
            key:
              type: string
            name:
              type: string
            epoch:
              type: string
              description: Set when the zone is created; part of every stream message id.
        bundle:
          type: object
          required: [version]
          properties:
            version:
              type: string
        theme:
          type: object
          description: The theme revision in effect (the pinned one, else the current).
          required: [revision, tokens_css_url, css_url, logo_url, templates]
          properties:
            revision:
              type: integer
            templates:
              type: array
              description: That revision's templates (name, widget type and the parsed template), as theming serves them.
              items:
                type: object
                required: [name, widget]
                properties:
                  name:
                    type: string
                  widget:
                    type: string
                  template:
                    type: object
            tokens_css_url:
              type: string
            css_url:
              type: [string, "null"]
            logo_url:
              type: [string, "null"]
        layout:
          type: [object, "null"]
          description: The whole layout, in the shape of contracts/theme.schema.json `layout`; null without a zone.
          required: [id, aspect, grid]
          properties:
            id:
              type: string
            aspect:
              type: string
            grid:
              type: object
              properties:
                columns:
                  type: integer
                rows:
                  type: integer
        regions:
          type: array
          items:
            $ref: "#/components/schemas/Region"
        unplaced:
          type: array
          description: Overrides active on this zone that found no free region.
          items:
            type: string
        hidden:
          type: array
          description: Overrides placed on this zone but not drawn, because a higher-ranked `full` claim covers them.
          items:
            type: string
        ticker:
          $ref: "#/components/schemas/Ticker"
        sound:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: False on a mirroring device and on devices other than the zone's sound device.
            sounded_claims:
              type: array
              description: Claims this device already sounded, so a reload does not play them again.
              items:
                type: string
        prefetch:
          type: array
          items:
            type: string
        offline:
          type: object
          required: [marker_after_seconds]
          properties:
            marker_after_seconds:
              type: integer
              const: 10
    StreamMessage:
      type: object
      description: The `data` of one push-channel message; which fields are present depends on the SSE event name.
      properties:
        state_version:
          type: integer
        region_id:
          type: string
        index:
          type: integer
        view:
          type: object
        region:
          $ref: "#/components/schemas/Region"
        ticker:
          $ref: "#/components/schemas/Ticker"
        theme:
          type: object
        command:
          type: string
          enum: [reload, identify]
        expires_at:
          $ref: "#/components/schemas/Time"
        time:
          $ref: "#/components/schemas/Time"
    NowView:
      type: object
      required: [time, zone, regions, ticker]
      properties:
        time:
          $ref: "#/components/schemas/Time"
        zone:
          type: object
          required: [key, name]
          properties:
            key:
              type: string
            name:
              type: string
        regions:
          type: array
          items:
            $ref: "#/components/schemas/Region"
        ticker:
          $ref: "#/components/schemas/Ticker"
    Pin:
      type: object
      required: [bundle_version, theme_revision]
      properties:
        bundle_version:
          type: [string, "null"]
          description: One of `available`; null follows the platform version.
        theme_revision:
          type: [integer, "null"]
          description: A revision of the event's theme; null follows the current.
        available:
          type: array
          readOnly: true
          items:
            type: string
    AssetKind:
      type: string
      enum: [image, video, audio, pptx, web, youtube]
    Asset:
      type: object
      required: [id, kind, title, version, health, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          $ref: "#/components/schemas/AssetKind"
        title:
          type: string
        version:
          type: integer
          minimum: 1
        url:
          type: string
          description: The file under `/api/screen/files/`, or the web or YouTube embed URL.
        mime_type:
          type: [string, "null"]
        size_bytes:
          type: [integer, "null"]
        duration_seconds:
          type: [number, "null"]
        slide_count:
          type: [integer, "null"]
        render_state:
          type: [string, "null"]
          enum: [queued, running, succeeded, failed, cancelled, null]
        health:
          type: string
          enum: [ok, degraded, error]
        health_message:
          type: [string, "null"]
        can_revert:
          type: boolean
        used_by:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        created_at:
          $ref: "#/components/schemas/Time"
    AssetUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
        title:
          type: string
          maxLength: 200
    AssetUrl:
      type: object
      required: [kind, url, title]
      properties:
        kind:
          type: string
          enum: [web, youtube]
        url:
          type: string
          format: uri
          pattern: "^https://"
        title:
          type: string
          minLength: 1
          maxLength: 200
    PlaylistItem:
      type: object
      required: [asset_id]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        asset_id:
          $ref: "#/components/schemas/Id"
        duration_seconds:
          type: [number, "null"]
          minimum: 1
        slide_start:
          type: [integer, "null"]
          minimum: 1
        slide_end:
          type: [integer, "null"]
          minimum: 1
        slide_seconds:
          type: [integer, "null"]
          minimum: 1
    BreakSettings:
      type: object
      description: The legacy ADVT break.
      required: [period_seconds, break_seconds]
      properties:
        zones:
          type: array
          description: The zones it interrupts; empty for every zone.
          items:
            $ref: "#/components/schemas/ZoneKey"
        period_seconds:
          type: integer
          minimum: 60
        break_seconds:
          type: integer
          minimum: 5
        window_start_minute:
          $ref: "#/components/schemas/Minute"
        window_end_minute:
          $ref: "#/components/schemas/Minute"
        play_once:
          type: boolean
        region:
          type: string
          enum: [playlist, full]
          default: playlist
        mode:
          type: string
          enum: [timeline, slideshow]
        slideshow_dwell_seconds:
          type: integer
          minimum: 1
        transition:
          type: string
          enum: [cut, crossfade]
        pan_zoom:
          type: string
          enum: [none, subtle, strong]
        shuffle:
          type: boolean
    Playlist:
      type: object
      required: [name, type, items]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 80
        type:
          type: string
          enum: [regular, slideshow, break]
        priority:
          type: integer
          minimum: 0
          maximum: 999
        slideshow_image_seconds:
          type: integer
          minimum: 1
        break:
          oneOf:
            - $ref: "#/components/schemas/BreakSettings"
            - type: "null"
        items:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/PlaylistItem"
        revision:
          type: integer
          minimum: 1
    Schedule:
      type: object
      description: Either weekly (`days`, `start_minute`, `end_minute`) or bound to a run-of-show item (`agenda_item_id`).
      required: [zone_key, playlist_id, priority]
      oneOf:
        - required: [days, start_minute, end_minute]
          properties:
            agenda_item_id:
              type: "null"
        - required: [agenda_item_id]
          properties:
            agenda_item_id:
              type: string
          not:
            anyOf:
              - required: [days]
              - required: [start_minute]
              - required: [end_minute]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        playlist_id:
          $ref: "#/components/schemas/Id"
        priority:
          type: integer
          minimum: 0
          maximum: 999
        layout_id:
          type: [string, "null"]
        days:
          $ref: "#/components/schemas/Days"
        start_minute:
          $ref: "#/components/schemas/Minute"
        end_minute:
          $ref: "#/components/schemas/Minute"
        agenda_item_id:
          type: [string, "null"]
    Simulation:
      type: object
      required: [at, zone_key, schedule_id, playlist_id, layout_id, in_break]
      properties:
        at:
          $ref: "#/components/schemas/Time"
        zone_key:
          type: string
        schedule_id:
          type: [string, "null"]
        playlist_id:
          type: [string, "null"]
        layout_id:
          type: string
        in_break:
          type: boolean
        next_change_at:
          type: [string, "null"]
          format: date-time
    Push:
      type: object
      required: [zones, until]
      description: Exactly one of `playlist_id` and `asset_id`.
      oneOf:
        - required: [playlist_id]
          not:
            required: [asset_id]
        - required: [asset_id]
          not:
            required: [playlist_id]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        zones:
          type: array
          description: Empty means every zone.
          items:
            $ref: "#/components/schemas/ZoneKey"
        playlist_id:
          $ref: "#/components/schemas/Id"
        asset_id:
          $ref: "#/components/schemas/Id"
        until:
          type: string
          format: date-time
          description: At most 12 hours ahead.
    RenderState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    RenderJob:
      type: object
      required: [id, asset_id, asset_version, state, queue_position, submitted_at, started_at, finished_at, error]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        asset_id:
          $ref: "#/components/schemas/Id"
        asset_version:
          type: integer
        state:
          $ref: "#/components/schemas/RenderState"
        queue_position:
          type: [integer, "null"]
        submitted_at:
          $ref: "#/components/schemas/Time"
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        error:
          oneOf:
            - type: "null"
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  enum: [render_timeout, too_many_slides, file_invalid, renderer_failed]
                message:
                  type: string
    RenderResult:
      type: object
      required: [job_id, slide_count, slides]
      properties:
        job_id:
          $ref: "#/components/schemas/Id"
        slide_count:
          type: integer
          minimum: 1
          maximum: 300
        slides:
          type: array
          items:
            type: object
            required: [index, url, width, height]
            properties:
              index:
                type: integer
                minimum: 1
              url:
                type: string
              width:
                type: integer
              height:
                type: integer
    Photo:
      type: object
      required: [id, url, caption, author_name, posted_at, featured]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        url:
          type: string
          description: "`/api/screen/files/<sha256>.<ext>`, served through the photo's row like an asset's file"
        caption:
          type: [string, "null"]
        author_name:
          type: [string, "null"]
        author_user_id:
          type: [string, "null"]
        posted_at:
          $ref: "#/components/schemas/Time"
        featured:
          type: boolean
          description: True until it has been featured once.
    PhotoUpload:
      type: object
      required: [file, posted_at]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
        caption:
          type: string
          maxLength: 200
        author_name:
          type: string
          maxLength: 80
        author_user_id:
          type: string
        posted_at:
          type: string
          format: date-time
        source_ref:
          type: string
          description: The source's own id (a Discord message id), so a second add of it is 409 `photo_exists`.
          maxLength: 64
