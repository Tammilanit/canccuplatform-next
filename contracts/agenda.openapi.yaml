openapi: 3.1.0
info:
  title: Agenda API
  version: 1.4.0
  summary: The run-of-show of one event, editable live.
  description: |
    Machine-readable part of the agenda contract. Prose, rules, reminders and events: contracts/agenda.md.
    Conventions (snake_case, RFC 3339 UTC times, error body): contracts/README.md.
    The event (tenant) comes from the hostname; no operation names a tenant except the clone source and the
    internal reads, whose `tenant_id` the calling module's kit sets.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: Same origin, behind Caddy; the hostname selects the event.
tags:
  - name: items
    description: Reading and editing the run-of-show.
  - name: kinds
    description: The event's own list of item kinds.
  - name: clone
    description: Copying the agenda of a previous event of the series.
  - name: internal
    description: Module paths on the stack's internal network; the edge Caddy never routes them.
security:
  - {}
  - session: []
paths:
  /api/agenda/items:
    get:
      tags: [items]
      operationId: listItems
      summary: List the agenda
      description: |
        Items the caller may see, sorted by `starts_at`: `public` without a session (when the event's
        info-page mode allows), plus `attendees` for members, plus `crew` with right `agenda.crew.read`.
      parameters:
        - name: from
          in: query
          description: Only items that end at or after this time (or start at or after it when they have no end).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only items that start before this time.
          schema:
            type: string
            format: date-time
        - name: include_cancelled
          in: query
          description: Include cancelled items.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: The agenda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agenda"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [items]
      operationId: addItem
      summary: Add an item
      description: Needs right `agenda.items.write`. Emits `agenda.item.added`.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemNew"
      responses:
        "201":
          description: The new item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/agenda/items/{item_id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [items]
      operationId: getItem
      summary: Read one item
      description: 404 `not_found` also when the caller may not see the item.
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [items]
      operationId: editItem
      summary: Edit or move an item
      description: |
        Needs right `agenda.items.write`. A move is a new plan: each given time becomes both its planned and
        its current value, so giving `starts_at` resets `delay_minutes` to 0. Fields left out stay as they
        are; `null` clears `description`, `location` or `zone`. Emits `agenda.item.changed`, which carries
        `announce`: with `announce: false` no consumer tells people about the change.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemEdit"
      responses:
        "200":
          description: The changed item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [items]
      operationId: removeItem
      summary: Remove an item
      description: |
        Needs right `agenda.items.write`. For mistakes; during the event, cancel instead.
        Emits `agenda.item.removed`.
      security:
        - session: []
      parameters:
        - name: revision
          in: query
          required: true
          description: The item's revision as read.
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/agenda/items/{item_id}/delay:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: delayItem
      summary: Delay an item, or bring it forward
      description: |
        Needs right `agenda.items.write`. Shifts the current times and keeps the planned ones. With
        `following`, also shifts every scheduled item starting at or after this item's old start, except
        `quiet_hours` items. A running item keeps its start and only its end moves. A shift that would put an
        item's end at or before its start is 400 `invalid_request` and nothing shifts; an item that has started
        and has no end is 409 `item_started`. Emits one `agenda.item.delayed` per shifted item, with one
        `correlation_id`; each carries `announce`. With `announce: false` no consumer tells people about the
        shift; screens still show the new times and the delay.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Delay"
      responses:
        "200":
          description: Every shifted item, this one first.
          content:
            application/json:
              schema:
                type: object
                required: [agenda_version, items]
                properties:
                  agenda_version:
                    type: integer
                    minimum: 0
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/agenda/items/{item_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: cancelItem
      summary: Cancel an item
      description: Needs right `agenda.items.write`. Final; the item stays visible as cancelled. Emits `agenda.item.cancelled`.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionOnly"
      responses:
        "200":
          description: The cancelled item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/agenda/items/{item_id}/announce:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [items]
      operationId: announceItem
      summary: Announce an item now
      description: |
        Needs right `agenda.items.write`. Tells people about the item now, on its `notify_channels` (Notify's
        `schedule` topic, the bot's channel post). Changes nothing in the agenda: no `revision`, and
        `agenda_version` stays. A `quiet_hours` item is 400 `invalid_request`; a cancelled one is 409
        `item_cancelled`. Emits `agenda.item.announced`.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Announce"
      responses:
        "204":
          description: Announced.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/agenda/now:
    get:
      tags: [items]
      operationId: getNow
      summary: Now and next
      description: |
        The scheduled items running now and those with the earliest start after now, among the items the
        caller may see. The hub and the bot take now and next from here; the screens read the same answer as a
        module (`GET /internal/agenda/now`).
      parameters:
        - name: zone
          in: query
          description: Only items of this screen zone and items with no zone.
          schema:
            $ref: "#/components/schemas/ZoneKey"
      responses:
        "200":
          description: Now and next.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Now"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/agenda/kinds:
    get:
      tags: [kinds]
      operationId: listKinds
      summary: List the event's kinds
      description: Readable by whoever may read the agenda.
      responses:
        "200":
          description: The kinds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/agenda/kinds/{kind_key}:
    parameters:
      - name: kind_key
        in: path
        required: true
        description: Kind key.
        schema:
          $ref: "#/components/schemas/Kind"
    put:
      tags: [kinds]
      operationId: saveKind
      summary: Add or replace a kind
      description: |
        Needs right `agenda.items.write`. Without `revision` it adds a kind (409 `kind_exists` when the key is
        taken); with it, it replaces the kind (409 `version_conflict` when stale). `builtin` follows from the key.
        Emits `agenda.kind.saved`.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KindSave"
      responses:
        "200":
          description: The replaced kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindInfo"
        "201":
          description: The new kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KindInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [kinds]
      operationId: removeKind
      summary: Remove a kind
      description: |
        Needs right `agenda.items.write`. 409 `kind_in_use` while an item names it (cancelled ones too),
        409 `kind_required` for `other`. Emits `agenda.kind.removed`.
      security:
        - session: []
      parameters:
        - name: revision
          in: query
          required: true
          description: The kind's revision as read.
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/agenda/clone:
    post:
      tags: [clone]
      operationId: cloneAgenda
      summary: Clone the agenda of a previous event
      description: |
        Needs right `agenda.items.write` here and event admin on the source; both events must be in one
        series (checked through the tenants API). Only into an empty agenda (409 `agenda_not_empty`; items with
        `managed_by` do not count, so the tournament's clone may run first) whose kind
        list is the untouched starter set, `kinds_version` 0 (409 `kinds_changed`). The source's kind list replaces
        the starter set; scheduled items are copied with their planned times shifted, no delays and no links.
        Items that mirror a tournament session (`managed_by`) are not copied.
        Emits `agenda.items.cloned`.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneRequest"
      responses:
        "200":
          description: The new agenda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agenda"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "common.openapi.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/agenda/items:
    get:
      tags: [internal]
      operationId: listAllItemsInternal
      summary: Every item of an event, for a module
      description: |
        For a module that keeps its own copy of the agenda (the screen module's agenda-bound windows and quiet
        hours), to read it again at start, after a jump in `agenda_version` and after `agenda.items.cloned`, whose
        items no event carries. Every item of the event, `crew` and cancelled ones included, sorted by
        `starts_at`, each as crew sees it; the caller shows each item only to those its `visibility` allows. No
        session: the kit's service identity (`x-canccu-service`, contracts/README.md, Conventions). Internal
        network only.
      security:
        - {}
      parameters:
        - name: tenant_id
          in: query
          required: true
          description: The tenant the calling module serves, set by its kit, never from a client's input.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
      responses:
        "200":
          description: The whole agenda of the event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agenda"
        "401":
          $ref: "#/components/responses/ServiceUnauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`not_found`: no such event."
  /internal/agenda/now:
    get:
      tags: [internal]
      operationId: getNowInternal
      summary: Now and next of an event's public items, for the screens
      description: |
        The same answer as `GET /api/agenda/now` gives a guest whom the info-page mode lets in: `public` items
        only, never `attendees` or `crew` ones, with the same fields. It ignores the info-page mode, so an event
        in mode `venue_only` or `sign_in` still shows its run-of-show on its own screens: the screen module's
        server reads it for the event's screens (contracts/screen.md, Widgets: `agenda_now`, `countdown`). Every
        status of the event. No session: the kit's service identity (`x-canccu-service`, contracts/README.md,
        Conventions); only the screen module may call it. Internal network only.
      security:
        - {}
      parameters:
        - name: tenant_id
          in: query
          required: true
          description: The tenant the calling module serves, set by its kit, never from a client's input.
          schema:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
        - name: zone
          in: query
          description: Only items of this screen zone and items with no zone.
          schema:
            $ref: "#/components/schemas/ZoneKey"
      responses:
        "200":
          description: Now and next among the event's public items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Now"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/ServiceUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
          description: "`service_forbidden`: the calling module is not the screen module."
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`not_found`: no such event."
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: canccu_session
      description: Opaque session id (contracts/admin.md, Session and rights). Rights are checked through admin.
  parameters:
    ItemId:
      name: item_id
      in: path
      required: true
      description: Item id.
      schema:
        $ref: "#/components/schemas/ItemId"
  responses:
    BadRequest:
      description: "`invalid_request`: a field is missing or invalid; `unknown_kind`: the item names a kind the event does not have."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    Forbidden:
      description: |
        `missing_right`: signed in, but the right is missing; `info_pages_closed`: the event's info-page
        mode does not let this request see the agenda; or `service_forbidden`: an internal path the calling
        module may not use.
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    NotFound:
      description: "`not_found`: no such item or kind, or the caller may not see it."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    ServiceUnauthenticated:
      description: "`service_unauthenticated`: no valid `x-canccu-service` header (an internal path, no session)."
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
    Conflict:
      description: |
        `version_conflict` (stale `revision`), `item_cancelled`, `item_started` (delay of a started item with
        no end), `item_managed` (a change the item's tournament session owns), `agenda_not_empty` (clone), `kind_exists`, `kind_in_use`, `kind_required` (removing `other`), `kinds_changed` (clone)
        or `event_archived` (the event is read-only).
      content:
        application/json:
          schema:
            $ref: "common.openapi.yaml#/components/schemas/Error"
  schemas:
    ItemId:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
      examples: [it_8]
    ZoneKey:
      type: string
      description: A zone key of the screen contract.
      pattern: "^[a-z0-9_]{1,32}$"
      examples: [main_hall]
    Kind:
      type: string
      description: |
        A kind key of the event's kind list (`GET /api/agenda/kinds`). The starter set is `doors`, `ceremony`,
        `tournament`, `meal`, `quiet_hours`, `activity` and `other`; organisers add their own. A consumer that
        does not know a key reads the list for its name and otherwise treats it as `other`.
      pattern: "^[a-z][a-z0-9_]{0,31}$"
      examples: [meal, quiet_hours, cosplay]
    Channel:
      type: string
      description: |
        `screen` and `discord_channel` are delivered by Screen and the bot; `discord_dm` and `push` by Notify, to
        attendees who opted in. Consumers ignore channels they do not know.
      enum: [screen, discord_channel, discord_dm, push]
    ChannelChoice:
      description: Channels that announce reminders and changes; `null` hands the choice down (item, kind, event), `[]` announces nothing.
      oneOf:
        - type: "null"
        - type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Channel"
    KindInfo:
      type: object
      required: [key, name, builtin, reminder_leads_minutes, notify, revision]
      properties:
        key:
          $ref: "#/components/schemas/Kind"
        name:
          type: string
          minLength: 1
          maxLength: 60
        builtin:
          type: boolean
          description: A starter-set key. Only `quiet_hours` carries behaviour (contracts/agenda.md, Kinds).
        reminder_leads_minutes:
          $ref: "#/components/schemas/ReminderLeads"
        notify:
          $ref: "#/components/schemas/ChannelChoice"
        revision:
          type: integer
          minimum: 1
    KindSave:
      type: object
      required: [name]
      properties:
        revision:
          type: integer
          minimum: 1
          description: Required to replace an existing kind; left out to add one.
        name:
          type: string
          minLength: 1
          maxLength: 60
        reminder_leads_minutes:
          $ref: "#/components/schemas/ReminderLeads"
        notify:
          $ref: "#/components/schemas/ChannelChoice"
    KindList:
      type: object
      required: [kinds_version, kinds]
      properties:
        kinds_version:
          type: integer
          minimum: 0
          description: +1 on every change of the kind list.
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/KindInfo"
    Visibility:
      type: string
      description: "`public`: anyone; `attendees`: signed-in members; `crew`: right `agenda.crew.read`."
      enum: [public, attendees, crew]
    Links:
      type: object
      description: Ids owned by other modules; the agenda stores them and reads nothing behind them.
      properties:
        tournament_id:
          type: string
        tournament_session_id:
          type: string
          readOnly: true
          description: Set only by the agenda, on the item that mirrors a tournament session; a write that sets it is 400 `invalid_request`.
        moment_id:
          type: string
    ReminderLeads:
      description: Lead times in minutes; `null` uses the kind's (for an item), else the event's setting; `[]` means no reminders.
      oneOf:
        - type: "null"
        - type: array
          maxItems: 8
          items:
            type: integer
            minimum: 1
            maximum: 1440
    Item:
      type: object
      required:
        - id
        - title
        - kind
        - starts_at
        - ends_at
        - planned_starts_at
        - planned_ends_at
        - delay_minutes
        - visibility
        - status
        - reminder_leads_minutes
        - notify
        - notify_channels
        - links
        - revision
      properties:
        id:
          $ref: "#/components/schemas/ItemId"
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        kind:
          $ref: "#/components/schemas/Kind"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
          description: "`null` for a moment in time; always set for `quiet_hours`."
        planned_starts_at:
          type: string
          format: date-time
        planned_ends_at:
          type: [string, "null"]
          format: date-time
        delay_minutes:
          type: integer
          description: "`starts_at` minus `planned_starts_at`, in whole minutes."
        location:
          type: string
          maxLength: 120
        zone:
          $ref: "#/components/schemas/ZoneKey"
        visibility:
          $ref: "#/components/schemas/Visibility"
        status:
          type: string
          enum: [scheduled, cancelled]
        reminder_leads_minutes:
          $ref: "#/components/schemas/ReminderLeads"
        notify:
          $ref: "#/components/schemas/ChannelChoice"
        notify_channels:
          type: array
          readOnly: true
          description: The channels in effect (item, else kind, else the event's `notify_channels`). Consumers act on this.
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Channel"
        links:
          $ref: "#/components/schemas/Links"
        managed_by:
          type: string
          readOnly: true
          enum: [tournament]
          description: |
            Set on an item that mirrors a tournament session. The session owns its title, kind, times, status
            and links: changing them here, cancelling or removing it is 409 `item_managed`; delays still apply.
        cloned_from:
          $ref: "#/components/schemas/ItemId"
        revision:
          type: integer
          minimum: 1
    ItemNew:
      type: object
      required: [title, kind, starts_at, visibility]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        kind:
          $ref: "#/components/schemas/Kind"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
        location:
          type: string
          maxLength: 120
        zone:
          $ref: "#/components/schemas/ZoneKey"
        visibility:
          $ref: "#/components/schemas/Visibility"
        reminder_leads_minutes:
          $ref: "#/components/schemas/ReminderLeads"
        notify:
          $ref: "#/components/schemas/ChannelChoice"
        links:
          $ref: "#/components/schemas/Links"
    ItemEdit:
      type: object
      description: "`revision`, optionally `announce`, plus the fields to change; fields left out stay as they are, `null` clears an optional text field or the zone, or hands reminder leads and `notify` back to the kind."
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 2000
        kind:
          $ref: "#/components/schemas/Kind"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time
        location:
          type: [string, "null"]
          maxLength: 120
        zone:
          description: "`null` clears the zone."
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ZoneKey"
        visibility:
          $ref: "#/components/schemas/Visibility"
        reminder_leads_minutes:
          $ref: "#/components/schemas/ReminderLeads"
        notify:
          $ref: "#/components/schemas/ChannelChoice"
        links:
          $ref: "#/components/schemas/Links"
        announce:
          type: boolean
          default: true
          description: >-
            Tell people about this change (Discord, phones, screen notices). `false` changes the agenda quietly:
            the event carries `announce: false` and no consumer announces it; see contracts/agenda.md.
    Delay:
      type: object
      required: [revision, minutes]
      properties:
        revision:
          type: integer
          minimum: 1
        minutes:
          type: integer
          minimum: -720
          maximum: 720
          not:
            const: 0
          description: Positive delays, negative brings forward.
        following:
          type: boolean
          default: false
          description: Also shift every later scheduled item, except `quiet_hours` items.
        announce:
          type: boolean
          default: true
          description: >-
            Tell people about this change (Discord, phones, screen notices). `false` changes the agenda quietly:
            the event carries `announce: false` and no consumer announces it; see contracts/agenda.md.
    RevisionOnly:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
    Announce:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 140
          description: The organiser's words, the notification's body; leave out for none.
    Agenda:
      type: object
      required: [agenda_version, items]
      properties:
        agenda_version:
          type: integer
          minimum: 0
          description: +1 on every change of the event's agenda; a jump of more than one means re-read.
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
    Now:
      type: object
      required: [time, agenda_version, current, next]
      properties:
        time:
          type: string
          format: date-time
        agenda_version:
          type: integer
          minimum: 0
        current:
          type: array
          description: Scheduled items running now.
          items:
            $ref: "#/components/schemas/Item"
        next:
          type: array
          description: Scheduled items with the earliest start after now; empty at the end of the event.
          items:
            $ref: "#/components/schemas/Item"
    CloneRequest:
      type: object
      required: [source_tenant_id, shift_seconds]
      properties:
        source_tenant_id:
          type: string
          description: The previous event of the same series.
        shift_seconds:
          type: integer
          description: Added to every planned time of the source.
