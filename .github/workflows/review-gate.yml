name: Review gate

# Machine gate for the independent review (AGENTS.md, A package run, step 8).
# Passes only when the newest "Review verdict: <pass|changes|manual — reason> <head sha>"
# comment by the reviewer identity (repo variable REVIEWER_LOGIN) says `pass` for the PR's
# current head. Comments by anyone else are ignored; with the variable unset the gate fails.
# No secrets, no LLM: the GITHUB_TOKEN only reads, except `actions: write` in the rerun job,
# and comment text is matched with jq, never executed. See docs/ci.md, review-gate.
on:
  pull_request:
    # edited: a base-branch change keeps the head SHA, so the gate re-checks it.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  merge_group:

permissions: {}

# The job name `review-gate` is the required-check name for branch rules. Do not rename it.
jobs:
  review-gate:
    name: review-gate
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: review-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Merge queue entry
        if: github.event_name == 'merge_group'
        run: echo "::notice title=review-gate::Merge queue entry; the PR passed review-gate before it was queued."
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Self-test the gate
        if: github.event_name == 'pull_request'
        run: |
          .github/scripts/review-gate --self-test
          .github/scripts/review-gate-rerun --self-test
      - name: Check the newest review verdict
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEWER_LOGIN: ${{ vars.REVIEWER_LOGIN }}
        run: |
          gh api --paginate "repos/$REPO/issues/$PR/comments" | jq -s 'add // []' > "$RUNNER_TEMP/comments.json"
          gh api --paginate "repos/$REPO/issues/$PR/timeline" | jq -s 'add // []' > "$RUNNER_TEMP/timeline.json"
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          .github/scripts/review-gate "$RUNNER_TEMP/comments.json" "$head" "$RUN_HEAD" "$RUNNER_TEMP/timeline.json"

  # A comment event runs on the default branch, so its own check would not land on the PR.
  # Instead, re-run every review-gate run of the PR's head, one at a time, which then read the
  # comments again (.github/scripts/review-gate-rerun says why every run and why one at a time).
  # Fires on a reviewer comment that has (or, when edited, had) a verdict, and on any edit of
  # a reviewer comment (an edited reviewer comment fails the gate). Any other comment only
  # starts a skipped run.
  rerun-on-verdict:
    name: review-gate (rerun on verdict)
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      vars.REVIEWER_LOGIN != '' && github.event.comment.user.login == vars.REVIEWER_LOGIN &&
      (contains(github.event.comment.body, 'Review verdict:') ||
       contains(github.event.changes.body.from || '', 'Review verdict:') ||
       github.event.action == 'edited')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    concurrency:
      group: review-gate-rerun-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # A comment event checks out the default branch, never the PR's copy of the script.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Re-run every review-gate run of the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: .github/scripts/review-gate-rerun "$REPO" "$PR"
