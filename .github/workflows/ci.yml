name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job names are the required-check names for branch rules (#4). Do not rename them.
jobs:
  kit-ts:
    name: lint-types-test (kit-ts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kit-ts
    steps:
      - uses: actions/checkout@v4
      - name: Detect package
        id: pkg
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "empty package, skipping"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.pkg.outputs.present == 'true'
        with:
          node-version: 22
      - if: steps.pkg.outputs.present == 'true'
        run: npm ci
      - if: steps.pkg.outputs.present == 'true'
        run: npm run lint
      - if: steps.pkg.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.pkg.outputs.present == 'true'
        run: npm test

  ui:
    name: lint-types-test (ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4
      - name: Detect package
        id: pkg
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "empty package, skipping"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.pkg.outputs.present == 'true'
        with:
          node-version: 22
      - if: steps.pkg.outputs.present == 'true'
        run: npm ci
      - if: steps.pkg.outputs.present == 'true'
        run: npm run lint
      - if: steps.pkg.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.pkg.outputs.present == 'true'
        run: npm test

  kit-py:
    name: lint-types-test (kit-py)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kit-py
    steps:
      - uses: actions/checkout@v4
      - name: Detect package
        id: pkg
        run: |
          if [ -f pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "empty package, skipping"; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.pkg.outputs.present == 'true'
        with:
          python-version: "3.12"
      - if: steps.pkg.outputs.present == 'true'
        run: pip install -e ".[dev]"
      - if: steps.pkg.outputs.present == 'true'
        run: ruff check .
      - if: steps.pkg.outputs.present == 'true'
        run: mypy .
      - if: steps.pkg.outputs.present == 'true'
        run: pytest

  integration-kit:
    name: integration (kit)
    runs-on: ubuntu-latest
    env:
      CANCCU_VALKEY_URL: redis://127.0.0.1:6379
      # The Compose superuser: the RLS tests create their own plain app role and switch to it.
      CANCCU_DATABASE_URL: postgres://canccu:canccu-local-only@127.0.0.1:5432/canccu
    steps:
      - uses: actions/checkout@v4
      - name: Start Valkey and Postgres from the Compose stack
        run: docker compose -f deploy/compose.yml -f deploy/compose.test.yml up -d --wait valkey postgres
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: kit-ts against Valkey and Postgres
        working-directory: packages/kit-ts
        run: npm ci && npx vitest run test/valkey.integration.test.ts test/postgres.integration.test.ts
      - name: kit-py against Valkey and Postgres
        working-directory: packages/kit-py
        run: pip install -e ".[dev]" && pytest tests/test_valkey_integration.py tests/test_postgres_integration.py
      - name: tenants against Postgres (RLS, audit grants, cross-tenant leak tests)
        working-directory: modules/tenants
        run: pip install -e ".[dev]" && pytest
      - name: admin against Postgres (RLS, its migration, cross-tenant leak tests)
        working-directory: modules/admin
        run: pip install -e ".[dev]" && pytest
      - name: Valkey and Postgres logs
        if: failure()
        run: docker compose -f deploy/compose.yml logs valkey postgres
      - if: always()
        run: docker compose -f deploy/compose.yml -f deploy/compose.test.yml down -v

  compose:
    name: compose (deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: hello checks
        run: |
          (cd packages/kit-ts && npm ci)
          cd modules/hello && npm ci && npm run lint && npm run typecheck && npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: admin checks
        working-directory: modules/admin
        run: pip install -e ".[dev]" && ruff check . && mypy . && pytest
      - name: tenants checks
        working-directory: modules/tenants
        run: pip install -e ".[dev]" && ruff check . && ruff format --check . && mypy . && pytest
      - name: Start the stack (clean runner, only Docker)
        run: docker compose -f deploy/compose.yml up -d --build --wait
      - name: Only Caddy publishes a port; only the three named volumes exist
        run: |
          docker compose -f deploy/compose.yml config --format json > /tmp/config.json
          jq -e '[.services | to_entries[] | select(.value.ports) | .key] == ["caddy"]' /tmp/config.json
          jq -e '.volumes | keys == ["files", "postgres-data", "valkey-data"]' /tmp/config.json
          test "$(docker volume ls -q --filter label=com.docker.compose.project=canccuplatform | sort | tr '\n' ' ')" \
            = "canccuplatform_files canccuplatform_postgres-data canccuplatform_valkey-data "
      - name: Health through Caddy is 200 ok
        run: |
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost/api/hello/health)
          cat /tmp/health.json; echo
          test "$code" = 200
          jq -e '.status == "ok" and .module == "hello" and .checks.valkey.status == "ok" and .checks.postgres.status == "ok"' /tmp/health.json
      - name: Admin health through Caddy is 200 ok
        run: |
          curl -fsS http://localhost/api/admin/health | tee /tmp/admin-health.json; echo
          jq -e '.status == "ok" and .module == "admin" and .checks.postgres.status == "ok"' /tmp/admin-health.json
          curl -fsS http://localhost/api/tenants/health | tee /tmp/tenants-health.json; echo
          jq -e '.status == "ok" and .module == "tenants" and .checks.postgres.status == "ok"' /tmp/tenants-health.json
      - name: The seeded demo tenant answers in IP mode through Caddy
        run: |
          curl -fsS http://127.0.0.1/api/tenants/current | tee /tmp/tenants-current.json; echo
          jq -e '.id == "demo" and .status == "live"' /tmp/tenants-current.json
      - name: Health is 503 down when Valkey is stopped
        run: |
          docker compose -f deploy/compose.yml stop valkey
          for i in $(seq 1 15); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost/api/hello/health || true)
            if [ "$code" = 503 ] && jq -e '.status == "down" and .checks.valkey.status == "down"' /tmp/health.json; then
              cat /tmp/health.json; echo; exit 0
            fi
            sleep 1
          done
          echo "expected 503 down, last answer: $code"; cat /tmp/health.json; exit 1
      - name: hello stops at start when a kit variable is missing
        run: |
          if docker compose -f deploy/compose.yml run --rm --no-deps -e CANCCU_ADMIN_URL= hello > /tmp/start.log 2>&1; then
            echo "hello started without CANCCU_ADMIN_URL"; cat /tmp/start.log; exit 1
          fi
          cat /tmp/start.log
          grep -q "missing environment variable(s): CANCCU_ADMIN_URL" /tmp/start.log
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yml logs
      - if: always()
        run: docker compose -f deploy/compose.yml down -v

  no-event-names:
    name: no-event-names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test the checker
        run: scripts/check-event-names --self-test
      - name: Check the diff
        env:
          EVENT_NAME_TERMS: ${{ secrets.EVENT_NAME_TERMS }}
          # Fork PRs get no secrets; the maintainer-approved run is the gate there.
          EVENT_NAMES_SKIP_IF_MISSING: ${{ github.event.pull_request.head.repo.full_name != github.repository && '1' || '0' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-event-names "$BASE"

  naming:
    name: naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the checker
        run: scripts/check-naming --self-test
      - name: No identifier with the old prefix (ADR 0017)
        run: scripts/check-naming

  tenancy:
    name: tenancy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the checker
        run: scripts/check-tenancy --self-test
      - name: Tenant tables, global allow-list and no raw keys (0013 items 5-7)
        run: scripts/check-tenancy

  file-size:
    name: file-size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the checker
        run: scripts/check-file-size --self-test
      # Warns only (annotations on the files): the health pass decides what to split (ADR 0019).
      - name: Source files over 400 lines
        run: scripts/check-file-size

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate profiles and lint OpenAPI contracts
        run: scripts/check-contracts

  setup:
    name: setup (self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools for every setup check
        run: |
          for t in shellcheck jq docker; do command -v "$t" >/dev/null || { echo "::error::$t missing"; exit 1; }; done
          docker info >/dev/null && docker compose version
      - name: setup/test.sh
        shell: bash  # -eo pipefail: a failing test.sh fails the step despite tee
        run: setup/test.sh | tee "$RUNNER_TEMP/setup-test.log"
      - name: No setup check skipped (systemd-analyze may skip)
        run: |
          if grep -E '^skip ' "$RUNNER_TEMP/setup-test.log" | grep -v '^skip systemd-analyze verify '; then
            echo "::error::setup checks were skipped"; exit 1
          fi
