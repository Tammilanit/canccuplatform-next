name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job names are the required-check names for branch rules (#4). Do not rename them.
jobs:
  # The packages run through the module runner and its setup (#253, #302), so the kit's
  # integration tests run inside its lint-types-test jobs, not a second time. The kit
  # legs are a job of their own so that `integration (kit)` waits for them alone, not for ui.
  package-kit:
    name: lint-types-test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [kit-ts, kit-py]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-module
        with:
          target: packages/${{ matrix.package }}

  package-ui:
    name: lint-types-test (ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-module
        with:
          target: packages/ui

  integration-kit:
    name: integration (kit)
    needs: package-kit
    # Kept as a required name: the kit's Valkey and Postgres tests now run in the package jobs.
    # always(): a failed or cancelled package job must fail this check, not skip it.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Both kit package jobs passed, the kit's integration tests among them
        env:
          RESULT: ${{ needs.package-kit.result }}
        run: |
          echo "kit package jobs: $RESULT"
          test "$RESULT" = success

  # The generic module step (#213): every modules/<name> with checks runs through
  # scripts/check-module, so a new module needs no change here. Only `modules` is a stable
  # check name for branch rules; the per-module names come and go with the modules.
  module-list:
    name: modules (list)
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the runner
        run: scripts/check-module --self-test
      - id: list
        run: echo "modules=$(scripts/check-module --list)" | tee -a "$GITHUB_OUTPUT"

  module:
    name: module (${{ matrix.module }})
    needs: module-list
    if: needs.module-list.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.module-list.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-module
        with:
          target: ${{ matrix.module }}

  modules:
    name: modules
    needs: [module-list, module]
    # always(): a failed or cancelled module job must fail this check, not skip it, because a
    # skipped required check counts as passed.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every module job passed
        env:
          LIST: ${{ needs.module-list.result }}
          MODULES: ${{ needs.module-list.outputs.modules }}
          RESULT: ${{ needs.module.result }}
        run: |
          echo "list: $LIST, modules: $MODULES, module jobs: $RESULT"
          test "$LIST" = success
          test "$RESULT" = success || { test "$RESULT" = skipped && test "$MODULES" = '[]'; }

  compose:
    name: compose (deploy)
    # The module checks (RLS and cross-tenant leak tests among them) left this required job for
    # `modules`; needing it keeps them blocking merges whether or not the ruleset lists
    # `modules`. always(): a failed `modules` must fail this job, since a skipped one passes.
    needs: modules
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every module check passed
        env:
          MODULES: ${{ needs.modules.result }}
        run: |
          echo "modules: $MODULES"
          test "$MODULES" = success
      - uses: actions/checkout@v4
      - name: Fresh secrets for this run (never a fixed key in the repo)
        run: |
          echo "CANCCU_SECRETS_KEY=1:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          # A module's own (notify's VAPID key, ...) come from its ci/stack-env.sh (docs/ci.md#compose).
          scripts/stack-smoke env >> "$GITHUB_ENV"
      - name: Start the stack (clean runner, only Docker)
        run: docker compose -f deploy/compose.yml up -d --build --wait
      - name: Only Caddy publishes a port; only the five named volumes exist
        run: |
          docker compose -f deploy/compose.yml config --format json > /tmp/config.json
          jq -e '[.services | to_entries[] | select(.value.ports) | .key] == ["caddy"]' /tmp/config.json
          jq -e '.volumes | keys == ["deploy-status", "files", "postgres-data", "render-socket", "valkey-data"]' /tmp/config.json
          test "$(docker volume ls -q --filter label=com.docker.compose.project=canccuplatform | sort | tr '\n' ' ')" \
            = "canccuplatform_deploy-status canccuplatform_files canccuplatform_postgres-data canccuplatform_render-socket canccuplatform_valkey-data "
      - name: Health through Caddy is 200 ok
        run: |
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost/api/hello/health)
          cat /tmp/health.json; echo
          test "$code" = 200
          jq -e '.status == "ok" and .module == "hello" and .checks.valkey.status == "ok" and .checks.postgres.status == "ok"' /tmp/health.json
      # Each module's own checks live in modules/<name>/ci/stack-smoke.sh, so a module PR never
      # edits this file (#324). Before Valkey stops: they expect the whole stack up.
      - name: Module stack smoke checks (modules/*/ci/stack-smoke.sh)
        run: scripts/stack-smoke run
      - name: Health is 503 down when Valkey is stopped
        run: |
          docker compose -f deploy/compose.yml stop valkey
          for i in $(seq 1 15); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost/api/hello/health || true)
            if [ "$code" = 503 ] && jq -e '.status == "down" and .checks.valkey.status == "down"' /tmp/health.json; then
              cat /tmp/health.json; echo; exit 0
            fi
            sleep 1
          done
          echo "expected 503 down, last answer: $code"; cat /tmp/health.json; exit 1
      - name: hello stops at start when a kit variable is missing
        run: |
          if docker compose -f deploy/compose.yml run --rm --no-deps -e CANCCU_ADMIN_URL= hello > /tmp/start.log 2>&1; then
            echo "hello started without CANCCU_ADMIN_URL"; cat /tmp/start.log; exit 1
          fi
          cat /tmp/start.log
          grep -q "missing environment variable(s): CANCCU_ADMIN_URL" /tmp/start.log
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yml logs
      - if: always()
        run: docker compose -f deploy/compose.yml down -v

  no-event-names:
    name: no-event-names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test the checker
        run: scripts/check-event-names --self-test
      - name: Check the diff
        env:
          EVENT_NAME_TERMS: ${{ secrets.EVENT_NAME_TERMS }}
          # Fork PRs get no secrets; the maintainer-approved run is the gate there.
          EVENT_NAMES_SKIP_IF_MISSING: ${{ github.event.pull_request.head.repo.full_name != github.repository && '1' || '0' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-event-names "$BASE"

  naming:
    name: naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the checker
        run: scripts/check-naming --self-test
      - name: No identifier with the old prefix (ADR 0017)
        run: scripts/check-naming

  tenancy:
    name: tenancy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the checker
        run: scripts/check-tenancy --self-test
      - name: Tenant tables, global allow-list and no raw keys (0013 items 5-7)
        run: scripts/check-tenancy

  file-size:
    name: file-size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the checker
        run: scripts/check-file-size --self-test
      # Warns only (annotations on the files): the health pass decides what to split (ADR 0019).
      - name: Source files over 400 lines
        run: scripts/check-file-size

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate profiles and lint OpenAPI contracts
        run: scripts/check-contracts

  setup:
    name: setup (self-test)
    runs-on: ubuntu-latest
    # The runner image's ShellCheck updates on its own, and a new version with a new rule
    # (SC2329 in 0.11) turned every PR red at once (#343). A pinned, checksummed release
    # makes a ShellCheck update a PR of its own: change both lines together.
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@v4
      - name: Pinned ShellCheck
        run: |
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $tarball" | sha256sum -c - \
            || { echo "::error::ShellCheck $SHELLCHECK_VERSION tarball does not match its pinned checksum"; exit 1; }
          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
          got=$("$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" --version | sed -n 's/^version: //p')
          [ "v$got" = "$SHELLCHECK_VERSION" ] \
            || { echo "::error::pinned ShellCheck reports version ${got:-unknown}, expected $SHELLCHECK_VERSION"; exit 1; }
      - name: Tools for every setup check
        run: |
          [ "$(command -v shellcheck)" = "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" ] \
            || { echo "::error::shellcheck on PATH is $(command -v shellcheck), not the pinned one"; exit 1; }
          for t in shellcheck jq docker; do command -v "$t" >/dev/null || { echo "::error::$t missing"; exit 1; }; done
          docker info >/dev/null && docker compose version
      - name: setup/test.sh
        shell: bash  # -eo pipefail: a failing test.sh fails the step despite tee
        run: setup/test.sh | tee "$RUNNER_TEMP/setup-test.log"
      - name: No setup check skipped (systemd-analyze may skip)
        run: |
          if grep -E '^skip ' "$RUNNER_TEMP/setup-test.log" | grep -v '^skip systemd-analyze verify '; then
            echo "::error::setup checks were skipped"; exit 1
          fi
