name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job names are the required-check names for branch rules (#4). Do not rename them.
jobs:
  # The packages run through the module runner (#253), each with its own Valkey and Postgres,
  # so the kit's integration tests run inside its lint-types-test job, not a second time.
  package:
    name: lint-types-test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [kit-ts, ui, kit-py]
    env:
      CANCCU_VALKEY_URL: redis://127.0.0.1:6379
      # The Compose superuser: the RLS tests create their own plain app role and switch to it.
      CANCCU_DATABASE_URL: postgres://canccu:canccu-local-only@127.0.0.1:5432/canccu
      PACKAGE: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - name: Start Valkey and Postgres from the Compose stack
        run: docker compose -f deploy/compose.yml -f deploy/compose.test.yml up -d --wait valkey postgres
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint, types and tests, with the Postgres and Valkey tests
        run: scripts/check-module "$PACKAGE"
      - name: Valkey and Postgres logs
        if: failure()
        run: docker compose -f deploy/compose.yml logs valkey postgres
      - if: always()
        run: docker compose -f deploy/compose.yml -f deploy/compose.test.yml down -v

  integration-kit:
    name: integration (kit)
    needs: package
    # Kept as a required name: the kit's Valkey and Postgres tests now run in the package jobs.
    # always(): a failed or cancelled package job must fail this check, not skip it.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every package job passed, the kit's integration tests among them
        env:
          RESULT: ${{ needs.package.result }}
        run: |
          echo "package jobs: $RESULT"
          test "$RESULT" = success

  # The generic module step (#213): every modules/<name> with checks runs through
  # scripts/check-module, so a new module needs no change here. Only `modules` is a stable
  # check name for branch rules; the per-module names come and go with the modules.
  module-list:
    name: modules (list)
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the runner
        run: scripts/check-module --self-test
      - id: list
        run: echo "modules=$(scripts/check-module --list)" | tee -a "$GITHUB_OUTPUT"

  module:
    name: module (${{ matrix.module }})
    needs: module-list
    if: needs.module-list.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.module-list.outputs.modules) }}
    env:
      CANCCU_VALKEY_URL: redis://127.0.0.1:6379
      # The Compose superuser: the RLS tests create their own plain app role and switch to it.
      # Each module job has its own database, so a module's tests may recreate their tables.
      CANCCU_DATABASE_URL: postgres://canccu:canccu-local-only@127.0.0.1:5432/canccu
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - name: Start Valkey and Postgres from the Compose stack
        run: docker compose -f deploy/compose.yml -f deploy/compose.test.yml up -d --wait valkey postgres
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint, types and tests, with the Postgres and Valkey tests
        run: scripts/check-module "$MODULE"
      - name: Valkey and Postgres logs
        if: failure()
        run: docker compose -f deploy/compose.yml logs valkey postgres
      - if: always()
        run: docker compose -f deploy/compose.yml -f deploy/compose.test.yml down -v

  modules:
    name: modules
    needs: [module-list, module]
    # always(): a failed or cancelled module job must fail this check, not skip it, because a
    # skipped required check counts as passed.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every module job passed
        env:
          LIST: ${{ needs.module-list.result }}
          MODULES: ${{ needs.module-list.outputs.modules }}
          RESULT: ${{ needs.module.result }}
        run: |
          echo "list: $LIST, modules: $MODULES, module jobs: $RESULT"
          test "$LIST" = success
          test "$RESULT" = success || { test "$RESULT" = skipped && test "$MODULES" = '[]'; }

  compose:
    name: compose (deploy)
    # The module checks (RLS and cross-tenant leak tests among them) left this required job for
    # `modules`; needing it keeps them blocking merges whether or not the ruleset lists
    # `modules`. always(): a failed `modules` must fail this job, since a skipped one passes.
    needs: modules
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every module check passed
        env:
          MODULES: ${{ needs.modules.result }}
        run: |
          echo "modules: $MODULES"
          test "$MODULES" = success
      - uses: actions/checkout@v4
      - name: Fresh secrets for this run (never a fixed key in the repo)
        run: |
          echo "CANCCU_SECRETS_KEY=1:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          # A random 32-byte scalar is a valid P-256 key but for a chance of about 2^-32.
          echo "CANCCU_NOTIFY_VAPID_PRIVATE_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')" >> "$GITHUB_ENV"
      - name: Start the stack (clean runner, only Docker)
        run: docker compose -f deploy/compose.yml up -d --build --wait
      - name: Only Caddy publishes a port; only the five named volumes exist
        run: |
          docker compose -f deploy/compose.yml config --format json > /tmp/config.json
          jq -e '[.services | to_entries[] | select(.value.ports) | .key] == ["caddy"]' /tmp/config.json
          jq -e '.volumes | keys == ["deploy-status", "files", "postgres-data", "render-socket", "valkey-data"]' /tmp/config.json
          test "$(docker volume ls -q --filter label=com.docker.compose.project=canccuplatform | sort | tr '\n' ' ')" \
            = "canccuplatform_deploy-status canccuplatform_files canccuplatform_postgres-data canccuplatform_render-socket canccuplatform_valkey-data "
      - name: The render job is isolated and renders through its socket
        run: |
          jq -e '.services["screen-render"] | .network_mode == "none" and .read_only == true
            and .cap_drop == ["ALL"] and ([.volumes[].source] == ["render-socket"])
            and (.environment // {} | length == 0)' /tmp/config.json
          jq -e '[.services | to_entries[] | select(.value.volumes // [] | map(.source) | index("render-socket")) | .key]
            == ["screen-render"]' /tmp/config.json
          if docker compose -f deploy/compose.yml exec -T screen-render \
              python -c "import socket; socket.create_connection(('1.1.1.1', 53), 2)"; then
            echo "screen-render reached the network"; exit 1
          fi
          docker build -q --target test -f modules/screen-render/Dockerfile -t canccu-screen-render-test .
          docker run --rm --network none -v canccuplatform_render-socket:/run/canccu-render \
            canccu-screen-render-test python tests/smoke.py
      - name: Health through Caddy is 200 ok
        run: |
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost/api/hello/health)
          cat /tmp/health.json; echo
          test "$code" = 200
          jq -e '.status == "ok" and .module == "hello" and .checks.valkey.status == "ok" and .checks.postgres.status == "ok"' /tmp/health.json
      - name: Admin health through Caddy is 200 ok
        run: |
          curl -fsS http://localhost/api/admin/health | tee /tmp/admin-health.json; echo
          jq -e '.status == "ok" and .module == "admin" and .checks.postgres.status == "ok"' /tmp/admin-health.json
          curl -fsS http://localhost/api/tenants/health | tee /tmp/tenants-health.json; echo
          jq -e '.status == "ok" and .module == "tenants" and .checks.postgres.status == "ok"' /tmp/tenants-health.json
          curl -fsS http://localhost/api/agenda/health | tee /tmp/agenda-health.json; echo
          jq -e '.status == "ok" and .module == "agenda" and .checks.postgres.status == "ok"' /tmp/agenda-health.json
          curl -fsS http://127.0.0.1/api/agenda/kinds | tee /tmp/agenda-kinds.json; echo
          jq -e '.kinds_version == 0 and (.kinds | map(.key) | index("other") != null)' /tmp/agenda-kinds.json
          curl -fsS http://localhost/api/notify/health | tee /tmp/notify-health.json; echo
          jq -e '.status == "ok" and .module == "notify" and .checks.postgres.status == "ok"' /tmp/notify-health.json
          curl -fsS http://127.0.0.1/api/notify/topics | tee /tmp/notify-topics.json; echo
          jq -e '.topics == []' /tmp/notify-topics.json
          curl -fsS http://127.0.0.1/api/notify/push-key | tee /tmp/notify-key.json; echo
          jq -e '.vapid_public_key | test("^B[A-Za-z0-9_-]{86}$")' /tmp/notify-key.json
      - name: The seeded demo tenant answers in IP mode through Caddy
        run: |
          curl -fsS http://127.0.0.1/api/tenants/current | tee /tmp/tenants-current.json; echo
          jq -e '.id == "demo" and .status == "live"' /tmp/tenants-current.json
      - name: Theming answers the platform defaults through Caddy, with its token CSS
        run: |
          curl -fsS http://localhost/api/theming/health | jq -e '.status == "ok" and .checks.files.status == "ok"'
          curl -fsS http://127.0.0.1/api/theming/current | tee /tmp/theme.json; echo
          jq -e '.revision == 0 and .theming_version == 1' /tmp/theme.json
          curl -fsS -D /tmp/css.headers "http://127.0.0.1$(jq -r .tokens_css_url /tmp/theme.json)" | grep -q -- '--canccu-color-primary'
          grep -qi '^x-content-type-options: nosniff' /tmp/css.headers
      - name: Health is 503 down when Valkey is stopped
        run: |
          docker compose -f deploy/compose.yml stop valkey
          for i in $(seq 1 15); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost/api/hello/health || true)
            if [ "$code" = 503 ] && jq -e '.status == "down" and .checks.valkey.status == "down"' /tmp/health.json; then
              cat /tmp/health.json; echo; exit 0
            fi
            sleep 1
          done
          echo "expected 503 down, last answer: $code"; cat /tmp/health.json; exit 1
      - name: hello stops at start when a kit variable is missing
        run: |
          if docker compose -f deploy/compose.yml run --rm --no-deps -e CANCCU_ADMIN_URL= hello > /tmp/start.log 2>&1; then
            echo "hello started without CANCCU_ADMIN_URL"; cat /tmp/start.log; exit 1
          fi
          cat /tmp/start.log
          grep -q "missing environment variable(s): CANCCU_ADMIN_URL" /tmp/start.log
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yml logs
      - if: always()
        run: docker compose -f deploy/compose.yml down -v

  no-event-names:
    name: no-event-names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test the checker
        run: scripts/check-event-names --self-test
      - name: Check the diff
        env:
          EVENT_NAME_TERMS: ${{ secrets.EVENT_NAME_TERMS }}
          # Fork PRs get no secrets; the maintainer-approved run is the gate there.
          EVENT_NAMES_SKIP_IF_MISSING: ${{ github.event.pull_request.head.repo.full_name != github.repository && '1' || '0' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-event-names "$BASE"

  naming:
    name: naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the checker
        run: scripts/check-naming --self-test
      - name: No identifier with the old prefix (ADR 0017)
        run: scripts/check-naming

  tenancy:
    name: tenancy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the checker
        run: scripts/check-tenancy --self-test
      - name: Tenant tables, global allow-list and no raw keys (0013 items 5-7)
        run: scripts/check-tenancy

  file-size:
    name: file-size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the checker
        run: scripts/check-file-size --self-test
      # Warns only (annotations on the files): the health pass decides what to split (ADR 0019).
      - name: Source files over 400 lines
        run: scripts/check-file-size

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate profiles and lint OpenAPI contracts
        run: scripts/check-contracts

  setup:
    name: setup (self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools for every setup check
        run: |
          for t in shellcheck jq docker; do command -v "$t" >/dev/null || { echo "::error::$t missing"; exit 1; }; done
          docker info >/dev/null && docker compose version
      - name: setup/test.sh
        shell: bash  # -eo pipefail: a failing test.sh fails the step despite tee
        run: setup/test.sh | tee "$RUNNER_TEMP/setup-test.log"
      - name: No setup check skipped (systemd-analyze may skip)
        run: |
          if grep -E '^skip ' "$RUNNER_TEMP/setup-test.log" | grep -v '^skip systemd-analyze verify '; then
            echo "::error::setup checks were skipped"; exit 1
          fi
