name: Demo stack

# Tiered (#461, #835, docs/ci.md#tiers): a pull request, a merge-queue entry and a push to main run
# what their changed paths need, the screens only the views they affect at 1920×1080 in one theme;
# a push to main takes no screenshot, since the queue has just checked the same tree (#861), but
# still runs its API tests, which write the image cache, and the soak. The nightly run and a
# manual run take every view in every theme, and a manual run with `book=true` (the screenshot
# book at a checkpoint) portrait and one 4K shot per layout too.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      book:
        description: "The screenshot book: portrait and one 4K shot per layout too"
        type: boolean
        default: false

permissions:
  contents: read

# The event is in the group so the nightly run never cancels a push's run on main.
concurrency:
  group: demo-stack-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  COMPOSE: docker compose -f deploy/compose.yml -f deploy/compose.ci.yml

jobs:
  plan:
    name: demo-stack (plan)
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      api: ${{ steps.plan.outputs.api }}
      soak: ${{ steps.plan.outputs.soak }}
      check: ${{ steps.plan.outputs.check }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      # The planner diffs two trees, so it needs those two commits, not the history: a pull
      # request's merge commit and its first parent (depth 2), a queue entry's head and its base, a
      # push's head and the commit main was at before it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: The queue entry's or the push's base
        if: github.event_name == 'merge_group' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test the planner, the path map and the screenshot groups
        run: node scripts/demo-stack-plan.mjs --self-test
      # The run's summary says what runs and why.
      - name: The tier and the shots, from the event and the changed paths
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          # A pull request's checkout is its merge commit, whose first parent is the base it merges
          # into; a queue entry names its base, a push the commit before it. (A pull request's own
          # `before` is its previous head, not its base.)
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before || 'HEAD^1' }}
          BOOK: ${{ github.event_name == 'workflow_dispatch' && inputs.book }}
        run: |
          args=(--event "$EVENT" --base "$BASE" --summary "$GITHUB_STEP_SUMMARY")
          if [ "$BOOK" = true ]; then args+=(--book); fi
          node scripts/demo-stack-plan.mjs "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  api:
    name: demo-stack (api)
    needs: plan
    if: needs.plan.outputs.tier != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The one cache writer: every run that builds a stack runs this job. A queue entry's ref is
      # never built again, so its cache would only push older entries out.
      - uses: ./.github/actions/demo-stack-up
        with:
          write-cache: ${{ github.event_name != 'merge_group' }}
      - name: API tests of the changed modules, and the platform smoke
        env:
          ONLY: ${{ needs.plan.outputs.api }}
        run: scripts/demo-stack-test --only "$ONLY" http://127.0.0.1
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color > compose.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-stack-logs-api
          path: compose.log
          retention-days: 14

  # The player's 24 accelerated hours take 6 minutes, so they run beside the API tests.
  soak:
    name: demo-stack (soak)
    needs: plan
    if: needs.plan.outputs.soak == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/demo-stack-up
        with:
          browser: "true"
      - name: The player's soak, after the platform smoke
        run: scripts/demo-stack-test --only soak http://127.0.0.1
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color > compose.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-stack-logs-soak
          path: compose.log
          retention-days: 14

  shots:
    name: demo-stack (shots ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    # The screens shard of one ran 22–28 min with the living strips and the stage's two (#787);
    # it is now cut in two (#835), each part under 20 min, so 25 leaves room and a hang still
    # ends here. It supersedes the 35- and 40-minute raises of #833 and #834.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/demo-stack-up
        with:
          browser: "true"
      # It also imports the demo event, which the shots show.
      - name: Platform smoke
        run: scripts/demo-stack-test --only "" http://127.0.0.1
      # The shard's groups and the run's choice of screen shots (the plan's summary says why);
      # what the shard took goes to the run's summary.
      - name: Screenshots of this shard's groups
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_GROUPS: ${{ matrix.groups }}
          SELECT: ${{ matrix.select }}
          CHECK: ${{ needs.plan.outputs.check }}
        run: |
          set -o pipefail
          read -ra select <<< "$SELECT"
          args=(--groups "$SHARD_GROUPS" "${select[@]}")
          if [ "$CHECK" = true ]; then args+=(--check); fi
          status=0
          scripts/demo-screenshots "${args[@]}" http://127.0.0.1 screenshots 2>&1 | tee "$RUNNER_TEMP/shots.log" || status=1
          {
            echo "<details><summary>shots $SHARD: $(grep -c '^ok ' "$RUNNER_TEMP/shots.log") taken, $(grep -c '^FAIL ' "$RUNNER_TEMP/shots.log") failed</summary>"
            echo
            grep -E '^(ok|FAIL) ' "$RUNNER_TEMP/shots.log" | sed 's/^/    /' || true
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload screenshots
        if: always() && needs.plan.outputs.check != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots-${{ matrix.shard }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color > compose.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-stack-logs-shots-${{ matrix.shard }}
          path: compose.log
          retention-days: 14

  # The shards' PNGs as the one artifact `demo-screenshots` reviewers download (AGENTS.md, A
  # package run), also when a shard failed, so its other views can still be held to the mockups.
  screenshots:
    name: demo-stack (screenshots)
    needs: [plan, shots]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.shards != '[]' && needs.plan.outputs.check != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # The merge fails when it finds no artifact. When a shard failed, every shard may have
      # stopped before its first PNG, and that second failure would hide the shards' own in the
      # demo-stack check, so it is skipped then. When the shards all passed, no PNG means a pass
      # took nothing, which must fail here: the shards' upload only warns.
      - name: The shards' artifacts
        id: found
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHOTS: ${{ needs.shots.result }}
        run: |
          names=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name')
          n=$(grep -c '^demo-screenshots-' <<<"$names" || true)
          echo "count=$n" | tee -a "$GITHUB_OUTPUT"
          if [ "$n" != 0 ]; then exit 0; fi
          if [ "$SHOTS" = success ]; then
            echo "::error::the shards passed but none uploaded a screenshot"
            exit 1
          fi
          echo "::warning::no shard uploaded a screenshot; see the shards' own failures"
      - if: steps.found.outputs.count != '0'
        uses: actions/upload-artifact/merge@v4
        with:
          name: demo-screenshots
          pattern: demo-screenshots-*
          delete-merged: true
          retention-days: 14

  # The job name is the required-check name for branch rules (#4). Do not rename it. always(): a
  # failed or cancelled job must fail this check, not skip it, because a skipped required check
  # counts as passed.
  demo-stack:
    name: demo-stack
    needs: [plan, api, soak, shots, screenshots]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job the tier needs passed, and only those were skipped
        env:
          PLAN: ${{ needs.plan.result }}
          TIER: ${{ needs.plan.outputs.tier }}
          SOAK_NEEDED: ${{ needs.plan.outputs.soak }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          CHECK: ${{ needs.plan.outputs.check }}
          API: ${{ needs.api.result }}
          SOAK: ${{ needs.soak.result }}
          SHOTS: ${{ needs.shots.result }}
          MERGED: ${{ needs.screenshots.result }}
        run: |
          echo "plan: $PLAN, tier ${TIER:-none}, shards ${SHARDS:-none}, check ${CHECK:-none}"
          test "$PLAN" = success || { echo "::error::the plan failed"; exit 1; }
          bad=0
          # expect JOB NEEDED RESULT: a needed job passed; one the tier does not need was skipped.
          expect() {
            local want=skipped
            [ "$2" = true ] && want=success
            echo "$1: $3 (want $want)"
            [ "$3" = "$want" ] || { echo "::error::$1 is $3, want $want"; bad=1; }
          }
          need_shots=false; [ "$SHARDS" != '[]' ] && need_shots=true
          need_merge=false; [ "$need_shots" = true ] && [ "$CHECK" != true ] && need_merge=true
          expect api "$([ "$TIER" != docs ] && echo true)" "$API"
          expect soak "$SOAK_NEEDED" "$SOAK"
          expect shots "$need_shots" "$SHOTS"
          expect screenshots "$need_merge" "$MERGED"
          exit "$bad"

  # The nightly run's failing tests become `regression` issues, one per test, or a comment on the
  # one still open (#575, docs/ci.md#regressions). It runs last, after the aggregator, whose own
  # failure only repeats the others'.
  regressions:
    name: demo-stack (regressions)
    needs: [plan, api, soak, shots, screenshots, demo-stack]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One regression issue per failing test
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          WORKFLOW: demo-stack.yml
          IGNORE: demo-stack
        run: node .github/scripts/regressions.mjs
