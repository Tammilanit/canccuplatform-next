name: Release tag

# Every green main is a rollback point (#574, docs/ci.md#releases): when CI and Demo stack have
# both finished on a push to main, the commit gets the tag v0.<step>.<n> and its images, if both
# passed and it is still main's head; if either failed, one `release-red` issue. Each of the two
# completions starts a run; the script waits for the other one, and the concurrency group makes
# the second run of a commit see the first one's tag or issue.
# GitHub starts workflow_run only from this file on main.
on:
  workflow_run:
    workflows: [CI, Demo stack]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  tag:
    name: release-tag
    # A pull request from a fork's branch called main also reports head_branch main.
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag a green head, or file release-red
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: node .github/scripts/release-tag.mjs

  # A tag pushed with GITHUB_TOKEN starts no workflow, so release.yml's tag trigger would not
  # fire: the images are built here, by the same workflow.
  images:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      sha: ${{ github.event.workflow_run.head_sha }}
