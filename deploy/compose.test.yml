# Test overlay: publishes Valkey and Postgres on the host's loopback for the kit integration tests.
#   docker compose -f deploy/compose.yml -f deploy/compose.test.yml up -d --wait valkey postgres
#   CANCCU_VALKEY_URL=redis://127.0.0.1:6379 \
#   CANCCU_DATABASE_URL=postgres://canccu:canccu-local-only@127.0.0.1:5432/canccu npm test   # or pytest
services:
  valkey:
    ports:
      - "127.0.0.1:6379:6379"
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
