# CanccuPlatform on one machine, IP mode: `docker compose -f deploy/compose.yml up -d`
# Only Caddy publishes ports. Containers keep no state: data lives in the postgres-data,
# valkey-data and files volumes.
name: canccuplatform

x-kit-env: &kit-env
  CANCCU_VERSION: ${CANCCU_VERSION:-dev}
  CANCCU_VALKEY_URL: redis://valkey:6379
  CANCCU_ADMIN_URL: http://admin:8080

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: canccu
      POSTGRES_DB: canccu
      # Placeholder for local use only. Real installs set POSTGRES_PASSWORD in deploy/.env
      # (see .env.example); the setup wizard will generate it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canccu-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canccu -d canccu"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  hello:
    build:
      context: ..
      dockerfile: modules/hello/Dockerfile
    environment:
      <<: *kit-env
      CANCCU_MODULE: hello
      CANCCU_DATABASE_URL: postgres://canccu:${POSTGRES_PASSWORD:-canccu-local-only}@postgres:5432/canccu
    volumes:
      - files:/files
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: modules/admin/Dockerfile
    environment:
      <<: *kit-env
      CANCCU_MODULE: admin
      CANCCU_DATABASE_URL: postgres://canccu:${POSTGRES_PASSWORD:-canccu-local-only}@postgres:5432/canccu
      CANCCU_EVENT_DIR: /files/event
      CANCCU_HEALTH_TARGETS: hello=http://hello:8080/health
      CANCCU_PUBLIC_URL: ${CANCCU_PUBLIC_URL:-}
      CANCCU_DISCORD_CLIENT_ID: ${CANCCU_DISCORD_CLIENT_ID:-}
      CANCCU_DISCORD_CLIENT_SECRET: ${CANCCU_DISCORD_CLIENT_SECRET:-}
    volumes:
      - files:/files
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      hello:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  tenants:
    build:
      context: ..
      dockerfile: modules/tenants/Dockerfile
    environment:
      <<: *kit-env
      CANCCU_MODULE: tenants
      CANCCU_DATABASE_URL: postgres://canccu:${POSTGRES_PASSWORD:-canccu-local-only}@postgres:5432/canccu
      CANCCU_SIGNIN_HOSTNAME: ${CANCCU_SIGNIN_HOSTNAME:-}
      CANCCU_SUPERADMIN_HOSTNAME: ${CANCCU_SUPERADMIN_HOSTNAME:-}
      CANCCU_PLATFORM_DOMAIN: ${CANCCU_PLATFORM_DOMAIN:-}
      # The demo tenant and venue (replaces new-event, #12); idempotent at every start.
      CANCCU_SEED_DEMO: "1"
      # IP mode: the demo tenant on the host's IP address while it is the only tenant. The
      # module honours it only while CANCCU_VERSION is dev (0013 item 2).
      CANCCU_IP_MODE: ${CANCCU_IP_MODE:-demo}
      # Only stack containers reach this one, and Caddy's address is not fixed; the edge Caddy
      # (#51) narrows this to Caddy alone.
      CANCCU_TRUSTED_PROXIES: "*"
    volumes:
      - files:/files
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    # Explicit host IPs: the host's Docker default bind may be 127.0.0.1. On a host reachable from
    # outside, start the stack only once the DOCKER-USER firewall is in place (setup/README.md):
    # Docker's NAT bypasses ufw. 443 is published ahead of the TLS option (#5).
    ports:
      - { target: 80, published: "80", host_ip: 0.0.0.0, protocol: tcp }
      - { target: 80, published: "80", host_ip: "::", protocol: tcp }
      - { target: 443, published: "443", host_ip: 0.0.0.0, protocol: tcp }
      - { target: 443, published: "443", host_ip: "::", protocol: tcp }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # The image declares /data and /config volumes; http mode stores nothing there, so keep
    # them in memory instead of creating anonymous volumes.
    tmpfs:
      - /data
      - /config
    depends_on:
      - hello
      - admin
    restart: unless-stopped

# IPv6 on the stack's network, so Docker NATs published IPv6 traffic through ip6tables and the
# DOCKER-USER firewall (setup/firewall) filters it. Without it, docker-proxy would forward the
# "::" ports to the IPv4 container address and that traffic would bypass DOCKER-USER.
# A fixed ULA prefix, internal to this host; Docker adds an IPv4 subnet itself.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd8c:6a3e:51e2:1::/64

volumes:
  postgres-data:
  valkey-data:
  # Shared files (uploads, profile assets); mounted at /files in every module that needs it.
  files:
