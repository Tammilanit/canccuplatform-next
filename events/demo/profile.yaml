# Demo event profile. Format: contracts/profile.md. Placeholder content only.
# assets/logo.svg is hand-written; assets/sounds/chime.wav is a 0.4 s 880 Hz sine tone made with Python's wave module.
# media/demo-film.mp4 is a 12 s title card with a soft chord, made with ffmpeg's lavfi sources (DejaVu Sans), for Premiere.
schema_version: 1
name: Demo Event
modules:
  - screen
  - tournament
  - pizza
  - bot
  - admin
  - games
  - moments
  - voices
  - cast
settings:
  admin:
    timezone: UTC
    language: en
  screen:
    rotation_seconds: 15
  pizza:
    ordering_open: false
    settle_to_payer: true
# The Default demo theme's Demo night (#432), so the event looks the same before any theme is published.
theme:
  colors:
    background: "#0b0d1a"
    surface: "#161a2e"
    border: "#343c66"
    text: "#f3f5ff"
    text_muted: "#a9b1d6"
    primary: "#3ddcff"
    primary_text: "#0b0d1a"
    accent: "#b98cff"
    status_ok: "#3ee39a"
    status_degraded: "#ffc94d"
    status_down: "#ff6b7d"
logos:
  main: assets/logo.svg
sounds:
  chime: assets/sounds/chime.wav
# Two placeholder pizzerias with prices (step 5, D18); demo orders are made through the API.
pizza:
  pizzerias:
    - name: Demo Pizzeria
      phone: "+000 000 0000"
      website: https://pizzeria.example
      service: delivery
      items:
        - { number: "1", name: Margherita, description: "tomato, mozzarella", price: 800 }
        - { number: "3", name: Pepperoni, description: "tomato, mozzarella, pepperoni", price: 900 }
        - { number: "12", name: Kebab, description: "kebab, onion, chili", price: 950 }
        - { number: "20", name: Vegetariana, description: "tomato, mushroom, pepper, olives", price: 900 }
      # A "Fantasia" own pizza (#789): three toppings included, each further one 1.50, specials extra.
      base: { name: Fantasia, description: "tomato, mozzarella", price: 1000, included_toppings: 3, extra_topping_price: 150 }
      toppings:
        - { name: Ham, price: 100 }
        - { name: Pineapple, price: 100 }
        - { name: Olives, price: 100 }
        - { name: Jalapeño, price: 100 }
        - { name: Prosciutto, price: 250, tier: special }
    - name: Demo Trattoria
      phone: "+000 000 0001"
      website: https://trattoria.example
      service: takeaway
      items:
        - { number: "4", name: Margherita, description: "tomato, mozzarella", price: 800 }
        - { number: "7", name: Funghi, description: "mushroom, mozzarella", price: 850 }
        - { number: "15", name: Lasagne, description: "beef, béchamel", price: 1200 }
        # Well over the menu's average, so an even split shows the limit (#789 item 8).
        - { number: "21", name: Tartufo, description: "truffle, mushroom, mozzarella", price: 1890 }
