# Demo event profile. Format: contracts/profile.md. Placeholder content only.
# assets/logo.svg is hand-written; assets/sounds/chime.wav is a 0.4 s 880 Hz sine tone made with Python's wave module.
schema_version: 1
name: Demo Event
modules:
  - screen
  - tournament
  - pizza
  - bot
  - admin
  - games
  - moments
  - voices
  - cast
settings:
  admin:
    timezone: UTC
    language: en
  screen:
    rotation_seconds: 15
  pizza:
    ordering_open: false
# The Default demo theme's Demo night (#432), so the event looks the same before any theme is published.
theme:
  colors:
    background: "#0b0d1a"
    surface: "#161a2e"
    border: "#343c66"
    text: "#f3f5ff"
    text_muted: "#a9b1d6"
    primary: "#3ddcff"
    primary_text: "#0b0d1a"
    accent: "#b98cff"
    status_ok: "#3ee39a"
    status_degraded: "#ffc94d"
    status_down: "#ff6b7d"
logos:
  main: assets/logo.svg
sounds:
  chime: assets/sounds/chime.wav
