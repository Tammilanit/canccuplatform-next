# Preset "Daylight" (#785, plan docs/plans/issue-785.md D4–D7, D12): a light scheme for daytime or
# bright venues. A simple theme: the platform's Space Grotesk and Inter pair, soft corners and the
# `sky` background, a gradient with a soft sun, are its signature; no CSS of its own.
schema_version: 1
name: Daylight
description: "Light and calm: daytime or bright venues"
mode: simple
tokens:
  colors:
    background: "#f6f8fb"
    surface: "#ffffff"
    border: "#cfd6e2"
    text: "#111827"
    text_muted: "#4b5563"
    primary: "#0b63ce"
    primary_text: "#ffffff"
    accent: "#b4235a"
    status_ok: "#1a7f4b"
    status_degraded: "#8a6100"
    status_down: "#c2283d"
  motion_style:
    pack: standard
brand:
  primary: "#0b63ce"
  accent: "#b4235a"
  scheme: light
  font_pair: space-inter
  roundness: soft
  backdrop:
    looks: [sky, waves]
  box_opacity: 0.9
images:
  logo: images/logo.svg
# Level up's layouts (D7), without its backdrop embed: the stage draws the background.
layouts:
  - id: main
    name: Main hall
    aspect: "16:9"
    grid:
      columns: 24
      rows: 12
    regions:
      - id: brand
        area: { column: 1, row: 1, columns: 4, rows: 2 }
        layer: 1
        widgets:
          - widget: logo
      - id: food
        area: { column: 5, row: 1, columns: 13, rows: 2 }
        layer: 1
        widgets:
          - widget: food_status
      - id: clock
        area: { column: 18, row: 1, columns: 7, rows: 2 }
        layer: 1
        widgets:
          - widget: clock
      - id: now
        area: { column: 1, row: 3, columns: 9, rows: 9 }
        layer: 1
        widgets:
          - widget: agenda_now
      - id: ladder
        area: { column: 10, row: 3, columns: 8, rows: 9 }
        layer: 1
        widgets:
          - widget: leaderboard
      - id: countdown
        area: { column: 18, row: 3, columns: 7, rows: 4 }
        layer: 1
        widgets:
          - widget: countdown
      - id: spotlight
        area: { column: 18, row: 7, columns: 7, rows: 5 }
        layer: 1
        rotate_seconds: 20
        widgets:
          - widget: announcements
          - widget: hot_game
          - widget: qr
      - id: ticker
        area: { column: 1, row: 12, columns: 24, rows: 1 }
        layer: 1
        widgets:
          - widget: ticker
  - id: portrait
    name: Lobby (portrait)
    aspect: "9:16"
    grid:
      columns: 12
      rows: 24
    regions:
      - id: brand
        area: { column: 1, row: 1, columns: 5, rows: 2 }
        layer: 1
        widgets:
          - widget: logo
      - id: clock
        area: { column: 6, row: 1, columns: 7, rows: 2 }
        layer: 1
        widgets:
          - widget: clock
      - id: countdown
        area: { column: 1, row: 3, columns: 12, rows: 4 }
        layer: 1
        widgets:
          - widget: countdown
      - id: now
        area: { column: 1, row: 7, columns: 12, rows: 6 }
        layer: 1
        widgets:
          - widget: agenda_now
      - id: ladder
        area: { column: 1, row: 13, columns: 12, rows: 6 }
        layer: 1
        widgets:
          - widget: leaderboard
      - id: spotlight
        area: { column: 1, row: 19, columns: 7, rows: 5 }
        layer: 1
        rotate_seconds: 20
        widgets:
          - widget: announcements
          - widget: hot_game
      - id: side
        area: { column: 8, row: 19, columns: 5, rows: 5 }
        layer: 1
        rotate_seconds: 20
        widgets:
          - widget: qr
          - widget: food_status
      - id: ticker
        area: { column: 1, row: 24, columns: 12, rows: 1 }
        layer: 1
        widgets:
          - widget: ticker
