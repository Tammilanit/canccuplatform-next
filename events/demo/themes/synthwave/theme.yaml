# Preset "Synthwave" (#785, plan docs/plans/issue-785.md D5–D8, D13): pink and purple neon, a striped
# sun on the horizon and a grid that never stops. The platform's Audiowide and Titillium pair (its
# slashed zero), soft corners and see-through boxes, so the sun and the grid show through them. Its
# CSS is screen-only, so hub and phone pages get the colours, the pair and the corners.
schema_version: 1
name: Synthwave
description: "Pink and purple neon, a grid to the horizon: the 80s"
mode: advanced
tokens:
  colors:
    background: "#120724"
    surface: "#1f0d3a"
    border: "#4a2a7a"
    text: "#fbefff"
    text_muted: "#c9b3e6"
    primary: "#ff4fd8"
    primary_text: "#120724"
    accent: "#22e4ff"
    status_ok: "#4cf2a7"
    status_degraded: "#ffd166"
    status_down: "#ff5c8a"
  motion_style:
    pack: standard
brand:
  primary: "#ff4fd8"
  accent: "#22e4ff"
  scheme: dark
  font_pair: audiowide-titillium
  roundness: soft
  # The game's art left off: it would cover the sun and the grid, which the PO asked to see (D13).
  backdrop:
    looks: [glows, gradient]
    game_art: false
  box_opacity: 0.8
images:
  logo: images/logo.svg
css:
  - css/synthwave.css
# Level up's layouts (D7), without its backdrop embed: the stage draws the background.
layouts:
  - id: main
    name: Main hall
    aspect: "16:9"
    grid:
      columns: 24
      rows: 12
    regions:
      - id: brand
        area: { column: 1, row: 1, columns: 4, rows: 2 }
        layer: 1
        widgets:
          - widget: logo
      - id: food
        area: { column: 5, row: 1, columns: 13, rows: 2 }
        layer: 1
        widgets:
          - widget: food_status
      - id: clock
        area: { column: 18, row: 1, columns: 7, rows: 2 }
        layer: 1
        widgets:
          - widget: clock
      - id: now
        area: { column: 1, row: 3, columns: 9, rows: 9 }
        layer: 1
        widgets:
          - widget: agenda_now
      - id: ladder
        area: { column: 10, row: 3, columns: 8, rows: 9 }
        layer: 1
        widgets:
          - widget: leaderboard
      - id: countdown
        area: { column: 18, row: 3, columns: 7, rows: 4 }
        layer: 1
        widgets:
          - widget: countdown
      - id: spotlight
        area: { column: 18, row: 7, columns: 7, rows: 5 }
        layer: 1
        rotate_seconds: 20
        widgets:
          - widget: announcements
          - widget: hot_game
          - widget: qr
      - id: ticker
        area: { column: 1, row: 12, columns: 24, rows: 1 }
        layer: 1
        widgets:
          - widget: ticker
  - id: portrait
    name: Lobby (portrait)
    aspect: "9:16"
    grid:
      columns: 12
      rows: 24
    regions:
      - id: brand
        area: { column: 1, row: 1, columns: 5, rows: 2 }
        layer: 1
        widgets:
          - widget: logo
      - id: clock
        area: { column: 6, row: 1, columns: 7, rows: 2 }
        layer: 1
        widgets:
          - widget: clock
      - id: countdown
        area: { column: 1, row: 3, columns: 12, rows: 4 }
        layer: 1
        widgets:
          - widget: countdown
      - id: now
        area: { column: 1, row: 7, columns: 12, rows: 6 }
        layer: 1
        widgets:
          - widget: agenda_now
      - id: ladder
        area: { column: 1, row: 13, columns: 12, rows: 6 }
        layer: 1
        widgets:
          - widget: leaderboard
      - id: spotlight
        area: { column: 1, row: 19, columns: 7, rows: 5 }
        layer: 1
        rotate_seconds: 20
        widgets:
          - widget: announcements
          - widget: hot_game
      - id: side
        area: { column: 8, row: 19, columns: 5, rows: 5 }
        layer: 1
        rotate_seconds: 20
        widgets:
          - widget: qr
          - widget: food_status
      - id: ticker
        area: { column: 1, row: 24, columns: 12, rows: 1 }
        layer: 1
        widgets:
          - widget: ticker
