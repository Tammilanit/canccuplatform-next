# Preset "Esports" (#785, plan docs/plans/issue-785.md D5–D8): bold, angular, high contrast,
# broadcast style. The platform's Saira pair, square corners, broadcast motion and slabs with cut
# corners; a scoreboard for the standings. Its CSS is screen-only, so hub and phone pages get the
# colours, the pair and the corners. Its logo has a ground of its own, so it reads on every scheme.
schema_version: 1
name: Esports
description: "Bold, angular, high contrast: broadcast style"
mode: advanced
tokens:
  colors:
    background: "#0a0e17"
    surface: "#131a2a"
    border: "#2c3a57"
    text: "#f4f7ff"
    text_muted: "#a9b6d3"
    primary: "#00e0ff"
    primary_text: "#0a0e17"
    accent: "#ff3b5c"
    status_ok: "#3ee39a"
    status_degraded: "#ffd23f"
    status_down: "#ff5a6e"
  motion_style:
    pack: broadcast
brand:
  primary: "#00e0ff"
  accent: "#ff3b5c"
  scheme: dark
  font_pair: saira
  roundness: square
  backdrop:
    looks: [gradient, glows]
  box_opacity: 0.9
images:
  logo: images/logo.svg
css:
  - css/esports.css
templates:
  scoreboard:
    widget: leaderboard
    file: templates/scoreboard.mustache
# Level up's layouts (D7), without its backdrop embed: the stage draws the background.
layouts:
  - id: main
    name: Main hall
    aspect: "16:9"
    grid:
      columns: 24
      rows: 12
    regions:
      - id: brand
        area: { column: 1, row: 1, columns: 4, rows: 2 }
        layer: 1
        widgets:
          - widget: logo
      - id: food
        area: { column: 5, row: 1, columns: 13, rows: 2 }
        layer: 1
        widgets:
          - widget: food_status
      - id: clock
        area: { column: 18, row: 1, columns: 7, rows: 2 }
        layer: 1
        widgets:
          - widget: clock
      - id: now
        area: { column: 1, row: 3, columns: 9, rows: 9 }
        layer: 1
        widgets:
          - widget: agenda_now
      - id: ladder
        area: { column: 10, row: 3, columns: 8, rows: 9 }
        layer: 1
        widgets:
          - widget: leaderboard
            template: scoreboard
      - id: countdown
        area: { column: 18, row: 3, columns: 7, rows: 4 }
        layer: 1
        widgets:
          - widget: countdown
      - id: spotlight
        area: { column: 18, row: 7, columns: 7, rows: 5 }
        layer: 1
        rotate_seconds: 20
        widgets:
          - widget: announcements
          - widget: hot_game
          - widget: qr
      - id: ticker
        area: { column: 1, row: 12, columns: 24, rows: 1 }
        layer: 1
        widgets:
          - widget: ticker
  - id: portrait
    name: Lobby (portrait)
    aspect: "9:16"
    grid:
      columns: 12
      rows: 24
    regions:
      - id: brand
        area: { column: 1, row: 1, columns: 5, rows: 2 }
        layer: 1
        widgets:
          - widget: logo
      - id: clock
        area: { column: 6, row: 1, columns: 7, rows: 2 }
        layer: 1
        widgets:
          - widget: clock
      - id: countdown
        area: { column: 1, row: 3, columns: 12, rows: 4 }
        layer: 1
        widgets:
          - widget: countdown
      - id: now
        area: { column: 1, row: 7, columns: 12, rows: 6 }
        layer: 1
        widgets:
          - widget: agenda_now
      - id: ladder
        area: { column: 1, row: 13, columns: 12, rows: 6 }
        layer: 1
        widgets:
          - widget: leaderboard
            template: scoreboard
      - id: spotlight
        area: { column: 1, row: 19, columns: 7, rows: 5 }
        layer: 1
        rotate_seconds: 20
        widgets:
          - widget: announcements
          - widget: hot_game
      - id: side
        area: { column: 8, row: 19, columns: 5, rows: 5 }
        layer: 1
        rotate_seconds: 20
        widgets:
          - widget: qr
          - widget: food_status
      - id: ticker
        area: { column: 1, row: 24, columns: 12, rows: 1 }
        layer: 1
        widgets:
          - widget: ticker
