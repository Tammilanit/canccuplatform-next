# Demo theme in the advanced mode: "Level up", an original look built on progression (bars that
# fill, a rank ladder, achievement cards, a HUD clock). Format: contracts/theming.md.
# Fonts: Chakra Petch and Exo 2, SIL OFL 1.1 (fonts/OFL-chakra-petch.txt, fonts/OFL-exo-2.txt).
# Every contrast rule passes with room to spare (text 15.8:1, text_muted 8.1:1 on surface), so the
# CSS can draw the panels as glass over the embed and still keep text above 4.5:1.
schema_version: 1
name: Level up
description: Dark glass panels and one electric cyan-to-violet gradient; countdowns fill like progress bars and the leaderboard reads as a rank ladder.
mode: advanced
tokens:
  colors:
    background: "#0b0d1a"
    surface: "#161a2e"
    border: "#343c66"
    text: "#f3f5ff"
    text_muted: "#a9b1d6"
    primary: "#3ddcff"
    primary_text: "#0b0d1a"
    accent: "#b98cff"
    status_ok: "#3ee39a"
    status_degraded: "#ffc94d"
    status_down: "#ff6b7d"
  fonts:
    body: Exo 2
    heading: Chakra Petch
    display: Chakra Petch
  sizes:
    radius: 14px
    border_width: 2px
    gap: 1rem
    safe_inset: 48px
fonts:
  - family: Chakra Petch
    weight: 600
    style: normal
    file: fonts/chakra-petch-600.woff2
    licence: OFL-1.1
    licence_file: fonts/OFL-chakra-petch.txt
  - family: Chakra Petch
    weight: 700
    style: normal
    file: fonts/chakra-petch-700.woff2
    licence: OFL-1.1
    licence_file: fonts/OFL-chakra-petch.txt
  - family: Exo 2
    weight: 500
    style: normal
    file: fonts/exo-2-500.woff2
    licence: OFL-1.1
    licence_file: fonts/OFL-exo-2.txt
  - family: Exo 2
    weight: 600
    style: normal
    file: fonts/exo-2-600.woff2
    licence: OFL-1.1
    licence_file: fonts/OFL-exo-2.txt
images:
  logo: images/logo.svg
css:
  - css/base.css
  - css/widgets.css
  - css/cards.css
templates:
  hud_clock:
    widget: clock
    file: templates/clock.mustache
  now_next:
    widget: agenda_now
    file: templates/agenda-now.mustache
  xp_countdown:
    widget: countdown
    file: templates/countdown.mustache
  hot_game:
    widget: hot_game
    file: templates/hot-game.mustache
  rank_ladder:
    widget: leaderboard
    file: templates/leaderboard.mustache
  achievement:
    widget: announcements
    file: templates/announcements.mustache
  qr_handoff:
    widget: qr
    file: templates/qr.mustache
  food:
    widget: food_status
    file: templates/food-status.mustache
  ticker:
    widget: ticker
    file: templates/ticker.mustache
embeds:
  drift:
    entry: embeds/drift/index.html
    files:
      - embeds/drift/drift.js
# Region ids are this theme's own; the CSS reaches the backdrop through .canccu-region--backdrop.
# Rotations pair widgets a viewer does not need at the same moment; the countdown, now/next and
# the ladder never rotate away, because they are what people look up to check.
layouts:
  - id: main
    name: Main hall
    aspect: "16:9"
    grid:
      columns: 24
      rows: 12
    regions:
      - id: backdrop
        area: { column: 1, row: 1, columns: 24, rows: 12 }
        layer: 0
        widgets:
          - widget: embed
            embed: drift
      - id: brand
        area: { column: 1, row: 1, columns: 4, rows: 2 }
        layer: 1
        widgets:
          - widget: logo
      - id: food
        area: { column: 5, row: 1, columns: 13, rows: 2 }
        layer: 1
        widgets:
          - widget: food_status
            template: food
      - id: clock
        area: { column: 18, row: 1, columns: 7, rows: 2 }
        layer: 1
        widgets:
          - widget: clock
            template: hud_clock
      - id: now
        area: { column: 1, row: 3, columns: 9, rows: 9 }
        layer: 1
        widgets:
          - widget: agenda_now
            template: now_next
      - id: ladder
        area: { column: 10, row: 3, columns: 8, rows: 9 }
        layer: 1
        widgets:
          - widget: leaderboard
            template: rank_ladder
      - id: countdown
        area: { column: 18, row: 3, columns: 7, rows: 4 }
        layer: 1
        widgets:
          - widget: countdown
            template: xp_countdown
      - id: spotlight
        area: { column: 18, row: 7, columns: 7, rows: 5 }
        layer: 1
        rotate_seconds: 20
        widgets:
          - widget: announcements
            template: achievement
          - widget: hot_game
            template: hot_game
          - widget: qr
            template: qr_handoff
      - id: ticker
        area: { column: 1, row: 12, columns: 24, rows: 1 }
        layer: 1
        widgets:
          - widget: ticker
            template: ticker
  - id: portrait
    name: Lobby (portrait)
    aspect: "9:16"
    grid:
      columns: 12
      rows: 24
    regions:
      - id: backdrop
        area: { column: 1, row: 1, columns: 12, rows: 24 }
        layer: 0
        widgets:
          - widget: embed
            embed: drift
      - id: brand
        area: { column: 1, row: 1, columns: 5, rows: 2 }
        layer: 1
        widgets:
          - widget: logo
      - id: clock
        area: { column: 6, row: 1, columns: 7, rows: 2 }
        layer: 1
        widgets:
          - widget: clock
            template: hud_clock
      - id: countdown
        area: { column: 1, row: 3, columns: 12, rows: 4 }
        layer: 1
        widgets:
          - widget: countdown
            template: xp_countdown
      - id: now
        area: { column: 1, row: 7, columns: 12, rows: 6 }
        layer: 1
        widgets:
          - widget: agenda_now
            template: now_next
      - id: ladder
        area: { column: 1, row: 13, columns: 12, rows: 6 }
        layer: 1
        widgets:
          - widget: leaderboard
            template: rank_ladder
      - id: spotlight
        area: { column: 1, row: 19, columns: 7, rows: 5 }
        layer: 1
        rotate_seconds: 20
        widgets:
          - widget: announcements
            template: achievement
          - widget: hot_game
            template: hot_game
      - id: side
        area: { column: 8, row: 19, columns: 5, rows: 5 }
        layer: 1
        rotate_seconds: 20
        widgets:
          - widget: qr
            template: qr_handoff
          - widget: food_status
            template: food
      - id: ticker
        area: { column: 1, row: 24, columns: 12, rows: 1 }
        layer: 1
        widgets:
          - widget: ticker
            template: ticker
