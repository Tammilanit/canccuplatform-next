# Demo theme: "Demo night", the base look of the design guideline (docs/design/mockups.html, the board's
# "Demo night" theme; #432), in the simple mode. Format: contracts/theming.md. The inks pages draw with
# (decision 1 of docs/design/README.md) are computed from these by packages/ui, not set here.
schema_version: 1
name: Default
mode: simple
brand:
  primary: "#3ddcff"
  accent: "#b98cff"
  scheme: dark
tokens:
  colors:
    background: "#0b0d1a"
    surface: "#161a2e"
    border: "#343c66"
    text: "#f3f5ff"
    text_muted: "#a9b1d6"
    primary: "#3ddcff"
    primary_text: "#0b0d1a"
    accent: "#b98cff"
    status_ok: "#3ee39a"
    status_degraded: "#ffc94d"
    status_down: "#ff6b7d"
images:
  logo: images/logo.svg
layouts:
  - id: main
    name: Main
    aspect: "16:9"
    grid:
      columns: 12
      rows: 12
    regions:
      - id: header
        area: { column: 1, row: 1, columns: 12, rows: 2 }
        widgets:
          - widget: logo
          - widget: clock
        rotate_seconds: 20
      - id: main
        area: { column: 1, row: 3, columns: 8, rows: 9 }
        widgets:
          - widget: agenda_now
      - id: side
        area: { column: 9, row: 3, columns: 4, rows: 9 }
        widgets:
          - widget: announcements
      - id: ticker
        area: { column: 1, row: 12, columns: 12, rows: 1 }
        widgets:
          - widget: ticker
